<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>Football-Shirt-Market</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>

:root{
    --black:#020504;
    --black2:#050b08;
    --green:#19c77a;
    --green2:#0d8e56;
    --green-dark:#06291b;
    --gold:#e9c46a;
    --gold2:#b98722;
    --gold-light:#f6df9d;
    --white:#ffffff;
    --muted:#9eaaa4;
    --card:#07130e;
    --border:rgba(233,196,106,.22);
}

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html{
    scroll-behavior:smooth;
    overflow-x:hidden;
}

body{
    background:
        radial-gradient(circle at 50% -10%,rgba(26,110,72,.15),transparent 35%),
        var(--black);
    color:var(--white);
    font-family:'Inter',sans-serif;
    overflow-x:hidden;
}

body.translated-ltr,
body.translated-rtl{
    top:0!important;
}

a{
    color:inherit;
    text-decoration:none;
}

button,
input{
    font-family:inherit;
}

img{
    max-width:100%;
}

/* =========================================
   GOOGLE TRANSLATE
========================================= */

#google_translate_element{
    position:absolute;
    width:1px;
    height:1px;
    overflow:hidden;
    opacity:0;
    pointer-events:none;
}

.goog-te-banner-frame,
.skiptranslate iframe{
    display:none!important;
}

.goog-te-gadget{
    font-size:0!important;
}

.goog-text-highlight{
    background:none!important;
    box-shadow:none!important;
}

body{
    top:0!important;
}

/* =========================================
   HEADER
========================================= */

.site-header{
    position:sticky;
    top:0;
    z-index:1000;
    width:100%;
    background:rgba(2,7,5,.88);
    backdrop-filter:blur(22px);
    -webkit-backdrop-filter:blur(22px);
    border-bottom:1px solid rgba(233,196,106,.16);
}

.header-inner{
    width:min(1380px,100%);
    min-height:82px;
    margin:auto;
    padding:10px 24px;
    display:flex;
    align-items:center;
    gap:22px;
}

.logo-link{
    display:flex;
    align-items:center;
    gap:12px;
    min-width:0;
    flex-shrink:0;
}

.header-logo{
    width:58px;
    height:58px;
    object-fit:contain;
    filter:drop-shadow(0 4px 12px rgba(0,0,0,.5));
}

.brand{
    display:flex;
    flex-direction:column;
    line-height:1.1;
}

.brand-title{
    font-family:'Montserrat',sans-serif;
    font-size:15px;
    font-weight:900;
    letter-spacing:.5px;
    text-transform:uppercase;
    white-space:nowrap;
}

.brand-since{
    color:var(--gold);
    font-size:10px;
    font-weight:800;
    letter-spacing:2px;
    margin-top:5px;
}

/* NAV */

nav{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:4px;
    margin-left:auto;
}

nav a{
    color:#aebdb5;
    padding:11px 15px;
    border-radius:10px;
    font-size:13px;
    font-weight:800;
    transition:.25s ease;
}

nav a:hover{
    color:#fff;
    background:rgba(255,255,255,.06);
}

nav a.active{
    color:#fff;
    background:
        linear-gradient(
            135deg,
            rgba(233,196,106,.16),
            rgba(25,199,122,.08)
        );
    border:1px solid rgba(233,196,106,.15);
}

/* LANGUAGE */

.lang-btn{
    flex-shrink:0;
    display:flex;
    align-items:center;
    gap:8px;
    background:#07140e;
    color:var(--gold-light);
    border:1px solid rgba(233,196,106,.32);
    border-radius:12px;
    padding:10px 13px;
    font-size:12px;
    font-weight:800;
    cursor:pointer;
    transition:.25s ease;
}

.lang-btn:hover{
    border-color:var(--gold);
    transform:translateY(-1px);
    box-shadow:0 8px 25px rgba(233,196,106,.08);
}

#currentFlag{
    font-size:16px;
}

/* MOBILE MENU BUTTON */

.mobile-menu{
    display:none;
    margin-left:auto;
    width:42px;
    height:42px;
    border:1px solid rgba(233,196,106,.25);
    background:#07130e;
    color:#fff;
    border-radius:11px;
    font-size:20px;
    cursor:pointer;
}

/* =========================================
   LANGUAGE MODAL
========================================= */

.lang-modal-backdrop{
    position:fixed;
    inset:0;
    z-index:5000;
    background:rgba(0,0,0,.82);
    backdrop-filter:blur(12px);
    display:none;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.lang-modal-backdrop.open{
    display:flex;
    animation:fadeIn .2s ease;
}

@keyframes fadeIn{
    from{opacity:0}
    to{opacity:1}
}

.lang-modal{
    width:min(650px,100%);
    max-height:min(750px,90vh);
    background:
        radial-gradient(
            circle at top right,
            rgba(25,199,122,.08),
            transparent 35%
        ),
        #08150f;
    border:1px solid rgba(233,196,106,.25);
    border-radius:22px;
    padding:24px;
    box-shadow:
        0 30px 100px rgba(0,0,0,.8),
        inset 0 1px 0 rgba(255,255,255,.03);
    display:flex;
    flex-direction:column;
}

.lang-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
    margin-bottom:18px;
}

.lang-title{
    color:var(--gold-light);
    font-family:'Montserrat',sans-serif;
    font-size:18px;
    font-weight:900;
}

.lang-close{
    width:38px;
    height:38px;
    border:0;
    border-radius:10px;
    background:rgba(255,255,255,.05);
    color:#aaa;
    font-size:24px;
    cursor:pointer;
}

.lang-close:hover{
    color:#fff;
    background:rgba(255,255,255,.1);
}

.lang-search{
    width:100%;
    height:48px;
    border-radius:12px;
    border:1px solid rgba(233,196,106,.2);
    background:#030806;
    color:#fff;
    outline:none;
    padding:0 15px;
    font-size:14px;
    margin-bottom:15px;
}

.lang-search:focus{
    border-color:var(--gold);
    box-shadow:0 0 0 3px rgba(233,196,106,.06);
}

.lang-list{
    overflow-y:auto;
    display:grid;
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:7px;
    padding-right:5px;
}

.lang-list::-webkit-scrollbar{
    width:5px;
}

.lang-list::-webkit-scrollbar-thumb{
    background:rgba(233,196,106,.3);
    border-radius:10px;
}

.lang-item{
    display:flex;
    align-items:center;
    gap:10px;
    min-width:0;
    padding:11px 12px;
    border-radius:10px;
    border:1px solid transparent;
    background:rgba(255,255,255,.025);
    color:#d4ddd8;
    cursor:pointer;
    font-size:12px;
    font-weight:600;
    transition:.18s ease;
}

.lang-item:hover{
    background:rgba(233,196,106,.1);
    border-color:rgba(233,196,106,.15);
    color:#fff;
}

.lang-item.active{
    background:linear-gradient(
        135deg,
        rgba(233,196,106,.25),
        rgba(25,199,122,.1)
    );
    border-color:rgba(233,196,106,.3);
    color:#fff;
}

.lang-flag{
    font-size:17px;
    flex-shrink:0;
}

.lang-name{
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
}

/* =========================================
   PAGE
========================================= */

.page{
    width:min(1380px,100%);
    margin:auto;
    padding:25px 24px 80px;
}

/* =========================================
   HERO
========================================= */

.hero{
    position:relative;
    width:100%;
    min-height:clamp(430px,48vw,680px);
    border-radius:22px;
    overflow:hidden;
    border:1px solid rgba(233,196,106,.2);
    box-shadow:
        0 25px 70px rgba(0,0,0,.6),
        inset 0 1px 0 rgba(255,255,255,.04);
    background:#020604;
}

.hero-image{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    object-position:center center;
}

.hero-overlay{
    position:absolute;
    inset:0;
    background:
        linear-gradient(
            90deg,
            rgba(1,5,4,.88) 0%,
            rgba(1,5,4,.65) 34%,
            rgba(1,5,4,.1) 67%,
            rgba(1,5,4,.15) 100%
        );
}

.hero-content{
    position:absolute;
    z-index:2;
    left:6%;
    top:50%;
    transform:translateY(-50%);
    width:min(520px,45%);
}

.hero-kicker{
    color:var(--gold);
    font-size:12px;
    font-weight:900;
    letter-spacing:2.5px;
    text-transform:uppercase;
    margin-bottom:15px;
}

.hero-title{
    font-family:'Montserrat',sans-serif;
    font-size:clamp(40px,5.2vw,78px);
    line-height:.95;
    font-weight:900;
    text-transform:uppercase;
    letter-spacing:-2px;
    color:#fff;
    text-shadow:0 5px 25px rgba(0,0,0,.55);
}

.hero-title span{
    color:var(--gold-light);
}

.hero-text{
    color:#c5d0cb;
    font-size:clamp(13px,1.1vw,16px);
    line-height:1.6;
    max-width:470px;
    margin-top:20px;
}

.hero-actions{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    margin-top:26px;
}

.btn{
    min-height:45px;
    padding:0 19px;
    border-radius:10px;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    font-size:12px;
    font-weight:900;
    transition:.25s ease;
    border:1px solid transparent;
}

.btn-green{
    color:#fff;
    background:linear-gradient(
        135deg,
        #19c77a,
        #0d8c54
    );
    box-shadow:0 10px 30px rgba(25,199,122,.2);
}

.btn-green:hover{
    transform:translateY(-2px);
    box-shadow:0 14px 35px rgba(25,199,122,.3);
}

.btn-gold{
    color:#080b09;
    background:linear-gradient(
        135deg,
        #f4d98d,
        #c69a35
    );
}

.btn-dark{
    color:#fff;
    background:rgba(255,255,255,.07);
    border-color:rgba(255,255,255,.16);
}

.btn-dark:hover{
    background:rgba(255,255,255,.12);
}

/* SEARCH BAR */

.hero-search{
    position:absolute;
    z-index:4;
    left:5%;
    bottom:28px;
    width:min(455px,42%);
    height:57px;
    display:flex;
    align-items:center;
    gap:12px;
    padding:7px 9px 7px 16px;
    border-radius:14px;
    background:rgba(0,0,0,.78);
    border:1px solid rgba(233,196,106,.45);
    box-shadow:
        0 10px 35px rgba(0,0,0,.5),
        0 0 25px rgba(233,196,106,.08);
    backdrop-filter:blur(12px);
}

.search-icon{
    width:34px;
    height:34px;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#fff;
    font-size:22px;
    flex-shrink:0;
}

.hero-search input{
    min-width:0;
    flex:1;
    border:0;
    outline:0;
    background:transparent;
    color:#fff;
    font-size:13px;
}

.hero-search input::placeholder{
    color:#a5aea9;
}

.search-arrow{
    width:40px;
    height:40px;
    border-radius:9px;
    border:0;
    background:linear-gradient(
        135deg,
        #e9c46a,
        #b98722
    );
    color:#050705;
    font-size:21px;
    font-weight:900;
    cursor:pointer;
}

/* =========================================
   SECTIONS
========================================= */

.section{
    margin-top:48px;
}

.section-header{
    display:flex;
    align-items:flex-end;
    justify-content:space-between;
    gap:20px;
    padding-bottom:13px;
    border-bottom:1px solid rgba(233,196,106,.13);
    margin-bottom:20px;
}

.section-title{
    font-family:'Montserrat',sans-serif;
    font-size:clamp(21px,2.2vw,29px);
    font-weight:900;
    text-transform:uppercase;
}

.section-title span{
    color:var(--gold-light);
}

.section-link{
    color:var(--gold);
    font-size:12px;
    font-weight:800;
    white-space:nowrap;
}

.section-link:hover{
    color:#fff;
}

/* =========================================
   SHIRT GRID
========================================= */

.shirts-grid{
    display:grid;
    grid-template-columns:repeat(5,minmax(0,1fr));
    gap:16px;
}

.shirt-card{
    min-width:0;
    overflow:hidden;
    background:
        linear-gradient(
            180deg,
            rgba(10,30,21,.95),
            rgba(5,16,11,.98)
        );
    border:1px solid rgba(233,196,106,.2);
    border-radius:15px;
    transition:
        transform .3s ease,
        border-color .3s ease,
        box-shadow .3s ease;
}

.shirt-card:hover{
    transform:translateY(-6px);
    border-color:rgba(233,196,106,.55);
    box-shadow:
        0 18px 40px rgba(0,0,0,.4),
        0 0 25px rgba(233,196,106,.07);
}

.shirt-image{
    position:relative;
    aspect-ratio:1 / 1;
    display:flex;
    align-items:center;
    justify-content:center;
    background:
        radial-gradient(
            circle at center,
            #123c28 0%,
            #07150e 58%,
            #030906 100%
        );
    overflow:hidden;
}

.shirt-image::before{
    content:"";
    position:absolute;
    width:65%;
    height:65%;
    border-radius:50%;
    background:rgba(25,199,122,.08);
    filter:blur(25px);
}

.shirt-icon{
    position:relative;
    z-index:2;
    font-size:72px;
    filter:drop-shadow(0 12px 15px rgba(0,0,0,.55));
    transition:.3s ease;
}

.shirt-card:hover .shirt-icon{
    transform:scale(1.1);
}

.badge{
    position:absolute;
    z-index:4;
    top:10px;
    left:10px;
    color:var(--gold-light);
    background:rgba(2,7,5,.82);
    border:1px solid rgba(233,196,106,.4);
    border-radius:20px;
    padding:4px 8px;
    font-size:8px;
    font-weight:900;
    text-transform:uppercase;
    backdrop-filter:blur(5px);
}

.shirt-info{
    padding:14px;
}

.shirt-club{
    color:#91a098;
    font-size:9px;
    font-weight:800;
    text-transform:uppercase;
    letter-spacing:.5px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.shirt-name{
    color:#fff;
    font-size:12px;
    font-weight:800;
    line-height:1.35;
    margin-top:5px;
    min-height:33px;
}

.shirt-footer{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:7px;
    margin-top:14px;
}

.price{
    color:var(--green);
    font-size:13px;
    font-weight:900;
    white-space:nowrap;
}

.view-btn{
    border:1px solid rgba(233,196,106,.28);
    background:rgba(233,196,106,.07);
    color:var(--gold-light);
    border-radius:7px;
    padding:7px 9px;
    font-size:9px;
    font-weight:900;
    cursor:pointer;
    transition:.2s;
}

.view-btn:hover{
    background:var(--gold);
    color:#050705;
}

/* =========================================
   EXPLORE BANNER
========================================= */

.explore-banner{
    position:relative;
    width:100%;
    min-height:320px;
    border-radius:20px;
    overflow:hidden;
    border:1px solid rgba(233,196,106,.2);
}

.explore-banner img{
    width:100%;
    height:100%;
    min-height:320px;
    object-fit:cover;
}

.explore-overlay{
    position:absolute;
    inset:0;
    background:linear-gradient(
        90deg,
        rgba(2,5,4,.85),
        transparent 70%
    );
}

.explore-content{
    position:absolute;
    left:6%;
    top:50%;
    transform:translateY(-50%);
    max-width:450px;
}

.explore-content h1{
    font-family:'Montserrat',sans-serif;
    font-size:clamp(32px,4vw,55px);
    line-height:1;
    text-transform:uppercase;
}

.explore-content h1 span{
    color:var(--gold);
}

.explore-content p{
    margin-top:14px;
    color:#b9c5bf;
    line-height:1.6;
    font-size:14px;
}

/* =========================================
   SELL
========================================= */

.sell-box{
    width:min(650px,100%);
    margin:50px auto;
    padding:40px;
    border-radius:20px;
    text-align:center;
    background:
        radial-gradient(
            circle at top,
            rgba(25,199,122,.1),
            transparent 50%
        ),
        #07130e;
    border:1px solid rgba(233,196,106,.2);
    box-shadow:0 25px 70px rgba(0,0,0,.35);
}

.sell-box h1{
    font-family:'Montserrat',sans-serif;
    font-size:32px;
    color:var(--gold-light);
}

.sell-box p{
    color:#aab7b0;
    line-height:1.7;
    margin:15px auto 25px;
    max-width:500px;
}

/* =========================================
   FOOTER
========================================= */

footer{
    border-top:1px solid rgba(233,196,106,.13);
    text-align:center;
    padding:40px 20px;
    color:#84918b;
    font-size:12px;
}

footer strong{
    color:#fff;
    font-family:'Montserrat',sans-serif;
}

/* =========================================
   MOBILE
========================================= */

@media(max-width:1100px){

    .shirts-grid{
        grid-template-columns:repeat(4,minmax(0,1fr));
    }

    .hero-content{
        width:50%;
    }

}

@media(max-width:850px){

    .header-inner{
        min-height:68px;
        padding:8px 14px;
    }

    .header-logo{
        width:45px;
        height:45px;
    }

    .brand-title{
        font-size:12px;
    }

    .brand-since{
        font-size:8px;
    }

    nav{
        display:none;
        position:absolute;
        top:68px;
        left:10px;
        right:10px;
        padding:10px;
        flex-direction:column;
        background:rgba(4,12,8,.97);
        border:1px solid rgba(233,196,106,.2);
        border-radius:14px;
        box-shadow:0 20px 50px rgba(0,0,0,.6);
    }

    nav.mobile-open{
        display:flex;
    }

    nav a{
        width:100%;
        text-align:center;
    }

    .mobile-menu{
        display:block;
    }

    .lang-btn{
        padding:9px 10px;
    }

    .page{
        padding:15px 12px 60px;
    }

    .hero{
        min-height:590px;
        border-radius:16px;
    }

    .hero-image{
        object-position:58% center;
    }

    .hero-overlay{
        background:
            linear-gradient(
                180deg,
                rgba(1,5,4,.25),
                rgba(1,5,4,.6) 45%,
                rgba(1,5,4,.96) 82%
            );
    }

    .hero-content{
        left:20px;
        right:20px;
        bottom:125px;
        top:auto;
        transform:none;
        width:auto;
    }

    .hero-kicker{
        font-size:9px;
        letter-spacing:1.8px;
        margin-bottom:10px;
    }

    .hero-title{
        font-size:42px;
        letter-spacing:-1.5px;
    }

    .hero-text{
        font-size:12px;
        line-height:1.5;
        margin-top:13px;
    }

    .hero-actions{
        margin-top:16px;
    }

    .btn{
        min-height:40px;
        padding:0 13px;
        font-size:10px;
    }

    .hero-search{
        left:16px;
        right:16px;
        bottom:20px;
        width:auto;
        height:51px;
    }

    .shirts-grid{
        grid-template-columns:repeat(2,minmax(0,1fr));
        gap:10px;
    }

    .shirt-card{
        border-radius:12px;
    }

    .shirt-info{
        padding:11px;
    }

    .shirt-icon{
        font-size:55px;
    }

    .shirt-name{
        font-size:11px;
    }

    .price{
        font-size:12px;
    }

    .view-btn{
        padding:6px 7px;
        font-size:8px;
    }

    .section{
        margin-top:35px;
    }

}

@media(max-width:520px){

    .header-inner{
        gap:7px;
    }

    .brand{
        display:none;
    }

    .header-logo{
        width:43px;
        height:43px;
    }

    .lang-btn{
        margin-left:auto;
    }

    .hero{
        min-height:575px;
    }

    .hero-content{
        bottom:120px;
    }

    .hero-title{
        font-size:37px;
    }

    .hero-text{
        max-width:330px;
    }

    .hero-actions{
        flex-direction:row;
    }

    .hero-actions .btn{
        flex:1;
    }

    .section-header{
        align-items:center;
    }

    .section-title{
        font-size:19px;
    }

    .section-link{
        font-size:10px;
    }

    .lang-modal{

/* =========================================

========================================= */

function route(){

const hash=location.hash || "#/";

document
.querySelectorAll("nav a")
.forEach(a=>a.classList.remove("active"));


if(hash.startsWith("#/explore")){

document
.getElementById("nav-explore")
.classList.add("active");

renderExplore();

}

else if(hash.startsWith("#/sell")){

document
.getElementById("nav-sell")
.classList.add("active");

renderSell();

}

else{

document
.getElementById("nav-home")
.classList.add("active");

renderHome();

}

setTimeout(()=>{
restoreSearch();
},100);

}


/* =========================================
   SEARCH
========================================= */

function performSearch(){

const input=document.getElementById("heroSearch");

if(!input)return;

const value=input.value.trim().toLowerCase();

if(!value){

location.hash="#/explore";
return;

}

location.hash="#/explore";

setTimeout(()=>{

const cards=document.querySelectorAll(".shirt-card");

cards.forEach(card=>{

const text=card.innerText.toLowerCase();

card.style.display=
text.includes(value)
?""
:"none";

});

},100);

}


function restoreSearch(){

const input=document.getElementById("heroSearch");

if(!input)return;

input.addEventListener("keydown",function(e){

if(e.key==="Enter"){

performSearch();

}

});

}


/* =========================================
   LANGUAGE SYSTEM
========================================= */

const langModal=document.getElementById("langModal");

const langList=document.getElementById("langList");

const langSearch=document.getElementById("langSearchInput");


function getCurrentLanguage(){

const cookie=document.cookie
.split(";")
.map(x=>x.trim())
.find(x=>x.startsWith("googtrans="));

if(cookie){

const value=decodeURIComponent(cookie.split("=")[1]||"");

const parts=value.split("/");

if(parts.length>=3){

return parts[2];

}

}

return "nl";

}


function setLanguageDisplay(){

const code=getCurrentLanguage();

const language=
languages.find(l=>l.code===code) ||
languages.find(l=>l.code==="nl");

if(!language)return;

document.getElementById("currentFlag").textContent=
language.flag;

document.getElementById("currentLangCode").textContent=
language.code
.split("-")[0]
.toUpperCase();

}


function renderLanguageList(filter=""){

const query=filter
.toLowerCase()
.trim();

const filtered=languages.filter(language=>{

return language.name
.toLowerCase()
.includes(query)

||

language.code
.toLowerCase()
.includes(query);

});


langList.innerHTML="";


filtered.forEach(language=>{

const item=document.createElement("div");

item.className="lang-item";

if(language.code===getCurrentLanguage()){

item.classList.add("active");

}

item.innerHTML=`

<span class="lang-flag">
${language.flag}
</span>

<span class="lang-name">
${language.name}
</span>

`;

item.addEventListener("click",()=>{

changeLanguage(language.code);

});

langList.appendChild(item);

});

}


function clearTranslationCookies(){

const domains=[
"",
location.hostname,
"."+location.hostname
];

domains.forEach(domain=>{

const domainPart=
domain
?"; domain="+domain
:"";

document.cookie=
"googtrans=; expires=Thu, 01 Jan 1970 00:00:00 GMT; path=/"+domainPart;

});

}


function changeLanguage(code){

if(code==="nl"){

clearTranslationCookies();

localStorage.setItem("fsm-language","nl");

location.reload();

return;

}


/*
Google Translate cookie.
*/

clearTranslationCookies();

document.cookie=
"googtrans=/nl/"+code+
"; path=/; max-age=31536000";

localStorage.setItem(
"fsm-language",
code
);

langModal.classList.remove("open");

location.reload();

}


/* =========================================
   LANGUAGE MODAL EVENTS
========================================= */

document
.getElementById("langPickerBtn")
.addEventListener("click",()=>{

langModal.classList.add("open");

langSearch.value="";

renderLanguageList();

setTimeout(()=>{
langSearch.focus();
},100);

});


document

langModal.classList.remove("open");

});


langModal.addEventListener("click",(e)=>{

if(e.target===langModal){

langModal.classList.remove("open");

}

});


langSearch.addEventListener("input",(e)=>{

renderLanguageList(e.target.value);

});


document.addEventListener("keydown",(e)=>{

if(e.key==="Escape"){

langModal.classList.remove("open");

}

});
