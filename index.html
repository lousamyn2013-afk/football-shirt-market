<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Football-Shirt-Market - Koop, verkoop en verzamel voetbalshirts.">
<meta name="theme-color" content="#020504">

<title>Football-Shirt-Market • Since 2026</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800;900&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#020504;
  --bg2:#050b08;
  --card:#08130f;
  --card2:#0b1913;
  --gold:#efd28f;
  --gold2:#d6aa45;
  --gold3:#a97a22;
  --green:#19c982;
  --green2:#0d8757;
  --white:#fff;
  --text:#f5f1e7;
  --muted:#9cacA3;
  --line:rgba(239,210,143,.18);
  --shadow:0 20px 60px rgba(0,0,0,.55);
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html{
  scroll-behavior:smooth;
}

body{
  min-height:100vh;
  background:
    radial-gradient(circle at 80% 10%,rgba(28,115,76,.08),transparent 35%),
    var(--bg);
  color:var(--text);
  font-family:Inter,Arial,sans-serif;
  overflow-x:hidden;
}

body.translated-ltr,
body.translated-rtl{
  top:0!important;
}

a{
  color:inherit;
  text-decoration:none;
}

button,
input{
  font:inherit;
}

button{
  cursor:pointer;
}

img{
  max-width:100%;
}

/* =========================
   GOOGLE TRANSLATE VERBERGEN
========================= */

.goog-te-banner-frame,
.skiptranslate iframe,
#goog-gt-tt,
.goog-te-balloon-frame{
  display:none!important;
}

.goog-text-highlight{
  background:none!important;
  box-shadow:none!important;
}

body > .skiptranslate{
  display:none!important;
}

/* =========================
   HEADER
========================= */

.header{
  position:sticky;
  top:0;
  z-index:1000;
  width:100%;
  background:rgba(2,5,4,.92);
  backdrop-filter:blur(20px);
  border-bottom:1px solid var(--line);
}

.header-inner{
  width:min(1400px,100%);
  min-height:78px;
  margin:auto;
  padding:10px 24px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:24px;
}

.logo-area{
  display:flex;
  align-items:center;
  gap:12px;
  min-width:0;
}

.header-logo{
  width:54px;
  height:54px;
  object-fit:contain;
  flex-shrink:0;
}

.brand{
  display:flex;
  flex-direction:column;
  min-width:0;
}

.brand-title{
  color:#fff;
  font-family:Montserrat,sans-serif;
  font-size:15px;
  font-weight:900;
  letter-spacing:.7px;
  white-space:nowrap;
}

.brand-since{
  margin-top:3px;
  color:var(--gold);
  font-size:10px;
  font-weight:800;
  letter-spacing:2px;
}

.nav{
  display:flex;
  align-items:center;
  gap:5px;
}

.nav a{
  padding:10px 15px;
  border-radius:10px;
  color:#aab8b0;
  font-size:14px;
  font-weight:800;
  transition:.25s;
}

.nav a:hover,
.nav a.active{
  color:#fff;
  background:rgba(255,255,255,.07);
}

.header-actions{
  display:flex;
  align-items:center;
  gap:9px;
}

.lang-button,
.cart-button{
  border:1px solid rgba(239,210,143,.3);
  background:#08130f;
  color:var(--gold);
  min-height:42px;
  padding:0 13px;
  border-radius:11px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:7px;
  font-weight:800;
  transition:.25s;
}

.lang-button:hover,
.cart-button:hover{
  border-color:var(--gold);
  background:#0d2018;
  transform:translateY(-1px);
}

.cart-button{
  position:relative;
  font-size:18px;
  width:44px;
  padding:0;
}

.cart-count{
  position:absolute;
  top:-5px;
  right:-5px;
  width:18px;
  height:18px;
  border-radius:50%;
  background:var(--green);
  color:#001b10;
  font-size:10px;
  font-weight:900;
  display:grid;
  place-items:center;
}

.menu-button{
  display:none;
  width:43px;
  height:43px;
  border:1px solid var(--line);
  background:#08130f;
  color:#fff;
  border-radius:10px;
  font-size:21px;
}

/* =========================
   MOBILE MENU
========================= */

.mobile-menu{
  display:none;
  padding:10px 20px 20px;
  border-top:1px solid rgba(239,210,143,.1);
  background:#030806;
}

.mobile-menu.open{
  display:block;
}

.mobile-menu a{
  display:block;
  padding:14px;
  border-radius:10px;
  color:#dce6e0;
  font-weight:800;
}

.mobile-menu a:hover{
  background:rgba(255,255,255,.06);
}

/* =========================
   PAGE
========================= */

.page{
  width:min(1400px,100%);
  margin:auto;
  padding:30px 24px 90px;
}

/* =========================
   HERO
========================= */

.hero{
  position:relative;
  min-height:520px;
  border:1px solid rgba(239,210,143,.25);
  border-radius:22px;
  overflow:hidden;
  box-shadow:var(--shadow);
  background:#020504;
}

.hero-image{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  object-position:center;
}

.hero-overlay{
  position:absolute;
  inset:0;
  background:
    linear-gradient(90deg,
      rgba(2,5,4,.96) 0%,
      rgba(2,5,4,.83) 25%,
      rgba(2,5,4,.35) 52%,
      rgba(2,5,4,.04) 75%,
      rgba(2,5,4,.2) 100%);
}

.hero-content{
  position:relative;
  z-index:2;
  width:min(590px,53%);
  min-height:520px;
  padding:72px 0 60px 56px;
  display:flex;
  flex-direction:column;
  justify-content:center;
}

.hero-small{
  color:var(--gold);
  font-family:Montserrat,sans-serif;
  font-size:11px;
  font-weight:900;
  letter-spacing:2px;
  margin-bottom:18px;
  text-transform:uppercase;
}

.hero h1{
  font-family:Montserrat,sans-serif;
  font-size:clamp(42px,5vw,76px);
  line-height:.93;
  font-weight:900;
  letter-spacing:-2px;
  text-transform:uppercase;
  color:#fff;
}

.hero h1 span{
  color:var(--gold);
}

.hero-description{
  max-width:500px;
  margin-top:23px;
  color:#d1dad5;
  font-size:15px;
  line-height:1.6;
}

.hero-buttons{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  margin-top:27px;
}

.btn{
  min-height:45px;
  border-radius:10px;
  padding:0 20px;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  border:1px solid transparent;
  font-size:13px;
  font-weight:900;
  transition:.25s;
}

.btn-green{
  color:#fff;
  background:linear-gradient(135deg,#18c982,#0b8756);
  box-shadow:0 8px 25px rgba(20,201,130,.22);
}

.btn-green:hover{
  transform:translateY(-2px);
  box-shadow:0 12px 30px rgba(20,201,130,.35);
}

.btn-white{
  color:#07100c;
  background:#fff;
}

.btn-white:hover{
  transform:translateY(-2px);
  background:#f4f4f4;
}

.hero-search{
  margin-top:32px;
  width:min(440px,100%);
  height:48px;
  border:1px solid rgba(239,210,143,.5);
  background:rgba(0,0,0,.62);
  border-radius:11px;
  display:flex;
  align-items:center;
  overflow:hidden;
}

.hero-search-icon{
  width:50px;
  text-align:center;
  color:#fff;
  font-size:21px;
}

.hero-search input{
  flex:1;
  height:100%;
  border:0;
  outline:0;
  background:transparent;
  color:#fff;
  min-width:0;
  font-size:13px;
}

.hero-search input::placeholder{
  color:#9ca8a2;
}

.hero-search button{
  width:48px;
  height:38px;
  margin-right:5px;
  border:0;
  border-radius:8px;
  background:linear-gradient(135deg,var(--gold),var(--gold2));
  color:#050806;
  font-size:18px;
  font-weight:900;
}

/* =========================
   SECTION
========================= */

.section{
  margin-top:52px;
}

.section-header{
  display:flex;
  align-items:flex-end;
  justify-content:space-between;
  gap:20px;
  margin-bottom:20px;
  padding-bottom:14px;
  border-bottom:1px solid var(--line);
}

.section-title{
  font-family:Montserrat,sans-serif;
  font-size:27px;
  font-weight:900;
  color:#fff;
  text-transform:uppercase;
}

.section-title span{
  color:var(--gold);
}

.section-link{
  color:var(--gold);
  font-size:13px;
  font-weight:900;
  white-space:nowrap;
}

.section-link:hover{
  color:#fff;
}

/* =========================
   SHIRT ROW
========================= */

.shirt-row{
  display:grid;
  grid-auto-flow:column;
  grid-auto-columns:minmax(235px,280px);
  gap:18px;
  overflow-x:auto;
  padding:4px 3px 15px;
  scroll-snap-type:x mandatory;
}

.shirt-row::-webkit-scrollbar{
  height:6px;
}

.shirt-row::-webkit-scrollbar-thumb{
  background:rgba(239,210,143,.3);
  border-radius:10px;
}

/* =========================
   SHIRT GRID
========================= */

.shirt-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(240px,1fr));
  gap:20px;
}

/* =========================
   SHIRT CARD
========================= */

.shirt-card{
  position:relative;
  background:linear-gradient(180deg,#0a1812,#06100c);
  border:1px solid var(--line);
  border-radius:17px;
  overflow:hidden;
  min-width:0;
  scroll-snap-align:start;
  transition:.3s;
}

.shirt-card:hover{
  transform:translateY(-5px);
  border-color:rgba(239,210,143,.55);
  box-shadow:0 15px 35px rgba(0,0,0,.45);
}

.shirt-visual{
  position:relative;
  aspect-ratio:1/1;
  background:
    radial-gradient(circle at 50% 35%,#183528 0%,#07120d 55%,#030805 100%);
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
}

.shirt-visual::after{
  content:"";
  position:absolute;
  inset:auto 0 0;
  height:35%;
  background:linear-gradient(transparent,rgba(0,0,0,.35));
}

.shirt-emoji{
  font-size:82px;
  filter:drop-shadow(0 15px 16px rgba(0,0,0,.65));
  transition:.3s;
}

.shirt-card:hover .shirt-emoji{
  transform:scale(1.08);
}

.condition{
  position:absolute;
  top:11px;
  left:11px;
  z-index:2;
  padding:5px 9px;
  border-radius:20px;
  background:rgba(0,0,0,.75);
  border:1px solid rgba(239,210,143,.4);
  color:var(--gold);
  font-size:9px;
  font-weight:900;
  text-transform:uppercase;
}

.shirt-body{
  padding:16px;
}

.club{
  color:#82958a;
  font-size:10px;
  font-weight:900;
  text-transform:uppercase;
  letter-spacing:.7px;
}

.shirt-name{
  margin-top:5px;
  min-height:42px;
  color:#fff;
  font-size:14px;
  line-height:1.35;
  font-weight:900;
}

.shirt-bottom{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin-top:14px;
}

.price{
  color:var(--green);
  font-size:16px;
  font-weight:900;
}

.view-button{
  border:1px solid rgba(239,210,143,.3);
  background:rgba(239,210,143,.07);
  color:var(--gold);
  border-radius:8px;
  padding:7px 11px;
  font-size:10px;
  font-weight:900;
}

.view-button:hover{
  background:var(--gold2);
  color:#000;
}

/* =========================
   EXPLORE HERO
========================= */

.explore-top{
  position:relative;
  min-height:310px;
  border:1px solid var(--line);
  border-radius:20px;
  overflow:hidden;
  background:#020504;
  margin-bottom:40px;
}

.explore-top img{
  width:100%;
  height:310px;
  object-fit:cover;
  object-position:center;
  display:block;
}

.explore-overlay{
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  padding-left:55px;
  background:linear-gradient(90deg,rgba(2,5,4,.94),rgba(2,5,4,.55),transparent);
}

.explore-overlay h1{
  max-width:420px;
  font-family:Montserrat,sans-serif;
  font-size:clamp(35px,5vw,65px);
  line-height:.95;
  text-transform:uppercase;
}

.explore-overlay h1 span{
  color:var(--gold);
}

/* =========================
   SELL
========================= */

.sell-box{
  max-width:760px;
  margin:40px auto;
  padding:45px;
  text-align:center;
  border:1px solid var(--line);
  border-radius:22px;
  background:
    radial-gradient(circle at top,#102a1d,#07110d 55%,#040806);
  box-shadow:var(--shadow);
}

.sell-icon{
  font-size:55px;
  margin-bottom:15px;
}

.sell-box h1{
  font-family:Montserrat,sans-serif;
  font-size:clamp(30px,5vw,48px);
  color:var(--gold);
  text-transform:uppercase;
}

.sell-box p{
  color:#aebcb5;
  line-height:1.7;
  margin:15px auto 28px;
  max-width:560px;
}

/* =========================
   SEARCH RESULTS
========================= */

.search-results{
  margin-top:30px;
}

.search-info{
  color:#9ca9a2;
  margin-bottom:15px;
  font-size:13px;
}

/* =========================
   LANGUAGE MODAL
====================================================== */

.modal-backdrop{
  position:fixed;
  inset:0;
  z-index:3000;
  background:rgba(0,0,0,.82);
  backdrop-filter:blur(10px);
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.modal-backdrop.open{
  display:flex;
}

.language-modal{
  width:min(650px,100%);
  max-height:85vh;
  display:flex;
  flex-direction:column;
  background:#0a1711;
  border:1px solid rgba(239,210,143,.35);
  border-radius:20px;
  box-shadow:0 30px 80px rgba(0,0,0,.7);
  padding:22px;
}

.modal-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:15px;
}

.modal-title{
  color:var(--gold);
  font-size:18px;
  font-weight:900;
}

.modal-close{
  width:38px;
  height:38px;
  border:0;
  border-radius:9px;
  background:rgba(255,255,255,.06);
  color:#fff;
  font-size:24px;
}

.modal-close:hover{
  background:rgba(255,255,255,.12);
}

.language-search{
  width:100%;
  height:45px;
  border:1px solid rgba(239,210,143,.25);
  border-radius:10px;
  outline:0;
  background:#030806;
  color:#fff;
  padding:0 14px;
  margin-bottom:14px;
}

.language-search:focus{
  border-color:var(--gold);
}

.language-list{
  overflow-y:auto;
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:7px;
  padding-right:5px;
}

.language-list::-webkit-scrollbar{
  width:6px;
}

.language-list::-webkit-scrollbar-thumb{
  background:rgba(239,210,143,.3);
  border-radius:10px;
}

.language-item{
  min-height:43px;
  border:1px solid transparent;
  background:rgba(255,255,255,.035);
  border-radius:9px;
  color:#d9e3de;
  display:flex;
  align-items:center;
  gap:9px;
  padding:8px 11px;
  font-size:12px;
  font-weight:700;
  cursor:pointer;
  transition:.2s;
}

.language-item:hover{
  background:rgba(239,210,143,.1);
  border-color:rgba(239,210,143,.2);
}

.language-item.active{
  background:var(--gold2);
  color:#000;
}

/* =========================
   FOOTER
========================= */

.footer{
  border-top:1px solid var(--line);
  background:#020504;
  padding:40px 20px;
  text-align:center;
}

.footer-brand{
  font-family:Montserrat,sans-serif;
  font-weight:900;
  color:#fff;
}

.footer p{
  margin-top:8px;
  color:#7f8f87;
  font-size:12px;
}

.footer-gold{
  color:var(--gold);
}

/* =========================
   TOAST
========================= */

.toast{
  position:fixed;
  left:50%;
  bottom:25px;
  z-index:5000;
  transform:translate(-50%,120px);
  background:#0d2018;
  border:1px solid rgba(239,210,143,.4);
  color:#fff;
  border-radius:10px;
  padding:12px 18px;
  font-size:13px;
  font-weight:800;
  box-shadow:0 15px 40px rgba(0,0,0,.45);
  transition:.3s;
}

.toast.show{
  transform:translate(-50%,0);
}

/* =========================
   RESPONSIVE
========================= */

@media(max-width:1050px){
  .header-inner{
    padding:9px 16px;
  }

  .nav{
    display:none;
  }

  .menu-button{
    display:block;
  }

  .hero{
    min-height:500px;
  }

  .hero-content{
    width:58%;
    padding-left:38px;
  }

  .hero-overlay{
    background:
      linear-gradient(90deg,
      rgba(2,5,4,.96) 0%,
      rgba(2,5,4,.85) 42%,
      rgba(2,5,4,.28) 80%,
      rgba(2,5,4,.15));
  }
}

@media(max-width:720px){
  .page{
    padding:16px 12px 60px;
  }

  .header-inner{
    min-height:68px;
    padding:8px 12px;
    gap:8px;
  }

  .header-logo{
    width:44px;
    height:44px;
  }

  .brand-title{
    font-size:11px;
  }

  .brand-since{
    font-size:8px;
    letter-spacing:1.3px;
  }

  .lang-button{
    min-height:38px;
    padding:0 9px;
    font-size:11px;
  }

  .cart-button{
    width:38px;
    min-height:38px;
  }

  .hero{
    min-height:620px;
    border-radius:15px;
  }

  .hero-image{
    object-position:62% center;
  }

  .hero-overlay{
    background:
      linear-gradient(180deg,
      rgba(2,5,4,.92) 0%,
      rgba(2,5,4,.82) 48%,
      rgba(2,5,4,.35) 100%);
  }

  .hero-content{
    width:100%;
    min-height:620px;
    padding:42px 24px 28px;
    justify-content:flex-start;
  }

  .hero-small{
    margin-top:12px;
    font-size:9px;
  }

  .hero h1{
    font-size:clamp(38px,12vw,58px);
    letter-spacing:-1.5px;
  }

  .hero-description{
    font-size:13px;
    max-width:360px;
    margin-top:18px;
  }

  .hero-buttons{
    margin-top:20px;
  }

  .btn{
    min-height:42px;
    padding:0 14px;
    font-size:11px;
  }

  .hero-search{
    margin-top:22px;
    width:100%;
  }

  .section{
    margin-top:38px;
  }

  .section-title{
    font-size:20px;
  }

  .section-link{
    font-size:11px;
  }

  .shirt-row{
    grid-auto-columns:210px;
    gap:12px;
  }

  .shirt-grid{
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:10px;
  }

  .shirt-body{
    padding:11px;
  }

  .shirt-name{
    font-size:11px;
    min-height:46px;
  }

  .price{
    font-size:13px;
  }

  .view-button{
    padding:6px 8px;
    font-size:8px;
  }

  .shirt-emoji{
    font-size:65px;
  }

  .language-list{
    grid-template-columns:1fr;
  }

  .language-modal{
    padding:16px;
  }

  .explore-top{
    min-height:250px;
  }

  .explore-top img{
    height:250px;
  }

  .explore-overlay{
    padding:25px;
  }

  .sell-box{
    padding:30px 20px;
  }
}

@media(max-width:420px){
  .brand{
    display:none;
  }

  .header-actions{
    margin-left:auto;
  }

  .hero{
    min-height:590px;
  }

  .hero-content{
    min-height:590px;
    padding:35px 20px 20px;
  }

  .hero h1{
    font-size:40px;
  }

  .shirt-grid{
    grid-template-columns:1fr 1fr;
  }

  .shirt-visual{
    aspect-ratio:1/1;
  }
}
</style>
</head>

<body>

<!-- Google Translate -->
<div id="google_translate_element" style="display:none"></div>

<script>

/* =========================================================

function escapeHTML(value){

  return String(value)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


function showToast(message){

  toast.textContent = message;
  toast.classList.add("show");

  clearTimeout(window.toastTimer);

  window.toastTimer = setTimeout(()=>{
    toast.classList.remove("show");
  },2200);

}


/* =========================================================
   CART
========================================================= */

function updateCart(){

  document.getElementById("cartCount").textContent = cart.length;

  localStorage.setItem(
    "fsm_cart",
    JSON.stringify(cart)
  );

}


function addToCart(id){

  const shirt = shirts.find(x => x.id === id);

  if(!shirt) return;

  cart.push(id);

  updateCart();

  showToast("Shirt toegevoegd aan je winkelmand.");

}

/* =========================================================
   HOME SEARCH
========================================================= */

function setupHomeSearch(){

  const input = document.getElementById("heroSearchInput");
  const button = document.getElementById("heroSearchButton");

  if(!input) return;

  function search(){

    const value = input.value.trim();

    if(!value){

      location.hash = "#/explore";
      return;

    }

    location.hash =
      "#/explore?search=" +
      encodeURIComponent(value);

  }

  button.onclick = search;

  input.addEventListener("keydown",event=>{

    if(event.key === "Enter"){
      search();
    }

  });

}

/* =========================================================

========================================================= */

function updateActiveNavigation(){

  document
    .querySelectorAll(".nav a")
    .forEach(a => a.classList.remove("active"));

  const hash = location.hash || "#/";

  if(hash.startsWith("#/explore")){

    document
      .getElementById("navExplore")
      ?.classList.add("active");

  }
  else if(hash.startsWith("#/sell")){

    document
      .getElementById("navSell")
      ?.classList.add("active");

  }
  else{

    document
      .getElementById("navHome")
      ?.classList.add("active");

  }

}


function route(){

  const hash = location.hash || "#/";

  updateActiveNavigation();

  if(hash.startsWith("#/explore")){

    renderExplore();

  }
  else if(hash.startsWith("#/sell")){

    renderSell();

  }
  else{

    renderHome();

  }

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

}


/* =========================================================
   LANGUAGE HELPERS
========================================================= */

function getLanguage(){

  return localStorage.getItem("fsm_language") || "nl";

}


function setLanguage(code){

  localStorage.setItem(
    "fsm_language",
    code
  );

  /*
    Google Translate gebruikt deze cookie:
    /source/target
  */

  document.cookie =
    "googtrans=/nl/" + code +
    ";path=/;max-age=31536000";

  document.cookie =
    "googtrans=/nl/" + code +
    ";path=/;domain=" +
    location.hostname +
    ";max-age=31536000";

  languageModal.classList.remove("open");

  location.reload();

}


/* =========================================================
   GOOGLE TRANSLATE
========================================================= */

function triggerGoogleTranslate(code){

  const select =
    document.querySelector(".goog-te-combo");

  if(!select){

    setTimeout(()=>{
      triggerGoogleTranslate(code);
    },500);

    return;

  }

  select.value = code;

  select.dispatchEvent(
    new Event("change")
  );

}


/* =========================================================
   LANGUAGE LIST
========================================================= */

function renderLanguages(filter=""){

  const current = getLanguage();

  const value =
    filter.trim().toLowerCase();

  const filtered =
    languages.filter(language => {

      return (
        language.name.toLowerCase().includes(value) ||
        language.code.toLowerCase().includes(value)
      );

    });

  languageList.innerHTML =
    filtered.map(language => `

      <div
        class="language-item ${language.code === current ? "active" : ""}"
        data-code="${language.code}"
      >

        <span style="font-size:18px">
          ${language.flag}
        </span>

        <span>
          ${language.name}
        </span>

      </div>

    `).join("");

  languageList
    .querySelectorAll(".language-item")
    .forEach(item => {

      item.addEventListener("click",()=>{

        setLanguage(
          item.dataset.code
        );

      });

    });

}


/* =========================================================
   CURRENT LANGUAGE
========================================================= */

function updateCurrentLanguage(){

  const code = getLanguage();

  const language =
    languages.find(x => x.code === code)
    || languages[0];

  document.getElementById(
    "currentFlag"
  ).textContent = language.flag;

  document.getElementById(
    "currentCode"
  ).textContent =
    code.split("-")[0].toUpperCase();

}


/* =========================================================
   LANGUAGE MODAL EVENTS
========================================================= */

document
  .getElementById("languageButton")
  .addEventListener("click",()=>{

    languageModal.classList.add("open");

    languageSearch.value="";

    renderLanguages();

    setTimeout(()=>{
      languageSearch.focus();
    },100);

  });


document
  .getElementById("languageClose")
  .addEventListener("click",()=>{

    languageModal.classList.remove("open");

  });


languageModal.addEventListener("click",event=>{

  if(event.target === languageModal){

    languageModal.classList.remove("open");

  }

});


languageSearch.addEventListener(
  "input",
  event => {

    renderLanguages(
      event.target.value
    );

  }
);


/* =========================================================
   MOBILE MENU
========================================================= */

const menuButton =
  document.getElementById("menuButton");

const mobileMenu =
  document.getElementById("mobileMenu");

menuButton.addEventListener("click",()=>{

  mobileMenu.classList.toggle("open");

});


mobileMenu
  .querySelectorAll("a")
  .forEach(link => {

    link.addEventListener("click",()=>{

      mobileMenu.classList.remove("open");

    });

  });


/* =========================================================
   CART
========================================================= */

document
  .getElementById("cartButton")
  .addEventListener("click",()=>{

    if(cart.length === 0){

      showToast(
        "Je winkelmand is nog leeg."
      );

      return;

    }

    showToast(
      `${cart.length} shirt(s) in je winkelmand.`
    );

  });


/* =========================================================
   HASH ROUTING
========================================================= */

window.addEventListener(
  "hashchange",
  route
);


/* =========================================================
   START
========================================================= */

updateCurrentLanguage();

updateCart();

renderLanguages();

route();

</script>

</body>
</html>
