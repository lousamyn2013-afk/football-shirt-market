<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Football-Shirt-Market</title>

<style>
:root{
  --ink:#06100c;
  --ink-2:#0a1711;
  --ink-3:#10241a;
  --forest:#0b2418;
  --forest-2:#123321;
  --forest-3:#17422a;
  --green:#18b875;
  --green-bright:#2bd58c;
  --gold:#d6aa45;
  --gold-bright:#f2cf70;
  --white:#fff;
  --panel:#0c1e14;
  --panel-2:#10271a;
  --muted:#9caea3;
  --shadow:0 18px 55px rgba(0,0,0,.28);
  --gold-hi:#efd28f;
  --emerald-hi:#35d69a;
  --cream:#f5f1e7;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;width:100%;min-height:100%}

html,body{
  background:
    radial-gradient(900px 500px at 7% -5%,rgba(24,168,115,.15),transparent 60%),
    radial-gradient(700px 450px at 93% 6%,rgba(239,210,143,.10),transparent 62%),
    radial-gradient(1000px 600px at 50% 110%,rgba(6,70,48,.16),transparent 65%),
    linear-gradient(135deg,#020504,#07120d 45%,#030605) !important;
  color:var(--cream)!important;
  font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  letter-spacing:-.01em;
}
button,input,select,textarea{font:inherit}
a{text-decoration:none;color:inherit}
.hidden{display:none!important}

/* HEADER */
.site-header{
  position:sticky;top:0;z-index:1000;width:100%;
  background:linear-gradient(100deg,rgba(2,7,5,.96),rgba(5,25,18,.94),rgba(2,7,5,.97))!important;
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  color:#fff;
  border-bottom:1px solid rgba(239,210,143,.20)!important;
  box-shadow:0 14px 40px rgba(0,0,0,.38)!important;
}
.header-inner{
  width:min(1320px,100%);min-height:84px;margin:auto;padding:10px 22px;
  display:flex;align-items:center;gap:28px;
}
.logo-link{display:flex;align-items:center;gap:13px;flex-shrink:0;color:#fff}
.header-logo{width:56px;height:56px;object-fit:contain;display:block;filter:drop-shadow(0 0 12px rgba(239,210,143,.15))}
.brand-name strong{display:block;font-size:16px;font-weight:950;letter-spacing:-.025em}
.brand-name span{
  display:block;color:var(--gold-hi)!important;font-size:8px;letter-spacing:3px;
  margin-top:6px;font-weight:900;
}
nav{flex:1;display:flex;align-items:center;gap:5px}
nav a{
  position:relative;color:#b8c9be;padding:11px 14px;border-radius:11px;
  font-size:13px;font-weight:800;transition:all .28s ease;
  border:1px solid transparent;
}
nav a:hover{
  background:rgba(24,168,115,.075)!important;
  border-color:rgba(24,168,115,.12);
  color:#fff;
}

.lang-select-wrapper { position: relative; display: inline-flex; align-items: center; flex-shrink: 0; }
.lang-select {
  appearance: none; -webkit-appearance: none;
  background: linear-gradient(135deg, rgba(12, 31, 23, 0.95), rgba(8, 19, 15, 0.95));
  color: var(--gold-hi); border: 1px solid rgba(239, 210, 143, 0.3);
  border-radius: 12px; padding: 10px 36px 10px 14px; font-size: 13px; font-weight: 800;
  cursor: pointer; outline: none; transition: all 0.25s ease;
}
.lang-select-wrapper::after {
  content: '▾'; position: absolute; right: 14px; pointer-events: none; color: var(--gold-hi); font-size: 11px;
}
.lang-select optgroup { background: #050b08; color: var(--gold-hi); font-weight: 900; }
.lang-select option { background: #08130f; color: #f4f7f3; padding: 8px 12px; }

.account-btn{
  border:1px solid rgba(239,210,143,.22)!important;
  background:linear-gradient(135deg,#12291f,#08130f)!important;
  color:#fff;border-radius:12px;padding:11px 17px;cursor:pointer;
  font-weight:850;flex-shrink:0;transition:.2s;
}

#app{min-height:calc(100vh - 84px)}
.page{width:min(1320px,100%);margin:auto;padding:34px 22px 80px}
.page h1,.page h2,.page h3{letter-spacing:-.035em; color:#f6f1e7!important;}
.page h1{font-size:clamp(30px,4vw,46px);margin:0 0 8px;font-weight:950;}
.page h2{font-size:28px;margin:0 0 16px;font-weight:900;}

/* HERO */
.hero,.explore-hero{
  position:relative;width:100%;overflow:hidden;border-radius:26px!important;
  background:#050908!important;border:1px solid rgba(239,210,143,.24)!important;
  box-shadow:0 35px 100px rgba(0,0,0,.48)!important;
}
.hero-image, .explore-hero-image{display:block;width:100%;height:auto;max-width:100%;object-fit:cover;}
.hero-hotspot{position:absolute;z-index:5;display:block;cursor:pointer;border-radius:12px;}
.hero-hotspot-explore{left:4.6%;top:65.1%;width:16.8%;height:8%}
.hero-hotspot-sell{left:22.6%;top:65.1%;width:19.5%;height:8%}

/* BUTTONS & CARDS */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  border:0;border-radius:12px;padding:12px 18px;cursor:pointer;
  font-weight:900;transition:.2s ease;min-height:46px; font-size:13px;
}
.primary{
  background:linear-gradient(135deg,#efd18d,#bd944d 58%,#96713a)!important;
  color:#171106!important;
}
.secondary{
  background:linear-gradient(135deg,#12382a,#0a2118)!important;
  color:#eef6f1!important;border:1px solid rgba(53,214,154,.25)!important;
}

.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:22px}
.box{
  position:relative;
  background:linear-gradient(145deg,#10271d,#0a1712 55%,#060c0a)!important;
  border:1px solid rgba(255,255,255,.075)!important;border-radius:18px;overflow:hidden;
  padding:20px;
}
.muted{color:var(--muted);font-size:12px}

.toolbar{
  display:grid;grid-template-columns:2fr 1.15fr .8fr;gap:12px;margin:22px 0 28px;
  padding:10px;border:1px solid rgba(255,255,255,.07);
  background:linear-gradient(135deg,rgba(12,31,23,.85),rgba(5,12,9,.8));
  border-radius:16px;
}
input,select{
  width:100%;padding:13px 14px;border:1px solid rgba(255,255,255,.10)!important;border-radius:12px;
  background:#09150f!important;color:#f1eee5!important;outline:none;
}

footer{text-align:center;padding:42px 20px;background:#020504;border-top:1px solid rgba(239,210,143,.18);}
.gold{color:var(--gold-hi)!important}

@media(max-width:950px){.grid{grid-template-columns:repeat(2,1fr)}.toolbar{grid-template-columns:1fr}}
@media(max-width:700px){.grid{grid-template-columns:1fr}}

/* Localized image overlays */
.hero,.explore-hero{position:relative;overflow:hidden}
.localized-shade{position:absolute;inset:0 auto 0 0;width:58%;z-index:3;pointer-events:none;background:linear-gradient(90deg,rgba(2,7,5,.96),rgba(2,7,5,.78) 55%,transparent)}
.localized-copy{position:absolute;z-index:4;left:5%;top:12%;width:48%;pointer-events:none;color:#fff}
.localized-copy .eyebrow{color:#efd28f;font-size:10px;font-weight:950;letter-spacing:2.5px;margin-bottom:14px}
.localized-copy h1{margin:0;font-size:clamp(32px,4.7vw,68px);line-height:.98;letter-spacing:-.055em;font-weight:950}
.localized-copy p{margin:16px 0 0;color:#d5dfda;max-width:440px;font-size:clamp(12px,1.15vw,16px);line-height:1.5}
.localized-actions{display:flex;gap:10px;margin-top:21px;pointer-events:auto}
.explore-localized-copy{position:absolute;z-index:4;left:5%;bottom:13%;color:#fff}
.explore-localized-copy small{color:#efd28f;font-size:10px;font-weight:950;letter-spacing:3px}
.explore-localized-copy h1{margin:7px 0 0;font-size:clamp(28px,4vw,56px);letter-spacing:-.05em}
.explore-localized-copy p{margin:7px 0 0;color:#d5dfda;font-size:14px}
@media(max-width:700px){.localized-shade{width:100%;background:linear-gradient(90deg,rgba(2,7,5,.96),rgba(2,7,5,.72))}.localized-copy{left:7%;top:12%;width:82%}}


/* === PREMIUM SEARCHABLE LANGUAGE PICKER === */
.lang-picker{position:relative;min-width:210px}
.lang-trigger{width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 13px;border:1px solid rgba(255,255,255,.10);border-radius:13px;background:rgba(255,255,255,.055);color:#fff;cursor:pointer}
.lang-menu{position:absolute;right:0;top:calc(100% + 8px);width:min(360px,92vw);max-height:min(520px,70vh);overflow:hidden;background:#0a1712;border:1px solid rgba(216,180,88,.24);border-radius:16px;box-shadow:0 24px 70px rgba(0,0,0,.55);z-index:9999;display:none}
.lang-menu.open{display:block;animation:langIn .16s ease}
@keyframes langIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.lang-search{padding:12px;border-bottom:1px solid rgba(255,255,255,.08);position:sticky;top:0;background:#0a1712;z-index:2}
.lang-search input{width:100%;box-sizing:border-box;padding:12px 14px;border-radius:11px;border:1px solid rgba(255,255,255,.1);background:#111f1a;color:#fff;outline:none}
.lang-list{max-height:420px;overflow:auto;padding:7px}
.lang-option{display:flex;align-items:center;gap:11px;width:100%;padding:10px;border:0;border-radius:10px;background:transparent;color:#fff;text-align:left;cursor:pointer}
.lang-option:hover,.lang-option.active{background:rgba(216,180,88,.10)}
.lang-option .flag{font-size:20px;width:25px;text-align:center}
.lang-option .lang-names{display:flex;flex-direction:column;min-width:0}
.lang-option .lang-name{font-size:13px;font-weight:800}
.lang-option .lang-native{font-size:11px;color:#8f9c96}
.lang-empty{padding:20px;text-align:center;color:#8f9c96;font-size:13px}
@media(max-width:700px){
  .lang-picker{min-width:0;width:100%}
  .lang-trigger{min-height:46px}
  .lang-menu{position:fixed;left:10px;right:10px;top:calc(var(--lang-top, 70px));width:auto;max-height:72vh;border-radius:18px}
  .lang-list{max-height:calc(72vh - 70px)}
  .lang-option{padding:13px 11px}
}


/* === MOBILE POLISH === */
@media(max-width:700px){
  html,body{width:100%;overflow-x:hidden}
  body{font-size:14px}
  .container,.wrap,.section-inner{width:100%;max-width:none;padding-left:16px;padding-right:16px;box-sizing:border-box}
  header,.navbar,.nav-inner{height:auto;min-height:64px}
  header .nav-inner{flex-wrap:wrap;gap:10px;padding-top:10px;padding-bottom:10px}
  .nav-links{order:3;width:100%;overflow-x:auto;display:flex;gap:6px;padding-bottom:2px;scrollbar-width:none}
  .nav-links::-webkit-scrollbar{display:none}
  .nav-links a{white-space:nowrap;padding:9px 11px}
  .hero{min-height:610px}
  .hero-image,.explore-hero-image{object-position:center}
  .localized-copy{top:15%;left:18px;width:calc(100% - 36px)}
  .localized-copy h1{font-size:clamp(38px,12vw,58px)}
  .localized-copy p{max-width:100%;font-size:14px}
  .localized-actions{flex-direction:column;align-items:stretch;max-width:280px}
  .localized-actions .btn{width:100%;box-sizing:border-box;text-align:center}
  .explore-localized-copy{left:18px;bottom:10%;right:18px}
  .explore-localized-copy h1{font-size:clamp(34px,10vw,52px)}
  .grid,.cards,.products-grid{grid-template-columns:1fr!important}
  .card,.product-card{width:100%;min-width:0}
  .filters{overflow-x:auto;display:flex;gap:8px;scrollbar-width:none}
  .filters::-webkit-scrollbar{display:none}
  .modal,.drawer{width:calc(100% - 20px)!important;max-width:none!important;margin:10px!important}
  input,select,textarea,button{font-size:16px} /* prevents iOS zoom */
}

</style>
</head>

function populateLanguageDropdown(){
  const host=document.querySelector('#languageDropdown,.language-dropdown,[data-language-picker]');
  if(!host) return;
  host.classList.add('lang-picker');
  host.innerHTML=`
    <button type="button" class="lang-trigger" aria-expanded="false">
      <span class="lang-current"></span><span>⌄</span>
    </button>
    <div class="lang-menu" role="dialog" aria-label="Language selector">
      <div class="lang-search"><input type="search" autocomplete="off" placeholder="Search language / Zoek taal..." aria-label="Search language"></div>
      <div class="lang-list"></div>
    </div>`;
  const trigger=host.querySelector('.lang-trigger'), menu=host.querySelector('.lang-menu');
  const search=host.querySelector('.lang-search input'), list=host.querySelector('.lang-list');
  const current=()=>languages.find(x=>x.code===currentLang)||languages[0];

  function draw(filter=''){
    const q=filter.trim().toLocaleLowerCase();
    const rows=languages.filter(x=>
      !q || [x.code,x.name,x.nativeName].some(v=>v.toLocaleLowerCase().includes(q))
    );
    list.innerHTML=rows.length ? rows.map(x=>`
      <button type="button" class="lang-option ${x.code===currentLang?'active':''}" data-code="${x.code}">
        <span class="flag">${x.flag}</span>
        <span class="lang-names"><span class="lang-name">${x.name}</span><span class="lang-native">${x.nativeName} · ${x.code}</span></span>
      </button>`).join('') : '<div class="lang-empty">Geen taal gevonden / No language found</div>';
  }
  function updateCurrent(){
    const x=current(); host.querySelector('.lang-current').textContent=`${x.flag} ${x.nativeName}`;
  }
  trigger.addEventListener('click',()=>{
    const open=menu.classList.toggle('open'); trigger.setAttribute('aria-expanded',open);
    if(open){search.value='';draw();setTimeout(()=>search.focus(),30)}
  });
  search.addEventListener('input',e=>draw(e.target.value));
  list.addEventListener('click',e=>{
    const b=e.target.closest('[data-code]'); if(!b)return;
    currentLang=b.dataset.code; localStorage.setItem('fsm_lang',currentLang);
    document.documentElement.lang=currentLang; applyLanguageDirection();
    menu.classList.remove('open'); trigger.setAttribute('aria-expanded','false');
    route();
    updateCurrent();
  });
  document.addEventListener('click',e=>{if(!host.contains(e.target)){menu.classList.remove('open');trigger.setAttribute('aria-expanded','false')}});
  updateCurrent(); draw();
}


function applyLanguageDirection(){
  const rtl=['ar','he','fa','ur'].includes(currentLang);
  document.documentElement.dir=rtl?'rtl':'ltr';
  document.body.classList.toggle('rtl-lang',rtl);
}

function t(key) {
  const langDict = dict[currentLang] || dict['nl'];
  return langDict[key] || dict['nl'][key] || key;
}

function translateDOM() {
  document.querySelectorAll("[data-i18n]").forEach(el => {
    const key = el.getAttribute("data-i18n");
    el.textContent = t(key);
  });
  route();
}

document.getElementById("langSwitcher").addEventListener("change", function(e) {
  currentLang = e.target.value;
  localStorage.setItem("fsm_lang", currentLang);
  document.documentElement.lang = currentLang;
  applyLanguageDirection();
  route();
});
