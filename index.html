<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Football-Shirt-Market</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

<style>

:root{
    --gold:#d6aa45;
    --gold-light:#efd28f;
    --green:#18b875;
    --green-dark:#08734b;
    --bg:#020504;
    --card:#07120d;
    --text:#f5f1e7;
    --muted:#9aa9a1;
    --border:rgba(239,210,143,.20);
}

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html{
    scroll-behavior:smooth;
}

body{
    background:
        radial-gradient(circle at 50% -20%,rgba(24,184,117,.08),transparent 35%),
        var(--bg);
    color:var(--text);
    font-family:'Inter',sans-serif;
    overflow-x:hidden;
}

a{
    color:inherit;
    text-decoration:none;
}

button,
input{
    font-family:inherit;
}

/* =========================
   HEADER
========================= */

.site-header{
    position:sticky;
    top:0;
    z-index:1000;
    width:100%;
    background:rgba(2,7,5,.92);
    backdrop-filter:blur(20px);
    border-bottom:1px solid rgba(239,210,143,.16);
}

.header-inner{
    width:min(1400px,100%);
    min-height:78px;
    margin:auto;
    padding:10px 24px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:25px;
}

.logo-link{
    display:flex;
    align-items:center;
    gap:12px;
    min-width:0;
}

.header-logo{
    width:55px;
    height:55px;
    object-fit:contain;
}

.brand-name{
    display:flex;
    flex-direction:column;
    min-width:0;
}

.brand-title{
    color:white;
    font-family:'Montserrat',sans-serif;
    font-size:15px;
    font-weight:900;
    letter-spacing:.5px;
    text-transform:uppercase;
    white-space:nowrap;
}

.brand-since{
    color:var(--gold-light);
    font-size:10px;
    font-weight:800;
    letter-spacing:2px;
    margin-top:3px;
}

nav{
    display:flex;
    align-items:center;
    gap:5px;
}

nav a{
    color:#b8c9be;
    padding:10px 15px;
    border-radius:10px;
    font-size:14px;
    font-weight:800;
    transition:.25s;
}

nav a:hover,
nav a.active{
    color:white;
    background:rgba(255,255,255,.08);
}

.lang-btn{
    display:flex;
    align-items:center;
    gap:7px;
    border:1px solid rgba(239,210,143,.35);
    background:#08130f;
    color:var(--gold-light);
    border-radius:11px;
    padding:10px 14px;
    font-size:12px;
    font-weight:800;
    cursor:pointer;
    transition:.25s;
}

.lang-btn:hover{
    border-color:var(--gold-light);
    transform:translateY(-1px);
}

/* =========================
   PAGE
========================= */

.page{
    width:min(1400px,100%);
    margin:auto;
    padding:28px 24px 80px;
}

/* =========================
   HERO
========================= */

.hero{
    position:relative;
    width:100%;
    min-height:560px;
    border-radius:22px;
    overflow:hidden;
    border:1px solid rgba(239,210,143,.25);
    box-shadow:
        0 25px 70px rgba(0,0,0,.65),
        inset 0 0 80px rgba(0,0,0,.25);
    background:#030706;
}

.hero-image{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    object-position:center;
}

.hero-overlay{
    position:absolute;
    inset:0;
    background:
        linear-gradient(
            90deg,
            rgba(2,6,5,.94) 0%,
            rgba(2,6,5,.78) 31%,
            rgba(2,6,5,.18) 61%,
            rgba(2,6,5,.05) 100%
        );
}

.hero-content{
    position:relative;
    z-index:2;
    width:48%;
    min-height:560px;
    padding:70px 0 40px 55px;
    display:flex;
    flex-direction:column;
    justify-content:center;
}

.hero-small{
    color:var(--gold-light);
    font-family:'Montserrat',sans-serif;
    font-size:12px;
    font-weight:900;
    letter-spacing:2px;
    text-transform:uppercase;
    margin-bottom:18px;
}

.hero-title{
    font-family:'Montserrat',sans-serif;
    font-size:clamp(42px,5vw,76px);
    line-height:.94;
    font-weight:900;
    letter-spacing:-2px;
    text-transform:uppercase;
}

.hero-title span{
    color:var(--gold-light);
}

.hero-description{
    max-width:470px;
    margin-top:24px;
    color:#d5ded9;
    font-size:15px;
    line-height:1.6;
}

.hero-buttons{
    display:flex;
    gap:10px;
    margin-top:27px;
    flex-wrap:wrap;
}

.btn{
    border:0;
    border-radius:9px;
    padding:13px 19px;
    font-size:12px;
    font-weight:900;
    cursor:pointer;
    transition:.25s;
}

.btn-green{
    background:linear-gradient(135deg,#19c47d,#08764c);
    color:white;
    box-shadow:0 8px 25px rgba(24,184,117,.22);
}

.btn-green:hover{
    transform:translateY(-2px);
    box-shadow:0 12px 30px rgba(24,184,117,.32);
}

.btn-white{
    background:white;
    color:#111;
}

.btn-white:hover{
    transform:translateY(-2px);
    background:#f2f2f2;
}

/* =========================
   SEARCH
========================= */

.hero-search{
    width:min(440px,100%);
    height:54px;
    margin-top:28px;
    display:flex;
    align-items:center;
    background:rgba(0,0,0,.72);
    border:1px solid rgba(239,210,143,.5);
    border-radius:12px;
    padding:5px 5px 5px 16px;
    box-shadow:0 0 25px rgba(239,210,143,.08);
}

.search-icon{
    font-size:21px;
    margin-right:11px;
    color:#ddd;
}

.hero-search input{
    flex:1;
    min-width:0;
    background:transparent;
    border:0;
    outline:0;
    color:white;
    font-size:13px;
}

.hero-search input::placeholder{
    color:#89958f;
}

.search-submit{
    width:42px;
    height:42px;
    border:0;
    border-radius:9px;
    background:linear-gradient(135deg,var(--gold-light),var(--gold));
    color:#111;
    font-size:20px;
    cursor:pointer;
    transition:.2s;
}

.search-submit:hover{
    transform:translateX(2px);
}

/* =========================
   SHIRT SECTION
========================= */

.shirt-section{
    margin-top:48px;
}

.section-header{
    display:flex;
    align-items:end;
    justify-content:space-between;
    gap:20px;
    margin-bottom:20px;
    padding-bottom:13px;
    border-bottom:1px solid rgba(239,210,143,.14);
}

.section-title{
    font-family:'Montserrat',sans-serif;
    font-size:26px;
    font-weight:900;
    text-transform:uppercase;
}

.section-title span{
    color:var(--gold-light);
}

.all-shirts{
    display:flex;
    align-items:center;
    gap:9px;
    color:var(--gold-light);
    font-size:13px;
    font-weight:800;
    padding:9px 13px;
    border:1px solid rgba(239,210,143,.25);
    border-radius:9px;
    transition:.25s;
}

.all-shirts:hover{
    background:rgba(239,210,143,.1);
    border-color:var(--gold-light);
}

.arrow{
    font-size:20px;
}

/* horizontale rij op Home */

.shirts-row{
    display:grid;
    grid-template-columns:repeat(4,minmax(0,1fr));
    gap:18px;
}

/* =========================
   SHIRT CARDS
========================= */

.shirt-card{
    min-width:0;
    background:
        linear-gradient(
            180deg,
            rgba(12,34,24,.96),
            rgba(5,17,12,.98)
        );
    border:1px solid var(--border);
    border-radius:16px;
    overflow:hidden;
    transition:.3s;
}

.shirt-card:hover{
    transform:translateY(-6px);
    border-color:var(--gold-light);
    box-shadow:0 15px 35px rgba(0,0,0,.45);
}

.shirt-image{
    height:230px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:
        radial-gradient(
            circle at center,
            #173526 0%,
            #08140e 55%,
            #030906 100%
        );
    font-size:75px;
}

.shirt-info{
    padding:15px;
}

.shirt-club{
    color:#91a49a;
    font-size:10px;
    font-weight:800;
    text-transform:uppercase;
    letter-spacing:.6px;
}

.shirt-name{
    color:white;
    font-size:14px;
    font-weight:800;
    line-height:1.35;
    margin-top:5px;
    min-height:38px;
}

.shirt-bottom{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    margin-top:15px;
}

.price{
    color:#18d78a;
    font-size:15px;
    font-weight:900;
}

.view-btn{
    border:1px solid rgba(239,210,143,.3);
    background:rgba(239,210,143,.07);
    color:var(--gold-light);
    padding:7px 10px;
    border-radius:7px;
    font-size:10px;
    font-weight:900;
    cursor:pointer;
}

/* =========================
   EXPLORE GRID
========================= */

.explore-grid{
    display:grid;
    grid-template-columns:repeat(4,minmax(0,1fr));
    gap:20px;
}

/* =========================
   LANGUAGE MODAL
========================= */

.lang-modal-backdrop{
    position:fixed;
    inset:0;
    z-index:3000;
    display:none;
    align-items:center;
    justify-content:center;
    padding:20px;
    background:rgba(0,0,0,.82);
    backdrop-filter:blur(10px);
}

.lang-modal-backdrop.open{
    display:flex;
}

.lang-modal{
    width:min(650px,100%);
    max-height:85vh;
    display:flex;
    flex-direction:column;
    padding:25px;
    border-radius:20px;
    background:#0a1812;
    border:1px solid rgba(239,210,143,.28);
    box-shadow:0 30px 80px rgba(0,0,0,.8);
}

.lang-modal-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:17px;
}

.lang-modal-title{
    color:var(--gold-light);
    font-size:18px;
    font-weight:900;
}

.lang-close{
    border:0;
    background:transparent;
    color:#9aa9a1;
    font-size:28px;
    cursor:pointer;
}

.lang-search{
    width:100%;
    padding:13px 15px;
    margin-bottom:15px;
    border-radius:10px;
    border:1px solid rgba(239,210,143,.22);
    background:#030806;
    color:white;
    outline:0;
}

.lang-search:focus{
    border-color:var(--gold-light);
}

.lang-list{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:7px;
    overflow-y:auto;
    padding-right:4px;
}

.lang-item{
    display:flex;
    align-items:center;
    gap:9px;
    padding:11px;
    border-radius:9px;
    background:rgba(255,255,255,.035);
    cursor:pointer;
    color:#dbe4df;
    font-size:12px;
    font-weight:700;
    transition:.2s;
}

.lang-item:hover{
    background:rgba(239,210,143,.12);
    color:white;
}

.lang-item.active{
    background:var(--gold);
    color:#000;
}

/* =========================
   FOOTER
========================= */

footer{
    padding:40px 20px;
    text-align:center;
    border-top:1px solid rgba(239,210,143,.15);
    color:#87948e;
    font-size:13px;
}

footer strong{
    color:white;
}

/* =========================
   GOOGLE TRANSLATE HIDE
========================= */

body{
    top:0!important;
}

.goog-te-banner-frame,
.skiptranslate iframe,
#goog-te-setup{
    display:none!important;
}

.goog-text-highlight{
    background:transparent!important;
    box-shadow:none!important;
}

/* =========================
   TABLET
========================= */

@media(max-width:1050px){

    .header-inner{
        padding:10px 18px;
    }

    .brand-name{
        display:none;
    }

    .hero{
        min-height:500px;
    }

    .hero-content{
        width:55%;
        min-height:500px;
        padding-left:40px;
    }

    .shirts-row,
    .explore-grid{
        grid-template-columns:repeat(3,1fr);
    }

}

/* =========================
   MOBILE
========================= */

@media(max-width:750px){

    .header-inner{
        min-height:68px;
        padding:8px 12px;
        gap:8px;
    }

    .header-logo{
        width:46px;
        height:46px;
    }

    nav{
        gap:0;
    }

    nav a{
        padding:8px 7px;
        font-size:11px;
    }

    .lang-btn{
        padding:8px 9px;
    }

    .page{
        padding:15px 12px 50px;
    }

    .hero{
        min-height:620px;
        border-radius:15px;
    }

    .hero-image{
        object-position:63% center;
    }

    .hero-overlay{
        background:
            linear-gradient(
                180deg,
                rgba(2,6,5,.90) 0%,
                rgba(2,6,5,.82) 48%,
                rgba(2,6,5,.50) 100%
            );
    }

    .hero-content{
        width:100%;
        min-height:620px;
        padding:55px 24px 25px;
        justify-content:flex-start;
    }

    .hero-small{
        font-size:9px;
        margin-bottom:15px;
    }

    .hero-title{
        font-size:clamp(39px,12vw,62px);
        letter-spacing:-1.5px;
    }

    .hero-description{
        font-size:13px;
        max-width:390px;
        margin-top:18px;
    }

    .hero-buttons{
        margin-top:20px;
    }

    .btn{
        padding:11px 14px;
        font-size:11px;
    }

    .hero-search{
        margin-top:20px;
        width:100%;
    }

    .shirts-row{
        display:flex;
        overflow-x:auto;
        scroll-snap-type:x mandatory;
        padding-bottom:10px;
    }

    .shirts-row .shirt-card{
        min-width:260px;
        scroll-snap-align:start;
    }

    .explore-grid{
        grid-template-columns:repeat(2,1fr);
        gap:10px;
    }

    .shirt-image{
        height:180px;
    }

    .section-title{
        font-size:19px;
    }

    .all-shirts{
        font-size:11px;
    }

    .lang-list{
        grid-template-columns:1fr;
    }

}

/* kleine gsm */

@media(max-width:430px){

    .brand-name{
        display:none;
    }

    nav a{
        padding:7px 5px;
        font-size:10px;
    }

    .lang-btn span:nth-child(2){
        display:none;
    }

    .hero{
        min-height:600px;
    }

    .hero-content{
        min-height:600px;
        padding:45px 20px 20px;
    }

    .hero-title{
        font-size:43px;
    }

}

</style>
</head>

/* ==========================================
   SEARCH
========================================== */

function searchShirts(){

const input=document.getElementById("heroSearch");

if(!input) return;

const value=input.value.trim();

if(value){

location.hash="#/explore";

}

}

document.addEventListener("keydown",function(e){

if(e.key==="Enter" && document.activeElement?.id==="heroSearch"){

searchShirts();

}

});


/* ==========================================
   ROUTER
========================================== */

function route(){

const hash=location.hash || "#/";

document.querySelectorAll("nav a")
.forEach(a=>a.classList.remove("active"));


if(hash.startsWith("#/explore")){

document
.getElementById("nav-explore")
.classList.add("active");

renderExplore();

}

else if(hash.startsWith("#/sell")){

document
.getElementById("nav-sell")
.classList.add("active");

renderSell();

}

else{

document
.getElementById("nav-home")
.classList.add("active");

renderHome();

}

}


/* ==========================================
   LANGUAGE
========================================== */

const langModal=
document.getElementById("langModal");

const langList=
document.getElementById("langList");

const langSearch=
document.getElementById("langSearchInput");


function getActiveLanguage(){

let match=document.cookie.match(
/(^|;) ?googtrans=\/nl\/([^;]+)/
);

return match ? match[2] : "nl";

}


function renderLanguageList(filter=""){

const search=filter.toLowerCase().trim();

langList.innerHTML="";

const filtered=languages.filter(lang=>

lang.name.toLowerCase().includes(search) ||

lang.code.toLowerCase().includes(search)

);

filtered.forEach(lang=>{

const item=document.createElement("div");

item.className="lang-item";

if(lang.code===getActiveLanguage()){

item.classList.add("active");

}

item.innerHTML=`

<span>${lang.flag}</span>

<span>${lang.name}</span>

`;

item.onclick=()=>{

document.cookie=
"googtrans=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;";

document.cookie=
"googtrans=/nl/"+lang.code+"; path=/;";

langModal.classList.remove("open");

location.reload();

};

langList.appendChild(item);

});

}


document
.getElementById("langPickerBtn")
.addEventListener("click",()=>{

langModal.classList.add("open");

langSearch.value="";

renderLanguageList();

setTimeout(()=>{
langSearch.focus();
},100);

});


document
.getElementById("closeLangModal")
.addEventListener("click",()=>{

langModal.classList.remove("open");

});


langModal.addEventListener("click",(e)=>{

if(e.target===langModal){

langModal.classList.remove("open");

}

});


langSearch.addEventListener("input",e=>{

renderLanguageList(e.target.value);

});


/* ==========================================
   CURRENT LANGUAGE
========================================== */

function updateLanguageButton(){

const code=getActiveLanguage();

const language=
languages.find(x=>x.code===code)
||
languages.find(x=>x.code==="nl");

if(language){

document.getElementById("currentFlag")
.textContent=language.flag;

document.getElementById("currentLangCode")
.textContent=language.code
.split("-")[0]
.toUpperCase();

}

}


/* ==========================================
   START
========================================== */

window.addEventListener("hashchange",route);

route();

updateLanguageButton();

</script>
