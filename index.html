<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<!-- Belangrijk voor GSM: voorkomt ongewenst inzoomen en zorgt voor de juiste breedte -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Football-Shirt-Market</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
:root {
    --bg: #020504; --green: #18bf77; --green-dark: #08784c;
    --gold: #efd28f; --gold-dark: #d1a33d; --white: #fff;
    --muted: #b7c4be; --card: #08140f; --line: rgba(239,210,143,.2);
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
    background: var(--bg); color: #fff;
    font-family: Inter, Arial, sans-serif;
    overflow-x: hidden; min-height: 100vh;
    width: 100%;
    -webkit-text-size-adjust: 100%;
}

a { color: inherit; text-decoration: none; }
button, input, select, textarea { font-family: inherit; }
img { max-width: 100%; display: block; }

/* HEADER & NAV */
.site-header {
    position: sticky; top: 0; z-index: 1000;
    background: rgba(2,6,4,.94); backdrop-filter: blur(18px);
    border-bottom: 1px solid var(--line);
}
.header-inner {
    width: min(1400px, 100%); margin: auto; padding: 9px 22px;
    display: flex; align-items: center; justify-content: space-between; gap: 20px;
}
.logo-area { display: flex; align-items: center; gap: 11px; }
.header-logo { width: 54px; height: 54px; object-fit: contain; }
.brand-title { font-family: Montserrat, sans-serif; font-size: 14px; font-weight: 900; }
.brand-since { color: var(--gold); font-size: 9px; letter-spacing: 2px; font-weight: 800; }
nav { display: flex; gap: 5px; }
nav a { color: #adbbb4; padding: 10px 15px; border-radius: 10px; font-size: 13px; font-weight: 800; transition: .2s; cursor: pointer; }
nav a:hover, nav a.active { color: #fff; background: rgba(255,255,255,.07); }
.header-right { display: flex; align-items: center; gap: 8px; }

.menu-button {
    display: none; width: 42px; height: 42px; border: 1px solid var(--line);
    border-radius: 10px; background: #07130e; color: #fff; font-size: 20px; cursor: pointer;
}
.mobile-nav { display: none; border-top: 1px solid rgba(239,210,143,.1); background: #030806; padding: 10px 12px; }
.mobile-nav.open { display: block; }
.mobile-nav a { display: block; padding: 13px; border-radius: 12px; color: #dbe3df; font-weight: 800; margin-bottom: 5px; cursor: pointer;}
.mobile-nav a:hover { background: rgba(255,255,255,.06); }

/* PAGE & HERO */
.page { width: min(1400px, 100%); margin: auto; padding: 25px 22px 75px; }
.hero {
    position: relative; width: 100%; min-height: 520px;
    border-radius: 22px; border: 1px solid rgba(239,210,143,.22);
    background: #111; box-shadow: 0 25px 70px rgba(0,0,0,.6);
    display: flex; flex-direction: column; justify-content: center; padding: 40px;
    background-image: linear-gradient(90deg, rgba(2,5,4,0.9) 0%, rgba(2,5,4,0.4) 100%), url('https://images.unsplash.com/photo-1579952363873-27f3bade9f55?q=80&w=1000&auto=format&fit=crop');
    background-size: cover; background-position: center;
}
.hero-kicker { color: var(--gold); font-family: Montserrat; font-size: 11px; font-weight: 900; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 14px; }
.hero-title { font-family: Montserrat; color: #fff; font-size: clamp(36px, 4.5vw, 68px); line-height: 1; font-weight: 900; text-transform: uppercase; }
.hero-title span { color: var(--gold); }
.hero-description { max-width: 470px; color: #d1dbd6; margin-top: 16px; font-size: 14px; line-height: 1.55; }
.hero-buttons { display: flex; gap: 10px; margin-top: 22px; }
.hero-button {
    min-height: 45px; padding: 0 20px; display: inline-flex; align-items: center; justify-content: center;
    border-radius: 99px; font-size: 12px; font-weight: 900; transition: .22s; border: none; cursor: pointer;
}
.hero-button.green { color: #fff; background: linear-gradient(135deg, #19c982, #0a8955); }
.hero-button.white { background: #fff; color: #111; }

/* SECTIONS & GRIDS */
.section { margin-top: 45px; }
.section-head { display: flex; justify-content: space-between; align-items: flex-end; padding-bottom: 13px; margin-bottom: 18px; border-bottom: 1px solid rgba(239,210,143,.14); gap: 15px; }
.section-title { font-family: Montserrat; font-size: 24px; font-weight: 900; text-transform: uppercase; }
.section-title span { color: var(--gold); }

.explore-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(235px, 1fr)); gap: 18px; }

/* SHIRT CARDS */
.shirt-card { background: linear-gradient(180deg, #0b1913, #06100c); border: 1px solid var(--line); border-radius: 15px; overflow: hidden; transition: .28s; display: flex; flex-direction: column; }
.shirt-card:hover { transform: translateY(-5px); border-color: var(--gold); }
.shirt-visual { position: relative; width: 100%; aspect-ratio: 1/1; background: #08150f; display: flex; align-items: center; justify-content: center; }
.shirt-visual img { width: 100%; height: 100%; object-fit: cover; }
.shirt-condition { position: absolute; top: 9px; left: 9px; color: var(--gold); padding: 4px 8px; background: rgba(0,0,0,.75); border: 1px solid var(--line); border-radius: 15px; font-size: 8px; font-weight: 900; }
.shirt-info { padding: 14px; flex: 1; display: flex; flex-direction: column; justify-content: space-between; }
.shirt-club { color: #83948c; font-size: 9px; font-weight: 900; text-transform: uppercase; }
.shirt-name { color: #fff; font-size: 13px; font-weight: 900; margin-top: 4px; line-height: 1.3; }
.shirt-footer { display: flex; align-items: center; justify-content: space-between; margin-top: 12px; }
.shirt-price { color: var(--green); font-size: 14px; font-weight: 900; }
.shirt-view { color: var(--gold); background: rgba(239,210,143,.07); border: 1px solid var(--line); border-radius: 7px; padding: 6px 10px; font-size: 9px; font-weight: 900; cursor: pointer; }

/* SELL FORM */
.sell-box { max-width: 680px; margin: 20px auto; padding: 30px; background: #07130e; border: 1px solid var(--line); border-radius: 20px; }
.form-group { margin-bottom: 18px; }
.form-group label { display: block; color: var(--gold); font-size: 11px; font-weight: 800; text-transform: uppercase; margin-bottom: 7px; }
.form-group input, .form-group select, .form-group textarea { width: 100%; padding: 13px; background: #030806; border: 1px solid var(--line); border-radius: 10px; color: #fff; font-size: 14px; outline: 0; }
.hero-button.submit-btn { width: 100%; margin-top: 10px; }

/* FOOTER */
footer { padding: 35px 20px; text-align: center; background: #010302; border-top: 1px solid var(--line); color: #7e8c85; font-size: 12px; }

/* ======================================================
   RESPONSIVE / GSM FIXES
====================================================== */
@media(max-width: 900px) {
    .brand, nav { display: none; }
    .menu-button { display: block; }
    .hero { min-height: 480px; padding: 30px; }
}

@media(max-width: 700px) {
    .header-inner { padding: 10px 15px; }
    .page { padding: 15px 12px 50px; }
    .hero { min-height: 400px; padding: 25px 15px; }
    .hero-title { font-size: 32px; }
    .hero-description { font-size: 12px; }
    
    /* Gecorrigeerde sectie-titels voor mobiel */
    .section-title { font-size: 19px; }
    .section-link { font-size: 10px; }
    
    /* Grid fixes voor mobiel */
    .explore-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    .shirt-info { padding: 10px; }
    .shirt-name { font-size: 11px; min-height: 30px; }
    .shirt-price { font-size: 12px; }
    
    .sell-box { padding: 20px 15px; }
}

@media(max-width: 390px) {
    /* Voor erg kleine schermen, zet shirts onder elkaar in plaats van 2 naast elkaar */
    .explore-grid { grid-template-columns: 1fr; }
    .hero-title { font-size: 28px; }
    .hero-button { width: 100%; margin-bottom: 5px; }
}
</style>
</head>
<body>

<header class="site-header">
    <div class="header-inner">
        <div class="logo-area">
            <div class="brand">
                <span class="brand-title">Football Shirt Market</span>
                <span class="brand-since">EST. 2024</span>
            </div>
        </div>
        <nav id="desktopNav">
            <a onclick="navigate('home')" class="active">Home</a>
            <a onclick="navigate('explore')">Ontdekken</a>
            <a onclick="navigate('sell')">Verkopen</a>
        </nav>
        <div class="header-right">
            <button class="menu-button" onclick="toggleMenu()">☰</button>
        </div>
    </div>
    <div class="mobile-nav" id="mobileNav">
        <a onclick="navigate('home')">Home</a>
        <a onclick="navigate('explore')">Ontdekken</a>
        <a onclick="navigate('sell')">Verkopen</a>
    </div>
</header>

<main class="page" id="mainContent">
    <!-- Content wordt hier dynamisch geladen via JavaScript -->
</main>

<footer>
    <p>&copy; 2024 <strong>Football-Shirt-Market</strong>. Alle rechten voorbehouden.</p>
</footer>

<script>
// Mock Data (Voorbeeld shirts)
const shirtsData = [
    { id: 1, club: "AC Milan", name: "1994-1995 Home Shirt", price: "€ 149,99", condition: "9/10 Mint", img: "https://images.unsplash.com/photo-1508344928928-7105b67de433?q=80&w=400&auto=format&fit=crop" },
    { id: 2, club: "FC Barcelona", name: "2005-2006 Away Shirt", price: "€ 120,00", condition: "8/10 Goed", img: "https://images.unsplash.com/photo-1600250395379-31745dc72019?q=80&w=400&auto=format&fit=crop" },
    { id: 3, club: "Ajax", name: "1995 Home Shirt Zwart/Rood", price: "€ 180,00", condition: "10/10 Nieuw", img: "https://images.unsplash.com/photo-1552316658-0ce4a34bcfde?q=80&w=400&auto=format&fit=crop" },
    { id: 4, club: "Arsenal", name: "2003-2004 Invincibles", price: "€ 210,00", condition: "8.5/10 Goed", img: "https://images.unsplash.com/photo-1605650172600-b610c14441dc?q=80&w=400&auto=format&fit=crop" }
];

// Views HTML
const views = {
    home: `
        <div class="hero">
            <div class="hero-content">
                <div class="hero-kicker">De ultieme marktplaats</div>
                <h1 class="hero-title">Vind Jouw <span>Klassieker</span></h1>
                <p class="hero-description">Koop en verkoop authentieke, retro voetbalshirts veilig en snel.</p>
                <div class="hero-buttons">
                    <button class="hero-button green" onclick="navigate('explore')">Shop Nu</button>
                    <button class="hero-button white" onclick="navigate('sell')">Zelf Verkopen</button>
                </div>
            </div>
        </div>
        <div class="section">
            <div class="section-head">
                <h2 class="section-title">Nieuw <span>Binnen</span></h2>
                <a onclick="navigate('explore')" class="section-link" style="cursor:pointer;">Bekijk Alles &rarr;</a>
            </div>
            <div class="explore-grid" id="homeShirtsGrid"></div>
        </div>
    `,
    explore: `
        <div class="section-head">
            <h2 class="section-title">Alle <span>Shirts</span></h2>
        </div>
        <div class="explore-grid" id="exploreShirtsGrid"></div>
    `,
    sell: `
        <div class="sell-box">
            <h1 style="color:var(--gold); text-align:center; font-family:Montserrat; font-size:24px; margin-bottom: 20px;">Verkoop je Shirt</h1>
            <div class="form-group">
                <label>Club / Land</label>
                <input type="text" placeholder="Bijv. AC Milan">
            </div>
            <div class="form-group">
                <label>Naam & Seizoen</label>
                <input type="text" placeholder="Bijv. 1994 Home Shirt">
            </div>
            <div class="form-group">
                <label>Prijs (€)</label>
                <input type="number" placeholder="0.00">
            </div>
            <button class="hero-button green submit-btn" onclick="alert('Shirt succesvol geüpload!')">Plaats Advertentie</button>
        </div>
    `
};

// Navigatie & Rendering Logic
function navigate(page) {
    const content = document.getElementById('mainContent');
    content.innerHTML = views[page];
    
    // Update active state in nav
    document.querySelectorAll('nav a, .mobile-nav a').forEach(link => {
        link.classList.remove('active');
        if(link.getAttribute('onclick').includes(page)) {
            link.classList.add('active');
        }
    });

    // Render shirts if on home or explore
    if (page === 'home') renderShirts('homeShirtsGrid', 4);
    if (page === 'explore') renderShirts('exploreShirtsGrid', shirtsData.length);

    // Sluit mobiel menu indien open
    document.getElementById('mobileNav').classList.remove('open');
    window.scrollTo(0, 0);
}

// Shirt Kaartjes genereren
function renderShirts(containerId, limit) {
    const container = document.getElementById(containerId);
    if (!container) return;
    
    let html = '';
    const shirtsToShow = shirtsData.slice(0, limit);
    
    shirtsToShow.forEach(shirt => {
        html += `
            <div class="shirt-card">
                <div class="shirt-visual">
                    <span class="shirt-condition">${shirt.condition}</span>
                    <img src="${shirt.img}" alt="${shirt.name}">
                </div>
                <div class="shirt-info">
                    <div>
                        <div class="shirt-club">${shirt.club}</div>
                        <div class="shirt-name">${shirt.name}</div>
                    </div>
                    <div class="shirt-footer">
                        <span class="shirt-price">${shirt.price}</span>
                        <button class="shirt-view">Bekijk</button>
                    </div>
                </div>
            </div>
        `;
    });
    container.innerHTML = html;
}

// Mobiel menu toggle
function toggleMenu() {
    const nav = document.getElementById('mobileNav');
    nav.classList.toggle('open');
}

// Initiele laadactie
window.onload = () => {
    navigate('home');
};
</script>
</body>
</html>
