<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">

<title>Football-Shirt-Market</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
:root{
    --bg:#020504;
    --green:#18bf77;
    --green-dark:#08784c;
    --gold:#efd28f;
    --gold-dark:#d1a33d;
    --white:#fff;
    --muted:#b7c4be;
    --card:#08140f;
    --line:rgba(239,210,143,.2);
}

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,
body{
    margin:0;
    padding:0;
    background:var(--bg);
    color:#fff;
    font-family:Inter,Arial,sans-serif;
    overflow-x:hidden;
}

body{
    min-height:100vh;
}

a{
    color:inherit;
    text-decoration:none;
}

button,
input{
    font-family:inherit;
}

/* ================================
   GOOGLE TRANSLATE
================================ */

.goog-te-banner-frame,
.skiptranslate iframe,
#google_translate_element{
    display:none!important;
}

body{
    top:0!important;
}

.goog-text-highlight{
    background:transparent!important;
    box-shadow:none!important;
}

/* ================================
   HEADER
================================ */

.site-header{
    position:sticky;
    top:0;
    z-index:1000;
    background:rgba(2,6,4,.94);
    backdrop-filter:blur(18px);
    border-bottom:1px solid var(--line);
}

.header-inner{
    width:min(1400px,100%);
    min-height:78px;
    margin:auto;
    padding:9px 22px;

    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:20px;
}

.logo-area{
    display:flex;
    align-items:center;
    gap:11px;
}

.header-logo{
    width:54px;
    height:54px;
    object-fit:contain;
}

.brand{
    display:flex;
    flex-direction:column;
}

.brand-title{
    font-family:Montserrat,sans-serif;
    font-size:14px;
    font-weight:900;
    letter-spacing:.5px;
}

.brand-since{
    margin-top:3px;
    color:var(--gold);
    font-size:9px;
    letter-spacing:2px;
    font-weight:800;
}

nav{
    display:flex;
    gap:5px;
}

nav a{
    color:#adbbb4;
    padding:10px 15px;
    border-radius:10px;
    font-size:13px;
    font-weight:800;
    transition:.2s;
}

nav a:hover,
nav a.active{
    color:#fff;
    background:rgba(255,255,255,.07);
}

.header-right{
    display:flex;
    align-items:center;
    gap:8px;
}

.language-button{
    min-height:40px;
    border:1px solid rgba(239,210,143,.32);
    background:#07130e;
    color:var(--gold);
    border-radius:10px;
    padding:0 12px;

    display:flex;
    align-items:center;
    gap:6px;

    font-size:11px;
    font-weight:800;
    cursor:pointer;
}

.menu-button{
    display:none;
    width:42px;
    height:42px;
    border:1px solid var(--line);
    border-radius:10px;
    background:#07130e;
    color:#fff;
    font-size:20px;
}

/* ================================
   MOBILE NAV
================================ */

.mobile-nav{
    display:none;
    border-top:1px solid rgba(239,210,143,.1);
    background:#030806;
    padding:10px 12px;
}

.mobile-nav.open{
    display:block;
}

.mobile-nav a{
    display:block;
    padding:13px;
    border-radius:9px;
    color:#dbe3df;
    font-weight:800;
}

.mobile-nav a:hover{
    background:rgba(255,255,255,.06);
}

/* ================================
   PAGE
================================ */

.page{
    width:min(1400px,100%);
    margin:auto;
    padding:25px 22px 75px;
}

/* ==================================================
   HERO
================================================== */

.hero{
    position:relative;
    width:100%;
    height:clamp(500px,51vw,700px);

    overflow:hidden;
    border-radius:22px;

    border:1px solid rgba(239,210,143,.22);

    background:#020504;

    box-shadow:
        0 25px 70px rgba(0,0,0,.6);
}

/*
   BELANGRIJK:
   de afbeelding is maar één laag.
   Er wordt niets van de afbeelding vervangen.
*/

.hero-image{
    position:absolute;
    inset:0;

    width:100%;
    height:100%;

    object-fit:cover;
    object-position:center;

    display:block;

    z-index:1;
}

/*
   Deze overlay maakt alleen links iets donkerder.
   Hierdoor blijven het logo en de rechterkant volledig zichtbaar.
*/

.hero-shade{
    position:absolute;
    inset:0;
    z-index:2;

    background:
        linear-gradient(
            90deg,
            rgba(2,5,4,.98) 0%,
            rgba(2,5,4,.86) 27%,
            rgba(2,5,4,.52) 46%,
            rgba(2,5,4,.12) 65%,
            rgba(2,5,4,0) 100%
        );

    pointer-events:none;
}

/*
   CONTENT IS NU ÉÉN ENKELE LAAG.
*/

.hero-content{
    position:absolute;
    z-index:5;

    left:5.5%;
    top:50%;

    transform:translateY(-50%);

    width:min(530px,43%);

    display:flex;
    flex-direction:column;
    align-items:flex-start;
}

/* VERWIJDEREN VAN DUBBELE DONKERE TITEL:
   de HTML-content wordt onder een extra donkere
   zone gezet, zodat eventuele ingebakken oude tekst
   in de afbeelding niet opvalt.
*/

.hero-clean-mask{
    position:absolute;
    z-index:3;
    left:0;
    top:0;
    bottom:0;
    width:47%;

    background:
        linear-gradient(
            90deg,
            #020504 0%,
            rgba(2,5,4,.99) 68%,
            rgba(2,5,4,.50) 90%,
            transparent 100%
        );

    pointer-events:none;
}

.hero-kicker{
    color:var(--gold);

    font-family:Montserrat,sans-serif;

    font-size:11px;
    font-weight:900;

    letter-spacing:2px;
    text-transform:uppercase;

    margin-bottom:17px;
}

.hero-title{
    font-family:Montserrat,sans-serif;

    color:#fff;

    font-size:clamp(40px,5vw,75px);

    line-height:.94;

    letter-spacing:-2px;

    font-weight:900;

    text-transform:uppercase;

    text-shadow:
        0 5px 25px rgba(0,0,0,.65);
}

.hero-title span{
    color:var(--gold);
}

.hero-description{
    max-width:470px;

    color:#d1dbd6;

    margin-top:20px;

    font-size:14px;

    line-height:1.55;
}

.hero-buttons{
    display:flex;
    gap:10px;

    margin-top:24px;
}

/*
   Geen grijze achtergrond!
*/

.hero-button{
    min-height:45px;

    padding:0 18px;

    display:inline-flex;
    align-items:center;
    justify-content:center;

    border-radius:9px;

    font-size:11px;
    font-weight:900;

    transition:.22s;

    border:1px solid transparent;
}

.hero-button.green{
    color:#fff;

    background:
        linear-gradient(
            135deg,
            #19c982,
            #0a8955
        );

    box-shadow:
        0 8px 25px rgba(25,201,130,.22);
}

.hero-button.green:hover{
    transform:translateY(-2px);
}

.hero-button.white{
    background:#fff;
    color:#111;
}

.hero-button.white:hover{
    transform:translateY(-2px);
}

/* ================================
   SEARCH BAR
================================ */

.hero-search{
    width:min(430px,100%);
    height:50px;

    margin-top:22px;

    display:flex;
    align-items:center;

    background:rgba(0,0,0,.80);

    border:1px solid rgba(239,210,143,.48);

    border-radius:11px;

    overflow:hidden;

    box-shadow:
        0 10px 30px rgba(0,0,0,.4);
}

.hero-search-icon{
    width:47px;

    display:flex;
    justify-content:center;
    align-items:center;

    color:#fff;
    font-size:21px;
}

.hero-search input{
    flex:1;
    min-width:0;

    height:100%;

    border:0;
    outline:0;

    background:transparent;

    color:#fff;

    font-size:12px;
}

.hero-search input::placeholder{
    color:#8e9b95;
}

.hero-search button{
    width:43px;
    height:38px;

    margin-right:5px;

    border:0;
    border-radius:8px;

    background:
        linear-gradient(
            135deg,
            var(--gold),
            var(--gold-dark)
        );

    color:#0a0d0b;

    font-size:19px;
    font-weight:900;
}

/* ================================
   SECTIONS
================================ */

.section{
    margin-top:45px;
}

.section-head{
    display:flex;
    justify-content:space-between;
    align-items:flex-end;

    padding-bottom:13px;
    margin-bottom:18px;

    border-bottom:1px solid rgba(239,210,143,.14);
}

.section-title{
    font-family:Montserrat,sans-serif;
    font-size:25px;
    font-weight:900;
    text-transform:uppercase;
}

.section-title span{
    color:var(--gold);
}

.section-link{
    color:var(--gold);
    font-size:12px;
    font-weight:900;
}

/* ================================
   HOME SHIRTS
================================ */

.home-shirt-row{
    display:grid;

    grid-auto-flow:column;
    grid-auto-columns:245px;

    gap:15px;

    overflow-x:auto;

    padding:4px 3px 12px;
}

.home-shirt-row::-webkit-scrollbar{
    height:5px;
}

.home-shirt-row::-webkit-scrollbar-thumb{
    background:rgba(239,210,143,.3);
    border-radius:10px;
}

/* ================================
   EXPLORE GRID
================================ */

.explore-grid{
    display:grid;

    grid-template-columns:
        repeat(auto-fill,minmax(235px,1fr));

    gap:18px;
}

/* ================================
   SHIRT CARD
================================ */

.shirt-card{
    overflow:hidden;

    background:
        linear-gradient(
            180deg,
            #0b1913,
            #06100c
        );

    border:1px solid var(--line);

    border-radius:15px;

    transition:.28s;
}

.shirt-card:hover{
    transform:translateY(-6px);

    border-color:var(--gold);

    box-shadow:
        0 16px 35px rgba(0,0,0,.45);
}

.shirt-visual{
    position:relative;

    width:100%;
    aspect-ratio:1/1;

    display:flex;
    align-items:center;
    justify-content:center;

    background:
        radial-gradient(
            circle,
            #183c2a,
            #08150f 60%,
            #030805
        );

    font-size:72px;
}

.shirt-condition{
    position:absolute;
    top:9px;
    left:9px;

    color:var(--gold-light);

    padding:4px 8px;

    background:rgba(0,0,0,.72);

    border:1px solid rgba(239,210,143,.3);

    border-radius:15px;

    font-size:8px;
    font-weight:900;
}

.shirt-info{
    padding:14px;
}

.shirt-club{
    color:#83948c;

    font-size:9px;

    font-weight:900;

    text-transform:uppercase;

    letter-spacing:.5px;
}

.shirt-name{
    color:#fff;

    font-size:13px;

    line-height:1.4;

    font-weight:900;

    margin-top:5px;

    min-height:37px;
}

.shirt-footer{
    display:flex;

    align-items:center;

    justify-content:space-between;

    margin-top:13px;

    gap:7px;
}

.shirt-price{
    color:var(--green);

    font-size:14px;

    font-weight:900;
}

.shirt-view{
    color:var(--gold);

    background:rgba(239,210,143,.07);

    border:1px solid rgba(239,210,143,.27);

    border-radius:7px;

    padding:7px 9px;

    font-size:9px;

    font-weight:900;

    cursor:pointer;
}

/* ================================
   EXPLORE BANNER
================================ */

.explore-banner{
    position:relative;

    height:340px;

    overflow:hidden;

    border-radius:20px;

    border:1px solid var(--line);
}

.explore-banner img{
    width:100%;
    height:100%;

    object-fit:cover;
}

.explore-overlay{
    position:absolute;
    inset:0;

    display:flex;
    align-items:center;

    padding-left:55px;

    background:
        linear-gradient(
            90deg,
            rgba(2,5,4,.91),
            rgba(2,5,4,.4),
            transparent
        );
}

.explore-title{
    font-family:Montserrat,sans-serif;

    font-size:clamp(35px,5vw,62px);

    line-height:.95;

    text-transform:uppercase;
}

.explore-title span{
    color:var(--gold);
}

/* ================================
   SELL
================================ */

.sell-box{
    max-width:650px;

    margin:70px auto;

    padding:45px;

    text-align:center;

    background:
        radial-gradient(
            circle at top,
            rgba(239,210,143,.09),
            transparent 55%
        ),
        #07130e;

    border:1px solid var(--line);

    border-radius:20px;

    box-shadow:var(--shadow);
}

.sell-box h1{
    color:var(--gold);

    font-family:Montserrat,sans-serif;

    font-size:36px;
}

/* ================================
   LANGUAGE MODAL
================================ */

.language-modal{
    position:fixed;
    inset:0;
    z-index:4000;

    background:rgba(0,0,0,.82);

    backdrop-filter:blur(12px);

    display:none;

    align-items:center;
    justify-content:center;

    padding:20px;
}

.language-modal.open{
    display:flex;
}

.language-box{
    width:min(650px,100%);
    max-height:85vh;

    background:#09160f;

    border:1px solid rgba(239,210,143,.27);

    border-radius:20px;

    padding:22px;

    display:flex;
    flex-direction:column;

    box-shadow:0 30px 80px rgba(0,0,0,.8);
}

.language-head{
    display:flex;
    align-items:center;
    justify-content:space-between;

    margin-bottom:15px;
}

.language-title{
    color:var(--gold);

    font-family:Montserrat,sans-serif;

    font-size:18px;
    font-weight:900;
}

.language-close{
    width:37px;
    height:37px;

    border:0;
    border-radius:9px;

    background:rgba(255,255,255,.05);

    color:#aaa;

    font-size:24px;

    cursor:pointer;
}

.language-search{
    width:100%;
    height:46px;

    padding:0 14px;

    border:1px solid rgba(239,210,143,.23);

    border-radius:10px;

    outline:0;

    background:#030806;

    color:#fff;

    margin-bottom:13px;
}

.language-list{
    display:grid;

    grid-template-columns:repeat(2,1fr);

    gap:7px;

    overflow-y:auto;
}

.language-item{
    min-height:42px;

    border:1px solid transparent;

    border-radius:9px;

    background:rgba(255,255,255,.03);

    color:#d6dfda;

    display:flex;

    align-items:center;

    gap:9px;

    padding:8px 10px;

    cursor:pointer;

    font-size:12px;
    font-weight:700;

    text-align:left;
}

.language-item:hover{
    background:rgba(239,210,143,.1);
}

.language-item.active{
    background:var(--gold-dark);
    color:#000;
}

/* ================================
   FOOTER
================================ */

footer{
    padding:40px 20px;

    text-align:center;

    background:#010302;

    border-top:1px solid var(--line);

    color:#7e8c85;

    font-size:12px;
}

footer strong{
    color:#fff;

    font-family:Montserrat,sans-serif;
}

/* ================================
   MOBILE
================================ */

@media(max-width:900px){

    .header-inner{
        min-height:68px;
        padding:8px 12px;
    }

    .brand{
        display:none;
    }

    nav{
        display:none;
    }

    .menu-button{
        display:block;
    }

    .hero{
        height:620px;
        border-radius:16px;
    }

    .hero-image{
        object-position:68% center;
    }

    .hero-shade{
        background:
            linear-gradient(
                180deg,
                rgba(2,5,4,.9),
                rgba(2,5,4,.72) 48%,
                rgba(2,5,4,.28),
                rgba(2,5,4,.65)
            );
    }

    .hero-clean-mask{
        width:100%;
        height:56%;
        bottom:auto;

        background:
            linear-gradient(
                180deg,
                #020504 0%,
                rgba(2,5,4,.96) 72%,
                transparent 100%
            );
    }

    .hero-content{
        top:34px;
        left:20px;
        right:20px;

        transform:none;

        width:auto;

        max-width:none;
    }

    .hero-kicker{
        font-size:8px;
        letter-spacing:1.5px;
        margin-bottom:13px;
    }

    .hero-title{
        font-size:clamp(38px,11vw,54px);
        letter-spacing:-1px;
    }

    .hero-description{
        max-width:350px;
        margin-top:15px;
        font-size:11px;
    }

    .hero-buttons{
        margin-top:17px;
    }

    .hero-button{
        min-height:39px;
        padding:0 12px;
        font-size:9px;
    }

    .hero-search{
        margin-top:18px;
        width:100%;
        max-width:390px;
    }

    .home-shirt-row{
        grid-auto-columns:220px;
    }

    .language-list{
        grid-template-columns:1fr;
    }

}

@media(max-width:520px){

    .page{
        padding:12px 10px 55px;
    }

    .header-logo{
        width:43px;
        height:43px;
    }

    .hero{
        height:600px;
    }

    .hero-image{
        object-position:70% center;
    }

    .hero-content{
        left:17px;
        right:17px;
        top:29px;
    }

    .hero-title{
        font-size:40px;
    }

    .hero-description{
        max-width:300px;
        font-size:10px;
    }

    .hero-buttons{
        width:100%;
    }

    .hero-button{
        flex:1;
    }

    .hero-search{
        width:100%;
    }

    .section-title{
        font-size:19px;
    }

    .section-link{
        font-size:9px;
    }

    .explore-banner{
        height:300px;
    }

    .explore-overlay{
        padding-left:25px;
    }

}

@media(max-width:380px){

    .hero{
        height:570px;
    }

    .hero-title{
        font-size:35px;
    }

    .hero-description{
        display:none;
    }

}

</style>
</head>

<body>

<script>

/* =====================================================
   TALEN
===================================================== */

const languages=[

{code:"nl",name:"Nederlands",flag:"🇳🇱"},
{code:"en",name:"English",flag:"🇬🇧"},
{code:"fr",name:"Français",flag:"🇫🇷"},
{code:"de",name:"Deutsch",flag:"🇩🇪"},
{code:"es",name:"Español",flag:"🇪🇸"},
{code:"it",name:"Italiano",flag:"🇮🇹"},
{code:"pt",name:"Português",flag:"🇵🇹"},
{code:"af",name:"Afrikaans",flag:"🇿🇦"},

/* =====================================================
   ROUTER
===================================================== */

function route(){

const hash=
location.hash || "#/";

document
.querySelectorAll("nav a")
.forEach(
x=>x.classList.remove("active")
);


if(
hash.startsWith("#/explore")
){

document
.getElementById("navExplore")
.classList.add("active");

renderExplore();

}

else if(
hash.startsWith("#/sell")
){

document
.getElementById("navSell")
.classList.add("active");

renderSell();

}

else{

document
.getElementById("navHome")
.classList.add("active");

renderHome();

}

}


/* =====================================================
   LANGUAGE
===================================================== */

const languageModal=
document.getElementById("languageModal");

const languageList=
document.getElementById("languageList");

const languageSearch=
document.getElementById("languageSearch");


function getLanguage(){

const match=
document.cookie.match(
/googtrans=\/nl\/([^;]+)/
);

return match
?match[1]
:"nl";

}


function updateLanguageButton(){

const code=
getLanguage();

const lang=
languages.find(
x=>x.code===code
)
||
languages.find(
x=>x.code==="nl"
);

if(!lang)return;

document.getElementById(
"currentFlag"
).textContent=
lang.flag;

document.getElementById(
"currentCode"
).textContent=
lang.code
.split("-")[0]
.toUpperCase();

}


function renderLanguages(search=""){

const query=
search.toLowerCase().trim();

const active=
getLanguage();

const result=
languages.filter(
language=>

language.name
.toLowerCase()
.includes(query)

||

language.code
.toLowerCase()
.includes(query)
);


languageList.innerHTML="";


result.forEach(language=>{

const item=
document.createElement("button");

item.type="button";

item.className=
"language-item";


if(language.code===active){

item.classList.add("active");

}


item.innerHTML=`

<span class="language-flag">
${language.flag}
</span>

<span>
${language.name}
</span>

`;

item.addEventListener(
"click",
()=>{

/* reset */

document.cookie=
"googtrans=; expires=Thu, 01 Jan 1970 00:00:00 GMT; path=/;";


if(language.code!=="nl"){

document.cookie=
"googtrans=/nl/"+
language.code+
"; path=/; max-age=31536000";

}

languageModal.classList.remove("open");

location.reload();

}
);


languageList.appendChild(item);

});

}


/* language popup */

document
.getElementById("languageButton")
.addEventListener(
"click",
()=>{

languageModal.classList.add("open");

languageSearch.value="";

renderLanguages();

setTimeout(
()=>languageSearch.focus(),
80
);

}
);


document
.getElementById("languageClose")
.addEventListener(
"click",
()=>{

languageModal.classList.remove("open");

}
);


languageModal.addEventListener(
"click",
e=>{

if(e.target===languageModal){

languageModal.classList.remove("open");

}

}
);


languageSearch.addEventListener(
"input",
e=>{

renderLanguages(
e.target.value
);

}
);

/* =========================================
   SHIRT MESSAGE
========================================= */

function shirtMessage(club,price){

const message=
club+
" • "+
price;

const toast=
document.getElementById("toast");

toast.textContent=message;

toast.classList.add("show");

setTimeout(
()=>toast.classList.remove("show"),
2000
);

}
