<style>
:root {
  --gold-hi: #efd28f;
  --gold-mid: #d6aa45;
  --cream: #f5f1e7;
  --green: #2bd58c;
  --dark-bg: #020504;
  --card-bg: #08130f;
}
* { box-sizing: border-box; }
html, body {
  margin: 0; padding: 0;
  background: var(--dark-bg);
  color: var(--cream);
  font-family: 'Inter', system-ui, sans-serif;
}
a { text-decoration: none; color: inherit; }

/* HEADER */
.site-header {
  position: sticky; top: 0; z-index: 1000; width: 100%;
  background: rgba(2, 7, 5, 0.96);
  backdrop-filter: blur(18px);
  border-bottom: 1px solid rgba(239, 210, 143, 0.20);
}
.header-inner {
  width: min(1320px, 100%); min-height: 84px; margin: auto; padding: 10px 22px;
  display: flex; align-items: center; gap: 28px;
}
.logo-link { display: flex; align-items: center; gap: 14px; }
.header-logo { height: 52px; width: auto; object-fit: contain; }

.brand-name { display: flex; flex-direction: column; justify-content: center; }
.brand-title { color: #ffffff; font-weight: 900; font-size: 16px; letter-spacing: 0.5px; text-transform: uppercase; font-family: 'Montserrat', sans-serif; }
.brand-since { color: var(--gold-hi); font-size: 11px; font-weight: 800; letter-spacing: 2px; margin-top: 2px; }

nav { flex: 1; display: flex; align-items: center; gap: 5px; }
nav a { color: #b8c9be; padding: 11px 14px; border-radius: 11px; font-size: 13px; font-weight: 800; transition: .28s; }
nav a:hover { color: #fff; }

/* SEARCHABLE LANGUAGE SELECTOR BUTTON */
.lang-btn {
  background: var(--card-bg); color: var(--gold-hi); 
  border: 1px solid rgba(239, 210, 143, 0.3);
  border-radius: 12px; padding: 10px 16px; font-size: 13px; font-weight: 800;
  cursor: pointer; outline: none; display: flex; align-items: center; gap: 8px;
  transition: all 0.2s ease;
}
.lang-btn:hover { border-color: var(--gold-hi); background: #0e2019; }

/* LANGUAGE PICKER MODAL / DROPDOWN */
.lang-modal-backdrop {
  position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
  background: rgba(0, 0, 0, 0.75); backdrop-filter: blur(8px);
  z-index: 2000; display: none; align-items: center; justify-content: center;
}
.lang-modal-backdrop.open { display: flex; }

.lang-modal {
  background: #0b1a14; border: 1px solid rgba(239, 210, 143, 0.3);
  border-radius: 20px; width: min(520px, 90vw); max-height: 80vh;
  display: flex; flex-direction: column; padding: 24px;
  box-shadow: 0 25px 50px rgba(0,0,0,0.8);
}
.lang-modal-header {
  display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;
}
.lang-modal-title { font-size: 18px; font-weight: 800; color: var(--gold-hi); }
.lang-close-btn { background: none; border: none; color: #8a9e92; font-size: 24px; cursor: pointer; }
.lang-close-btn:hover { color: #fff; }

.lang-search-box {
  width: 100%; background: #040a08; border: 1px solid rgba(239, 210, 143, 0.25);
  border-radius: 12px; padding: 12px 16px; color: #fff; font-size: 14px;
  outline: none; margin-bottom: 16px; font-family: inherit;
}
.lang-search-box:focus { border-color: var(--gold-hi); }

.lang-list {
  overflow-y: auto; display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px;
  max-height: 50vh; padding-right: 6px;
}
.lang-list::-webkit-scrollbar { width: 6px; }
.lang-list::-webkit-scrollbar-thumb { background: rgba(239, 210, 143, 0.3); border-radius: 3px; }

.lang-item {
  display: flex; align-items: center; gap: 10px; padding: 10px 14px;
  border-radius: 10px; background: rgba(255,255,255,0.03); cursor: pointer;
  font-size: 13px; font-weight: 600; transition: background 0.2s;
}
.lang-item:hover { background: rgba(239, 210, 143, 0.15); color: #fff; }
.lang-item.active { background: var(--gold-mid); color: #000; font-weight: 800; }

.page { width: min(1320px, 100%); margin: auto; padding: 34px 22px 80px; }

/* BANNER CONTAINER */
.banner-container {
  position: relative;
  width: 100%;
  border-radius: 20px;
  overflow: hidden;
  border: 1px solid rgba(239, 210, 143, 0.24);
  box-shadow: 0 20px 50px rgba(0,0,0,0.6);
}
.banner-container img {
  width: 100%;
  display: block;
  height: auto;
}

/* TYPOGRAFIE & EFFECTEN */
.banner-heading {
  font-family: 'Montserrat', sans-serif;
  text-transform: uppercase;
}

.gold-gradient-3d {
  font-family: 'Montserrat', sans-serif;
  font-weight: 900;
  background: linear-gradient(180deg, #fffbeb 0%, #ffe380 25%, #d6a133 50%, #8a5e12 78%, #fceabb 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  filter: drop-shadow(0px 3px 0px #3a2202) drop-shadow(0px 6px 12px rgba(0,0,0,0.9));
}

/* KNOPPEN */
.banner-btn-green {
  background: linear-gradient(135deg, #18b875, #118252);
  color: #fff; padding: 0.8vw 1.6vw; border-radius: 8px; 
  font-weight: 800; font-size: 1.1vw; text-decoration: none; display: inline-block;
  box-shadow: 0 0 20px rgba(24, 184, 117, 0.4);
}

.banner-btn-white {
  background: #ffffff; color: #000; padding: 0.8vw 1.6vw; border-radius: 8px; 
  font-weight: 800; font-size: 1.1vw; text-decoration: none; display: inline-block;
}

footer { text-align: center; padding: 42px 20px; background: #020504; border-top: 1px solid rgba(239, 210, 143, .18); }
</style>

          <div class="banner-heading" style="color: #ffffff; font-size: 1.25vw; font-weight: 900; letter-spacing: 1px; display: flex; align-items: center; justify-content: center; gap: 0.6vw;">
            <span style="height: 1px; width: 2.5vw; background: linear-gradient(90deg, transparent, var(--gold-mid));"></span>
            ${t('sub_find')} <span style="color: var(--green);">${t('sub_next')}</span> ${t('sub_shirt')}
            <span style="height: 1px; width: 2.5vw; background: linear-gradient(90deg, var(--gold-mid), transparent);"></span>
          </div>
          <div style="margin-top: 0.3vw; display: flex; align-items: center; justify-content: center; gap: 0.4vw;">
            <span style="height: 2px; width: 2px; background: var(--gold-mid); border-radius: 50%;"></span>
            <span style="height: 1px; width: 3.5vw; background: var(--gold-mid);"></span>
            <span style="height: 2px; width: 2px; background: var(--gold-mid); border-radius: 50%;"></span>
          </div>
        </div>

        <div style="position: absolute; top: 48%; left: 3.2%; width: 33vw; text-align: center; color: #d0d7d3; font-size: 0.8vw; line-height: 1.4; font-weight: 600; text-shadow: 0 2px 10px rgba(0,0,0,0.9);">
          <div>${t('desc_line1')}</div>
          <div>${t('desc_line2')}</div>
        </div>

        <div style="position: absolute; top: 76.5%; left: 11.2%; pointer-events: none;">
          <div class="banner-heading" style="color: #ffffff; font-size: 1.05vw; font-weight: 900; letter-spacing: 0.5px; line-height: 1.1;">
            ${t('search_cta')}
          </div>
          <div style="color: var(--green); font-size: 0.7vw; font-weight: 800; letter-spacing: 0.8px; margin-top: 0.2vw;">
            ${t('search_sub')}
          </div>
        </div>

      </div>
    </div>
  `;
}

function route() {
  const hash = location.hash || "#/";
  if (hash === "#/explore") renderExplore();
  else renderHome();
  
  document.querySelectorAll("[data-i18n]").forEach(el => {
    el.innerHTML = t(el.getAttribute("data-i18n"));
  });

  const activeLangObj = languages.find(l => l.code === currentLang) || languages[0];
  document.getElementById("currentFlag").textContent = activeLangObj.flag;
  document.getElementById("currentLangCode").textContent = activeLangObj.code.toUpperCase();
}

/* SEARCHABLE LANGUAGE SELECTOR LOGIC */
function renderLanguageList(filterText = "") {
  const langList = document.getElementById("langList");
  langList.innerHTML = "";
  
  const filtered = languages.filter(l => 
    l.name.toLowerCase().includes(filterText.toLowerCase()) || 
    l.code.toLowerCase().includes(filterText.toLowerCase())
  );

  filtered.forEach(lang => {
    const item = document.createElement("div");
    item.className = `lang-item ${lang.code === currentLang ? 'active' : ''}`;
    item.innerHTML = `<span>${lang.flag}</span> <span>${lang.name}</span>`;
    item.onclick = () => {
      currentLang = lang.code;
      localStorage.setItem("fsm_lang", currentLang);
      document.getElementById("langModal").classList.remove("open");
      route();
    };
    langList.appendChild(item);
  });
}

document.getElementById("langPickerBtn").onclick = () => {
  document.getElementById("langModal").classList.add("open");
  document.getElementById("langSearchInput").value = "";
  renderLanguageList();
  document.getElementById("langSearchInput").focus();
};

document.getElementById("closeLangModal").onclick = () => {
  document.getElementById("langModal").classList.remove("open");
};

document.getElementById("langSearchInput").oninput = (e) => {
  renderLanguageList(e.target.value);
};

window.addEventListener("hashchange", route);
route();
</script>
</body>
</html>
