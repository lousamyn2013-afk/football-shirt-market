<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Football-Shirt-Market</title>

<style>
:root{
  --ink:#06100c;
  --ink-2:#0a1711;
  --ink-3:#10241a;
  --forest:#0b2418;
  --forest-2:#123321;
  --forest-3:#17422a;
  --green:#18b875;
  --green-bright:#2bd58c;
  --gold:#d6aa45;
  --gold-bright:#f2cf70;
  --white:#fff;
  --paper:#07140e;
  --panel:#0c1e14;
  --panel-2:#10271a;
  --text:#f4f7f3;
  --muted:#9caea3;
  --line:rgba(190,214,199,.13);
  --shadow:0 18px 55px rgba(0,0,0,.28);
  --shadow-lg:0 30px 90px rgba(0,0,0,.42);
  --radius:18px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;width:100%;min-height:100%}
body{
  font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
  color:var(--text);
  background:
    radial-gradient(circle at 12% 0%,rgba(42,111,65,.22),transparent 28rem),
    radial-gradient(circle at 90% 12%,rgba(214,170,69,.09),transparent 25rem),
    linear-gradient(180deg,#06110b 0%,#08180f 48%,#06110b 100%);
  letter-spacing:-.01em;
}
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:-1;
  background-image:linear-gradient(rgba(255,255,255,.012) 1px,transparent 1px),
                   linear-gradient(90deg,rgba(255,255,255,.012) 1px,transparent 1px);
  background-size:46px 46px;
  mask-image:linear-gradient(to bottom,rgba(0,0,0,.35),transparent 70%);
}
button,input,select,textarea{font:inherit}
a{text-decoration:none;color:inherit}
.hidden{display:none!important}

/* HEADER */
.site-header{
  position:sticky;top:0;z-index:1000;width:100%;
  background:rgba(4,13,9,.92);
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  color:#fff;border-bottom:1px solid rgba(214,170,69,.16);
  box-shadow:0 8px 30px rgba(0,0,0,.35);
}
.header-inner{
  width:min(1320px,100%);min-height:78px;margin:auto;padding:10px 22px;
  display:flex;align-items:center;gap:28px;
}
.logo-link{display:flex;align-items:center;gap:11px;flex-shrink:0;color:#fff}
.header-logo{width:56px;height:56px;object-fit:contain;display:block;filter:drop-shadow(0 5px 15px rgba(0,0,0,.5))}
.brand-name strong{display:block;font-size:15px;font-weight:950;letter-spacing:-.03em}
.brand-name span{
  display:block;color:var(--gold-bright);font-size:8px;letter-spacing:2.7px;
  margin-top:6px;font-weight:900;
}
nav{flex:1;display:flex;align-items:center;gap:5px}
nav a{
  position:relative;color:#b8c9be;padding:11px 14px;border-radius:11px;
  font-size:13px;font-weight:800;transition:.2s ease;
}
nav a:hover{background:rgba(214,170,69,.08);color:#fff;transform:translateY(-1px)}
nav a::after{
  content:"";position:absolute;left:14px;right:14px;bottom:5px;height:2px;
  background:var(--gold-bright);transform:scaleX(0);transform-origin:center;transition:.2s;
}
nav a:hover::after{transform:scaleX(1)}
.account-btn{
  border:1px solid rgba(214,170,69,.25);
  background:linear-gradient(135deg,#173522,#0a1a11);
  color:#fff;border-radius:12px;padding:11px 17px;cursor:pointer;
  font-weight:850;flex-shrink:0;box-shadow:inset 0 1px rgba(255,255,255,.05);
  transition:.2s;
}
.account-btn:hover{border-color:rgba(242,207,112,.65);transform:translateY(-1px)}

/* PAGE */
#app{min-height:calc(100vh - 78px)}
.page{width:min(1320px,100%);margin:auto;padding:34px 22px 80px}
.page h1,.page h2,.page h3{letter-spacing:-.035em}
.page h1{font-size:clamp(30px,4vw,46px);margin:0 0 8px;font-weight:950;color:#fff}
.page h2{font-size:28px;margin:0 0 16px;font-weight:900;color:#fff}

/* HOME HERO */
.hero{
  position:relative;width:100%;overflow:hidden;border-radius:24px;
  box-shadow:0 30px 90px rgba(0,0,0,.48);
  background:#06100c;line-height:0;border:1px solid rgba(214,170,69,.18);
}
.hero::after{
  content:"";position:absolute;inset:0;pointer-events:none;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.05),inset 0 -90px 120px rgba(0,0,0,.24);
}
.hero-image{display:block;width:100%;height:auto;max-width:100%;background:#06100c}
.hero-hotspot{
  position:absolute;z-index:5;display:block;cursor:pointer;border-radius:12px;transition:.2s;
}
.hero-hotspot-explore{left:4.6%;top:65.1%;width:16.8%;height:8%}
.hero-hotspot-sell{left:22.6%;top:65.1%;width:19.5%;height:8%}
.hero-hotspot:hover{outline:2px solid rgba(242,207,112,.48);background:rgba(214,170,69,.04)}

/* BUTTONS */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  border:0;border-radius:12px;padding:12px 18px;cursor:pointer;
  font-weight:900;transition:.2s ease;min-height:44px;
}
.btn:hover{transform:translateY(-2px)}
.primary{
  background:linear-gradient(135deg,#1fc27d,#119b63);
  color:#03160d;box-shadow:0 8px 24px rgba(24,184,117,.24);
}
.primary:hover{background:linear-gradient(135deg,#31d890,#18b873)}
.secondary{
  background:linear-gradient(135deg,#e9eee9,#cfd8d2);
  color:#0b1a12;border:1px solid rgba(255,255,255,.35);
}
.secondary:hover{background:#f4f7f4}

/* CARDS */
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:22px}
.card{
  position:relative;background:linear-gradient(180deg,rgba(17,42,27,.98),rgba(9,28,18,.98));
  border:1px solid rgba(214,170,69,.13);border-radius:18px;overflow:hidden;
  box-shadow:0 10px 34px rgba(0,0,0,.25);transition:.25s ease;
}
.card:hover{
  transform:translateY(-6px);
  box-shadow:0 22px 55px rgba(0,0,0,.38);
  border-color:rgba(214,170,69,.34);
}
.shirt{
  height:245px;display:flex;align-items:center;justify-content:center;position:relative;
  background:
    radial-gradient(circle at 50% 30%,rgba(44,130,76,.20),transparent 31%),
    radial-gradient(circle at 78% 82%,rgba(214,170,69,.13),transparent 32%),
    linear-gradient(145deg,#183a26,#07140d);
  font-size:78px;overflow:hidden;
}
.shirt::before{
  content:"";position:absolute;inset:0;
  background:linear-gradient(135deg,rgba(255,255,255,.045),transparent 35%);
}
.shirt::after{
  content:"";position:absolute;width:190px;height:190px;border-radius:50%;
  border:1px solid rgba(214,170,69,.08);transform:translate(55px,55px);
}
.boost{
  position:absolute;top:13px;right:13px;z-index:2;
  background:linear-gradient(135deg,#f5d77f,#c99b34);color:#261c06;
  padding:6px 9px;border-radius:999px;font-size:9px;font-weight:950;letter-spacing:1px;
  box-shadow:0 5px 18px rgba(214,170,69,.2);
}
.body{padding:18px 18px 19px}
.body h3{margin:7px 0 8px;font-size:17px;font-weight:900;color:#fff}
.muted{color:var(--muted);font-size:12px}
.price{font-size:22px;letter-spacing:-.04em;color:var(--gold-bright)}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.heart{
  width:40px;height:40px;border:1px solid rgba(214,170,69,.18);border-radius:12px;
  background:#10271a;color:#f0d278;cursor:pointer;font-size:20px;transition:.2s;
}
.heart:hover{background:#183a26;transform:scale(1.05);border-color:rgba(214,170,69,.4)}

/* TOOLBAR */
.toolbar{
  display:grid;grid-template-columns:2fr 1.15fr .8fr;gap:12px;margin:22px 0 28px;
}
input,select,textarea{
  width:100%;padding:13px 14px;border:1px solid rgba(180,207,191,.16);border-radius:12px;
  background:rgba(12,31,20,.96);color:#f4f7f3;outline:none;transition:.2s;
  box-shadow:inset 0 1px rgba(255,255,255,.025);
}
input::placeholder,textarea::placeholder{color:#71847a}
select{color:#eaf0ec}
input:focus,select:focus,textarea:focus{
  border-color:var(--gold);box-shadow:0 0 0 4px rgba(214,170,69,.09),0 5px 18px rgba(0,0,0,.15);
}
textarea{min-height:125px;resize:vertical}

/* BOX / FORMS */
.box{
  background:linear-gradient(145deg,rgba(15,39,24,.98),rgba(8,25,16,.98));
  border:1px solid rgba(214,170,69,.14);border-radius:18px;padding:25px;
  box-shadow:var(--shadow);
}
.box h2,.box h3{color:#fff}
.form{display:grid;gap:16px}
.form label{display:grid;gap:8px;font-size:13px;font-weight:850;color:#dbe5df}
.form button{border:0;padding:14px;border-radius:12px;cursor:pointer;font-weight:900}

/* FILTERS */
.type-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}
.type-option{position:relative}
.type-option input{position:absolute;opacity:0;pointer-events:none}
.type-option span{
  display:block;padding:12px 13px;border:1px solid rgba(180,207,191,.14);border-radius:11px;
  background:#0b2115;color:#bdccc3;cursor:pointer;font-size:13px;transition:.18s;
}
.type-option span:hover{border-color:rgba(214,170,69,.35);color:#fff;transform:translateY(-1px)}
.type-option input:checked+span{
  border-color:var(--gold);background:linear-gradient(135deg,#3a2e14,#172a1a);
  color:#f5d981;font-weight:900;box-shadow:0 4px 18px rgba(214,170,69,.10);
}
.condition-filter{
  background:rgba(11,31,20,.96);border:1px solid rgba(214,170,69,.13);
  border-radius:14px;padding:13px;
}
.condition-filter h3{color:#fff}

/* EXPLORE */
.explore-page{padding-top:28px}
.explore-hero{
  min-height:0!important;height:auto!important;padding:0!important;
  background:#06100c!important;display:flex!important;align-items:center!important;
  justify-content:center!important;border-radius:24px;overflow:hidden;
  box-shadow:0 30px 90px rgba(0,0,0,.48);border:1px solid rgba(214,170,69,.18);
}
.explore-hero::after{display:none!important}
.explore-hero-image{
  position:relative!important;inset:auto!important;width:100%!important;height:auto!important;
  max-height:none!important;object-fit:contain!important;object-position:center!important;
  opacity:1!important;display:block!important;
}
.explore-hero-overlay{display:none!important}
.explore-heading{
  display:flex;justify-content:space-between;align-items:end;gap:20px;margin:30px 0 18px;
}
.explore-heading small{color:var(--gold-bright);font-size:10px;font-weight:950;letter-spacing:2.5px}
.explore-heading h1{margin:6px 0 0}
.explore-heading>span{color:#789184;font-size:12px;font-weight:750}

/* MODAL */
.modal-bg{
  position:fixed;inset:0;z-index:2000;background:rgba(1,7,4,.78);
  backdrop-filter:blur(9px);-webkit-backdrop-filter:blur(9px);
  display:flex;align-items:center;justify-content:center;padding:20px;
}
.modal-box{
  width:min(510px,100%);max-height:90vh;overflow:auto;
  background:linear-gradient(145deg,#10271a,#07170e);
  color:#f4f7f3;border:1px solid rgba(214,170,69,.22);
  border-radius:22px;padding:30px;box-shadow:0 30px 100px rgba(0,0,0,.5);
}
.modal-box h2,.modal-box h3{color:#fff}
.modal-box hr{border:0;border-top:1px solid rgba(180,207,191,.14);margin:25px 0}
.close-btn{
  width:100%;margin-top:10px;padding:12px;border:1px solid rgba(180,207,191,.15);
  background:#0b2115;color:#dce7df;border-radius:12px;cursor:pointer;font-weight:800;
}

/* FOOTER */
footer{
  position:relative;background:#040d08;color:#81968a;text-align:center;padding:42px 20px;
  border-top:1px solid rgba(214,170,69,.14);
}
footer strong{color:#fff;font-size:15px}
footer .gold{color:var(--gold-bright);font-weight:800}

/* RESPONSIVE */
@media(max-width:1050px){.grid{grid-template-columns:repeat(3,1fr)}}
@media(max-width:950px){
  .grid{grid-template-columns:repeat(2,1fr)}
  .toolbar{grid-template-columns:1fr 1fr}
}
@media(max-width:700px){
  .header-inner{min-height:auto;flex-wrap:wrap;gap:8px;padding:8px 12px}
  .header-logo{width:47px;height:47px}
  .brand-name strong{font-size:13px}
  nav{order:3;width:100%;overflow-x:auto;padding-bottom:3px;scrollbar-width:none}
  nav::-webkit-scrollbar{display:none}
  nav a{white-space:nowrap;font-size:12px;padding:8px 10px}
  .account-btn{margin-left:auto}
  #app{min-height:calc(100vh - 105px)}
  .page{padding:17px 11px 55px}
  .hero,.explore-hero{border-radius:15px}
  .grid{grid-template-columns:1fr}
  .toolbar{grid-template-columns:1fr}
  .type-grid{grid-template-columns:1fr}
  .explore-heading{align-items:flex-start;flex-direction:column;margin-top:23px}
  .shirt{height:230px}
}

/* =========================================================
   PREMIUM MOTION / MICRO-INTERACTIONS
   ========================================================= */
html{scroll-behavior:smooth}
body{overflow-x:hidden}

/* Soft page reveal */
#app{animation:pageIn .55s cubic-bezier(.22,1,.36,1) both}
@keyframes pageIn{
  from{opacity:0;transform:translateY(8px)}
  to{opacity:1;transform:translateY(0)}
}

/* Header glass effect + subtle entrance */
.site-header{
  transition:background .35s ease,box-shadow .35s ease,border-color .35s ease;
}
.site-header:hover{
  background:rgba(5,18,13,.97);
}

/* Hero cinematic treatment */
.hero,.explore-hero{
  transform:translateZ(0);
  isolation:isolate;
}
.hero::before,.explore-hero::before{
  content:"";
  position:absolute;
  z-index:3;
  inset:-30%;
  pointer-events:none;
  background:linear-gradient(
    115deg,
    transparent 42%,
    rgba(255,255,255,.075) 49%,
    rgba(185,255,56,.035) 51%,
    transparent 58%
  );
  transform:translateX(-65%) rotate(8deg);
  animation:heroShine 8s ease-in-out infinite;
}
@keyframes heroShine{
  0%,62%{transform:translateX(-65%) rotate(8deg);opacity:0}
  70%{opacity:1}
  88%,100%{transform:translateX(65%) rotate(8deg);opacity:0}
}

/* Image gently breathes, but remains premium rather than flashy */
.hero-image,.explore-hero-image{
  transform:scale(1.001);
  transition:transform 1.2s cubic-bezier(.22,1,.36,1),filter .7s ease;
}
.hero:hover .hero-image,.explore-hero:hover .explore-hero-image{
  transform:scale(1.018);
  filter:saturate(1.04) contrast(1.02);
}

/* Navigation */
nav a{transition:color .2s ease,background .2s ease,transform .2s ease}
nav a::after{transition:transform .25s cubic-bezier(.22,1,.36,1)}

/* Buttons */
.btn,.account-btn,.heart{
  position:relative;
  overflow:hidden;
  will-change:transform;
}
.btn::before,.account-btn::before{
  content:"";
  position:absolute;
  top:0;bottom:0;left:-120%;
  width:70%;
  transform:skewX(-18deg);
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.24),transparent);
  transition:left .65s ease;
}
.btn:hover::before,.account-btn:hover::before{left:150%}
.btn:active,.account-btn:active{transform:translateY(1px) scale(.985)}

/* Cards */
.card{
  transform:translateY(0);
  transition:
    transform .35s cubic-bezier(.22,1,.36,1),
    box-shadow .35s ease,
    border-color .35s ease;
}
.card::before{
  content:"";
  position:absolute;
  z-index:4;
  inset:0;
  pointer-events:none;
  border-radius:inherit;
  opacity:0;
  background:linear-gradient(135deg,rgba(185,255,56,.10),transparent 32%,transparent 68%,rgba(214,170,69,.10));
  transition:opacity .35s ease;
}
.card:hover{
  transform:translateY(-9px) scale(1.012);
  box-shadow:0 28px 60px rgba(0,0,0,.22),0 0 0 1px rgba(185,255,56,.08);
}
.card:hover::before{opacity:1}
.shirt{
  transition:transform .55s cubic-bezier(.22,1,.36,1),filter .45s ease;
}
.card:hover .shirt{
  transform:scale(1.025);
  filter:saturate(1.08);
}
.boost{
  animation:badgePulse 3.2s ease-in-out infinite;
}
@keyframes badgePulse{
  0%,100%{box-shadow:0 5px 15px rgba(185,255,56,.18)}
  50%{box-shadow:0 7px 24px rgba(185,255,56,.36)}
}
.heart{
  transition:transform .2s ease,background .2s ease,border-color .2s ease;
}
.heart:hover{
  transform:translateY(-2px) scale(1.06);
  border-color:rgba(214,170,69,.55);
}

/* Inputs */
input,select,textarea{
  transition:border-color .2s ease,box-shadow .25s ease,transform .2s ease,background .2s ease;
}
input:hover,select:hover,textarea:hover{
  border-color:#bdc9c4;
}
input:focus,select:focus,textarea:focus{
  transform:translateY(-1px);
}

/* Filter chips */
.type-option span{
  transition:transform .2s ease,box-shadow .25s ease,border-color .2s ease,background .25s ease;
}
.type-option span:hover{
  transform:translateY(-2px);
}
.type-option input:checked+span{
  animation:filterSelect .25s cubic-bezier(.22,1,.36,1);
}
@keyframes filterSelect{
  from{transform:scale(.97)}
  to{transform:scale(1)}
}

/* Boxes / modal */
.box{
  transition:transform .3s ease,box-shadow .3s ease,border-color .3s ease;
}
.box:hover{
  box-shadow:0 24px 55px rgba(0,0,0,.13);
}
.modal-bg{
  animation:modalBgIn .25s ease both;
}
.modal-box{
  animation:modalIn .4s cubic-bezier(.22,1,.36,1) both;
}
@keyframes modalBgIn{from{opacity:0}to{opacity:1}}
@keyframes modalIn{
  from{opacity:0;transform:translateY(18px) scale(.97)}
  to{opacity:1;transform:translateY(0) scale(1)}
}

/* Section reveal helper */
.reveal{
  opacity:0;
  transform:translateY(20px);
  transition:opacity .65s ease,transform .65s cubic-bezier(.22,1,.36,1);
}
.reveal.is-visible{opacity:1;transform:none}

/* Respect reduced motion */
@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{
    animation-duration:.01ms!important;
    animation-iteration-count:1!important;
    transition-duration:.01ms!important;
    scroll-behavior:auto!important;
  }
}


/* =========================================================
   CHIC EDITION — MIDNIGHT / CHAMPAGNE / IVORY
   ========================================================= */
:root{
  --ink:#0b0d12;
  --ink-2:#12151c;
  --ink-3:#1b1f28;
  --gold:#c9a86a;
  --gold-bright:#f0d39a;
  --lime:#c9a86a;
  --green:#1d8b68;
  --white:#fffdf9;
  --paper:#f5f2ec;
  --text:#17181d;
  --muted:#74747a;
  --line:#ded9d0;
  --shadow:0 18px 50px rgba(12,12,16,.10);
  --shadow-lg:0 30px 90px rgba(8,9,12,.22);
  --radius:18px;
}

/* Elegant global background */
body{
  background:
    radial-gradient(circle at 8% 0%,rgba(201,168,106,.10),transparent 28rem),
    radial-gradient(circle at 92% 12%,rgba(104,73,47,.08),transparent 25rem),
    linear-gradient(180deg,#f8f6f1 0%,#f1eee7 100%);
  color:var(--text);
}

/* Luxury navigation */
.site-header{
  background:rgba(10,12,17,.94);
  border-bottom:1px solid rgba(201,168,106,.22);
  box-shadow:0 12px 40px rgba(0,0,0,.22);
}
.header-inner{min-height:82px}
.brand-name strong{letter-spacing:.01em}
.brand-name span{
  color:var(--gold-bright);
  letter-spacing:3px;
}
nav a{color:#bdbcc0}
nav a:hover{
  background:linear-gradient(135deg,rgba(255,255,255,.07),rgba(201,168,106,.07));
  color:#fff;
}
nav a::after{
  background:linear-gradient(90deg,var(--gold),var(--gold-bright));
}

/* Hero — more editorial/chic */
.hero,.explore-hero{
  border:1px solid rgba(201,168,106,.24);
  box-shadow:0 30px 90px rgba(8,9,12,.24),0 0 0 1px rgba(255,255,255,.03);
}
.hero::after{
  box-shadow:
    inset 0 0 0 1px rgba(255,255,255,.055),
    inset 0 -100px 120px rgba(0,0,0,.26);
}
.hero::before,.explore-hero::before{
  background:linear-gradient(
    115deg,
    transparent 40%,
    rgba(255,255,255,.13) 49%,
    rgba(201,168,106,.10) 51%,
    transparent 60%
  );
  animation:heroShine 9s cubic-bezier(.4,0,.2,1) infinite;
}

/* Premium buttons */
.btn{
  border-radius:11px;
  letter-spacing:.005em;
}
.primary{
  color:#17130c;
  background:linear-gradient(135deg,#ead09c 0%,#c9a86a 48%,#a9864e 100%);
  box-shadow:0 10px 26px rgba(147,112,57,.24),inset 0 1px rgba(255,255,255,.5);
}
.primary:hover{
  background:linear-gradient(135deg,#f3dcae,#d4b778,#b8945b);
  box-shadow:0 15px 34px rgba(147,112,57,.30),inset 0 1px rgba(255,255,255,.65);
}
.secondary{
  background:rgba(255,255,255,.88);
  color:#17181d;
  border:1px solid #d7d0c5;
  box-shadow:0 7px 20px rgba(25,24,22,.06);
}
.secondary:hover{
  background:#fffdf9;
  border-color:rgba(201,168,106,.65);
}

/* Cards become boutique/e-commerce style */
.card{
  background:rgba(255,253,249,.97);
  border-color:#e0d9cf;
  box-shadow:0 9px 30px rgba(22,19,15,.065);
}
.card:hover{

async function api(url,opt={}){

  const options = {
    ...opt,
    credentials:"same-origin",
    headers:{
      ...(opt.headers || {})
    }
  };


  if(
    opt.body &&
    typeof opt.body !== "string"
  ){

    options.headers["Content-Type"] =
      "application/json";

    options.body =
      JSON.stringify(opt.body);
  }


  const response =
    await fetch(
      url,
      options
    );


  const data =
    await response
      .json()
      .catch(
        ()=>({})
      );


  if(!response.ok){

    throw new Error(
      data.error ||
      data.message ||
      "Er ging iets mis."
    );
  }


  return data;
}

async function handleLogin(event){

async function handleRegister(event){

function requireLogin(destination){

function escapeHtml(value){

  return String(
    value ?? ""
  )

  .replace(
    /&/g,
    "&amp;"
  )

  .replace(
    /</g,
    "&lt;"
  )

  .replace(
    />/g,
    "&gt;"
  )

  .replace(
    /"/g,
    "&quot;"
  )

  .replace(
    /'/g,
    "&#039;"
  );
}


function card(x){

  let types = [];


  if(Array.isArray(x.type)){

    types =
      x.type;

  }else if(
    typeof x.type === "string"
  ){

    types =
      x.type
        .split(",")
        .map(
          v => v.trim()
        )
        .filter(Boolean);
  }


  return `

    <article class="card">

      <div class="shirt">

            ? "🌍"
            : "👕"
        }

              </span>
            `
            : ""
        }

      </div>


      <div class="body">

          ${escapeHtml(
            x.club || ""
          )}

          ${
            x.season
              ? " · " +
                escapeHtml(

                )

          ${escapeHtml(
            x.title || ""
          )}

        </h3>


        <div class="muted">

          Maat
          ${escapeHtml(
            x.size || "-"
          )}

          ·

          ${escapeHtml(
            x.condition || "-"
          )}

        </div>


        ${
          types.length
            ? `
              <div
                class="muted"
                style="margin-top:7px"
              >
                ${escapeHtml(
                  types.join(" · ")
                )}
              </div>
            `
            : ""
        }


        <div
          class="row"
          style="margin-top:12px"
        >

          <b class="price">

            €${Number(
              x.price || 0
            ).toFixed(2)}

          </b>


          <button
            class="heart"
            type="button"
            data-action="fav"
            data-id="${x.id}"
          >
            ♡
          </button>

        </div>


        <div
          class="muted"
          style="margin-top:8px"
        >

          ${escapeHtml(
            x.seller || ""
          )}

        </div>


        <div
          class="row"
          style="margin-top:12px"
        >

          <button
            class="btn primary"
            type="button"
            data-action="buy"
            data-id="${x.id}"
          >
            Nu kopen
          </button>


          <button
            class="btn secondary"
            type="button"
            data-action="offer"
            data-id="${x.id}"
          >
            Bod
          </button>

        </div>

      </div>

    </article>

  `;
}


document.addEventListener(
  "click",
  event=>{

    const button =
      event.target.closest(
        "[data-action]"
      );


    if(!button){

      return;
    }


    const id =
      button.dataset.id;


    const action =
      button.dataset.action;


    if(action === "fav"){

      fav(id);
    }


    if(action === "buy"){

      buy(id);
    }


    if(action === "offer"){

      offer(id);
    }

  }

}


async function buy(id){

  if(
    !requireLogin(
      location.hash
    )
  ){

    return;
  }


  try{

    const order =
      await api(
        "/api/orders",
        {
          method:"POST",

          body:{
            listingId:
              Number(id)

      );


    alert(
      "Order aangemaakt.\n\n" +
      "Bedrag: €" +
      Number(
        order.amount || 0
      ).toFixed(2)
    );

  }catch(error){

    alert(
      error.message
    );
  }
}


async function offer(id){

  if(
    !requireLogin(
      location.hash
    )
  ){

    return;
  }


  const amount =
    prompt(
      "Jouw bod in euro:"
    );


  if(!amount){

    return;
  }


  const number =
    Number(amount);


  if(
    !Number.isFinite(number) ||
    number <= 0
  ){

    alert(
      "Vul een geldig bedrag in."
    );

    return;
  }


  try{

    await api(
      "/api/offers",
      {
        method:"POST",

        body:{
          listingId:
            Number(id),

          amount:
            number
        }
      }
    );


    alert(
      "Bod verzonden."
    );

  }catch(error){

    alert(
      error.message
    );
  }
}

async function loadListings(){

  const search =
    document.getElementById(
      "search"
    )?.value || "";


  const selectedConditions =
    [
      ...document.querySelectorAll(
        ".explore-condition:checked"
      )
    ]
    .map(
      x => x.value
    );


  const conditionParam =
    selectedConditions.join(",");


  const sort =
    document.getElementById(
      "sort"
    )?.value ||
    "recommended";


  const selectedTypes =
    [
      ...document.querySelectorAll(
        ".explore-type:checked"
      )
    ]
    .map(
      x => x.value
    );


  try{

    const listings =
      await api(
        "/api/listings" +
        "?q=" +
        encodeURIComponent(search) +
        "&condition=" +
        encodeURIComponent(conditionParam) +
        "&type=" +
        encodeURIComponent(
          selectedTypes.join(",")
        ) +
        "&sort=" +
        encodeURIComponent(sort)
      );


    const target =
      document.getElementById(
        "results"
      );


    if(!target){

      return;
    }


    target.innerHTML =
      listings
        .map(card)
        .join("") ||

      `

        <div class="box">

          <h3>
            Geen shirts gevonden
          </h3>

          <p class="muted">
            Probeer andere filters.
          </p>

        </div>

      `;

  }catch(error){

    const target =
      document.getElementById(
        "results"
      );


    if(target){

      target.innerHTML = `

        <div class="box">

          <h3>
            Shirts laden lukt niet
          </h3>

          <p class="muted">

            ${escapeHtml(
              error.message
            )}

          </p>

        </div>

      `;
    }
  }
}

async function submitListing(event){

  event.preventDefault();


  const form =
    new FormData(
      event.target
    );


  const types =
    [
      ...document.querySelectorAll(
        'input[name="types"]:checked'
      )
    ]
    .map(
      x => x.value
    );


  if(types.length === 0){

    alert(
      "Kies minimaal één type."
    );

    return;
  }


  const price =
    Number(
      form.get("price")
    );


  if(
    !Number.isFinite(price) ||
    price <= 0
  ){

    alert(
      "Vul een geldige prijs in."
    );

    return;
  }


  const listing = {

    title:
      form.get("title"),

    club:
      form.get("club"),

    player:
      form.get("player"),

    season:
      form.get("season"),

    size:
      form.get("size"),

    condition:
      form.get("condition"),

    type:
      types.join(", "),

    price:
      price,

    description:
      form.get("description")
  };


  try{

    await api(
      "/api/listings",
      {
        method:"POST",
        body:listing
      }
    );


    alert(
      "Listing gepubliceerd!"
    );


    location.hash =
      "#/profile";

  }catch(error){

    alert(
      error.message
    );
  }
}

function route(){

/* =========================================================
   PREMIUM REVEAL OBSERVER
   ========================================================= */
(function(){
  const reveal = () => {
    const selectors = [
      ".page > section",
      ".page > .box",
      ".page > h1",
      ".page > h2",
      ".page > .toolbar",
      ".explore-heading",
      ".grid .card"
    ];

    const nodes = document.querySelectorAll(selectors.join(","));
    nodes.forEach((el,i)=>{
      if(el.dataset.motionReady) return;
      el.dataset.motionReady="1";
      el.classList.add("reveal");
      el.style.transitionDelay = Math.min(i * 45, 320) + "ms";
    });

    if(!("IntersectionObserver" in window)){
      nodes.forEach(el=>el.classList.add("is-visible"));
      return;
    }

    const observer = new IntersectionObserver((entries,obs)=>{
      entries.forEach(entry=>{
        if(entry.isIntersecting){
          entry.target.classList.add("is-visible");
          obs.unobserve(entry.target);
        }
      });
    },{threshold:.08,rootMargin:"0px 0px -30px 0px"});

    nodes.forEach(el=>observer.observe(el));
  };

  new MutationObserver(reveal).observe(document.getElementById("app"),{
    childList:true,subtree:true
  });

  window.addEventListener("load",reveal);
  reveal();
})();


(function(){
  function updateActiveNav(){
    const path=(location.hash||"#/").replace("#/","");
    document.querySelectorAll("nav a").forEach(a=>{
      const href=a.getAttribute("href")||"";
      const target=href.replace("#/","");
      const active=(path==="" && target==="") || (path!=="" && target===path);
      a.style.color=active ? "#ffffff" : "";
      a.style.background=active ? "rgba(185,255,56,.09)" : "";
      a.style.boxShadow=active ? "inset 0 0 0 1px rgba(185,255,56,.12)" : "";
      const after=active ? "1" : "";
      a.style.setProperty("--active-nav",after);
    });
  }
  window.addEventListener("hashchange",updateActiveNav);
  window.addEventListener("load",updateActiveNav);
  updateActiveNav();
})();


(function(){
  function addLuxuryGlow(el){
    if(!el || el.dataset.luxuryGlow) return;
    el.dataset.luxuryGlow="1";
    el.addEventListener("pointermove",function(e){
      const r=el.getBoundingClientRect();
      const x=((e.clientX-r.left)/r.width)*100;
      const y=((e.clientY-r.top)/r.height)*100;
      el.style.setProperty("--mx",x+"%");
      el.style.setProperty("--my",y+"%");
    });
    el.style.setProperty("background-image",
      "radial-gradient(circle at var(--mx,50%) var(--my,50%), rgba(201,168,106,.055), transparent 28%), linear-gradient(145deg, transparent, transparent)"
    );
  }
  function init(){
    document.querySelectorAll(".hero,.explore-hero").forEach(addLuxuryGlow);
  }
  new MutationObserver(init).observe(document.getElementById("app"),{childList:true,subtree:true});
  window.addEventListener("load",init);
  init();
})();


(function(){
  function fallbackLogo(img){
    if(!img || img.dataset.fallbackApplied) return;
    img.dataset.fallbackApplied="1";
    img.addEventListener("error",function(){
      img.style.display="none";
      const wrap=img.parentElement;
      if(wrap && !wrap.querySelector(".logo-fallback")){
        const mark=document.createElement("div");
        mark.className="logo-fallback";
        mark.innerHTML='<span>⚽</span><b>FSM</b>';
        mark.style.cssText='width:56px;height:56px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle,#183f2d,#06100b 68%);border:1px solid rgba(239,210,143,.55);box-shadow:0 0 24px rgba(239,210,143,.10);color:#efd28f;font-size:11px;font-weight:950;line-height:1;';
        mark.firstElementChild.style.cssText='display:block;font-size:20px;line-height:18px;text-align:center;';
        wrap.prepend(mark);
      }
    },{once:true});
  }
  function fallbackHero(img){
    if(!img || img.dataset.fallbackApplied) return;
    img.dataset.fallbackApplied="1";
    img.addEventListener("error",function(){
      img.style.display="none";
      const parent=img.parentElement;
      if(parent){
        parent.classList.add("hero-image-error");
        if(!parent.querySelector(".hero-fallback-copy")){
          const c=document.createElement("div");
          c.className="hero-fallback-copy";
          c.innerHTML='<div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:40px;"><div><div style="font-size:11px;letter-spacing:4px;color:#efd28f;font-weight:900;margin-bottom:12px;">FOOTBALL-SHIRT-MARKET</div><div style="font-size:clamp(34px,5vw,70px);font-weight:950;color:#f5f1e7;letter-spacing:-.05em;">Koop. Verkoop.<br>Verzamel.</div><div style="margin-top:14px;color:#aebbb4;font-size:15px;">De marketplace voor echte voetbalshirts.</div></div></div>';
          parent.appendChild(c);
        }
      }
    },{once:true});
  }
  window.addEventListener("load",function(){
    document.querySelectorAll('img[src="logo.png"]').forEach(fallbackLogo);
    document.querySelectorAll('img[src="hero.png"]').forEach(fallbackHero);
  });
})();
