<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#050806">

<title>Football-Shirt-Market</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
:root{
  --gold:#e5bd67;
  --gold-light:#f4d99b;
  --gold-dark:#b98a2d;
  --green:#19c783;
  --green-dark:#087c50;
  --bg:#020504;
  --bg2:#06100c;
  --card:#091711;
  --card2:#0d1d16;
  --text:#f5f2e9;
  --muted:#9caca4;
  --border:rgba(229,189,103,.20);
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html{
  scroll-behavior:smooth;
}

body{
  background:
    radial-gradient(circle at 20% -10%,rgba(20,100,70,.18),transparent 35%),
    radial-gradient(circle at 90% 10%,rgba(229,189,103,.08),transparent 30%),
    var(--bg);
  color:var(--text);
  font-family:'Inter',sans-serif;
  min-height:100vh;
}

body.top{
  top:0!important;
}

a{
  color:inherit;
  text-decoration:none;
}

button,
input{
  font-family:inherit;
}

/* =========================================
   GOOGLE TRANSLATE VERBERGEN
========================================= */

.goog-te-banner-frame,
.goog-te-banner-frame.skiptranslate,
.skiptranslate iframe,
#goog-gt-tt,
.goog-tooltip,
.goog-text-highlight{
  display:none!important;
}

body{
  top:0!important;
}

.goog-te-menu-value{
  display:none!important;
}

/* =========================================
   HEADER
========================================= */

.site-header{
  position:sticky;
  top:0;
  z-index:1000;
  background:rgba(2,6,4,.88);
  backdrop-filter:blur(22px);
  -webkit-backdrop-filter:blur(22px);
  border-bottom:1px solid var(--border);
}

.site-header::after{
  content:"";
  position:absolute;
  left:0;
  right:0;
  bottom:-1px;
  height:1px;
  background:linear-gradient(
    90deg,
    transparent,
    rgba(229,189,103,.5),
    transparent
  );
}

.header-inner{
  width:min(1380px,100%);
  min-height:82px;
  margin:auto;
  padding:10px 24px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:25px;
}

/* LOGO */

.logo-link{
  display:flex;
  align-items:center;
  gap:13px;
  flex-shrink:0;
}

.header-logo{
  width:auto;
  height:54px;
  object-fit:contain;
  transition:.35s ease;
}

.logo-link:hover .header-logo{
  transform:scale(1.04);
}

.brand-name{
  display:flex;
  flex-direction:column;
}

.brand-title{
  font-family:'Montserrat',sans-serif;
  font-weight:900;
  font-size:15px;
  letter-spacing:.7px;
  color:#fff;
}

.brand-since{
  color:var(--gold-light);
  font-size:9px;
  font-weight:800;
  letter-spacing:2.5px;
  margin-top:4px;
}

/* NAV */

nav{
  display:flex;
  align-items:center;
  gap:5px;
}

nav a{
  color:#aab9b1;
  font-size:14px;
  font-weight:800;
  padding:11px 17px;
  border-radius:12px;
  transition:.25s ease;
}

nav a:hover{
  color:#fff;
  background:rgba(255,255,255,.06);
}

nav a.active{
  color:#fff;
  background:
    linear-gradient(
      135deg,
      rgba(229,189,103,.16),
      rgba(25,199,131,.08)
    );
  border:1px solid rgba(229,189,103,.18);
}

/* LANGUAGE BUTTON */

.lang-btn{
  display:flex;
  align-items:center;
  gap:8px;
  flex-shrink:0;

  border:1px solid rgba(229,189,103,.32);
  background:linear-gradient(
    135deg,
    rgba(255,255,255,.045),
    rgba(229,189,103,.06)
  );

  color:var(--gold-light);
  padding:10px 14px;
  border-radius:13px;
  cursor:pointer;
  font-size:12px;
  font-weight:800;

  transition:.25s ease;
}

.lang-btn:hover{
  transform:translateY(-2px);
  border-color:var(--gold);
  box-shadow:0 8px 25px rgba(229,189,103,.10);
}

.lang-arrow{
  font-size:9px;
  opacity:.7;
}

/* =========================================
   LANGUAGE MODAL
========================================= */

.lang-modal-backdrop{
  position:fixed;
  inset:0;
  z-index:5000;

  display:none;
  align-items:center;
  justify-content:center;

  padding:20px;

  background:rgba(0,0,0,.78);
  backdrop-filter:blur(15px);
  -webkit-backdrop-filter:blur(15px);
}

.lang-modal-backdrop.open{
  display:flex;
  animation:fadeIn .2s ease;
}

@keyframes fadeIn{
  from{opacity:0}
  to{opacity:1}
}

.lang-modal{
  width:min(650px,100%);
  max-height:86vh;

  display:flex;
  flex-direction:column;

  padding:25px;

  background:
    radial-gradient(
      circle at top right,
      rgba(229,189,103,.08),
      transparent 35%
    ),
    #08130e;

  border:1px solid rgba(229,189,103,.25);
  border-radius:24px;

  box-shadow:
    0 30px 100px rgba(0,0,0,.8),
    inset 0 1px 0 rgba(255,255,255,.04);

  animation:modalUp .25s ease;
}

@keyframes modalUp{
  from{
    transform:translateY(15px) scale(.98);
    opacity:0;
  }
  to{
    transform:none;
    opacity:1;
  }
}

.lang-modal-header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:18px;
}

.lang-modal-title{
  font-family:'Montserrat',sans-serif;
  font-size:20px;
  font-weight:900;
  color:#fff;
}

.lang-modal-subtitle{
  color:var(--muted);
  font-size:12px;
  margin-top:5px;
}

.lang-close-btn{
  width:38px;
  height:38px;

  border:1px solid rgba(255,255,255,.08);
  border-radius:10px;

  background:rgba(255,255,255,.04);
  color:#aab9b1;

  font-size:23px;
  cursor:pointer;
  transition:.2s;
}

.lang-close-btn:hover{
  color:#fff;
  background:rgba(255,255,255,.09);
}

/* SEARCH */

.lang-search-wrap{
  position:relative;
  margin-bottom:15px;
}

.lang-search-icon{
  position:absolute;
  left:15px;
  top:50%;
  transform:translateY(-50%);
  opacity:.55;
}

.lang-search-box{
  width:100%;

  background:#030906;
  color:#fff;

  border:1px solid rgba(229,189,103,.18);
  border-radius:13px;

  padding:13px 15px 13px 43px;

  outline:none;
  font-size:14px;

  transition:.2s;
}

.lang-search-box:focus{
  border-color:rgba(229,189,103,.65);
  box-shadow:0 0 0 3px rgba(229,189,103,.06);
}

.lang-list{
  overflow-y:auto;

  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));

  gap:7px;

  padding-right:5px;
  max-height:55vh;
}

.lang-list::-webkit-scrollbar{
  width:6px;
}

.lang-list::-webkit-scrollbar-thumb{
  background:rgba(229,189,103,.28);
  border-radius:10px;
}

.lang-item{
  display:flex;
  align-items:center;
  gap:10px;

  min-width:0;

  padding:11px 12px;

  border:1px solid transparent;
  border-radius:11px;

  background:rgba(255,255,255,.025);

  color:#d5ded9;

  cursor:pointer;

  font-size:13px;
  font-weight:600;

  transition:.2s ease;
}

.lang-item:hover{
  background:rgba(229,189,103,.10);
  border-color:rgba(229,189,103,.18);
  color:#fff;
  transform:translateX(2px);
}

.lang-item.active{
  background:linear-gradient(
    135deg,
    var(--gold),
    #c99b3e
  );
  color:#050806;
  font-weight:800;
}

.lang-flag{
  font-size:19px;
  width:24px;
  text-align:center;
  flex-shrink:0;
}

.lang-name{
  overflow:hidden;
  white-space:nowrap;
  text-overflow:ellipsis;
}

/* =========================================
   MAIN
========================================= */

.page{
  width:min(1380px,100%);
  margin:auto;
  padding:35px 24px 90px;
}

/* =========================================
   HERO
========================================= */

.banner-container{
  position:relative;
  overflow:hidden;

  width:100%;

  border-radius:25px;
  border:1px solid rgba(229,189,103,.22);

  box-shadow:
    0 25px 80px rgba(0,0,0,.55),
    0 0 0 1px rgba(255,255,255,.02);

  margin-bottom:50px;
}

.banner-container::after{
  content:"";
  position:absolute;
  inset:0;
  pointer-events:none;

  background:
    linear-gradient(
      90deg,
      rgba(0,0,0,.55),
      rgba(0,0,0,.12) 55%,
      transparent
    );
}

.banner-container img{
  width:100%;
  display:block;
  height:auto;

  transition:transform 1s ease;
}

.banner-container:hover img{
  transform:scale(1.015);
}

.hero-content{
  position:absolute;
  z-index:2;

  left:6%;
  top:50%;
  transform:translateY(-50%);

  max-width:47%;
}

.hero-title{
  font-family:'Montserrat',sans-serif;
  font-size:clamp(28px,4vw,64px);
  line-height:1.02;
  font-weight:900;

  text-transform:uppercase;
  color:#fff;

  letter-spacing:-1.5px;

  text-shadow:0 4px 25px rgba(0,0,0,.65);
}

.hero-title span{
  color:var(--gold-light);
}

.hero-text{
  margin-top:18px;

  color:#d0dad4;

  font-size:clamp(12px,1.1vw,16px);
  line-height:1.55;

  max-width:520px;
}

.hero-buttons{
  display:flex;
  flex-wrap:wrap;
  gap:11px;
  margin-top:24px;
}

.banner-btn-green,
.banner-btn-white{
  display:inline-flex;
  align-items:center;
  justify-content:center;

  padding:12px 19px;

  border-radius:10px;

  font-size:13px;
  font-weight:800;

  transition:.25s ease;
}

.banner-btn-green{
  color:#fff;

  background:
    linear-gradient(
      135deg,
      #20c98b,
      #087d51
    );

  box-shadow:
    0 8px 25px rgba(25,199,131,.20);
}

.banner-btn-green:hover{
  transform:translateY(-3px);
  box-shadow:0 13px 30px rgba(25,199,131,.28);
}

.banner-btn-white{
  color:#101411;
  background:#f5f2e9;
}

.banner-btn-white:hover{
  transform:translateY(-3px);
  background:#fff;
}

/* =========================================
   SECTION
========================================= */

.section-header{
  display:flex;
  justify-content:space-between;
  align-items:flex-end;

  margin-bottom:23px;
  padding-bottom:13px;

  border-bottom:1px solid rgba(229,189,103,.13);
}

.section-title{
  font-family:'Montserrat',sans-serif;
  font-size:25px;
  font-weight:900;
  text-transform:uppercase;
  letter-spacing:.3px;
}

.section-title span{
  color:var(--gold-light);
}

.section-description{
  color:var(--muted);
  font-size:12px;
}

/* =========================================
   SHIRTS
========================================= */

.shirts-grid{
  display:grid;

  grid-template-columns:
    repeat(auto-fill,minmax(245px,1fr));

  gap:20px;
}

.shirt-card{
  position:relative;

  overflow:hidden;

  background:
    linear-gradient(
      145deg,
      rgba(255,255,255,.025),
      transparent
    ),
    var(--card);

  border:1px solid var(--border);
  border-radius:18px;

  display:flex;
  flex-direction:column;

  cursor:pointer;

  transition:
    transform .35s ease,
    border-color .35s ease,
    box-shadow .35s ease;
}

.shirt-card::before{
  content:"";
  position:absolute;
  inset:0;
  pointer-events:none;

  background:
    linear-gradient(
      120deg,
      transparent 30%,
      rgba(229,189,103,.05),
      transparent 70%
    );

  opacity:0;
  transition:.35s;
}

.shirt-card:hover{
  transform:translateY(-8px);

  border-color:rgba(229,189,103,.55);

  box-shadow:
    0 20px 45px rgba(0,0,0,.45),
    0 5px 25px rgba(229,189,103,.07);
}

.shirt-card:hover::before{
  opacity:1;
}

.shirt-img-wrapper{
  position:relative;

  width:100%;
  aspect-ratio:1;

  display:flex;
  align-items:center;
  justify-content:center;

  overflow:hidden;

  background:
    radial-gradient(
      circle at center,
      #173526 0%,
      #09150f 48%,
      #030806 100%
    );
}

.shirt-img-placeholder{
  font-size:80px;

  filter:drop-shadow(0 15px 20px rgba(0,0,0,.65));

  transition:.35s ease;
}

.shirt-card:hover .shirt-img-placeholder{
  transform:scale(1.1) rotate(-2deg);
}

.badge-tag{
  position:absolute;

  z-index:2;

  top:12px;
  left:12px;

  padding:5px 9px;

  border-radius:20px;

  background:rgba(2,7,5,.82);
  border:1px solid rgba(229,189,103,.35);

  color:var(--gold-light);

  font-size:9px;
  font-weight:800;

  text-transform:uppercase;

  backdrop-filter:blur(6px);
}

.shirt-info{
  padding:17px;

  display:flex;
  flex-direction:column;

  flex:1;
}

.shirt-club{
  color:#82948a;

  font-size:11px;
  font-weight:700;

  text-transform:uppercase;
  letter-spacing:.7px;
}

.shirt-name{
  color:#fff;

  font-size:15px;
  line-height:1.35;

  font-weight:800;

  margin:5px 0 16px;
}

.shirt-footer{
  display:flex;
  align-items:center;
  justify-content:space-between;

  margin-top:auto;
}

.shirt-price{
  color:var(--green);

  font-size:17px;
  font-weight:900;
}

.shirt-btn{
  padding:8px 12px;

  border-radius:8px;

  background:rgba(229,189,103,.08);
  border:1px solid rgba(229,189,103,.25);

  color:var(--gold-light);

  font-size:11px;
  font-weight:800;

  transition:.2s;
}

.shirt-card:hover .shirt-btn{
  color:#050806;
  background:var(--gold);
}

/* =========================================
   SELL PAGE
========================================= */

.sell-box{
  width:min(650px,100%);
  margin:30px auto;

  text-align:center;

  padding:45px 30px;

  background:
    radial-gradient(
      circle at top,
      rgba(229,189,103,.09),
      transparent 45%
    ),
    var(--card);

  border:1px solid var(--border);
  border-radius:22px;

  box-shadow:0 25px 70px rgba(0,0,0,.4);
}

.sell-box h1{
  font-family:'Montserrat',sans-serif;
  font-size:32px;
  color:var(--gold-light);
  margin-bottom:15px;
}

.sell-box p{
  color:var(--muted);
  line-height:1.6;
  margin-bottom:25px;
}

/* =========================================
   FOOTER
========================================= */

footer{
  padding:45px 20px;

  text-align:center;

  border-top:1px solid rgba(229,189,103,.15);

  background:#010302;

  color:#87968f;

  font-size:13px;
}

footer strong{
  color:#fff;
  font-family:'Montserrat',sans-serif;
}

/* =========================================
   MOBILE
========================================= */

@media(max-width:900px){

  .header-inner{
    min-height:70px;
    padding:8px 15px;
    gap:10px;
  }

  .header-logo{
    height:45px;
  }

  .brand-name{
    display:none;
  }

  nav{
    gap:2px;
  }

  nav a{
    font-size:12px;
    padding:9px 9px;
  }

  .lang-btn{
    padding:9px 10px;
  }

  .page{
    padding:20px 14px 60px;
  }

  .banner-container{
    border-radius:17px;
    margin-bottom:35px;
  }

  .hero-content{
    left:6%;
    top:50%;
    max-width:55%;
  }

  .hero-text{
    margin-top:9px;
    font-size:10px;
  }

  .hero-buttons{
    margin-top:13px;
    gap:6px;
  }

  .banner-btn-green,
  .banner-btn-white{
    padding:8px 11px;
    font-size:9px;
    border-radius:7px;
  }

  .shirts-grid{
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:11px;
  }

  .shirt-card{
    border-radius:13px;
  }

  .shirt-info{
    padding:11px;
  }

  .shirt-name{
    font-size:12px;
    margin-bottom:11px;
  }

  .shirt-price{
    font-size:14px;
  }

  .shirt-btn{
    padding:7px 9px;
    font-size:9px;
  }

  .section-title{
    font-size:19px;
  }

  .section-description{
    display:none;
  }

  .lang-modal{
    padding:18px;
    border-radius:19px;
  }

  .lang-list{
    grid-template-columns:1fr;
    max-height:58vh;
  }
}

@media(max-width:500px){

  .header-inner{
    justify-content:space-between;
  }

  nav a{
    padding:8px 6px;
    font-size:10px;
  }

  .lang-btn{
    font-size:10px;
  }

  .lang-btn .lang-arrow{
    display:none;
  }

  .hero-title{
    font-size:25px;
  }

  .hero-text{
    display:none;
  }

  .hero-buttons{
    margin-top:12px;
  }

  .shirts-grid{
    grid-template-columns:repeat(2,1fr);
  }

  .shirt-img-placeholder{
    font-size:55px;
  }

  .sell-box{
    padding:35px 20px;
  }
}

/* =========================================
   REDUCED MOTION
========================================= */

@media(prefers-reduced-motion:reduce){

  *,
  *::before,
  *::after{
    animation:none!important;
    transition:none!important;
    scroll-behavior:auto!important;
  }
}
</style>
</head>

<body>

<!-- =========================================
     GOOGLE TRANSLATE ENGINE
========================================= -->

<div id="google_translate_element"
     style="position:absolute;left:-9999px;top:-9999px;">
</div>

<script>

    autoDisplay:false
  },'google_translate_element');

<script
src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit">
</script>


<!-- =========================================
     HEADER
========================================= -->

<header class="site-header">

  <div class="header-inner">

    <a href="#/" class="logo-link">

      <img
        class="header-logo"
        src="logo.png"
        alt="Football-Shirt-Market logo"
      >

      <div class="brand-name">
        <span
          class="brand-title"
          translate="no"
        >
          Football-Shirt-Market
        </span>

        <span
          class="brand-since"
          translate="no"
        >
          SINCE 2026
        </span>
      </div>

    </a>


    <nav>

      <a href="#/" id="nav-home">
        Home
      </a>

      <a href="#/explore" id="nav-explore">
        Ontdekken
      </a>

      <a href="#/sell" id="nav-sell">
        Verkopen
      </a>

    </nav>


    <button
      id="langPickerBtn"
      class="lang-btn"
      translate="no"
      type="button"
    >

      <span id="currentFlag">
        🇳🇱
      </span>

      <span id="currentLangCode">
        NL
      </span>

      <span class="lang-arrow">
        ▼
      </span>

    </button>

  </div>

</header>


<!-- =========================================
     LANGUAGE MODAL
========================================= -->

<div
  id="langModal"
  class="lang-modal-backdrop"
>

  <div
    class="lang-modal"
    role="dialog"
    aria-modal="true"
  >

    <div class="lang-modal-header">

      <div>

        <div class="lang-modal-title">
          Kies je taal
        </div>

        <div class="lang-modal-subtitle">
          Zoek uit meer dan 100 beschikbare talen
        </div>

      </div>

      <button
        class="lang-close-btn"
        id="closeLangModal"
        type="button"
      >
        ×
      </button>

    </div>


    <div class="lang-search-wrap">

      <span class="lang-search-icon">
        🔎
      </span>

      <input
        type="text"
        id="langSearchInput"
        class="lang-search-box"
        placeholder="Zoek een taal..."
        autocomplete="off"
      >

    </div>


    <div
      id="langList"
      class="lang-list"
      translate="no"
    ></div>

  </div>

</div>


<!-- =========================================

/* =========================================================
   GOOGLE TRANSLATE COOKIE
========================================================= */

function getCurrentLanguage(){

  const match = document.cookie.match(
    /(?:^|;\s*)googtrans=\/nl\/([^;]+)/
  );

  if(match && match[1]){
    return decodeURIComponent(match[1]);
  }

  return "nl";
}


/* =========================================================
   LANGUAGE BUTTON
========================================================= */

function updateLanguageButton(){

  const currentCode = getCurrentLanguage();

  const language =
    languages.find(
      language => language.code === currentCode
    ) ||
    languages.find(
      language => language.code === "nl"
    );

  if(!language) return;

  document.getElementById("currentFlag").textContent =
    language.flag;

  document.getElementById("currentLangCode").textContent =
    language.code
      .split("-")[0]
      .toUpperCase();

}


/* =========================================================
   TAAL INSTELLEN
========================================================= */

function setLanguage(code){

  /*
    Eerst oude Google Translate cookies verwijderen.
  */

  const expires =
    "expires=Thu, 01 Jan 1970 00:00:00 UTC;";

  document.cookie =
    `googtrans=; ${expires} path=/;`;

  document.cookie =
    `googtrans=; ${expires} path=/; domain=${location.hostname};`;


  /*
    Nederlands = originele taal.
  */

  if(code === "nl"){

    localStorage.setItem(
      "selectedLanguage",
      "nl"
    );

  }else{

    /*
      Google Translate gebruikt:
      /nl/taalcode
    */

    document.cookie =
      `googtrans=/nl/${code}; path=/;`;

    /*
      Voor sites met www / subdomeinen.
    */

    const host = location.hostname;

    if(
      host &&
      host !== "localhost" &&
      !host.includes("127.0.0.1")
    ){

      document.cookie =
        `googtrans=/nl/${code}; path=/; domain=.${host};`;

    }

    localStorage.setItem(
      "selectedLanguage",
      code
    );

  }

  document.getElementById(
    "langModal"
  ).classList.remove("open");

  /*
    Kleine vertraging zodat de cookie
    zeker opgeslagen is.
  */

  setTimeout(() => {

    location.reload();

  },150);

}


/* =========================================================
   LANGUAGE LIST
========================================================= */

function renderLanguageList(search=""){

  const list =
    document.getElementById("langList");

  const query =
    search
      .trim()
      .toLowerCase();

  const current =
    getCurrentLanguage();


  const filtered =
    languages.filter(language => {

      return (
        language.name
          .toLowerCase()
          .includes(query)
        ||
        language.code
          .toLowerCase()
          .includes(query)
      );

    });


  list.innerHTML = "";


  if(filtered.length === 0){

    list.innerHTML = `

      <div
        style="
          grid-column:1/-1;
          text-align:center;
          padding:35px 15px;
          color:#82948a;
        "
      >
        Geen taal gevonden.
      </div>

    `;

    return;

  }


  filtered.forEach(language => {

    const item =
      document.createElement("button");

    item.type = "button";

    item.className =
      "lang-item";

    if(language.code === current){

      item.classList.add("active");

    }


    item.innerHTML = `

      <span class="lang-flag">
        ${language.flag}
      </span>

      <span class="lang-name">
        ${language.name}
      </span>

    `;


    item.addEventListener(
      "click",
      () => setLanguage(language.code)
    );


    list.appendChild(item);

  });

}


/* =========================================================
   LANGUAGE MODAL
========================================================= */

const langModal =
  document.getElementById("langModal");

const langPickerBtn =
  document.getElementById("langPickerBtn");

const closeLangModal =
  document.getElementById("closeLangModal");

const langSearchInput =
  document.getElementById("langSearchInput");


langPickerBtn.addEventListener(
  "click",
  () => {

    langModal.classList.add("open");

    langSearchInput.value = "";

    renderLanguageList();

    setTimeout(
      () => langSearchInput.focus(),
      50
    );

  }
);


closeLangModal.addEventListener(
  "click",
  () => {

    langModal.classList.remove("open");

  }
);


langModal.addEventListener(
  "click",
  event => {

    if(event.target === langModal){

      langModal.classList.remove("open");

    }

  }
);


langSearchInput.addEventListener(
  "input",
  event => {

    renderLanguageList(
      event.target.value
    );

  }
);


/*
  ESC om taalvenster te sluiten.
*/

document.addEventListener(
  "keydown",
  event => {

    if(
      event.key === "Escape" &&
      langModal.classList.contains("open")
    ){

      langModal.classList.remove("open");

    }

  }
);


/* =========================================================
   ROUTER
========================================================= */

function route(){

  const hash =
    location.hash || "#/";


  document
    .querySelectorAll("nav a")
    .forEach(
      link => link.classList.remove("active")
    );


  if(hash.startsWith("#/explore")){

    document
      .getElementById("nav-explore")
      ?.classList.add("active");

    renderExplore();

  }

  else if(hash.startsWith("#/sell")){

    document
      .getElementById("nav-sell")
      ?.classList.add("active");

    renderSell();

  }

  else{

    document
      .getElementById("nav-home")
      ?.classList.add("active");

    renderHome();

  }


  updateLanguageButton();

}


/* =========================================================
   START
========================================================= */

window.addEventListener(
  "hashchange",
  route
);

route();
