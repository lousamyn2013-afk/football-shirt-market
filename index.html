<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<title>Football-Shirt-Market</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
:root{
    --bg:#020504;
    --green:#18bf77;
    --green-dark:#08784c;
    --gold:#efd28f;
    --gold-dark:#d1a33d;
    --white:#fff;
    --muted:#b7c4be;
    --card:#08140f;
    --line:rgba(239,210,143,.2);
}

*{ box-sizing:border-box; margin:0; padding:0; }

html, body{
    margin:0; padding:0; background:var(--bg); color:#fff;
    font-family:Inter,Arial,sans-serif; overflow-x:hidden; min-height:100vh;
}

a{ color:inherit; text-decoration:none; }
button, input, select, textarea{ font-family:inherit; }

.goog-te-banner-frame, .skiptranslate iframe, #google_translate_element{ display:none!important; }
body{ top:0!important; }
.goog-text-highlight{ background:transparent!important; box-shadow:none!important; }

/* HEADER */
.site-header{
    position:sticky; top:0; z-index:1000;
    background:rgba(2,6,4,.94); backdrop-filter:blur(18px);
    border-bottom:1px solid var(--line);
}
.header-inner{
    width:min(1400px,100%); min-height:78px; margin:auto; padding:9px 22px;
    display:flex; align-items:center; justify-content:space-between; gap:20px;
}
.logo-area{ display:flex; align-items:center; gap:11px; }
.header-logo{ width:54px; height:54px; object-fit:contain; }
.brand{ display:flex; flex-direction:column; }
.brand-title{ font-family:Montserrat,sans-serif; font-size:14px; font-weight:900; letter-spacing:.5px; }
.brand-since{ margin-top:3px; color:var(--gold); font-size:9px; letter-spacing:2px; font-weight:800; }

nav{ display:flex; gap:5px; }
nav a{ color:#adbbb4; padding:10px 15px; border-radius:10px; font-size:13px; font-weight:800; transition:.2s; }
nav a:hover, nav a.active{ color:#fff; background:rgba(255,255,255,.07); }

.header-right{ display:flex; align-items:center; gap:8px; }
.language-button{
    min-height:40px; border:1px solid rgba(239,210,143,.32); background:#07130e;
    color:var(--gold); border-radius:10px; padding:0 12px; display:flex; align-items:center; gap:6px;
    font-size:11px; font-weight:800; cursor:pointer;
}
.menu-button{ display:none; width:42px; height:42px; border:1px solid var(--line); border-radius:10px; background:#07130e; color:#fff; font-size:20px; cursor:pointer; }

/* MOBILE NAV */
.mobile-nav{ display:none; border-top:1px solid rgba(239,210,143,.1); background:#030806; padding:10px 12px; }
.mobile-nav.open{ display:block; }
.mobile-nav a{ display:block; padding:13px; border-radius:99px; color:#dbe3df; font-weight:800; }

/* PAGE & HERO */
.page{ width:min(1400px,100%); margin:auto; padding:25px 22px 75px; }
.hero{
    position:relative; width:100%; min-height:520px; height:clamp(520px,51vw,680px);
    overflow:hidden; border-radius:22px; border:1px solid rgba(239,210,143,.22);
    background:#020504; box-shadow:0 25px 70px rgba(0,0,0,.6);
}
.hero-image{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; object-position:center; z-index:1; }
.hero-shade{
    position:absolute; inset:0; z-index:2;
    background:linear-gradient(90deg, #020504 0%, rgba(2,5,4,.85) 40%, transparent 100%);
    pointer-events:none;
}
.hero-clean-mask{
    position:absolute; z-index:3; left:0; top:0; bottom:0; width:55%;
    background:linear-gradient(90deg, #020504 0%, #020504 70%, transparent 100%);
    pointer-events:none;
}
.hero-content{
    position:absolute; z-index:5; left:5.5%; top:50%; transform:translateY(-50%);
    width:min(530px,90%); display:flex; flex-direction:column; align-items:flex-start;
}
.hero-kicker{ color:var(--gold); font-family:Montserrat,sans-serif; font-size:11px; font-weight:900; letter-spacing:2px; text-transform:uppercase; margin-bottom:14px; }
.hero-title{ font-family:Montserrat,sans-serif; color:#fff; font-size:clamp(36px,4.5vw,68px); line-height:1; font-weight:900; text-transform:uppercase; }
.hero-title span{ color:var(--gold); }
.hero-description{ max-width:470px; color:#d1dbd6; margin-top:16px; font-size:14px; line-height:1.55; }

.hero-buttons{ display:flex; gap:10px; margin-top:22px; z-index:6; }
.hero-button{
    min-height:45px; padding:0 20px; display:inline-flex; align-items:center; justify-content:center;
    border-radius:99px; font-size:12px; font-weight:900; transition:.22s; border:none; cursor:pointer;
}
.hero-button.green{ color:#fff; background:linear-gradient(135deg, #19c982, #0a8955); box-shadow:0 8px 25px rgba(25,201,130,.22); }
.hero-button.white{ background:#fff; color:#111; }
.hero-button:hover{ transform:translateY(-2px); }

.hero-search{
    width:min(430px,100%); height:50px; margin-top:20px; display:flex; align-items:center;
    background:rgba(8,20,15,.95); border:1px solid rgba(239,210,143,.48); border-radius:11px; overflow:hidden; z-index:6;
}
.hero-search-icon{ width:45px; display:flex; justify-content:center; align-items:center; color:#fff; font-size:18px; }
.hero-search input{ flex:1; height:100%; border:0; outline:0; background:transparent; color:#fff; font-size:13px; }
.hero-search button{ width:43px; height:38px; margin-right:5px; border:0; border-radius:8px; background:linear-gradient(135deg, var(--gold), var(--gold-dark)); color:#0a0d0b; font-weight:900; cursor:pointer; }

/* SECTIONS & SHIRTS */
.section{ margin-top:45px; }
.section-head{ display:flex; justify-content:space-between; align-items:flex-end; padding-bottom:13px; margin-bottom:18px; border-bottom:1px solid rgba(239,210,143,.14); }
.section-title{ font-family:Montserrat,sans-serif; font-size:24px; font-weight:900; text-transform:uppercase; }
.section-title span{ color:var(--gold); }
.section-link{ color:var(--gold); font-size:12px; font-weight:900; }

.explore-filters{ display:flex; gap:12px; margin-bottom:25px; flex-wrap:wrap; }
.explore-filters select{ background:#030806; color:#fff; border:1px solid rgba(239,210,143,.25); padding:10px 14px; border-radius:10px; font-size:13px; cursor:pointer; outline:none; transition:.2s; }
.explore-filters select:focus{ border-color:var(--gold); }

.home-shirt-row{ display:grid; grid-auto-flow:column; grid-auto-columns:245px; gap:15px; overflow-x:auto; padding-bottom:12px; }
.explore-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(235px,1fr)); gap:18px; }

.shirt-card{ background:linear-gradient(180deg,#0b1913,#06100c); border:1px solid var(--line); border-radius:15px; overflow:hidden; transition:.28s; }
.shirt-card:hover{ transform:translateY(-5px); border-color:var(--gold); }
.shirt-visual{ position:relative; width:100%; aspect-ratio:1/1; display:flex; align-items:center; justify-content:center; background:radial-gradient(circle,#183c2a,#08150f 60%,#030805); font-size:64px; }
.shirt-condition{ position:absolute; top:9px; left:9px; color:var(--gold); padding:4px 8px; background:rgba(0,0,0,.75); border:1px solid rgba(239,210,143,.3); border-radius:15px; font-size:8px; font-weight:900; z-index:2; }
.shirt-info{ padding:14px; }
.shirt-club{ color:#83948c; font-size:9px; font-weight:900; text-transform:uppercase; }
.shirt-name{ color:#fff; font-size:13px; font-weight:900; margin-top:4px; min-height:36px; line-height:1.3; }
.shirt-footer{ display:flex; align-items:center; justify-content:space-between; margin-top:12px; }
.shirt-price{ color:var(--green); font-size:14px; font-weight:900; }
.shirt-view{ color:var(--gold); background:rgba(239,210,143,.07); border:1px solid rgba(239,210,143,.27); border-radius:7px; padding:6px 10px; font-size:9px; font-weight:900; cursor:pointer; }
.shirt-visual img{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
.shirt-boost-badge{ position:absolute; top:9px; right:9px; z-index:2; background:linear-gradient(135deg,var(--gold),var(--gold-dark)); color:#0a0d0b; padding:4px 8px; border-radius:15px; font-size:8px; font-weight:900; letter-spacing:.5px; }

/* EXPLORE BANNER */
.explore-banner{
    position:relative; width:100%; overflow:hidden;
    border-radius:20px; border:1px solid var(--line); background:#020504;
}
.explore-banner img{
    width:100%; height:auto; display:block; object-fit:contain;
    position:relative; z-index:1;
}
.explore-overlay{
    position:absolute; inset:0; z-index:2;
    display:flex; flex-direction:column; align-items:flex-start; justify-content:center;
    padding:clamp(28px, 5vw, 60px) clamp(20px, 4.5vw, 55px);
    background:linear-gradient(90deg, rgba(2,5,4,.9) 0%, rgba(2,5,4,.55) 45%, transparent 75%);
    pointer-events:none;
}
.explore-kicker{
    color:var(--gold); font-family:Montserrat,sans-serif; font-size:clamp(10px,1.1vw,12px);
    font-weight:900; letter-spacing:3px; text-transform:uppercase; margin-bottom:14px;
    display:flex; align-items:center; gap:10px;
}
.explore-kicker::before{ content:""; width:26px; height:2px; background:var(--gold); display:inline-block; }
.explore-title{
    font-family:Montserrat,sans-serif;
    font-size:clamp(32px, 5.5vw, 64px);
    line-height:1.05; font-weight:900; text-transform:uppercase;
    text-shadow:0 6px 30px rgba(0,0,0,.55);
    letter-spacing:.5px;
}
.explore-title span{
    background:linear-gradient(135deg, var(--gold), var(--gold-dark));
    -webkit-background-clip:text; background-clip:text; color:transparent;
}
.explore-subtitle{
    margin-top:16px; max-width:460px; color:#d1dbd6; font-size:clamp(13px,1.4vw,15px); line-height:1.6;
}
.explore-search-overlay{
    position:absolute; left:4.4%; top:74.8%; width:44.8%; height:11.9%; z-index:3;
}
.explore-search-overlay input{
    position:absolute; inset:0; width:100%; height:100%;
    padding-left:14%; padding-right:14%; background:transparent; border:0; outline:0;
    color:#fff; font-size:clamp(12px,1.5vw,15px);
}
.explore-search-overlay input::placeholder{ color:rgba(255,255,255,.4); }
.explore-search-overlay button{
    position:absolute; right:0; top:0; width:14%; height:100%; background:transparent; border:0; cursor:pointer;
}

/* SELL */
.sell-box{ max-width:680px; margin:50px auto; padding:40px clamp(20px,4vw,40px); text-align:left; background:#07130e; border:1px solid var(--line); border-radius:20px; }
.sell-box h1{ color:var(--gold); font-family:Montserrat,sans-serif; font-size:32px; text-align:center; }
.sell-intro{ color:#a8b5ae; line-height:1.7; margin:15px 0 30px; text-align:center; font-size:14px; }
.form-group{ margin-bottom:18px; }
.form-group label{ display:block; color:var(--gold); font-size:11px; font-weight:800; text-transform:uppercase; letter-spacing:.5px; margin-bottom:7px; }
.form-group input[type=text], .form-group input[type=number], .form-group select, .form-group textarea{
    width:100%; padding:13px 14px; background:#030806; border:1px solid rgba(239,210,143,.25); border-radius:10px;
    color:#fff; font-size:16px; outline:0; font-family:inherit;
}
.type-checkboxes{ display:flex; flex-wrap:wrap; gap:12px; margin-top:8px; }
.type-checkbox-label{ display:flex; align-items:center; gap:8px; font-size:13px; color:#fff; cursor:pointer; background:#030806; padding:8px 14px; border:1px solid rgba(239,210,143,.25); border-radius:8px; }
.type-checkbox-label input[type=checkbox]{ accent-color:var(--gold); width:16px; height:16px; cursor:pointer; }
.form-group textarea{ resize:vertical; min-height:90px; }
.form-group input:focus, .form-group select:focus, .form-group textarea:focus{ border-color:var(--gold); }
.form-row{ display:grid; grid-template-columns:1fr 1fr; gap:14px; }
.photo-dropzone{
    border:2px dashed rgba(239,210,143,.35); border-radius:14px; padding:26px 16px; text-align:center;
    cursor:pointer; color:#a8b5ae; font-size:13px; transition:.2s;
}
.photo-dropzone:hover, .photo-dropzone.dragover{ border-color:var(--gold); color:var(--gold); background:rgba(239,210,143,.05); }
.photo-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(80px,1fr)); gap:10px; margin-top:14px; }
.photo-thumb{ position:relative; aspect-ratio:1/1; border-radius:10px; overflow:hidden; border:1px solid var(--line); }
.photo-thumb img{ width:100%; height:100%; object-fit:cover; }
.photo-thumb button{ position:absolute; top:4px; right:4px; width:22px; height:22px; border-radius:50%; border:0; background:rgba(0,0,0,.8); color:#fff; font-size:13px; cursor:pointer; line-height:1; }
.boost-box{
    display:flex; align-items:flex-start; gap:12px; padding:14px; margin-top:6px; margin-bottom:8px;
    border:1px solid rgba(239,210,143,.3); border-radius:12px; background:rgba(239,210,143,.05);
}
.boost-box input[type=checkbox]{ margin-top:3px; width:18px; height:18px; flex-shrink:0; accent-color:var(--gold); cursor:pointer; }
.boost-box-text strong{ color:var(--gold); display:block; font-size:13px; margin-bottom:3px; }
.boost-box-text span{ color:#a8b5ae; font-size:12px; line-height:1.5; }
.boost-options{ display:flex; flex-direction:column; gap:10px; margin-top:6px; margin-bottom:20px; }
.boost-option{
    display:flex; align-items:center; gap:12px; padding:13px 14px; border:1px solid rgba(239,210,143,.22);
    border-radius:12px; cursor:pointer; background:rgba(255,255,255,.02); transition:.15s;
}
.boost-option:has(input:checked){ border-color:var(--gold); background:rgba(239,210,143,.08); }
.boost-option input[type=radio]{ width:18px; height:18px; flex-shrink:0; accent-color:var(--gold); cursor:pointer; }
.boost-option-text{ flex:1; }
.boost-option-text strong{ display:block; font-size:13px; color:#fff; }
.boost-option-text span{ font-size:11px; color:#a8b5ae; line-height:1.4; }
.boost-option-price{ color:var(--gold); font-weight:900; font-size:14px; flex-shrink:0; }
.sell-submit{ width:100%; margin-top:4px; }
.form-error{ color:#ff8f8f; font-size:12px; margin-top:6px; margin-bottom:12px; display:none; }
.form-error.show{ display:block; }

/* LANGUAGE MODAL */
.language-modal{ position:fixed; inset:0; z-index:4000; background:rgba(0,0,0,.85); backdrop-filter:blur(10px); display:none; align-items:center; justify-content:center; padding:20px; }
.language-modal.open{ display:flex; }
.language-box{ width:min(600px,100%); max-height:80vh; background:#09160f; border:1px solid rgba(239,210,143,.3); border-radius:18px; padding:20px; display:flex; flex-direction:column; }
.language-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; }
.language-title{ color:var(--gold); font-family:Montserrat,sans-serif; font-size:16px; font-weight:900; }
.language-close{ width:32px; height:32px; border:0; border-radius:8px; background:rgba(255,255,255,.1); color:#fff; font-size:20px; cursor:pointer; }
.language-search{ width:100%; height:42px; padding:0 12px; border:1px solid rgba(239,210,143,.25); border-radius:8px; outline:0; background:#030806; color:#fff; margin-bottom:12px; }
.language-list{ display:grid; grid-template-columns:repeat(2,1fr); gap:6px; overflow-y:auto; }
.language-item{ min-height:40px; border:0; border-radius:8px; background:rgba(255,255,255,.03); color:#d6dfda; display:flex; align-items:center; gap:8px; padding:6px 10px; cursor:pointer; font-size:12px; }
.language-item:hover, .language-item.active{ background:var(--gold-dark); color:#000; }

footer{ padding:35px 20px; text-align:center; background:#010302; border-top:1px solid var(--line); color:#7e8c85; font-size:12px; }
.toast{ position:fixed; left:50%; bottom:25px; transform:translate(-50%,120px); background:#07130e; border:1px solid var(--gold); color:#fff; border-radius:8px; padding:10px 16px; font-size:12px; font-weight:800; transition:.3s; z-index:5000; }
.toast.show{ transform:translate(-50%,0); }

/* RESPONSIVE */
@media(max-width:900px){
    .brand, nav{ display:none; }
    .menu-button{ display:block; }
    .hero{ height:auto; min-height:560px; padding:40px 0; }
    .hero-clean-mask{ width:100%; background:linear-gradient(180deg, #020504 0%, rgba(2,5,4,.9) 70%, transparent 100%); }
    .hero-content{ top:40px; left:20px; transform:none; width:calc(100% - 40px); }
    .hero-title{ font-size:38px; }
    .language-list{ grid-template-columns:1fr; }
    .explore-overlay{ background:linear-gradient(180deg, rgba(2,5,4,.5) 0%, rgba(2,5,4,.92) 70%); }
}
@media(max-width:520px){
    .page{ padding:15px 12px 50px; }
    .hero-title{ font-size:32px; }
    .hero-buttons{ flex-direction:column; width:100%; }
    .hero-button{ width:100%; }
    .explore-overlay{ padding:24px 18px; }
    .form-row{ grid-template-columns:1fr; }
    .sell-box{ padding:26px 16px; margin:25px auto; }
}
</style>
</head>

<body>
<div id="google_translate_element"></div>
<script>

  <div class="header-inner">
    <a href="#/" class="logo-area">
      <img src="logo.png" class="header-logo" alt="Football-Shirt-Market" onerror="this.style.display='none'">

        <div class="brand-title">FOOTBALL-SHIRT-MARKET</div>
        <div class="brand-since">SINCE 2026</div>

  <div class="mobile-nav" id="mobileNav">

<main id="app"></main>

const LISTINGS_KEY = "fsm_user_listings";

function getListings(){
  try{ return JSON.parse(localStorage.getItem(LISTINGS_KEY)) || []; }
  catch(e){ return []; }
}
function saveListings(list){
  try{ localStorage.setItem(LISTINGS_KEY, JSON.stringify(list)); return true; }
  catch(e){ return false; }
}
function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function combinedShirts(){
  const listings = getListings();
  const now = Date.now();
  let changed = false;
  listings.forEach(l=>{
    if(l.boosted && l.boostExpiresAt && l.boostExpiresAt <= now){
      l.boosted = false;
      changed = true;
    }
  });
  if(changed) saveListings(listings);

  const userShirts = listings.map(l=>({
    id:"u"+l.id, club:l.club, name:l.name, price:l.price, condition:l.condition, size:l.size, type:l.type,
    icon:"👕", image:(l.images && l.images[0]) || null, boosted:!!l.boosted
  }));
  const boosted = userShirts.filter(s=>s.boosted).sort((a,b)=> (b.id>a.id?1:-1));
  const normalUser = userShirts.filter(s=>!s.boosted).sort((a,b)=> (b.id>a.id?1:-1));
  return [...boosted, ...normalUser, ...shirts];
}

function makeShirt(shirt){
  const visual = shirt.image
    ? `<img src="${shirt.image}" alt="${escapeHtml(shirt.name)}">`
    : `<div>👕</div>`;
  return `
  <article class="shirt-card">
    <div class="shirt-visual">
      <div class="shirt-condition">${escapeHtml(shirt.condition)}</div>
      ${shirt.boosted ? '<div class="shirt-boost-badge">BOOST</div>' : ''}
      ${visual}
    </div>
    <div class="shirt-info">
      <div class="shirt-club">${shirt.icon} ${escapeHtml(shirt.club)}</div>
      <div class="shirt-name">${escapeHtml(shirt.name)}</div>
      <div class="shirt-footer">

        <button class="shirt-view" data-club="${escapeHtml(shirt.club)}" data-price="${escapeHtml(shirt.price)}">Bekijken</button>

}

function showToast(msg){
  const t = document.getElementById("toast");
  t.innerText = msg;
  t.classList.add("show");
  setTimeout(()=>t.classList.remove("show"),3000);
}

function updateNav(){
  const h = location.hash;
  document.querySelectorAll('nav a').forEach(a=>a.classList.remove('active'));
  if(h.startsWith('#/explore') && document.getElementById('navExplore')) document.getElementById('navExplore').classList.add('active');
  else if(h==='#/sell' && document.getElementById('navSell')) document.getElementById('navSell').classList.add('active');
  else if(document.getElementById('navHome')) document.getElementById('navHome').classList.add('active');
  document.getElementById('mobileNav').classList.remove('open');
}

function router(){
  updateNav();
  const h = location.hash;
  if(h.startsWith('#/explore')) renderExplore();
  else if(h==='#/sell') renderSell();
  else renderHome();
}

window.addEventListener('hashchange', router);
router();

/* LANGUAGE LOGIC */
const langBtn = document.getElementById("languageButton");
const langModal = document.getElementById("languageModal");
const langClose = document.getElementById("languageClose");
const langList = document.getElementById("languageList");
const langSearch = document.getElementById("languageSearch");
const curFlag = document.getElementById("currentFlag");
const curCode = document.getElementById("currentCode");
let activeLang = "nl";

function renderLanguages(query=""){
  const q = query.toLowerCase();
  const html = languages.filter(l=>l.name.toLowerCase().includes(q) || l.code.toLowerCase().includes(q)).map(l=>`
    <button class="language-item ${l.code===activeLang?'active':''}" data-code="${l.code}">
      <span style="font-size:16px">${l.flag}</span> ${l.name}
    </button>
  `).join("");
  langList.innerHTML = html;
}

langBtn.addEventListener("click", ()=>{
  renderLanguages();
  langModal.classList.add("open");
  setTimeout(()=>langSearch.focus(),100);
});
langClose.addEventListener("click", ()=>langModal.classList.remove("open"));
langSearch.addEventListener("input", e=>renderLanguages(e.target.value));

langList.addEventListener("click", e=>{
  const btn = e.target.closest(".language-item");
  if(btn){
    activeLang = btn.dataset.code;
    const l = languages.find(x=>x.code===activeLang);
    curFlag.innerText = l.flag;
    curCode.innerText = l.code.toUpperCase();
    langModal.classList.remove("open");
    
    // Google translate set language
    const gtCombo = document.querySelector('.goog-te-combo');
    if(gtCombo){
      gtCombo.value = activeLang;
      gtCombo.dispatchEvent(new Event('change'));
    }
  }
});
