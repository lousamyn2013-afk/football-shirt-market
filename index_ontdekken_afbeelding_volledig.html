<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Football-Shirt-Market</title>

<style>

:root{
  --black:#071019;
  --black2:#101c28;
  --gold:#d6aa45;
  --gold2:#f1cf72;
  --green:#19b978;
  --white:#fff;
  --light:#f4f6f8;
  --text:#17212b;
  --muted:#697583;
  --border:#dfe4e9;
  --shadow:0 10px 30px rgba(0,0,0,.10);
}

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  padding:0;
  width:100%;
  min-height:100%;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:var(--light);
  color:var(--text);
}

button,
input,
select,
textarea{
  font:inherit;
}

a{
  text-decoration:none;
}

.hidden{
  display:none!important;
}


/* =====================================================
   HEADER
===================================================== */

.site-header{
  position:sticky;
  top:0;
  z-index:1000;
  width:100%;
  background:var(--black);
  color:white;
  box-shadow:0 3px 18px rgba(0,0,0,.20);
}

.header-inner{
  width:min(1250px,100%);
  min-height:76px;
  margin:auto;
  padding:8px 20px;

  display:flex;
  align-items:center;
  gap:24px;
}

.logo-link{
  display:flex;
  align-items:center;
  gap:10px;
  flex-shrink:0;
  color:white;
}

.header-logo{
  width:58px;
  height:58px;
  object-fit:contain;
  display:block;
}

.brand-name{
  line-height:1.05;
}

.brand-name strong{
  display:block;
  font-size:15px;
}

.brand-name span{
  display:block;
  color:var(--gold2);
  font-size:9px;
  letter-spacing:2px;
  margin-top:5px;
  font-weight:bold;
}

nav{
  flex:1;
  display:flex;
  align-items:center;
  gap:4px;
}

nav a{
  color:#dce3e9;
  padding:10px 12px;
  border-radius:8px;
  font-size:14px;
}

nav a:hover{
  background:#152534;
  color:white;
}

.account-btn{
  border:1px solid #394957;
  background:#12212e;
  color:white;
  border-radius:8px;
  padding:10px 15px;
  cursor:pointer;
  flex-shrink:0;
}

.account-btn:hover{
  background:#1a3040;
}


/* =====================================================
   APP / PAGE
===================================================== */

#app{
  min-height:calc(100vh - 76px);
}

.page{
  width:min(1250px,100%);
  margin:auto;
  padding:30px 20px 70px;
}


/* =====================================================
   HERO
===================================================== */

.hero{
  position:relative;
  width:100%;
  overflow:hidden;
  border-radius:22px;
  box-shadow:var(--shadow);
  background:#071019;
  line-height:0;
}

.hero-image{
  display:block;
  width:100%;
  height:auto;
  max-width:100%;
}

.hero-hotspot{
  position:absolute;
  z-index:5;
  display:block;
  cursor:pointer;
  border-radius:10px;
}

.hero-hotspot-explore{
  left:4.6%;
  top:65.1%;
  width:16.8%;
  height:8.0%;
}

.hero-hotspot-sell{
  left:22.6%;
  top:65.1%;
  width:19.5%;
  height:8.0%;
}

.hero-hotspot:hover{
  outline:2px solid rgba(255,255,255,.25);
}


/* =====================================================
   BUTTONS
===================================================== */

.btn{
  display:inline-block;
  border:0;
  border-radius:8px;
  padding:12px 18px;
  cursor:pointer;
  font-weight:bold;
}

.primary{
  background:var(--green);
  color:#041a10;
}

.primary:hover{
  background:#30ce8b;
}

.secondary{
  background:#e9edf1;
  color:#16222d;
}

.secondary:hover{
  background:#dce2e7;
}


/* =====================================================
   CARDS
===================================================== */

.grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:20px;
}

.card{
  background:white;
  border:1px solid var(--border);
  border-radius:15px;
  overflow:hidden;
  box-shadow:0 4px 16px rgba(0,0,0,.05);
}

.shirt{
  height:220px;
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;

  background:
    radial-gradient(
      circle,
      rgba(214,170,69,.13),
      transparent 32%
    ),
    linear-gradient(
      145deg,
      #172c3e,
      #08131e
    );

  font-size:75px;
}

.boost{
  position:absolute;
  top:12px;
  right:12px;
  background:var(--gold2);
  color:#322400;
  padding:5px 8px;
  border-radius:5px;
  font-size:10px;
  font-weight:bold;
}

.body{
  padding:17px;
}

.body h3{
  margin:8px 0;
}

.muted{
  color:var(--muted);
  font-size:13px;
}

.price{
  font-size:20px;
}

.row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:8px;
}

.heart{
  width:38px;
  height:38px;
  border:1px solid var(--border);
  border-radius:8px;
  background:white;
  cursor:pointer;
  font-size:20px;
}


/* =====================================================
   TOOLBAR
===================================================== */

.toolbar{
  display:grid;
  grid-template-columns:2fr 1fr 1fr;
  gap:10px;
  margin:20px 0 25px;
}

input,
select,
textarea{
  width:100%;
  padding:12px;
  border:1px solid var(--border);
  border-radius:8px;
  background:white;
  color:var(--text);
  outline:none;
}

input:focus,
select:focus,
textarea:focus{
  border-color:var(--green);
  box-shadow:0 0 0 3px rgba(25,185,120,.12);
}

textarea{
  min-height:120px;
  resize:vertical;
}


/* =====================================================
   FORMS
===================================================== */

.box{
  background:white;
  border:1px solid var(--border);
  border-radius:15px;
  padding:24px;
  box-shadow:var(--shadow);
}

.form{
  display:grid;
  gap:15px;
}

.form label{
  display:grid;
  gap:7px;
  font-size:14px;
  font-weight:bold;
}

.form button{
  border:0;
  padding:13px;
  border-radius:8px;
  cursor:pointer;
  font-weight:bold;
}


/* =====================================================
   TYPES / CHECKBOXES
===================================================== */

.type-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
}

.type-option{
  position:relative;
}

.type-option input{
  position:absolute;
  opacity:0;
  pointer-events:none;
}

.type-option span{
  display:block;
  padding:13px;
  border:1px solid var(--border);
  border-radius:8px;
  background:white;
  cursor:pointer;
  font-weight:normal;
}

.type-option input:checked + span{
  border-color:var(--gold);
  background:#fff9e9;
  color:#72530a;
  font-weight:bold;
}


/* =====================================================
   CONDITION FILTER
===================================================== */

.condition-filter{
  background:white;
  border:1px solid var(--border);
  border-radius:8px;
  padding:12px;
}

.condition-filter h3{
  font-size:14px;
}


/* =====================================================
   MODAL
===================================================== */

.modal-bg{
  position:fixed;
  inset:0;
  z-index:2000;

  background:rgba(0,0,0,.68);

  display:flex;
  align-items:center;
  justify-content:center;

  padding:20px;
}

.modal-box{
  width:min(500px,100%);
  max-height:90vh;
  overflow:auto;

  background:white;
  border-radius:18px;
  padding:28px;

  box-shadow:0 25px 80px rgba(0,0,0,.3);
}

.modal-box hr{
  border:0;
  border-top:1px solid var(--border);
  margin:25px 0;
}

.close-btn{
  width:100%;
  margin-top:10px;
  padding:11px;

  border:1px solid var(--border);
  background:white;
  border-radius:8px;

  cursor:pointer;
}


/* =====================================================
   FOOTER
===================================================== */

footer{
  background:var(--black);
  color:#aeb8c2;
  text-align:center;
  padding:35px 20px;
}

footer strong{
  color:white;
}

footer .gold{
  color:var(--gold2);
}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:950px){

  .grid{
    grid-template-columns:repeat(2,1fr);
  }

  .toolbar{
    grid-template-columns:1fr 1fr;
  }
}


@media(max-width:700px){

  .header-inner{
    min-height:auto;
    flex-wrap:wrap;
    gap:8px;
    padding:8px 12px;
  }

  .header-logo{
    width:48px;
    height:48px;
  }

  .brand-name strong{
    font-size:13px;
  }

  nav{
    order:3;
    width:100%;
    overflow-x:auto;
    padding-bottom:3px;
  }

  nav a{
    white-space:nowrap;
    font-size:13px;
    padding:8px 10px;
  }

  .account-btn{
    margin-left:auto;
  }

  #app{
    min-height:calc(100vh - 105px);
  }

  .page{
    padding:15px 10px 50px;
  }

  .hero{
    border-radius:14px;
  }

  .grid{
    grid-template-columns:1fr;
  }

  .toolbar{
    grid-template-columns:1fr;
  }

  .type-grid{
    grid-template-columns:1fr;
  }

}


/* =====================================================
   IMAGE FALLBACK
===================================================== */

.hero-image{
  background:
    linear-gradient(
      135deg,
      #071019,
      #101c28
    );
}


/* =====================================================
   NIEUWE ONTDEKKEN HERO
===================================================== */
.explore-page{
  background:transparent;
}

.explore-hero{
  position:relative;
  min-height:330px;
  margin-bottom:28px;
  overflow:hidden;
  border:1px solid #3b4a3e;
  border-radius:22px;
  background:#071019;
  box-shadow:0 25px 70px rgba(0,0,0,.38);
}

.explore-hero-image{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  object-position:center;
  display:block;
  opacity:.88;
}

.explore-hero::after{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(90deg,rgba(3,8,5,.88) 0%,rgba(3,8,5,.55) 43%,rgba(3,8,5,.08) 100%),linear-gradient(0deg,rgba(3,8,5,.38),transparent 60%);
  pointer-events:none;
}

.explore-hero-overlay{
  position:relative;
  z-index:2;
  min-height:330px;
  width:min(620px,90%);
  display:flex;
  flex-direction:column;
  justify-content:center;
  padding:42px;
}

.explore-kicker{
  color:#b9ff38;
  font-size:10px;
  font-weight:900;
  letter-spacing:2.5px;
}

.explore-hero-overlay h1{
  margin:9px 0 10px;
  color:#fff;
  font-size:clamp(34px,5vw,58px);
  line-height:.98;
  letter-spacing:-1.5px;
}

.explore-hero-overlay p{
  margin:0;
  max-width:500px;
  color:#d1dad3;
  font-size:15px;
  line-height:1.6;
}

.explore-heading{
  display:flex;
  justify-content:space-between;
  align-items:end;
  gap:20px;
  margin:0 0 18px;
}

.explore-heading small{
  color:#b9ff38;
  font-size:10px;
  font-weight:900;
  letter-spacing:2px;
}

.explore-heading h1{
  margin:6px 0 0;
}

.explore-heading>span{
  color:#718078;
  font-size:12px;
}

@media(max-width:700px){
  .explore-hero,.explore-hero-overlay{
    min-height:250px;
  }
  .explore-hero-overlay{
    padding:25px;
  }
  .explore-heading{
    align-items:flex-start;
    flex-direction:column;
  }
}


/* Gebruik de volledige aangeleverde Ontdekken-afbeelding; geen dubbele tekst. */
.explore-hero{
  min-height:0 !important;
  height:auto !important;
  padding:0 !important;
  background:#071019 !important;
  display:flex !important;
  align-items:center !important;
  justify-content:center !important;
}
.explore-hero::after{display:none !important;}
.explore-hero-image{
  position:relative !important;
  inset:auto !important;
  width:100% !important;
  height:auto !important;
  max-height:none !important;
  object-fit:contain !important;
  object-position:center !important;
  opacity:1 !important;
  display:block !important;
}
.explore-hero-overlay{display:none !important;}
@media(max-width:700px){
  .explore-hero{min-height:0 !important;}
  .explore-hero-image{width:100% !important;height:auto !important;object-fit:contain !important;}
}

</style>
</head>

<body>

<header class="site-header">

  <div class="header-inner">

    <a
      href="#/"
      class="logo-link"
      aria-label="Football-Shirt-Market Home"
    >

      <img
        class="header-logo"
        src="logo.png"
        alt="Football-Shirt-Market logo"
      >

      <div class="brand-name">

        <strong>
          Football-Shirt-Market
        </strong>

        <span>
          SINCE 2026
        </span>

      </div>

    </a>


    <nav>

      <a href="#/">
        Home
      </a>

      <a href="#/explore">
        Ontdekken
      </a>

      <a href="#/sell">
        Verkopen
      </a>

      <a href="#/inbox">
        Inbox
      </a>

      <a href="#/profile">
        Profiel
      </a>

    </nav>


    <button
      id="account"
      class="account-btn"
      type="button"
    >
      Inloggen
    </button>

  </div>

</header>


<main id="app"></main>


<footer>

  <strong>
    ⚽ Football-Shirt-Market
  </strong>

  <br>

  <span>
    De marketplace voor voetbalshirts ·
    <span class="gold">
      Since 2026
    </span>
  </span>

</footer>


<div
  id="modal"
  class="hidden"
></div>


<script>

const app =
  document.getElementById("app");

const modal =
  document.getElementById("modal");

const account =
  document.getElementById("account");


let me = null;

let afterLogin = null;


async function api(url,opt={}){

  const options = {
    ...opt,
    credentials:"same-origin",
    headers:{
      ...(opt.headers || {})
    }
  };


  if(
    opt.body &&
    typeof opt.body !== "string"
  ){

    options.headers["Content-Type"] =
      "application/json";

    options.body =
      JSON.stringify(opt.body);
  }


  const response =
    await fetch(
      url,
      options
    );


  const data =
    await response
      .json()
      .catch(
        ()=>({})
      );


  if(!response.ok){

    throw new Error(
      data.error ||
      data.message ||
      "Er ging iets mis."
    );
  }


  return data;
}


async function init(){

  if(
    !location.hash ||
    location.hash === "#"
  ){

    location.hash = "#/";
  }


  route();


  try{

    me =
      await api(
        "/api/me"
      );

  }catch{

    me = null;
  }


  updateAccountButton();
}


function updateAccountButton(){

  account.textContent =
    me
      ? "Uitloggen"
      : "Inloggen";
}


account.addEventListener(
  "click",
  async()=>{

    if(!me){

      openLogin();

      return;
    }


    try{

      await api(
        "/api/logout",
        {
          method:"POST"
        }
      );

    }catch{}


    me = null;

    afterLogin = null;

    updateAccountButton();

    location.hash = "#/";

  }
);


function openLogin(){

  modal.className =
    "modal-bg";


  modal.innerHTML = `

    <div class="modal-box">

      <h2>
        Inloggen
      </h2>


      <form
        id="loginForm"
        class="form"
      >

        <label>

          E-mail

          <input
            name="email"
            type="email"
            autocomplete="email"
            required
          >

        </label>


        <label>

          Wachtwoord

          <input
            name="password"
            type="password"
            autocomplete="current-password"
            required
          >

        </label>


        <button
          type="submit"
          class="primary"
        >
          Inloggen
        </button>

      </form>


      <hr>


      <h3>
        Nieuw account
      </h3>


      <form
        id="registerForm"
        class="form"
      >

        <label>

          Naam

          <input
            name="name"
            autocomplete="name"
            required
          >

        </label>


        <label>

          E-mail

          <input
            name="email"
            type="email"
            autocomplete="email"
            required
          >

        </label>


        <label>

          Wachtwoord

          <input
            name="password"
            type="password"
            autocomplete="new-password"
            required
          >

        </label>


        <button
          type="submit"
          class="secondary"
        >
          Registreren
        </button>

      </form>


      <button
        type="button"
        class="close-btn"
        id="closeModalBtn"
      >
        Sluiten
      </button>

    </div>

  `;


  document
    .getElementById(
      "closeModalBtn"
    )
    .addEventListener(
      "click",
      closeModal
    );


  document
    .getElementById(
      "loginForm"
    )
    .addEventListener(
      "submit",
      handleLogin
    );


  document
    .getElementById(
      "registerForm"
    )
    .addEventListener(
      "submit",
      handleRegister
    );
}


async function handleLogin(event){

  event.preventDefault();


  const form =
    new FormData(
      event.target
    );


  try{

    me =
      await api(
        "/api/login",
        {
          method:"POST",

          body:{
            email:
              form.get("email"),

            password:
              form.get("password")
          }
        }
      );


    closeModal();

    updateAccountButton();


    const destination =
      afterLogin;


    afterLogin = null;


    if(destination){

      location.hash =
        destination;

    }else{

      location.hash =
        "#/";

    }

  }catch(error){

    alert(
      error.message
    );
  }
}


async function handleRegister(event){

  event.preventDefault();


  const form =
    new FormData(
      event.target
    );


  try{

    me =
      await api(
        "/api/register",
        {
          method:"POST",

          body:{
            name:
              form.get("name"),

            email:
              form.get("email"),

            password:
              form.get("password")
          }
        }
      );


    closeModal();

    updateAccountButton();


    const destination =
      afterLogin;


    afterLogin = null;


    if(destination){

      location.hash =
        destination;

    }else{

      location.hash =
        "#/";

    }

  }catch(error){

    alert(
      error.message
    );
  }
}


function closeModal(){

  modal.className =
    "hidden";

  modal.innerHTML =
    "";
}


function requireLogin(destination){

  if(me){

    return true;
  }


  afterLogin =
    destination;


  openLogin();


  return false;
}


function escapeHtml(value){

  return String(
    value ?? ""
  )

  .replace(
    /&/g,
    "&amp;"
  )

  .replace(
    /</g,
    "&lt;"
  )

  .replace(
    />/g,
    "&gt;"
  )

  .replace(
    /"/g,
    "&quot;"
  )

  .replace(
    /'/g,
    "&#039;"
  );
}


function card(x){

  let types = [];


  if(Array.isArray(x.type)){

    types =
      x.type;

  }else if(
    typeof x.type === "string"
  ){

    types =
      x.type
        .split(",")
        .map(
          v => v.trim()
        )
        .filter(Boolean);
  }


  return `

    <article class="card">

      <div class="shirt">

        ${
          types.includes(
            "Nationale ploeg"
          )
            ? "🌍"
            : "👕"
        }


        ${
          x.boosted
            ? `
              <span class="boost">
                BOOST
              </span>
            `
            : ""
        }

      </div>


      <div class="body">

        <div class="muted">

          ${escapeHtml(
            x.club || ""
          )}

          ${
            x.season
              ? " · " +
                escapeHtml(
                  x.season
                )
              : ""
          }

        </div>


        <h3>

          ${escapeHtml(
            x.title || ""
          )}

        </h3>


        <div class="muted">

          Maat
          ${escapeHtml(
            x.size || "-"
          )}

          ·

          ${escapeHtml(
            x.condition || "-"
          )}

        </div>


        ${
          types.length
            ? `
              <div
                class="muted"
                style="margin-top:7px"
              >
                ${escapeHtml(
                  types.join(" · ")
                )}
              </div>
            `
            : ""
        }


        <div
          class="row"
          style="margin-top:12px"
        >

          <b class="price">

            €${Number(
              x.price || 0
            ).toFixed(2)}

          </b>


          <button
            class="heart"
            type="button"
            data-action="fav"
            data-id="${x.id}"
          >
            ♡
          </button>

        </div>


        <div
          class="muted"
          style="margin-top:8px"
        >

          ${escapeHtml(
            x.seller || ""
          )}

        </div>


        <div
          class="row"
          style="margin-top:12px"
        >

          <button
            class="btn primary"
            type="button"
            data-action="buy"
            data-id="${x.id}"
          >
            Nu kopen
          </button>


          <button
            class="btn secondary"
            type="button"
            data-action="offer"
            data-id="${x.id}"
          >
            Bod
          </button>

        </div>

      </div>

    </article>

  `;
}


document.addEventListener(
  "click",
  event=>{

    const button =
      event.target.closest(
        "[data-action]"
      );


    if(!button){

      return;
    }


    const id =
      button.dataset.id;


    const action =
      button.dataset.action;


    if(action === "fav"){

      fav(id);
    }


    if(action === "buy"){

      buy(id);
    }


    if(action === "offer"){

      offer(id);
    }

  }
);


async function fav(id){

  if(
    !requireLogin(
      location.hash
    )
  ){

    return;
  }


  try{

    await api(
      "/api/favorites/" + id,
      {
        method:"POST"
      }
    );


    alert(
      "Favoriet bijgewerkt."
    );

  }catch(error){

    alert(
      error.message
    );
  }
}


async function buy(id){

  if(
    !requireLogin(
      location.hash
    )
  ){

    return;
  }


  try{

    const order =
      await api(
        "/api/orders",
        {
          method:"POST",

          body:{
            listingId:
              Number(id)
          }
        }
      );


    alert(
      "Order aangemaakt.\n\n" +
      "Bedrag: €" +
      Number(
        order.amount || 0
      ).toFixed(2)
    );

  }catch(error){

    alert(
      error.message
    );
  }
}


async function offer(id){

  if(
    !requireLogin(
      location.hash
    )
  ){

    return;
  }


  const amount =
    prompt(
      "Jouw bod in euro:"
    );


  if(!amount){

    return;
  }


  const number =
    Number(amount);


  if(
    !Number.isFinite(number) ||
    number <= 0
  ){

    alert(
      "Vul een geldig bedrag in."
    );

    return;
  }


  try{

    await api(
      "/api/offers",
      {
        method:"POST",

        body:{
          listingId:
            Number(id),

          amount:
            number
        }
      }
    );


    alert(
      "Bod verzonden."
    );

  }catch(error){

    alert(
      error.message
    );
  }
}

async function loadListings(){

  const search =
    document.getElementById(
      "search"
    )?.value || "";


  const selectedConditions =
    [
      ...document.querySelectorAll(
        ".explore-condition:checked"
      )
    ]
    .map(
      x => x.value
    );


  const conditionParam =
    selectedConditions.join(",");


  const sort =
    document.getElementById(
      "sort"
    )?.value ||
    "recommended";


  const selectedTypes =
    [
      ...document.querySelectorAll(
        ".explore-type:checked"
      )
    ]
    .map(
      x => x.value
    );


  try{

    const listings =
      await api(
        "/api/listings" +
        "?q=" +
        encodeURIComponent(search) +
        "&condition=" +
        encodeURIComponent(conditionParam) +
        "&type=" +
        encodeURIComponent(
          selectedTypes.join(",")
        ) +
        "&sort=" +
        encodeURIComponent(sort)
      );


    const target =
      document.getElementById(
        "results"
      );


    if(!target){

      return;
    }


    target.innerHTML =
      listings
        .map(card)
        .join("") ||

      `

        <div class="box">

          <h3>
            Geen shirts gevonden
          </h3>

          <p class="muted">
            Probeer andere filters.
          </p>

        </div>

      `;

  }catch(error){

    const target =
      document.getElementById(
        "results"
      );


    if(target){

      target.innerHTML = `

        <div class="box">

          <h3>
            Shirts laden lukt niet
          </h3>

          <p class="muted">

            ${escapeHtml(
              error.message
            )}

          </p>

        </div>

      `;
    }
  }
}

async function submitListing(event){

  event.preventDefault();


  const form =
    new FormData(
      event.target
    );


  const types =
    [
      ...document.querySelectorAll(
        'input[name="types"]:checked'
      )
    ]
    .map(
      x => x.value
    );


  if(types.length === 0){

    alert(
      "Kies minimaal één type."
    );

    return;
  }


  const price =
    Number(
      form.get("price")
    );


  if(
    !Number.isFinite(price) ||
    price <= 0
  ){

    alert(
      "Vul een geldige prijs in."
    );

    return;
  }


  const listing = {

    title:
      form.get("title"),

    club:
      form.get("club"),

    player:
      form.get("player"),

    season:
      form.get("season"),

    size:
      form.get("size"),

    condition:
      form.get("condition"),

    type:
      types.join(", "),

    price:
      price,

    description:
      form.get("description")
  };


  try{

    await api(
      "/api/listings",
      {
        method:"POST",
        body:listing
      }
    );


    alert(
      "Listing gepubliceerd!"
    );


    location.hash =
      "#/profile";

  }catch(error){

    alert(
      error.message
    );
  }
}

function route(){

  const hash =
    location.hash || "#/";


  const path =
    hash.startsWith("#/")
      ? hash.slice(2)
      : "";


  switch(path){

    case "":
      home();
      break;


    case "explore":
      explore();
      break;


    case "sell":
      sell();
      break;


    case "profile":
      profile();
      break;


    case "inbox":
      inbox();
      break;


    default:

      location.hash =
        "#/";

      break;
  }
}


window.addEventListener(
  "hashchange",
  route
);


if(
  !location.hash ||
  location.hash === "#"
){

  history.replaceState(
    null,
    "",
    "#/"
  );
}


route();

init();

</script>
