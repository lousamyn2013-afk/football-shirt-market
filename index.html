<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<title>Football-Shirt-Market</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
:root{
    --bg:#020504;
    --green:#18bf77;
    --green-dark:#08784c;
    --gold:#efd28f;
    --gold-dark:#d1a33d;
    --white:#fff;
    --muted:#b7c4be;
    --card:#08140f;
    --line:rgba(239,210,143,.2);
}

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,
body{
    margin:0;
    padding:0;
    background:var(--bg);
    color:#fff;
    font-family:Inter,Arial,sans-serif;
    overflow-x:hidden;
    min-height:100vh;
}

body{
    top:0!important;
}

a{
    color:inherit;
    text-decoration:none;
}

button,
input,
select,
textarea{
    font-family:inherit;
}

img{
    max-width:100%;
}

.goog-te-banner-frame,
.skiptranslate iframe,
#google_translate_element{
    display:none!important;
}

.goog-text-highlight{
    background:transparent!important;
    box-shadow:none!important;
}

/* ======================================================
   HEADER
====================================================== */

.site-header{
    position:sticky;
    top:0;
    z-index:1000;
    background:rgba(2,6,4,.94);
    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);
    border-bottom:1px solid var(--line);
}

.header-inner{
    width:min(1400px,100%);
    min-height:78px;
    margin:auto;
    padding:9px 22px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:20px;
}

.logo-area{
    display:flex;
    align-items:center;
    gap:11px;
    min-width:0;
}

.header-logo{
    width:54px;
    height:54px;
    object-fit:contain;
    flex-shrink:0;
}

.brand{
    display:flex;
    flex-direction:column;
    min-width:0;
}

.brand-title{
    font-family:Montserrat,sans-serif;
    font-size:14px;
    font-weight:900;
    letter-spacing:.5px;
    white-space:nowrap;
}

.brand-since{
    margin-top:3px;
    color:var(--gold);
    font-size:9px;
    letter-spacing:2px;
    font-weight:800;
}

nav{
    display:flex;
    gap:5px;
}

nav a{
    color:#adbbb4;
    padding:10px 15px;
    border-radius:10px;
    font-size:13px;
    font-weight:800;
    transition:.2s;
}

nav a:hover,
nav a.active{
    color:#fff;
    background:rgba(255,255,255,.07);
}

.header-right{
    display:flex;
    align-items:center;
    gap:8px;
}

.language-button{
    min-height:40px;
    border:1px solid rgba(239,210,143,.32);
    background:#07130e;
    color:var(--gold);
    border-radius:10px;
    padding:0 12px;
    display:flex;
    align-items:center;
    gap:6px;
    font-size:11px;
    font-weight:800;
    cursor:pointer;
    transition:.2s;
}

.language-button:hover{
    border-color:var(--gold);
    transform:translateY(-1px);
}

.menu-button{
    display:none;
    width:42px;
    height:42px;
    border:1px solid var(--line);
    border-radius:10px;
    background:#07130e;
    color:#fff;
    font-size:20px;
    cursor:pointer;
}

/* ======================================================
   MOBILE NAV
====================================================== */

.mobile-nav{
    display:none;
    border-top:1px solid rgba(239,210,143,.1);
    background:#030806;
    padding:10px 12px;
}

.mobile-nav.open{
    display:block;
}

.mobile-nav a{
    display:block;
    padding:13px;
    border-radius:12px;
    color:#dbe3df;
    font-weight:800;
}

.mobile-nav a:hover{
    background:rgba(255,255,255,.06);
}

/* ======================================================
   PAGE & HERO
====================================================== */

.page{
    width:min(1400px,100%);
    margin:auto;
    padding:25px 22px 75px;
}

.hero{
    position:relative;
    width:100%;
    min-height:520px;
    height:clamp(520px,51vw,680px);
    overflow:hidden;
    border-radius:22px;
    border:1px solid rgba(239,210,143,.22);
    background:#020504;
    box-shadow:0 25px 70px rgba(0,0,0,.6);
}

.hero-image{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    object-position:center;
    z-index:1;
}

.hero-shade{
    position:absolute;
    inset:0;
    z-index:2;
    background:linear-gradient(
        90deg,
        #020504 0%,
        rgba(2,5,4,.86) 38%,
        rgba(2,5,4,.28) 65%,
        transparent 100%
    );
    pointer-events:none;
}

.hero-clean-mask{
    position:absolute;
    z-index:3;
    left:0;
    top:0;
    bottom:0;
    width:55%;
    background:linear-gradient(
        90deg,
        #020504 0%,
        #020504 70%,
        transparent 100%
    );
    pointer-events:none;
}

.hero-content{
    position:absolute;
    z-index:5;
    left:5.5%;
    top:50%;
    transform:translateY(-50%);
    width:min(530px,90%);
    display:flex;
    flex-direction:column;
    align-items:flex-start;
}

.hero-kicker{
    color:var(--gold);
    font-family:Montserrat,sans-serif;
    font-size:11px;
    font-weight:900;
    letter-spacing:2px;
    text-transform:uppercase;
    margin-bottom:14px;
}

.hero-title{
    font-family:Montserrat,sans-serif;
    color:#fff;
    font-size:clamp(36px,4.5vw,68px);
    line-height:1;
    font-weight:900;
    text-transform:uppercase;
}

.hero-title span{
    color:var(--gold);
}

.hero-description{
    max-width:470px;
    color:#d1dbd6;
    margin-top:16px;
    font-size:14px;
    line-height:1.55;
}

.hero-buttons{
    display:flex;
    gap:10px;
    margin-top:22px;
    z-index:6;
}

.hero-button{
    min-height:45px;
    padding:0 20px;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    border-radius:99px;
    font-size:12px;
    font-weight:900;
    transition:.22s;
    border:none;
    cursor:pointer;
}

.hero-button.green{
    color:#fff;
    background:linear-gradient(135deg,#19c982,#0a8955);
    box-shadow:0 8px 25px rgba(25,201,130,.22);
}

.hero-button.white{
    background:#fff;
    color:#111;
}

.hero-button:hover{
    transform:translateY(-2px);
}

/* ======================================================
   HERO SEARCH
====================================================== */

.hero-search{
    width:min(430px,100%);
    height:50px;
    margin-top:20px;
    display:flex;
    align-items:center;
    background:rgba(8,20,15,.95);
    border:1px solid rgba(239,210,143,.48);
    border-radius:11px;
    overflow:hidden;
    z-index:6;
}

.hero-search-icon{
    width:45px;
    display:flex;
    justify-content:center;
    align-items:center;
    color:#fff;
    font-size:18px;
}

.hero-search input{
    flex:1;
    height:100%;
    border:0;
    outline:0;
    background:transparent;
    color:#fff;
    font-size:13px;
    min-width:0;
}

.hero-search input::placeholder{
    color:#829088;
}

.hero-search button{
    width:43px;
    height:38px;
    margin-right:5px;
    border:0;
    border-radius:8px;
    background:linear-gradient(
        135deg,
        var(--gold),
        var(--gold-dark)
    );
    color:#0a0d0b;
    font-weight:900;
    cursor:pointer;
}

/* ======================================================
   SECTIONS
====================================================== */

.section{
    margin-top:45px;
}

.section-head{
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    padding-bottom:13px;
    margin-bottom:18px;
    border-bottom:1px solid rgba(239,210,143,.14);
    gap:15px;
}

.section-title{
    font-family:Montserrat,sans-serif;
    font-size:24px;
    font-weight:900;
    text-transform:uppercase;
}

.section-title span{
    color:var(--gold);
}

.section-link{
    color:var(--gold);
    font-size:12px;
    font-weight:900;
    white-space:nowrap;
}

/* ======================================================
   HOME SHIRT ROW
====================================================== */

.home-shirt-row{
    display:grid;
    grid-auto-flow:column;
    grid-auto-columns:245px;
    gap:15px;
    overflow-x:auto;
    padding-bottom:12px;
}

.home-shirt-row::-webkit-scrollbar{
    height:5px;
}

.home-shirt-row::-webkit-scrollbar-thumb{
    background:rgba(239,210,143,.3);
    border-radius:10px;
}

/* ======================================================
   EXPLORE FILTERS
====================================================== */

.explore-filters{
    display:flex;
    flex-wrap:wrap;
    align-items:center;
    gap:10px;
    margin-bottom:22px;
}

.filter-group{
    position:relative;
}

.filter-trigger{
    min-height:42px;
    padding:0 13px;
    display:flex;
    align-items:center;
    gap:8px;
    background:#030806;
    border:1px solid rgba(239,210,143,.25);
    color:#fff;
    border-radius:10px;
    font-size:12px;
    font-weight:800;
    cursor:pointer;
    transition:.2s;
}

.filter-trigger:hover,
.filter-trigger.open{
    border-color:var(--gold);
    background:#09160f;
}

.filter-arrow{
    color:var(--gold);
    font-size:9px;
    transition:.2s;
}

.filter-trigger.open .filter-arrow{
    transform:rotate(180deg);
}

.filter-count{
    min-width:18px;
    height:18px;
    padding:0 5px;
    display:none;
    align-items:center;
    justify-content:center;
    border-radius:99px;
    background:var(--gold);
    color:#000;
    font-size:9px;
    font-weight:900;
}

.filter-count.show{
    display:flex;
}

.filter-dropdown{
    position:absolute;
    z-index:200;
    top:calc(100% + 8px);
    left:0;
    width:245px;
    max-height:320px;
    overflow-y:auto;
    padding:9px;
    display:none;
    background:#08150f;
    border:1px solid rgba(239,210,143,.28);
    border-radius:13px;
    box-shadow:0 20px 50px rgba(0,0,0,.6);
}

.filter-dropdown.open{
    display:block;
}

.filter-dropdown::-webkit-scrollbar{
    width:5px;
}

.filter-dropdown::-webkit-scrollbar-thumb{
    background:rgba(239,210,143,.25);
    border-radius:10px;
}

.filter-option{
    display:flex;
    align-items:center;
    gap:9px;
    width:100%;
    padding:10px;
    border-radius:8px;
    color:#d5dfda;
    background:transparent;
    cursor:pointer;
    font-size:12px;
    font-weight:600;
}

.filter-option:hover{
    background:rgba(239,210,143,.08);
    color:#fff;
}

.filter-option input{
    width:16px;
    height:16px;
    accent-color:var(--gold);
    flex-shrink:0;
}

.filter-reset{
    min-height:42px;
    padding:0 13px;
    border-radius:10px;
    border:1px solid rgba(239,210,143,.18);
    background:rgba(255,255,255,.025);
    color:#96a49d;
    font-size:11px;
    font-weight:800;
    cursor:pointer;
}

.filter-reset:hover{
    color:#fff;
    border-color:var(--gold);
}

/* ======================================================
   EXPLORE GRID
====================================================== */

.explore-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(235px,1fr));
    gap:18px;
}

/* ======================================================
   SHIRTS
====================================================== */

.shirt-card{
    background:linear-gradient(180deg,#0b1913,#06100c);
    border:1px solid var(--line);
    border-radius:15px;
    overflow:hidden;
    transition:.28s;
}

.shirt-card:hover{
    transform:translateY(-5px);
    border-color:var(--gold);
    box-shadow:0 15px 35px rgba(0,0,0,.35);
}

.shirt-visual{
    position:relative;
    width:100%;
    aspect-ratio:1/1;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    background:radial-gradient(
        circle,
        #183c2a,
        #08150f 60%,
        #030805
    );
    font-size:64px;
}

.shirt-visual > img{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:contain;
    padding:10%;
}

.shirt-condition{
    position:absolute;
    top:9px;
    left:9px;
    z-index:3;
    color:var(--gold);
    padding:4px 8px;
    background:rgba(0,0,0,.75);
    border:1px solid rgba(239,210,143,.3);
    border-radius:15px;
    font-size:8px;
    font-weight:900;
}

.shirt-boost-badge{
    position:absolute;
    top:9px;
    right:9px;
    z-index:4;
    background:linear-gradient(135deg,var(--gold),var(--gold-dark));
    color:#000;
    padding:4px 8px;
    border-radius:15px;
    font-size:8px;
    font-weight:900;
}

.shirt-info{
    padding:14px;
}

.shirt-club{
    color:#83948c;
    font-size:9px;
    font-weight:900;
    text-transform:uppercase;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.shirt-name{
    color:#fff;
    font-size:13px;
    font-weight:900;
    margin-top:4px;
    min-height:36px;
    line-height:1.3;
}

.shirt-footer{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-top:12px;
    gap:8px;
}

.shirt-price{
    color:var(--green);
    font-size:14px;
    font-weight:900;
    white-space:nowrap;
}

.shirt-view{
    color:var(--gold);
    background:rgba(239,210,143,.07);
    border:1px solid rgba(239,210,143,.27);
    border-radius:7px;
    padding:6px 10px;
    font-size:9px;
    font-weight:900;
    cursor:pointer;
    transition:.2s;
}

.shirt-view:hover{
    background:var(--gold-dark);
    color:#000;
}

/* ======================================================
   EXPLORE BANNER
====================================================== */

.explore-banner{
    position:relative;
    width:100%;
    overflow:hidden;
    border-radius:20px;
    border:1px solid var(--line);
    background:#020504;
}

.explore-banner img{
    width:100%;
    height:auto;
    display:block;
    object-fit:contain;
    position:relative;
    z-index:1;
}

.explore-overlay{
    position:absolute;
    inset:0;
    z-index:2;
    display:flex;
    flex-direction:column;
    align-items:flex-start;
    justify-content:center;
    padding:clamp(28px,5vw,60px) clamp(20px,4.5vw,55px);
    background:linear-gradient(
        90deg,
        rgba(2,5,4,.9) 0%,
        rgba(2,5,4,.55) 45%,
        transparent 75%
    );
    pointer-events:none;
}

.explore-kicker{
    color:var(--gold);
    font-family:Montserrat,sans-serif;
    font-size:clamp(10px,1.1vw,12px);
    font-weight:900;
    letter-spacing:3px;
    text-transform:uppercase;
    margin-bottom:14px;
    display:flex;
    align-items:center;
    gap:10px;
}

.explore-kicker::before{
    content:"";
    width:26px;
    height:2px;
    background:var(--gold);
    display:inline-block;
}

.explore-title{
    font-family:Montserrat,sans-serif;
    font-size:clamp(32px,5.5vw,64px);
    line-height:1.05;
    font-weight:900;
    text-transform:uppercase;
    text-shadow:0 6px 30px rgba(0,0,0,.55);
}

.explore-title span{
    background:linear-gradient(
        135deg,
        var(--gold),
        var(--gold-dark)
    );
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
}

.explore-subtitle{
    margin-top:16px;
    max-width:460px;
    color:#d1dbd6;
    font-size:clamp(13px,1.4vw,15px);
    line-height:1.6;
}

/* ======================================================
   SEARCH OVERLAY
====================================================== */

.explore-search-overlay{
    position:absolute;
    left:4.4%;
    top:74.8%;
    width:44.8%;
    height:11.9%;
    z-index:3;
}

.explore-search-overlay input{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    padding-left:14%;
    padding-right:14%;
    background:transparent;
    border:0;
    outline:0;
    color:#fff;
    font-size:clamp(12px,1.5vw,15px);
}

.explore-search-overlay input::placeholder{
    color:rgba(255,255,255,.4);
}

.explore-search-overlay button{
    position:absolute;
    right:0;
    top:0;
    width:14%;
    height:100%;
    background:transparent;
    border:0;
    cursor:pointer;
}

/* ======================================================
   SELL
====================================================== */

.sell-box{
    max-width:680px;
    margin:50px auto;
    padding:40px clamp(20px,4vw,40px);
    text-align:left;
    background:#07130e;
    border:1px solid var(--line);
    border-radius:20px;
}

.sell-box h1{
    color:var(--gold);
    font-family:Montserrat,sans-serif;
    font-size:32px;
    text-align:center;
}

.sell-intro{
    color:#a8b5ae;
    line-height:1.7;
    margin:15px 0 30px;
    text-align:center;
    font-size:14px;
}

.form-group{
    margin-bottom:18px;
}

.form-group label{
    display:block;
    color:var(--gold);
    font-size:11px;
    font-weight:800;
    text-transform:uppercase;
    letter-spacing:.5px;
    margin-bottom:7px;
}

.form-group input[type=text],
.form-group input[type=number],
.form-group select,
.form-group textarea{
    width:100%;
    padding:13px 14px;
    background:#030806;
    border:1px solid rgba(239,210,143,.25);
    border-radius:10px;
    color:#fff;
    font-size:16px;
    outline:0;
}

.form-group textarea{
    resize:vertical;
    min-height:90px;
}

.form-group input:focus,
.form-group select:focus,
.form-group textarea:focus{
    border-color:var(--gold);
}

.form-row{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:14px;
}

.type-checkboxes{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
}

.type-checkbox-label{
    display:flex;
    align-items:center;
    gap:8px;
    font-size:13px;
    color:#fff;
    cursor:pointer;
    background:#030806;
    padding:8px 12px;
    border:1px solid rgba(239,210,143,.25);
    border-radius:8px;
}

.type-checkbox-label input{
    accent-color:var(--gold);
    width:16px;
    height:16px;
}

.photo-dropzone{
    border:2px dashed rgba(239,210,143,.35);
    border-radius:14px;
    padding:26px 16px;
    text-align:center;
    cursor:pointer;
    color:#a8b5ae;
    font-size:13px;
    transition:.2s;
}

.photo-dropzone:hover,
.photo-dropzone.dragover{
    border-color:var(--gold);
    color:var(--gold);
    background:rgba(239,210,143,.05);
}

.photo-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(80px,1fr));
    gap:10px;
    margin-top:14px;
}

.photo-thumb{
    position:relative;
    aspect-ratio:1/1;
    border-radius:10px;
    overflow:hidden;
    border:1px solid var(--line);
}

.photo-thumb img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.photo-thumb button{
    position:absolute;
    top:4px;
    right:4px;
    width:22px;
    height:22px;
    border-radius:50%;
    border:0;
    background:rgba(0,0,0,.8);
    color:#fff;
    font-size:13px;
    cursor:pointer;
}

.boost-box{
    display:flex;
    align-items:flex-start;
    gap:12px;
    padding:14px;
    margin-bottom:14px;
    border:1px solid rgba(239,210,143,.3);
    border-radius:12px;
    background:rgba(239,210,143,.05);
}

.boost-box input{
    margin-top:3px;
    width:18px;
    height:18px;
    accent-color:var(--gold);
}

.boost-box-text strong{
    color:var(--gold);
    display:block;
    font-size:13px;
    margin-bottom:3px;
}

.boost-box-text span{
    color:#a8b5ae;
    font-size:12px;
    line-height:1.5;
}

.boost-options{
    display:flex;
    flex-direction:column;
    gap:10px;
}

.boost-option{
    display:flex;
    align-items:center;
    gap:12px;
    padding:13px 14px;
    border:1px solid rgba(239,210,143,.22);
    border-radius:12px;
    cursor:pointer;
    background:rgba(255,255,255,.02);
    transition:.15s;
}

.boost-option input[type=radio]{
    width:18px;
    height:18px;
    accent-color:var(--gold);
}

.boost-option-text{
    flex:1;
}

.boost-option-text strong{

<div id="google_translate_element"></div>

<script>
/*
   The site's own text is written in Dutch (nl).
   English is the default language shown to visitors,
   so on first visit (no saved preference yet) we
   translate straight to English before Google's
   widget even loads. On every load we make sure the
   googtrans cookie matches the saved preference,
   since that cookie is what the widget reads.
*/

(function(){

    var savedLang=
        localStorage.getItem("fsm_language");

    if(!savedLang){
        savedLang="en";
        localStorage.setItem(
            "fsm_language",
            savedLang
        );
    }

    document.cookie=
        "googtrans=; expires=Thu, 01 Jan 1970 00:00:00 GMT; path=/;";

    if(savedLang!=="nl"){
        document.cookie=
            "googtrans=/nl/"+savedLang+"; path=/;";
    }

})();

function googleTranslateElementInit(){

    new google.translate.TranslateElement(
        {
            pageLanguage:"nl",
            autoDisplay:false
        },
        "google_translate_element"
    );

}
</script>

/* ======================================================
   LOCAL STORAGE LISTINGS
====================================================== */

const LISTINGS_KEY="fsm_user_listings";


function getListings(){

    try{
        const data=
            JSON.parse(
                localStorage.getItem(LISTINGS_KEY)
            );

        return Array.isArray(data)
            ? data
            : [];

    }catch(error){

        return [];

    }

}


function saveListings(list){

    try{

        localStorage.setItem(
            LISTINGS_KEY,
            JSON.stringify(list)
        );

        return true;

    }catch(error){

        return false;

    }

}


/* ======================================================
   ESCAPE HTML
====================================================== */

function escapeHtml(str){

    return String(str)
        .replace(
            /[&<>"']/g,
            character=>({

                "&":"&amp;",
                "<":"&lt;",
                ">":"&gt;",
                '"':"&quot;",
                "'":"&#39;"

            }[character])
        );

}


/* ======================================================
   COMBINE SHIRTS
====================================================== */

function combinedShirts(){

    const listings=getListings();

    const now=Date.now();

    let changed=false;


    listings.forEach(listing=>{

        if(
            listing.boosted &&
            listing.boostExpiresAt &&
            listing.boostExpiresAt <= now
        ){

            listing.boosted=false;

            changed=true;

        }

    });


    if(changed){
        saveListings(listings);
    }


    const userShirts=
        listings.map(listing=>({

            id:"u"+listing.id,

            club:listing.club,

            name:listing.name,

            price:listing.price,

            condition:listing.condition,

            size:listing.size,

            type:listing.type || ["Club"],

            icon:"👕",

            image:
                listing.images &&
                listing.images.length
                    ? listing.images[0]
                    : null,

            boosted:!!listing.boosted

        }));


    const boosted=
        userShirts
            .filter(shirt=>shirt.boosted);


    const normal=
        userShirts
            .filter(shirt=>!shirt.boosted);


    return [
        ...boosted,
        ...normal,
        ...shirtsData
    ];

}


/* ======================================================
   SHIRT CARD
====================================================== */

function makeShirt(shirt){

    const visual=
        shirt.image
        ? `
            <img
                src="${shirt.image}"
                alt="${escapeHtml(shirt.name)}"
            >
          `
        : `
            <div>👕</div>
          `;


    return `

<article class="shirt-card">

    <div class="shirt-visual">

        <div class="shirt-condition">
            ${escapeHtml(shirt.condition)}
        </div>

        ${
            shirt.boosted
            ? `<div class="shirt-boost-badge">BOOST</div>`
            : ""
        }

        ${visual}

    </div>


    <div class="shirt-info">

        <div class="shirt-club">
            ${shirt.icon}
            ${escapeHtml(shirt.club)}
        </div>


        <div class="shirt-name">
            ${escapeHtml(shirt.name)}
        </div>


        <div class="shirt-footer">

            <div class="shirt-price">
                ${escapeHtml(shirt.price)}
            </div>

            <button
                class="shirt-view"
                data-club="${escapeHtml(shirt.club)}"
                data-price="${escapeHtml(shirt.price)}"
            >
                Bekijken
            </button>

        </div>

    </div>

</article>

`;

}

    /* ======================================
       PHOTO UPLOAD
    ====================================== */

    const photoDropzone=
        document.getElementById(
            "photoDropzone"
        );


    const photoInput=
        document.getElementById(
            "photoInput"
        );


    const photoGrid=
        document.getElementById(
            "photoGrid"
        );


    let selectedImages=[];


    photoDropzone.addEventListener(
        "click",
        ()=>{
            photoInput.click();
        }
    );


    photoInput.addEventListener(
        "change",
        ()=>{
            processFiles(
                Array.from(
                    photoInput.files
                )
            );
        }
    );


    function processFiles(files){

        const remaining=
            5-selectedImages.length;


        if(remaining<=0){
            return;
        }


        files
            .slice(0,remaining)
            .forEach(file=>{

                if(!file.type.startsWith("image/")){
                    return;
                }


                const reader=
                    new FileReader();


                reader.onload=event=>{

                    selectedImages.push(
                        event.target.result
                    );


                    renderPhotos();

                };


                reader.readAsDataURL(file);

            });

    }


    function renderPhotos(){

        photoGrid.innerHTML=
            selectedImages
                .map(
                    (src,index)=>`

<div class="photo-thumb">

<img
src="${src}"
alt="Foto ${index+1}"
>

<button
type="button"
data-photo-index="${index}"
>
×
</button>

</div>

`
                )
                .join("");


        photoGrid
            .querySelectorAll(
                "[data-photo-index]"
            )
            .forEach(button=>{

                button.addEventListener(
                    "click",
                    ()=>{

                        selectedImages.splice(
                            Number(
                                button.dataset.photoIndex
                            ),
                            1
                        );

                        renderPhotos();

                    }
                );

            });

    }


    /* ======================================
       FORM
    ====================================== */

    const form=
        document.getElementById(
            "sellForm"
        );


    form.addEventListener(
        "submit",
        event=>{

            event.preventDefault();


            const club=
                document.getElementById(
                    "sellClub"
                ).value.trim();


            const priceRaw=
                document.getElementById(
                    "sellPrice"
                ).value;


            const name=
                document.getElementById(
                    "sellName"
                ).value.trim();


            const condition=
                document.getElementById(
                    "sellCondition"
                ).value;


            const size=
                document.getElementById(
                    "sellMaat"
                ).value;


            const description=
                document.getElementById(
                    "sellDescription"
                ).value.trim();


            if(
                !club ||
                !priceRaw ||
                !name ||
                !condition
            ){

                alert(
                    "Vul alle verplichte velden in."
                );

                return;

            }


            if(
                selectedImages.length===0
            ){

                document
                    .getElementById(
                        "photoError"
                    )
                    .classList.add("show");

                return;

            }


            document
                .getElementById(
                    "photoError"
                )
                .classList.remove("show");


            const boost=
                document
                    .querySelector(
                        'input[name="boostOption"]:checked'
                    );


            let boosted=false;
            let boostExpiresAt=null;


            if(
                boost &&
                boost.value!=="none"
            ){

                boosted=true;


                boostExpiresAt=
                    Date.now()+
                    (
                        boost.value==="24h"
                        ?24*60*60*1000
                        :7*24*60*60*1000
                    );

            }


            const selectedTypes=
                Array.from(
                    document.querySelectorAll(
                        'input[name="sellType"]:checked'
                    )
                )
                .map(
                    checkbox=>checkbox.value
                );


            const newShirt={

                id:Date.now(),

                club:club,

                price:
                    "€ "+
                    parseFloat(priceRaw)
                    .toFixed(2)
                    .replace(".",","),

                name:name,

                condition:condition,

                size:size,

                type:
                    selectedTypes.length
                    ?selectedTypes
                    :["Club"],

                description:description,

                boosted:boosted,

                boostExpiresAt:boostExpiresAt,

                images:selectedImages

            };


            const listings=
                getListings();


            listings.push(
                newShirt
            );


            saveListings(
                listings
            );


            showToast(
                "Shirt succesvol geplaatst!"
            );


            setTimeout(
                ()=>{
                    location.hash="#/explore";
                },
                400
            );

        }
    );

}


/* ======================================================
   TOAST
====================================================== */

function showToast(message){

    const element=
        document.getElementById(
            "toast"
        );


    element.textContent=
        message;


    element.classList.add("show");


    clearTimeout(
        window.toastTimeout
    );


    window.toastTimeout=
        setTimeout(
            ()=>{
                element.classList.remove("show");
            },
            2500
        );

}


/* ======================================================
   BUTTON HANDLING
====================================================== */

app.addEventListener(
    "click",
    event=>{

        const button=
            event.target.closest(
                ".shirt-view"
            );


        if(!button){
            return;
        }


        showToast(
            button.dataset.club+
            " • "+
            button.dataset.price
        );

    }
);


/* ======================================================
   NAVIGATION
====================================================== */

function updateNav(){

    const hash=
        location.hash || "#/";


    document
        .querySelectorAll("nav a")
        .forEach(
            link=>
                link.classList.remove("active")
        );


    if(
        hash.startsWith(
            "#/explore"
        )
    ){

        document
            .getElementById("navExplore")
            ?.classList.add("active");

    }

    else if(
        hash.startsWith(
            "#/sell"
        )
    ){

        document
            .getElementById("navSell")
            ?.classList.add("active");

    }

    else{

        document
            .getElementById("navHome")
            ?.classList.add("active");

    }


    document
        .getElementById("mobileNav")
        ?.classList.remove("open");

}


/* ======================================================
   ROUTER
====================================================== */

function router(){

    updateNav();


    const hash=
        location.hash || "#/";


    if(
        hash.startsWith("#/explore")
    ){

        renderExplore();

    }

    else if(
        hash.startsWith("#/sell")
    ){

        renderSell();

    }

    else{

        renderHome();

    }

}


window.addEventListener(
    "hashchange",
    router
);


/* ======================================================
   MOBILE MENU
====================================================== */

document
    .getElementById("menuButton")
    .addEventListener(
        "click",
        ()=>{
            document
                .getElementById("mobileNav")
                .classList.toggle("open");
        }
    );


document
    .querySelectorAll(
        "#mobileNav a"
    )
    .forEach(link=>{

        link.addEventListener(
            "click",
            ()=>{
                document
                    .getElementById("mobileNav")
                    .classList.remove("open");
            }
        );

    });


/* ======================================================
   LANGUAGE
====================================================== */

const langBtn=
    document.getElementById(
        "languageButton"
    );


const langModal=
    document.getElementById(
        "languageModal"
    );


const langClose=
    document.getElementById(
        "languageClose"
    );


const langList=
    document.getElementById(
        "languageList"
    );


const langSearch=
    document.getElementById(
        "languageSearch"
    );


let activeLang=
    localStorage.getItem(
        "fsm_language"
    ) || "en";


function renderLanguages(
    query=""
){

    const q=
        query
            .toLowerCase()
            .trim();


    const filtered=
        languages.filter(
            language=>
                language.name
                    .toLowerCase()
                    .includes(q)
                ||
                language.code
                    .toLowerCase()
                    .includes(q)
        );


    langList.innerHTML=
        filtered
            .map(
                language=>`

<button
type="button"
class="language-item ${
    language.code===activeLang
    ?"active"
    :""
}"
data-code="${language.code}"
>

<span class="language-flag">
${language.flag}
</span>

<span>
${language.name}
</span>

</button>

`
            )
            .join("");


}


langBtn.addEventListener(
    "click",
    ()=>{

        renderLanguages();

        langModal.classList.add(
            "open"
        );

        setTimeout(
            ()=>{
                langSearch.focus();
            },
            100
        );

    }
);


langClose.addEventListener(
    "click",
    ()=>{

        langModal.classList.remove(
            "open"
        );

    }
);


langSearch.addEventListener(
    "input",
    event=>{

        renderLanguages(
            event.target.value
        );

    }
);


langList.addEventListener(
    "click",
    event=>{

        const button=
            event.target.closest(
                ".language-item"
            );


        if(!button){
            return;
        }


        activeLang=
            button.dataset.code;


        localStorage.setItem(
            "fsm_language",
            activeLang
        );


        /*
           Google Translate cookie
           (site's own text is Dutch, so we always
           translate FROM nl)
        */

        document.cookie=
            "googtrans=; expires=Thu, 01 Jan 1970 00:00:00 GMT; path=/;";


        if(
            activeLang!=="nl"
        ){

            document.cookie=
                "googtrans=/nl/"+
                activeLang+
                "; path=/;";

        }


        langModal.classList.remove(
            "open"
        );


        location.reload();

    }
);


/* ======================================================
   CURRENT LANGUAGE BUTTON
====================================================== */

function updateLanguageButton(){

    const language=
        languages.find(
            item=>item.code===activeLang
        )
        ||
        languages.find(
            item=>item.code==="nl"
        );


    if(!language){
        return;
    }


    document
        .getElementById(
            "currentFlag"
        )
        .textContent=
            language.flag;


    document
        .getElementById(
            "currentCode"
        )
        .textContent=
            language.code
                .split("-")[0]
                .toUpperCase();

}


/* ======================================================
   CLOSE LANGUAGE MODAL WHEN CLICKING OUTSIDE
====================================================== */

langModal.addEventListener(
    "click",
    event=>{

        if(
            event.target===
            langModal
        ){

            langModal.classList.remove(
                "open"
            );

        }

    }
);


/* ======================================================
   ESCAPE KEY
====================================================== */

document.addEventListener(
    "keydown",
    event=>{

        if(
            event.key==="Escape"
        ){

            langModal.classList.remove(
                "open"
            );


            document
                .querySelectorAll(
                    ".filter-dropdown"
                )
                .forEach(
                    menu=>
                        menu.classList.remove("open")
                );


            document
                .querySelectorAll(
                    ".filter-trigger"
                )
                .forEach(
                    button=>
                        button.classList.remove("open")
                );

        }

    }
);


/* ======================================================
   INIT
====================================================== */

updateLanguageButton();

renderLanguages();

router();

</script>

.fsm-actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:16px}.fsm-btn{border:0;border-radius:11px;padding:12px 16px;font-weight:900;cursor:pointer}.fsm-btn.green{background:linear-gradient(135deg,#19c982,#0a8955);color:#fff}.fsm-btn.gold{background:linear-gradient(135deg,var(--gold),var(--gold-dark));color:#080b09}.fsm-btn.dark{background:#07130e;color:#fff;border:1px solid var(--line)}
.fsm-form{display:grid;gap:12px}.fsm-form input,.fsm-form textarea,.fsm-form select{width:100%;padding:13px;background:#030806;border:1px solid rgba(239,210,143,.25);border-radius:10px;color:#fff;outline:0}.fsm-form input:focus,.fsm-form textarea:focus{border-color:var(--gold)}
.fsm-order{display:grid;gap:10px;padding:15px;border:1px solid rgba(239,210,143,.16);border-radius:14px;background:#07120d;margin-bottom:12px}.fsm-status{display:inline-flex;width:max-content;padding:5px 9px;border-radius:99px;background:rgba(24,191,119,.12);color:#5ee6aa;font-size:10px;font-weight:900}
.fsm-chat-list{display:grid;gap:8px}.fsm-chat-row{display:flex;gap:12px;align-items:center;padding:14px;border:1px solid rgba(239,210,143,.12);border-radius:14px;background:#07120d;cursor:pointer}.fsm-mini-avatar{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:#123624;color:var(--gold);font-weight:900}
.fsm-chat{display:flex;flex-direction:column;gap:10px;min-height:55vh}.fsm-messages{display:flex;flex-direction:column;gap:8px;flex:1}.fsm-msg{max-width:78%;padding:10px 12px;border-radius:14px;background:#10231a;color:#eaf1ed}.fsm-msg.mine{align-self:flex-end;background:linear-gradient(135deg,#128b59,#0b6f49)}.fsm-system{align-self:center;max-width:90%;text-align:center;background:#0b1711;border:1px solid rgba(239,210,143,.18);color:#cfd9d4;font-size:11px}.fsm-msg-tools{margin-top:7px;display:flex;gap:10px;font-size:10px;color:var(--gold)}.fsm-msg-tools button{border:0;background:none;color:var(--gold);padding:0;cursor:pointer}.fsm-chat-input{display:flex;gap:8px}.fsm-chat-input input{flex:1;padding:12px;border-radius:12px;border:1px solid var(--line);background:#030806;color:#fff}
.fsm-pay-method{display:flex;align-items:center;gap:12px;padding:14px;border:1px solid var(--line);border-radius:13px;background:#07120d}.fsm-card-logo{font-weight:900;color:var(--gold)}
.fsm-note{padding:11px 13px;border-radius:11px;background:rgba(239,210,143,.06);border:1px solid rgba(239,210,143,.15);color:#cbd5d0;font-size:11px;line-height:1.5}
.fsm-review{padding:15px;border:1px solid rgba(239,210,143,.12);border-radius:14px;margin-top:10px;background:#07120d}
.fsm-bottom-nav{display:none}
@media(max-width:650px){
 .fsm-page{padding:16px 10px 88px}.fsm-card{padding:15px}.fsm-grid{grid-template-columns:1fr}.fsm-products{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.fsm-product-img{height:135px;font-size:50px}.fsm-top h1{font-size:20px}.fsm-bottom-nav{position:fixed;left:0;right:0;bottom:0;z-index:3500;display:grid;grid-template-columns:repeat(5,1fr);background:#030806;border-top:1px solid rgba(239,210,143,.16);padding:7px 5px calc(7px + env(safe-area-inset-bottom));box-shadow:0 -12px 35px rgba(0,0,0,.45)}.fsm-bottom-nav a{color:#8c9b94;text-align:center;font-size:9px;font-weight:800;padding:5px 2px}.fsm-bottom-nav a.active{color:#20d894}.fsm-bottom-nav b{display:block;font-size:16px;margin-bottom:2px}.fsm-msg{max-width:88%}
}
</style>

<script id="fsm-marketplace-extension-script">
(function(){
  const FSM_KEY="fsm_marketplace_demo_v1";
  const CURRENCIES={EUR:{locale:"nl-BE"},GBP:{locale:"en-GB"},USD:{locale:"en-US"}};
  let demoState;
  try{demoState=JSON.parse(localStorage.getItem(FSM_KEY)||"{}")}catch(e){demoState={}}
  Object.assign(demoState,{wallet:demoState.wallet||0,orders:demoState.orders||[],favorites:demoState.favorites||[],messages:demoState.messages||[],reviews:demoState.reviews||[],paymentMethods:demoState.paymentMethods||[],offers:demoState.offers||[]});
  function save(){localStorage.setItem(FSM_KEY,JSON.stringify(demoState))}
  function esc(s){return typeof escapeHtml==="function"?escapeHtml(String(s??"")):String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
  function money(v,c){return new Intl.NumberFormat((CURRENCIES[c]||CURRENCIES.EUR).locale,{style:"currency",currency:c||"EUR"}).format(Number(v)||0)}
  function toast(m){if(typeof showToast==="function")showToast(m);else alert(m)}
  function api(path,options={}){return fetch(path,{credentials:"include",headers:{"Content-Type":"application/json"},...options}).then(r=>{if(!r.ok)throw Error(r.status);return r.json()})}
  function currencyFor(){return localStorage.getItem("fsm_currency")||"EUR"}
  function shirtById(id){return typeof combinedShirts==="function"?combinedShirts().find(x=>String(x.id)===String(id)):null}
  function parsePrice(p){return Number(String(p).replace(/[^\d,.-]/g,"").replace(/\./g,"").replace(",", "."))||0}
  function shell(title,body){
    app.innerHTML=`<div class="page"><div class="fsm-page"><div class="fsm-top"><button class="fsm-back" onclick="history.back()">←</button><h1>${esc(title)}</h1></div>${body}</div></div>`;
    if(!document.querySelector(".fsm-bottom-nav"))document.body.insertAdjacentHTML("beforeend",`<nav class="fsm-bottom-nav"><a href="#/"><b>⌂</b>Home</a><a href="#/explore"><b>⌕</b>Bladeren</a><a href="#/sell"><b>＋</b>Verkopen</a><a href="#/inbox"><b>✉</b>Inbox</a><a href="#/profile"><b>●</b>Profiel</a></nav>`);
  }
  function renderProfile(){
    shell("Profiel",`<div class="fsm-card"><div class="fsm-profile-head"><div class="fsm-avatar">L</div><div><strong style="font-size:20px">lousamyn</strong><div class="fsm-sub">Actief op Football-Shirt-Market</div></div></div><div class="fsm-actions"><a class="fsm-btn dark" href="#/profile/public">Mijn advertenties bekijken</a></div></div>
    <div class="fsm-card" style="margin-top:14px"><strong>Verdiende badges</strong><div class="fsm-sub" style="margin-top:5px">0 van 2</div><div class="fsm-progress"><i></i></div></div>
    <div class="fsm-grid" style="margin-top:14px"><button class="fsm-menu" data-go="#/favorites"><strong>♡ Mijn favorieten</strong><span>→</span></button><button class="fsm-menu" data-go="#/wallet"><strong>€ Mijn portemonnee</strong><span>→</span></button><button class="fsm-menu" data-go="#/orders"><strong>▣ Mijn bestellingen</strong><span>→</span></button><button class="fsm-menu" data-go="#/promote"><strong>✦ Advertenties promoten</strong><span>→</span></button></div>
    <div class="fsm-actions"><a class="fsm-btn dark" href="#/badges">◉ Badges</a></div>`);
  }
  function renderPublic(tab="items"){
    const reviews=demoState.reviews.filter(r=>r.user==="lousamyn");
    shell("lousamyn",`<div class="fsm-card"><div class="fsm-profile-head"><div class="fsm-avatar">L</div><div><strong style="font-size:20px">lousamyn</strong><div class="fsm-sub">Football-Shirt-Market</div></div></div>
      <div class="fsm-tabs"><button class="fsm-tab ${tab==="items"?"active":""}" data-tab="items">Advertenties</button><button class="fsm-tab ${tab==="reviews"?"active":""}" data-tab="reviews">Reviews</button><button class="fsm-tab ${tab==="about"?"active":""}" data-tab="about">Over mij</button></div>
      ${tab==="items"?`<div class="fsm-note"><strong>Verhoog je zichtbaarheid</strong><br>Promoot je items. Vergroot je verkoopkansen.</div><p class="fsm-sub" style="margin:15px 0 8px">${typeof getListings==="function"?getListings().length:0} advertenties</p><div class="fsm-products">${(typeof getListings==="function"?getListings():[]).map(x=>`<article class="fsm-product"><div class="fsm-product-img">${x.images?.[0]?`<img src="${esc(x.images[0])}" style="width:100%;height:100%;object-fit:contain">`:"👕"}</div><div class="fsm-product-info"><strong>${esc(x.name)}</strong><div class="fsm-price">${esc(x.price)}</div><button class="fsm-btn gold" style="margin-top:8px;padding:8px 10px">Boosten</button></div></article>`).join("")||`<div class="fsm-empty" style="grid-column:1/-1">Nog geen advertenties.</div>`}</div>`:
      tab==="reviews"?(reviews.length?reviews.map(r=>`<div class="fsm-review"><strong>${esc(r.author)}</strong> <span class="fsm-stars">${"★".repeat(r.stars)}${"☆".repeat(5-r.stars)}</span><div class="fsm-sub">${esc(r.text)}</div></div>`).join(""):`<div class="fsm-empty"><strong>Nog geen reviews</strong><br>Reviews verschijnen na een afgeronde bestelling.</div>`):
      `<div class="fsm-card"><strong>Over mij</strong><p class="fsm-sub" style="margin-top:8px">Verzamelaar van voetbalshirts.</p><p class="fsm-sub">✓ E-mail geverifieerd</p></div>`}</div>`);
    document.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>renderPublic(b.dataset.tab));
  }
  function renderBadges(){shell("Badges",`<div class="fsm-card"><h2 style="color:var(--gold);font-family:Montserrat">Goed bezig! 1 artikel geüpload</h2><p class="fsm-sub" style="margin-top:8px">Ga zo door om je badge te verdienen.</p><div class="fsm-progress"><i style="width:50%"></i></div><div class="fsm-actions"><a href="#/sell" class="fsm-btn green">Nieuwe advertentie maken</a></div></div><div class="fsm-card" style="margin-top:12px"><h2 style="color:var(--gold);font-family:Montserrat">Best snel: je verzendt binnen 3 dagen</h2><p class="fsm-sub" style="margin-top:8px">Verzend je bestellingen iets sneller om deze badge te verdienen.</p><div class="fsm-progress"><i></i></div></div>`)}
  function renderFavorites(){const fav=demoState.favorites.map(shirtById).filter(Boolean);shell("Mijn favorieten",`<div class="fsm-products">${fav.map(x=>`<article class="fsm-product"><div class="fsm-product-img">${x.icon||"👕"}</div><div class="fsm-product-info"><strong>${esc(x.club)}</strong><div class="fsm-sub">${esc(x.name)}</div><div class="fsm-price">${esc(x.price)}</div></div></article>`).join("")||`<div class="fsm-empty" style="grid-column:1/-1">Je hebt nog geen favorieten.</div>`}</div>`)}
  function renderWallet(){shell("Mijn portemonnee",`<div class="fsm-card"><div class="fsm-sub">Saldo in behandeling</div><div style="font-size:30px;font-weight:900;margin:7px 0">${money(0,currencyFor())}</div></div><div class="fsm-card" style="margin-top:12px"><div class="fsm-sub">Beschikbaar saldo</div><div style="font-size:30px;font-weight:900;color:var(--green);margin:7px 0">${money(demoState.wallet,currencyFor())}</div><div class="fsm-actions"><button class="fsm-btn green" id="withdrawBtn">Uitbetalen</button><a class="fsm-btn gold" href="#/explore">Shoppen</a></div></div><div class="fsm-card" style="margin-top:12px"><strong>Betaalmethode</strong><div style="margin-top:10px">${demoState.paymentMethods.length?`<div class="fsm-pay-method"><span class="fsm-card-logo">CARD</span>•••• ${esc(demoState.paymentMethods[0].last4)}</div>`:`<div class="fsm-sub">Nog geen kaart toegevoegd.</div>`}</div><div class="fsm-actions"><a href="#/payment-method" class="fsm-btn gold">Kaart toevoegen</a></div></div>`);document.getElementById("withdrawBtn").onclick=()=>toast("Uitbetaling wordt via de backend gestart.")}
  function renderPaymentMethod(){shell("Kaart toevoegen",`<div class="fsm-card"><p class="fsm-note">Voor echte betalingen worden kaartgegevens door een beveiligde betaalprovider verwerkt. F-S-M bewaart alleen een gemaskeerd kaartkenmerk, zoals de laatste 4 cijfers.</p><form class="fsm-form" id="cardForm" style="margin-top:15px"><input required inputmode="numeric" maxlength="19" placeholder="Kaartnummer" autocomplete="cc-number"><div class="fsm-grid"><input required maxlength="5" placeholder="MM/YY" autocomplete="cc-exp"><input required maxlength="4" placeholder="CVC" autocomplete="cc-csc"></div><input required placeholder="Naam op kaart" autocomplete="cc-name"><button class="fsm-btn gold">Kaart veilig koppelen</button></form></div>`);document.getElementById("cardForm").onsubmit=e=>{e.preventDefault();const n=e.target.elements[0].value.replace(/\D/g,"");if(n.length<12)return toast("Vul een geldige kaart in.");demoState.paymentMethods=[{last4:n.slice(-4)}];save();toast("Kaart gekoppeld.");location.hash="#/wallet"}}
  function renderOrders(){shell("Mijn bestellingen",`<div class="fsm-tabs"><button class="fsm-tab active">Verkocht</button><button class="fsm-tab">Gekocht</button></div><div class="fsm-actions" style="margin-bottom:14px"><span class="fsm-status">Alles</span><span class="fsm-status">In behandeling</span><span class="fsm-status">Geannuleerd</span><span class="fsm-status">Voltooid</span></div>${demoState.orders.length?demoState.orders.map(o=>`<div class="fsm-order"><strong>${esc(o.itemName)}</strong><span>${money(o.amount,o.currency)}</span><span class="fsm-status">${esc(o.status)}</span><a class="fsm-btn dark" href="#/order/${esc(o.id)}">Bestelling bekijken</a></div>`).join(""):`<div class="fsm-empty">📦<br><strong>Je hebt nog geen bestellingen</strong><br>Als je iets verkoopt, zie je het hier staan.</div>`}`)}
  function renderPromote(){shell("Promoot je advertenties",`<div class="fsm-card"><h2 style="color:var(--gold);font-family:Montserrat">Val op met Spotlights</h2><p class="fsm-sub" style="margin-top:7px">Geef al je advertenties meer zichtbaarheid.</p><div class="fsm-actions"><button class="fsm-btn gold" data-promo="spotlight">Spotlight kiezen</button></div></div><div class="fsm-card" style="margin-top:12px"><h2 style="color:var(--gold);font-family:Montserrat">Boost je artikelen</h2><p class="fsm-sub" style="margin-top:7px">Zet een artikel bovenaan de feed. Bereik potentiële kopers en krijg inzichten in je verkopen.</p><div class="fsm-actions"><button class="fsm-btn dark" data-promo="3-local">3 dagen lokaal</button><button class="fsm-btn dark" data-promo="3-int">3 dagen internationaal</button><button class="fsm-btn dark" data-promo="7-local">7 dagen lokaal</button><button class="fsm-btn dark" data-promo="7-int">7 dagen internationaal</button></div></div>`);document.querySelectorAll("[data-promo]").forEach(b=>b.onclick=()=>toast(b.textContent+" geselecteerd — betaling wordt via de backend gestart."))}
  function renderProduct(id){const s=shirtById(id);if(!s){location.hash="#/explore";return}const amount=parsePrice(s.price),cur=currencyFor();shell(s.club,`<div class="fsm-card"><div class="fsm-product-img" style="height:300px">${s.image?`<img src="${esc(s.image)}" style="width:100%;height:100%;object-fit:contain">`:esc(s.icon||"👕")}</div><h2 style="margin-top:15px">${esc(s.name)}</h2><p class="fsm-sub">${esc(s.condition)} • maat ${esc(s.size||"—")}</p><div class="fsm-price" style="font-size:24px;margin-top:10px">${money(amount,cur)}</div><div class="fsm-actions"><button class="fsm-btn green" id="buyNow">Koop nu</button><button class="fsm-btn gold" id="offerBtn">Bod doen</button><button class="fsm-btn dark" id="favBtn">♡ Favoriet</button></div><div class="fsm-note" style="margin-top:15px">Bij een geaccepteerd bod wordt de geaccepteerde biedprijs de aankoopprijs.</div></div>`);document.getElementById("buyNow").onclick=()=>renderCheckout({shirt:s,amount,currency:cur,source:"buy"});document.getElementById("offerBtn").onclick=()=>{const v=prompt("Jouw bod ("+cur+")");if(v&&Number(v)>0)submitOffer(s,Number(v),cur)};document.getElementById("favBtn").onclick=()=>{demoState.favorites=demoState.favorites.includes(s.id)?demoState.favorites.filter(x=>x!==s.id):[...demoState.favorites,s.id];save();toast("Favorieten bijgewerkt.")}}
  function submitOffer(s,amount,currency){const o={id:"offer_"+Date.now(),shirtId:s.id,amount,currency,status:"pending",seller:"lousamyn"};demoState.offers.push(o);save();api("/api/offers",{method:"POST",body:JSON.stringify(o)}).catch(()=>null);toast("Bod verzonden.")}
  function renderCheckout(d){shell("Betaling",`<div class="fsm-card"><div class="fsm-sub">Bestelling</div><h2 style="margin-top:5px">${esc(d.shirt.name)}</h2><div class="fsm-price" style="font-size:25px;margin-top:8px">${money(d.amount,d.currency)}</div>${d.source==="offer"?`<div class="fsm-note" style="margin-top:12px">Dit is de geaccepteerde biedprijs. De oorspronkelijke prijs wordt niet gebruikt.</div>`:""}<div class="fsm-pay-method" style="margin-top:15px"><span class="fsm-card-logo">CARD</span>${demoState.paymentMethods.length?"•••• "+esc(demoState.paymentMethods[0].last4):"Nog geen kaart"}<a href="#/payment-method" style="margin-left:auto;color:var(--gold);font-weight:900">Wijzigen</a></div><div class="fsm-actions"><button class="fsm-btn green" id="payBtn">Betalen ${money(d.amount,d.currency)}</button></div><p class="fsm-note" style="margin-top:12px">Voor echte betalingen opent de backend hier een beveiligde checkout van de betaalprovider.</p></div>`);document.getElementById("payBtn").onclick=()=>completePurchase(d)}
  function completePurchase(d){const o={id:"order_"+Date.now(),itemId:d.shirt.id,itemName:d.shirt.name,amount:d.amount,currency:d.currency,status:"In behandeling",trackingUrl:"/track?orderId=",seller:"lousamyn",buyer:localStorage.getItem("fsm_user")||"lousamyn",createdAt:new Date().toISOString()};o.trackingUrl="/track?orderId="+encodeURIComponent(o.id);demoState.orders.unshift(o);save();api("/api/payments/create-checkout",{method:"POST",body:JSON.stringify({orderId:o.id,amount:o.amount,currency:o.currency,itemId:o.itemId})}).then(r=>{if(r?.checkoutUrl)location.href=r.checkoutUrl}).catch(()=>{toast("Demo-bestelling aangemaakt. Koppel de backend voor echte betaling.");location.hash="#/order/"+o.id})}
  function renderOrder(id){const o=demoState.orders.find(x=>x.id===id);if(!o){location.hash="#/orders";return}shell("Bestelling",`<div class="fsm-order"><strong>${esc(o.itemName)}</strong><div class="fsm-price">${money(o.amount,o.currency)}</div><span class="fsm-status">${esc(o.status)}</span><a class="fsm-btn dark" href="${esc(o.trackingUrl)}">📦 Track je pakket</a>${o.status==="In behandeling"?`<button class="fsm-btn green" id="ship">Markeer als verzonden</button>`:""}${o.status==="Afgeleverd"?`<button class="fsm-btn green" id="received">Bestelling ontvangen</button><button class="fsm-btn dark" id="issue">Er is een probleem</button>`:""}${o.status==="Voltooid"?`<button class="fsm-btn gold" id="review">Feedback geven</button>`:""}</div>`);const s=document.getElementById("ship");if(s)s.onclick=()=>setStatus(o,"Verzonden");const r=document.getElementById("received");if(r)r.onclick=()=>setStatus(o,"Voltooid");const i=document.getElementById("issue");if(i)i.onclick=()=>{toast("Probleem gemeld.");api("/api/orders/"+o.id+"/issue",{method:"POST"}).catch(()=>null)};const v=document.getElementById("review");if(v)v.onclick=()=>renderReview(o)}
  function setStatus(o,status){o.status=status;save();api("/api/orders/"+o.id+"/status",{method:"POST",body:JSON.stringify({status})}).catch(()=>null);toast(status==="Verzonden"?"📦 Je bestelling is verzonden.":status==="Voltooid"?"✅ Bestelling afgerond.":"Status bijgewerkt.");renderOrder(o.id)}
  function renderReview(o){shell("Feedback geven",`<div class="fsm-card"><h2>Beoordeel ${esc(o.seller)}</h2><form class="fsm-form" id="reviewForm"><select required><option value="">Aantal sterren</option><option value="5">★★★★★</option><option value="4">★★★★☆</option><option value="3">★★★☆☆</option><option value="2">★★☆☆☆</option><option value="1">★☆☆☆☆</option></select><textarea required placeholder="Schrijf je beoordeling..."></textarea><button class="fsm-btn gold">Review plaatsen</button></form></div>`);document.getElementById("reviewForm").onsubmit=e=>{e.preventDefault();const r={id:"review_"+Date.now(),user:o.seller,author:localStorage.getItem("fsm_user")||"lousamyn",stars:Number(e.target.elements[0].value),text:e.target.elements[1].value};demoState.reviews.push(r);save();api("/api/reviews",{method:"POST",body:JSON.stringify({...r,orderId:o.id})}).catch(()=>null);toast("Review geplaatst.");location.hash="#/profile/public"}}
  const tr={en:{"Hallo, is het shirt nog beschikbaar?":"Hi, is the shirt still available?","Je bestelling is verzonden.":"Your order has been shipped."},fr:{"Hallo, is het shirt nog beschikbaar?":"Bonjour, le maillot est-il toujours disponible ?","Je bestelling is verzonden.":"Votre commande a été expédiée."}};
  function translated(t){const l=(localStorage.getItem("fsm_language")||"nl").split("-")[0];return tr[l]?.[t]||t}
  function renderInbox(){shell("Inbox",`<div class="fsm-chat-list"><div class="fsm-chat-row" data-chat="seller"><div class="fsm-mini-avatar">M</div><div><strong>VintageCollector</strong><div class="fsm-sub">Hallo, is het shirt nog beschikbaar?</div></div></div><div class="fsm-chat-row" data-chat="order"><div class="fsm-mini-avatar">📦</div><div><strong>Bestelling</strong><div class="fsm-sub">Je bestelling is verzonden.</div></div></div></div>`);document.querySelectorAll("[data-chat]").forEach(x=>x.onclick=()=>renderChat(x.dataset.chat))}
  function renderChat(kind){const msgs=kind==="seller"?["Hallo, is het shirt nog beschikbaar?"]:["🎉 Je hebt een artikel gekocht!","Je bestelling is verzonden."];shell("VintageCollector",`<div class="fsm-chat"><div class="fsm-messages">${msgs.map((m,i)=>`<div class="fsm-msg ${i===1?"fsm-system":""}" data-original="${esc(m)}">${esc(m)}<div class="fsm-msg-tools"><button data-t="${i}">Vertalen</button><button data-o="${i}" style="display:none">Origineel bekijken</button></div></div>`).join("")}</div><div class="fsm-chat-input"><input id="chatInput" placeholder="Schrijf een bericht..."><button class="fsm-btn green" id="sendChat">Stuur</button></div></div>`);document.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{const x=b.closest(".fsm-msg");x.firstChild.textContent=translated(x.dataset.original);b.style.display="none";x.querySelector("[data-o]").style.display="inline"});document.querySelectorAll("[data-o]").forEach(b=>b.onclick=()=>{const x=b.closest(".fsm-msg");x.firstChild.textContent=x.dataset.original;b.style.display="none";x.querySelector("[data-t]").style.display="inline"});document.getElementById("sendChat").onclick=()=>{const v=document.getElementById("chatInput");if(!v.value.trim())return;api("/api/messages",{method:"POST",body:JSON.stringify({to:"VintageCollector",text:v.value,language:localStorage.getItem("fsm_language")||"nl"})}).catch(()=>null);toast("Bericht verzonden.");v.value=""}}
  function enhancedRouter(){
    const h=location.hash||"#/";
    if(h==="#/profile")return renderProfile();
    if(h.startsWith("#/profile/public"))return renderPublic();
    if(h.startsWith("#/badges"))return renderBadges();
    if(h.startsWith("#/favorites"))return renderFavorites();
    if(h.startsWith("#/wallet"))return renderWallet();
    if(h.startsWith("#/payment-method"))return renderPaymentMethod();
    if(h.startsWith("#/orders"))return renderOrders();
    if(h.startsWith("#/promote"))return renderPromote();
    if(h.startsWith("#/inbox"))return renderInbox();
    if(h.startsWith("#/chat/"))return renderChat(decodeURIComponent(h.split("/")[2]||"seller"));
    if(h.startsWith("#/order/"))return renderOrder(decodeURIComponent(h.split("/")[2]||""));
    if(h.startsWith("#/product/"))return renderProduct(decodeURIComponent(h.split("/")[2]||""));
    if(h.startsWith("#/checkout/")){const s=shirtById(decodeURIComponent(h.split("/")[2]||""));if(s)return renderCheckout({shirt:s,amount:parsePrice(s.price),currency:currencyFor(),source:"buy"});return}
    if(typeof router==="function")router();
  }
  document.addEventListener("click",function(e){const b=e.target.closest(".fsm-menu[data-go]");if(b){location.hash=b.dataset.go}},false);
  document.addEventListener("click",function(e){const b=e.target.closest(".shirt-view");if(b){const card=b.closest(".shirt-card");const all=typeof combinedShirts==="function"?combinedShirts():[];const idx=[...document.querySelectorAll(".shirt-card")].indexOf(card);const s=all[idx];if(s){e.preventDefault();e.stopImmediatePropagation();location.hash="#/product/"+encodeURIComponent(s.id)}}},true);
  window.addEventListener("hashchange",enhancedRouter);
  setTimeout(enhancedRouter,0);
})();
</script>
