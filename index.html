<style>
:root {
  --gold-hi: #efd28f;
  --gold-mid: #d6aa45;
  --cream: #f5f1e7;
  --green: #2bd58c;
}
* { box-sizing: border-box; }
html, body {
  margin: 0; padding: 0;
  background: #020504;
  color: var(--cream);
  font-family: 'Inter', system-ui, sans-serif;
}
a { text-decoration: none; color: inherit; }

/* HEADER */
.site-header {
  position: sticky; top: 0; z-index: 1000; width: 100%;
  background: rgba(2, 7, 5, 0.96);
  backdrop-filter: blur(18px);
  border-bottom: 1px solid rgba(239, 210, 143, 0.20);
}
.header-inner {
  width: min(1320px, 100%); min-height: 84px; margin: auto; padding: 10px 22px;
  display: flex; align-items: center; gap: 28px;
}
.logo-link { display: flex; align-items: center; gap: 14px; }
.header-logo { height: 52px; width: auto; object-fit: contain; }

.brand-name { display: flex; flex-direction: column; justify-content: center; }
.brand-title { color: #ffffff; font-weight: 900; font-size: 16px; letter-spacing: 0.5px; text-transform: uppercase; font-family: 'Montserrat', sans-serif; }
.brand-since { color: var(--gold-hi); font-size: 11px; font-weight: 800; letter-spacing: 2px; margin-top: 2px; }

nav { flex: 1; display: flex; align-items: center; gap: 5px; }
nav a { color: #b8c9be; padding: 11px 14px; border-radius: 11px; font-size: 13px; font-weight: 800; transition: .28s; }
nav a:hover { color: #fff; }

.lang-select {
  background: #08130f; color: var(--gold-hi); 
  border: 1px solid rgba(239, 210, 143, 0.3);
  border-radius: 12px; padding: 10px 14px; font-size: 13px; font-weight: 800;
  cursor: pointer; outline: none;
}

.page { width: min(1320px, 100%); margin: auto; padding: 34px 22px 80px; }

/* BANNER CONTAINER */
.banner-container {
  position: relative;
  width: 100%;
  border-radius: 20px;
  overflow: hidden;
  border: 1px solid rgba(239, 210, 143, 0.24);
  box-shadow: 0 20px 50px rgba(0,0,0,0.6);
}
.banner-container img {
  width: 100%;
  display: block;
  height: auto;
}

/* TYPOGRAFIE & EFFECTEN */
.banner-heading {
  font-family: 'Montserrat', sans-serif;
  text-transform: uppercase;
}

.gold-gradient-3d {
  font-family: 'Montserrat', sans-serif;
  font-weight: 900;
  background: linear-gradient(180deg, #fffbeb 0%, #ffe380 25%, #d6a133 50%, #8a5e12 78%, #fceabb 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  filter: drop-shadow(0px 3px 0px #3a2202) drop-shadow(0px 6px 12px rgba(0,0,0,0.9));
}

/* KNOPPEN */
.banner-btn-green {
  background: linear-gradient(135deg, #18b875, #118252);
  color: #fff; padding: 0.8vw 1.6vw; border-radius: 8px; 
  font-weight: 800; font-size: 1.1vw; text-decoration: none; display: inline-block;
  box-shadow: 0 0 20px rgba(24, 184, 117, 0.4);
}

.banner-btn-white {
  background: #ffffff; color: #000; padding: 0.8vw 1.6vw; border-radius: 8px; 
  font-weight: 800; font-size: 1.1vw; text-decoration: none; display: inline-block;
}

footer { text-align: center; padding: 42px 20px; background: #020504; border-top: 1px solid rgba(239, 210, 143, .18); }

  const langDict = dict[currentLang] || dict['nl'];
  return langDict[key] || dict['nl'][key] || key;
}

        </div>
        <div style="position: absolute; top: 54%; left: 5%; color: #c2cfc7; font-size: 1.1vw; max-width: 38%; line-height: 1.4; text-shadow: 0 2px 8px rgba(0,0,0,0.8);">

      </div>

}

          <div class="banner-heading" style="color: #ffffff; font-size: 1.05vw; font-weight: 900; letter-spacing: 0.5px; line-height: 1.1;">
            ${t('search_cta')}
          </div>
          <div style="color: var(--green); font-size: 0.7vw; font-weight: 800; letter-spacing: 0.8px; margin-top: 0.2vw;">

function route() {
  const hash = location.hash || "#/";
  if (hash === "#/explore") renderExplore();
  else renderHome();
  
  document.querySelectorAll("[data-i18n]").forEach(el => {
    el.innerHTML = t(el.getAttribute("data-i18n"));
  });
}

function initLangSwitcher() {
  const select = document.getElementById("langSwitcher");
  select.innerHTML = "";
  languages.forEach(lang => {
    const opt = document.createElement("option");
    opt.value = lang.code;
    opt.textContent = `${lang.flag} ${lang.name}`;
    if (lang.code === currentLang) opt.selected = true;
    select.appendChild(opt);
  });
  
  select.addEventListener("change", (e) => {
    currentLang = e.target.value;
    localStorage.setItem("fsm_lang", currentLang);
    route();
  });
}

window.addEventListener("hashchange", route);
initLangSwitcher();
route();
