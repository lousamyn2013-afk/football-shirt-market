<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Football-Shirt-Market</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,700;0,800;0,900;1,900&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">

<style>
:root {
  --gold-hi: #efd28f;
  --gold-mid: #d6aa45;
  --cream: #f5f1e7;
  --green: #2bd58c;
}
* { box-sizing: border-box; }
html, body {
  margin: 0; padding: 0;
  background: #020504;
  color: var(--cream);
  font-family: 'Inter', system-ui, sans-serif;
}
a { text-decoration: none; color: inherit; }

/* HEADER */
.site-header {
  position: sticky; top: 0; z-index: 1000; width: 100%;
  background: rgba(2, 7, 5, 0.96);
  backdrop-filter: blur(18px);
  border-bottom: 1px solid rgba(239, 210, 143, 0.20);
}
.header-inner {
  width: min(1320px, 100%); min-height: 84px; margin: auto; padding: 10px 22px;
  display: flex; align-items: center; gap: 28px;
}
.logo-link { display: flex; align-items: center; gap: 13px; }
.header-logo { width: 56px; height: 56px; object-fit: contain; }
.brand-name strong { display: block; font-size: 16px; font-weight: 950; }
.brand-name span { display: block; color: var(--gold-hi); font-size: 8px; letter-spacing: 3px; margin-top: 6px; font-weight: 900; }

nav { flex: 1; display: flex; align-items: center; gap: 5px; }
nav a { color: #b8c9be; padding: 11px 14px; border-radius: 11px; font-size: 13px; font-weight: 800; transition: .28s; }
nav a:hover { color: #fff; }

.lang-select {
  background: #08130f; color: var(--gold-hi); 
  border: 1px solid rgba(239, 210, 143, 0.3);
  border-radius: 12px; padding: 10px 14px; font-size: 13px; font-weight: 800;
  cursor: pointer; outline: none;
}

.page { width: min(1320px, 100%); margin: auto; padding: 34px 22px 80px; }

/* BANNER CONTAINER */
.banner-container {
  position: relative;
  width: 100%;
  border-radius: 20px;
  overflow: hidden;
  border: 1px solid rgba(239, 210, 143, 0.24);
  box-shadow: 0 20px 50px rgba(0,0,0,0.6);
}
.banner-container img {
  width: 100%;
  display: block;
  height: auto;
}

/* TYPOGRAFIE & EFFECTEN */
.banner-heading {
  font-family: 'Montserrat', sans-serif;
  text-transform: uppercase;
}

/* 3D GOUD EFFECT EXTACT ZOALS IN DE AFBEELDING */
.gold-gradient-3d {
  font-family: 'Montserrat', sans-serif;
  font-weight: 900;
  background: linear-gradient(180deg, #fffbeb 0%, #ffe380 25%, #d6a133 50%, #8a5e12 78%, #fceabb 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  filter: drop-shadow(0px 4px 0px #3a2202) drop-shadow(0px 8px 15px rgba(0,0,0,0.9));
}

.banner-divider {
  display: flex;
  align-items: center;
  gap: 8px;
  color: var(--gold-mid);
  font-size: 0.8vw;
  font-weight: 700;
  letter-spacing: 2px;
}
.banner-divider::before, .banner-divider::after {
  content: "";
  height: 1px;
  width: 2.5vw;
  background: linear-gradient(90deg, transparent, var(--gold-mid), transparent);
}

/* KNOPPEN */
.banner-btn-green {
  background: linear-gradient(135deg, #18b875, #118252);
  color: #fff; padding: 0.8vw 1.6vw; border-radius: 8px; 
  font-weight: 800; font-size: 1.1vw; text-decoration: none; display: inline-block;
  box-shadow: 0 0 20px rgba(24, 184, 117, 0.4);
}

.banner-btn-white {
  background: #ffffff; color: #000; padding: 0.8vw 1.6vw; border-radius: 8px; 
  font-weight: 800; font-size: 1.1vw; text-decoration: none; display: inline-block;
}

footer { text-align: center; padding: 42px 20px; background: #020504; border-top: 1px solid rgba(239, 210, 143, .18); }
</style>
</head>
<body>

<header class="site-header">
  <div class="header-inner">
    <a href="#/" class="logo-link">
      <img class="header-logo" src="logo.png" alt="Logo">
      <div class="brand-name">
        <strong>Football-Shirt-Market</strong>
        <span><span data-i18n="brand_since">SINCE 2026</span></span>
      </div>
    </a>

    <nav>
      <a href="#/" data-i18n="nav_home">Home</a>
      <a href="#/explore" data-i18n="nav_explore">Ontdekken</a>
      <a href="#/sell" data-i18n="nav_sell">Verkopen</a>
    </nav>

    <select id="langSwitcher" class="lang-select"></select>
  </div>
</header>

<main id="app"></main>

<footer>
  <strong>⚽ Football-Shirt-Market</strong><br>
  <span><span data-i18n="footer_tag">De marketplace voor voetbalshirts</span> · <span style="color:var(--gold-hi)" data-i18n="footer_since">Since 2026</span></span>
</footer>

<script>
const languages = [
  { code: 'nl', name: 'Nederlands', flag: '🇳🇱' },
  { code: 'en', name: 'English', flag: '🇬🇧' },
  { code: 'fr', name: 'Français', flag: '🇫🇷' },
  { code: 'de', name: 'Deutsch', flag: '🇩🇪' },
  { code: 'es', name: 'Español', flag: '🇪🇸' }
];

const dict = {

    footer_tag: "De marketplace voor voetbalshirts", footer_since: "Since 2026",
    
    hero_title: "Koop. Verkoop.<br>Verzamel.",
    hero_desc: "De marketplace voor voetbalshirts, verzamelaars en echte voetbalfans.",
    btn_explore: "Ontdek shirts", btn_sell: "Verkoop een shirt",
    
    // EXACTE ONTDEKKEN TEKSTEN
    brand_title: "FOOTBALL SHIRT <span style='color:var(--gold-mid)'>MARKET</span>",
    tagline: "VOOR ÉCHTE VOETBALFANS",
    title_explore: "ONTDEKKEN",
    sub_find: "VIND JOUW", sub_next: "VOLGENDE", sub_shirt: "SHIRT",
    desc_line1: "Van iconische klassiekers tot de nieuwste releases.",
    desc_line2: "Ontdek, verzamel en draag jouw passie.",
    search_cta: "ZOEK. VIND. VERZAMEL.",
    search_sub: "JOUW COLLECTIE BEGINT HIER"
  },
  en: {
    brand_since: "SINCE 2026", nav_home: "Home", nav_explore: "Explore", nav_sell: "Sell",
    footer_tag: "The marketplace for football shirts", footer_since: "Since 2026",
    
    hero_title: "Buy. Sell.<br>Collect.",
    hero_desc: "The marketplace for football shirts, collectors, and true football fans.",
    btn_explore: "Explore shirts", btn_sell: "Sell a shirt",
    
    brand_title: "FOOTBALL SHIRT <span style='color:var(--gold-mid)'>MARKET</span>",
    tagline: "FOR TRUE FOOTBALL FANS",
    title_explore: "EXPLORE",
    sub_find: "FIND YOUR", sub_next: "NEXT", sub_shirt: "SHIRT",
    desc_line1: "From iconic classics to the newest releases.",
    desc_line2: "Discover, collect, and wear your passion.",
    search_cta: "SEARCH. FIND. COLLECT.",
    search_sub: "YOUR COLLECTION STARTS HERE"
  },
  fr: {
    brand_since: "DEPUIS 2026", nav_home: "Accueil", nav_explore: "Explorer", nav_sell: "Vendre",
    footer_tag: "La place de marché pour les maillots de football", footer_since: "Depuis 2026",
    
    hero_title: "Achetez. Vendez.<br>Collectionnez.",
    hero_desc: "La place de marché pour les maillots de football, les collectionneurs et les passionnés.",
    btn_explore: "Explorer les maillots", btn_sell: "Vendre un maillot",
    
    brand_title: "FOOTBALL SHIRT <span style='color:var(--gold-mid)'>MARKET</span>",
    tagline: "POUR LES VRAIS PASSIONNÉS",
    title_explore: "EXPLORER",
    sub_find: "TROUVEZ VOTRE", sub_next: "PROCHAIN", sub_shirt: "MAILLOT",
    desc_line1: "Des classiques iconiques aux dernières nouveautés.",
    desc_line2: "Découvrez, collectionnez et portez votre passion.",
    search_cta: "CHERCHEZ. TROUVEZ. COLLECTIONNEZ.",
    search_sub: "VOTRE COLLECTION COMMENCE ICI"
  },
  de: {
    brand_since: "SEIT 2026", nav_home: "Startseite", nav_explore: "Entdecken", nav_sell: "Verkaufen",
    footer_tag: "Der Marktplatz für Trikots", footer_since: "Seit 2026",
    
    hero_title: "Kaufen. Verkaufen.<br>Sammeln.",
    hero_desc: "Der Marktplatz für Fußballtrikots, Sammler und echte Fußballfans.",
    btn_explore: "Trikots entdecken", btn_sell: "Trikot verkaufen",
    
    brand_title: "FOOTBALL SHIRT <span style='color:var(--gold-mid)'>MARKET</span>",
    tagline: "FÜR ECHTE FUSSBALLFANS",
    title_explore: "ENTDECKEN",
    sub_find: "FINDE DEIN", sub_next: "NÄCHSTES", sub_shirt: "TRIKOT",
    desc_line1: "Von kultigen Klassikern bis zu den neuesten Releases.",
    desc_line2: "Entdecke, sammle und trage deine Leidenschaft.",
    search_cta: "SUCHEN. FINDEN. SAMMELN.",
    search_sub: "DEINE KOLLEKTION STARTET HIER"
  },
  es: {
    brand_since: "DESDE 2026", nav_home: "Inicio", nav_explore: "Explorar", nav_sell: "Vender",
    footer_tag: "El mercado de camisetas de fútbol", footer_since: "Desde 2026",
    
    hero_title: "Compra. Vende.<br>Colecciona.",
    hero_desc: "El mercado de camisetas de fútbol, coleccionistas y auténticos aficionados.",
    btn_explore: "Explorar camisetas", btn_sell: "Vender una camiseta",
    
    brand_title: "FOOTBALL SHIRT <span style='color:var(--gold-mid)'>MARKET</span>",
    tagline: "PARA AUTÉNTICOS AFICIONADOS",
    title_explore: "EXPLORAR",
    sub_find: "ENCUENTRA TU", sub_next: "PRÓXIMA", sub_shirt: "CAMISETA",
    desc_line1: "Desde clásicos icónicos hasta los últimos lanzamientos.",
    desc_line2: "Descubre, colecciona y viste tu pasión.",
    search_cta: "BUSCA. ENCUENTRA. COLECCIONA.",
    search_sub: "TU COLECCIÓN EMPIEZA AQUÍ"
  }
};

let currentLang = localStorage.getItem("fsm_lang") || "nl";

function t(key) {
  const langDict = dict[currentLang] || dict['nl'];
  return langDict[key] || dict['nl'][key] || key;
}

function renderHome() {
  document.getElementById("app").innerHTML = `
    <div class="page">
      <div class="banner-container">
        <img src="held.png" alt="Hero Banner">
        
        <div style="position: absolute; top: 22%; left: 5%; color: #f2cf70; font-size: 1.1vw; font-weight: 800; letter-spacing: 1px;">
          FOOTBALL-SHIRT-MARKET • ${t('brand_since')}
        </div>
        <div class="banner-heading" style="position: absolute; top: 29%; left: 5%; color: #ffffff; font-size: 4.2vw; font-weight: 900; line-height: 1.1; max-width: 45%;">
          ${t('hero_title')}
        </div>
        <div style="position: absolute; top: 53%; left: 5%; color: #c2cfc7; font-size: 1.2vw; max-width: 38%; line-height: 1.4; text-shadow: 0 2px 8px rgba(0,0,0,0.8);">
          ${t('hero_desc')}
        </div>
        <div style="position: absolute; top: 67%; left: 5%; display: flex; gap: 1vw;">
          <a href="#/explore" class="banner-btn-green">${t('btn_explore')}</a>
          <a href="#/sell" class="banner-btn-white">${t('btn_sell')}</a>
        </div>
      </div>
    </div>
  `;
}

function renderExplore() {
  document.getElementById("app").innerHTML = `
    <div class="page">
      <div class="banner-container">
        <img src="ontdekken.png" alt="Explore Banner">
        
        <!-- LOGO LINKSBOVEN OP BANNER -->
        <img src="logo.png" style="position: absolute; top: 5.5%; left: 3.5%; width: 4.8vw; height: auto;" alt="Logo">
        
        <!-- MERKNAAM & SUB-TAGLINE LINKSBOVEN -->
        <div class="banner-heading" style="position: absolute; top: 6.5%; left: 9.2%; color: #ffffff; font-size: 1.3vw; font-weight: 900; letter-spacing: 1px;">
          ${t('brand_title')}
        </div>
        <div class="banner-divider" style="position: absolute; top: 12.5%; left: 9.2%;">
          ${t('tagline')}
        </div>

        <!-- GROTE HOOFDTITEL "ONTDEKKEN" -->
        <div class="gold-gradient-3d" style="position: absolute; top: 21%; left: 3.5%; font-size: 5.4vw; line-height: 1; letter-spacing: 1px;">
          ${t('title_explore')}
        </div>

        <!-- KROON ICOON & SUBTITLE "VIND JOUW VOLGENDE SHIRT" -->
        <div style="position: absolute; top: 38%; left: 3.5%; width: 33vw; text-align: center;">
          <div style="color: var(--gold-mid); font-size: 1.1vw; margin-bottom: 0.2vw;">👑</div>
          <div class="banner-heading" style="color: #ffffff; font-size: 1.4vw; font-weight: 900; letter-spacing: 1.5px; display: flex; align-items: center; justify-content: center; gap: 0.8vw;">
            <span style="height: 1px; width: 3vw; background: linear-gradient(90deg, transparent, var(--gold-mid));"></span>
            ${t('sub_find')} <span style="color: var(--green);">${t('sub_next')}</span> ${t('sub_shirt')}
            <span style="height: 1px; width: 3vw; background: linear-gradient(90deg, var(--gold-mid), transparent);"></span>
          </div>
          <div style="margin-top: 0.4vw; display: flex; align-items: center; justify-content: center; gap: 0.4vw;">
            <span style="height: 2px; width: 2px; background: var(--gold-mid); border-radius: 50%;"></span>
            <span style="height: 1px; width: 4vw; background: var(--gold-mid);"></span>
            <span style="height: 2px; width: 2px; background: var(--gold-mid); border-radius: 50%;"></span>
          </div>
        </div>

        <!-- OMSCHRIJVING TEKST -->
        <div style="position: absolute; top: 51%; left: 3.5%; width: 33vw; text-align: center; color: #d0d7d3; font-size: 0.85vw; line-height: 1.5; font-weight: 600; text-shadow: 0 2px 10px rgba(0,0,0,0.9);">
          <div>${t('desc_line1')}</div>
          <div>${t('desc_line2')}</div>
        </div>

        <!-- TEKST OVERLAY OP DE GOUDEN ZOEKBALK (LINKSONDER) -->
        <div style="position: absolute; top: 76.5%; left: 11.2%; pointer-events: none;">
          <div class="banner-heading" style="color: #ffffff; font-size: 1.15vw; font-weight: 900; letter-spacing: 1px; line-height: 1.1;">
            ${t('search_cta')}
          </div>
          <div style="color: var(--green); font-size: 0.75vw; font-weight: 800; letter-spacing: 1px; margin-top: 0.2vw;">
            ${t('search_sub')}
          </div>
        </div>

      </div>
    </div>
  `;
}

function route() {
  const hash = location.hash || "#/";
  if (hash === "#/explore") renderExplore();
  else renderHome();
  
  document.querySelectorAll("[data-i18n]").forEach(el => {
    el.innerHTML = t(el.getAttribute("data-i18n"));
  });
}

function initLangSwitcher() {
  const select = document.getElementById("langSwitcher");
  select.innerHTML = "";
  languages.forEach(lang => {
    const opt = document.createElement("option");
    opt.value = lang.code;
    opt.textContent = `${lang.flag} ${lang.name}`;
    if (lang.code === currentLang) opt.selected = true;
    select.appendChild(opt);
  });
  
  select.addEventListener("change", (e) => {
    currentLang = e.target.value;
    localStorage.setItem("fsm_lang", currentLang);
    route();
  });
}

window.addEventListener("hashchange", route);
initLangSwitcher();
route();
</script>
</body>
</html>
