<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>Football-Shirt-Market</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
:root{
    --bg:#020504;
    --bg2:#050b08;
    --card:#08140f;
    --gold:#efd28f;
    --gold2:#d6aa45;
    --green:#20c982;
    --green2:#0c8654;
    --white:#fff;
    --muted:#a6b4ad;
    --border:rgba(239,210,143,.20);
}

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html{
    scroll-behavior:smooth;
}

body{
    min-height:100vh;
    background:
        radial-gradient(circle at 70% 0%,rgba(32,201,130,.08),transparent 30%),
        var(--bg);
    color:var(--white);
    font-family:Inter,Arial,sans-serif;
    overflow-x:hidden;
}

a{
    color:inherit;
    text-decoration:none;
}

button,
input{
    font:inherit;
}

img{
    max-width:100%;
}

/* =========================================
   GOOGLE TRANSLATE VERBERGEN
========================================= */

.goog-te-banner-frame,
.skiptranslate iframe,
.goog-te-banner-frame.skiptranslate,
#goog-gt-tt,
.goog-tooltip{
    display:none!important;
}

body{
    top:0!important;
}

.goog-text-highlight{
    background:transparent!important;
    box-shadow:none!important;
}

/* =========================================
   HEADER
========================================= */

.site-header{
    position:sticky;
    top:0;
    z-index:1000;
    background:rgba(2,7,5,.93);
    backdrop-filter:blur(20px);
    -webkit-backdrop-filter:blur(20px);
    border-bottom:1px solid var(--border);
}

.header-inner{
    width:min(1400px,100%);
    min-height:80px;
    margin:auto;
    padding:10px 24px;

    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:20px;
}

.logo-link{
    display:flex;
    align-items:center;
    gap:12px;
    min-width:0;
}

.header-logo{
    width:55px;
    height:55px;
    object-fit:contain;
    flex-shrink:0;
}

.brand{
    display:flex;
    flex-direction:column;
    min-width:0;
}

.brand-title{
    font-family:Montserrat,sans-serif;
    font-size:15px;
    font-weight:900;
    letter-spacing:.6px;
    white-space:nowrap;
}

.brand-since{
    color:var(--gold);
    font-size:9px;
    font-weight:800;
    letter-spacing:2px;
    margin-top:4px;
}

nav{
    display:flex;
    gap:5px;
    align-items:center;
}

nav a{
    color:#adbbb4;
    padding:11px 15px;
    border-radius:10px;
    font-size:13px;
    font-weight:800;
    transition:.25s ease;
}

nav a:hover,
nav a.active{
    color:#fff;
    background:rgba(255,255,255,.07);
}

.header-actions{
    display:flex;
    align-items:center;
    gap:8px;
}

.lang-button{
    min-height:42px;
    padding:0 13px;

    display:flex;
    align-items:center;
    gap:7px;

    border-radius:11px;
    border:1px solid rgba(239,210,143,.32);
    background:#08140f;
    color:var(--gold);

    font-size:12px;
    font-weight:800;

    cursor:pointer;
    transition:.25s;
}

.lang-button:hover{
    border-color:var(--gold);
    transform:translateY(-1px);
}

.menu-button{
    display:none;
    width:42px;
    height:42px;

    border:1px solid var(--border);
    border-radius:10px;

    background:#08140f;
    color:#fff;

    font-size:20px;
}

/* =========================================
   MOBILE MENU
========================================= */

.mobile-nav{
    display:none;
    background:#030806;
    border-top:1px solid rgba(239,210,143,.10);
    padding:10px 14px 15px;
}

.mobile-nav.open{
    display:block;
}

.mobile-nav a{
    display:block;
    padding:13px;
    border-radius:9px;
    color:#d9e2dd;
    font-weight:800;
}

.mobile-nav a:hover{
    background:rgba(255,255,255,.06);
}

/* =========================================
   PAGE
========================================= */

.page{
    width:min(1400px,100%);
    margin:auto;
    padding:28px 24px 80px;
}

/* =========================================
   HERO
========================================= */

.hero{
    position:relative;
    width:100%;
    min-height:560px;

    border-radius:22px;
    overflow:hidden;

    border:1px solid rgba(239,210,143,.24);

    background:#020604;

    box-shadow:
        0 25px 70px rgba(0,0,0,.62),
        inset 0 0 80px rgba(0,0,0,.25);
}

/*
  De afbeelding blijft volledig zichtbaar.
  Op desktop staat de rechterkant van de afbeelding
  waar je logo zit op zijn plaats.
*/

.hero-image{
    position:absolute;
    inset:0;

    width:100%;
    height:100%;

    object-fit:cover;
    object-position:center center;

    z-index:0;
}

.hero-overlay{
    position:absolute;
    inset:0;
    z-index:1;

    background:
        linear-gradient(
            90deg,
            rgba(2,5,4,.94) 0%,
            rgba(2,5,4,.80) 27%,
            rgba(2,5,4,.28) 55%,
            rgba(2,5,4,.06) 78%,
            rgba(2,5,4,.12) 100%
        );
}

/* HERO CONTENT */

.hero-content{
    position:relative;
    z-index:3;

    width:51%;
    min-height:560px;

    padding:60px 0 70px 56px;

    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:flex-start;
}

.hero-kicker{
    color:var(--gold);
    font-family:Montserrat,sans-serif;

    font-size:11px;
    font-weight:900;

    letter-spacing:2.2px;
    text-transform:uppercase;

    margin-bottom:17px;
}

.hero-title{
    font-family:Montserrat,sans-serif;

    font-size:clamp(42px,5.4vw,78px);
    line-height:.94;

    font-weight:900;

    letter-spacing:-2.5px;
    text-transform:uppercase;

    color:#fff;

    text-shadow:
        0 5px 25px rgba(0,0,0,.6);
}

.hero-title .gold{
    color:var(--gold);
}

.hero-description{
    max-width:500px;

    margin-top:22px;

    color:#d3ddd8;

    font-size:15px;
    line-height:1.55;
}

.hero-buttons{
    margin-top:25px;

    display:flex;
    flex-wrap:wrap;
    gap:10px;
}

.hero-btn{
    min-height:45px;
    padding:0 18px;

    display:inline-flex;
    align-items:center;
    justify-content:center;

    border-radius:9px;

    font-size:12px;
    font-weight:900;

    transition:.25s ease;
}

.hero-btn.green{
    color:white;

    background:
        linear-gradient(
            135deg,
            var(--green),
            var(--green2)
        );

    box-shadow:
        0 8px 25px rgba(25,201,130,.25);
}

.hero-btn.green:hover{
    transform:translateY(-2px);
    box-shadow:
        0 12px 32px rgba(25,201,130,.35);
}

.hero-btn.white{
    color:#101411;
    background:#fff;
}

.hero-btn.white:hover{
    transform:translateY(-2px);
    background:#f2f2f2;
}

/* =========================================
   HERO SEARCH
========================================= */

.hero-search{
    width:min(450px,100%);
    height:52px;

    margin-top:24px;

    display:flex;
    align-items:center;

    border-radius:12px;

    border:1px solid rgba(239,210,143,.50);
    background:rgba(0,0,0,.69);

    box-shadow:
        0 8px 30px rgba(0,0,0,.35),
        0 0 25px rgba(239,210,143,.06);

    backdrop-filter:blur(8px);
}

.hero-search-icon{
    width:48px;

    color:#fff;

    font-size:22px;

    display:flex;
    justify-content:center;
    align-items:center;
}

.hero-search input{
    flex:1;
    min-width:0;
    height:100%;

    border:0;
    outline:0;

    background:transparent;

    color:white;

    font-size:13px;
}

.hero-search input::placeholder{
    color:#84928b;
}

.hero-search button{
    width:42px;
    height:40px;

    margin-right:6px;

    border:0;
    border-radius:8px;

    background:
        linear-gradient(
            135deg,
            var(--gold),
            var(--gold2)
        );

    color:#090b09;

    font-size:20px;
    font-weight:900;
}

/* =========================================
   SECTIONS
========================================= */

.section{
    margin-top:50px;
}

.section-header{
    display:flex;
    align-items:end;
    justify-content:space-between;
    gap:20px;

    border-bottom:1px solid rgba(239,210,143,.14);

    padding-bottom:13px;
    margin-bottom:20px;
}

.section-title{
    font-family:Montserrat,sans-serif;

    font-size:26px;
    font-weight:900;

    text-transform:uppercase;
}

.section-title span{
    color:var(--gold);
}

.section-link{
    color:var(--gold);
    font-size:12px;
    font-weight:900;

    white-space:nowrap;
}

.section-link:hover{
    color:#fff;
}

/* =========================================
   HOME SHIRT RIJ
========================================= */

.home-shirt-row{
    display:grid;

    grid-auto-flow:column;
    grid-auto-columns:minmax(225px,1fr);

    gap:17px;

    overflow-x:auto;

    padding:3px 3px 14px;

    scroll-snap-type:x mandatory;
}

.home-shirt-row::-webkit-scrollbar{
    height:5px;
}

.home-shirt-row::-webkit-scrollbar-thumb{
    background:rgba(239,210,143,.28);
    border-radius:10px;
}

/* =========================================
   EXPLORE GRID
========================================= */

.explore-grid{
    display:grid;

    grid-template-columns:
        repeat(auto-fill,minmax(235px,1fr));

    gap:18px;
}

/* =========================================
   SHIRT CARD
========================================= */

.shirt-card{
    min-width:0;

    overflow:hidden;

    border:1px solid var(--border);
    border-radius:16px;

    background:
        linear-gradient(
            180deg,
            #0b1a13,
            #06100c
        );

    transition:
        transform .3s ease,
        border-color .3s ease,
        box-shadow .3s ease;
}

.shirt-card:hover{
    transform:translateY(-6px);

    border-color:rgba(239,210,143,.55);

    box-shadow:
        0 18px 38px rgba(0,0,0,.42);
}

.shirt-image{
    position:relative;

    aspect-ratio:1 / 1;

    display:flex;
    align-items:center;
    justify-content:center;

    overflow:hidden;

    background:
        radial-gradient(
            circle at center,
            #173827 0%,
            #09150f 55%,
            #030806 100%
        );
}

.shirt-image::before{
    content:"";

    position:absolute;

    width:70%;
    height:70%;

    border-radius:50%;

    background:
        radial-gradient(
            circle,
            rgba(25,201,130,.11),
            transparent 65%
        );
}

.shirt-icon{
    position:relative;
    z-index:2;

    font-size:74px;

    filter:
        drop-shadow(0 14px 15px rgba(0,0,0,.65));

    transition:.3s;
}

.shirt-card:hover .shirt-icon{
    transform:scale(1.08) rotate(-2deg);
}

.badge{
    position:absolute;
    z-index:3;

    top:10px;
    left:10px;

    padding:5px 8px;

    color:var(--gold-light);

    background:rgba(0,0,0,.76);

    border:1px solid rgba(239,210,143,.35);
    border-radius:20px;

    font-size:8px;
    font-weight:900;
    text-transform:uppercase;
}

.shirt-info{
    padding:15px;
}

.shirt-club{
    color:#87988f;

    font-size:9px;
    font-weight:900;

    letter-spacing:.6px;

    text-transform:uppercase;

    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.shirt-name{
    color:#fff;

    margin-top:5px;

    min-height:40px;

    font-size:13px;
    line-height:1.35;
    font-weight:900;
}

.shirt-bottom{
    display:flex;
    justify-content:space-between;
    align-items:center;

    gap:8px;

    margin-top:14px;
}

.price{
    color:var(--green);

    font-size:15px;
    font-weight:900;

    white-space:nowrap;
}

.view-button{
    border:1px solid rgba(239,210,143,.27);

    background:rgba(239,210,143,.07);

    color:var(--gold);

    border-radius:7px;

    padding:7px 9px;

    font-size:9px;
    font-weight:900;

    cursor:pointer;

    transition:.2s;
}

.view-button:hover{
    background:var(--gold2);
    color:#000;
}

/* =========================================
   EXPLORE TOP
========================================= */

.explore-top{
    position:relative;

    width:100%;
    height:320px;

    overflow:hidden;

    border-radius:20px;

    border:1px solid var(--border);

    background:#020504;

    margin-bottom:40px;
}

.explore-top img{
    width:100%;
    height:100%;

    object-fit:cover;
    object-position:center;
}

.explore-overlay{
    position:absolute;
    inset:0;

    display:flex;
    align-items:center;

    padding-left:55px;

    background:
        linear-gradient(
            90deg,
            rgba(2,5,4,.90),
            rgba(2,5,4,.42),
            transparent
        );
}

.explore-title{
    font-family:Montserrat,sans-serif;

    font-size:clamp(35px,4vw,58px);

    line-height:.95;

    text-transform:uppercase;
}

.explore-title span{
    color:var(--gold);
}

/* =========================================
   SELL
========================================= */

.sell-box{
    width:min(680px,100%);

    margin:70px auto;

    padding:45px;

    text-align:center;

    background:
        radial-gradient(
            circle at top,
            rgba(239,210,143,.09),
            transparent 50%
        ),
        #07130e;

    border:1px solid var(--border);

    border-radius:22px;

    box-shadow:var(--shadow);
}

.sell-box-icon{
    font-size:50px;
    margin-bottom:15px;
}

.sell-box h1{
    font-family:Montserrat,sans-serif;

    color:var(--gold);

    font-size:36px;

    text-transform:uppercase;
}

.sell-box p{
    margin:15px auto 27px;

    color:#a9b7b0;

    line-height:1.7;
}

/* =========================================
   LANGUAGE MODAL
========================================= */

.language-modal-bg{
    position:fixed;
    inset:0;
    z-index:5000;

    display:none;
    align-items:center;
    justify-content:center;

    padding:20px;

    background:rgba(0,0,0,.83);

    backdrop-filter:blur(12px);
}

.language-modal-bg.open{
    display:flex;
}

.language-modal{
    width:min(650px,100%);
    max-height:86vh;

    display:flex;
    flex-direction:column;

    padding:23px;

    border-radius:21px;

    background:
        radial-gradient(
            circle at top right,
            rgba(25,201,130,.07),
            transparent 35%
        ),
        #09160f;

    border:1px solid rgba(239,210,143,.27);

    box-shadow:
        0 30px 90px rgba(0,0,0,.8);
}

.language-header{
    display:flex;
    justify-content:space-between;
    align-items:center;

    margin-bottom:15px;
}

.language-title{
    color:var(--gold);

    font-family:Montserrat,sans-serif;

    font-size:19px;
    font-weight:900;
}

.language-close{
    width:38px;
    height:38px;

    border:0;
    border-radius:9px;

    background:rgba(255,255,255,.05);

    color:#aaa;

    font-size:24px;
}

.language-close:hover{
    color:white;
}

.language-search{
    width:100%;
    height:46px;

    border:1px solid rgba(239,210,143,.23);
    border-radius:11px;

    background:#030806;

    color:white;

    outline:none;

    padding:0 14px;

    margin-bottom:14px;
}

.language-search:focus{
    border-color:var(--gold);
}

.language-list{
    display:grid;

    grid-template-columns:repeat(2,minmax(0,1fr));

    gap:7px;

    overflow-y:auto;

    padding-right:4px;
}

.language-item{
    display:flex;
    align-items:center;

    gap:9px;

    padding:10px 11px;

    background:rgba(255,255,255,.03);

    border:1px solid transparent;
    border-radius:9px;

    color:#dce5e0;

    font-size:12px;
    font-weight:700;

    cursor:pointer;

    transition:.18s;
}

.language-item:hover{
    background:rgba(239,210,143,.10);
    border-color:rgba(239,210,143,.18);
}

.language-item.active{
    background:var(--gold2);
    color:#000;
}

.language-flag{
    font-size:18px;
}

/* =========================================
   FOOTER
========================================= */

footer{
    padding:42px 20px;

    text-align:center;

    border-top:1px solid var(--border);

    background:#010302;

    color:#84928b;

    font-size:12px;
}

footer strong{
    color:#fff;
    font-family:Montserrat,sans-serif;
}

/* =========================================
   TOAST
========================================= */

.toast{
    position:fixed;
    left:50%;
    bottom:22px;
    z-index:6000;

    transform:translate(-50%,120px);

    padding:12px 17px;

    border-radius:10px;

    background:#102117;

    border:1px solid rgba(239,210,143,.35);

    color:white;

    font-size:12px;
    font-weight:800;

    box-shadow:0 15px 40px rgba(0,0,0,.45);

    transition:.3s;
}

.toast.show{
    transform:translate(-50%,0);
}

/* =========================================
   TABLET
========================================= */

@media(max-width:1050px){

    .brand{
        display:none;
    }

    nav{
        display:none;
    }

    .menu-button{
        display:block;
    }

    .hero{
        min-height:500px;
    }

    .hero-content{
        min-height:500px;
        width:57%;
        padding-left:38px;
    }

    .hero-title{
        font-size:clamp(39px,5.5vw,65px);
    }

    .shirt-row{
        grid-auto-columns:230px;
    }
}

/* =========================================
   MOBILE
========================================= */

@media(max-width:700px){

    .header-inner{
        min-height:66px;
        padding:8px 12px;
        gap:8px;
    }

    .header-logo{
        width:44px;
        height:44px;
    }

    .header-actions{
        margin-left:auto;
    }

    .lang-button{
        min-height:39px;
        padding:0 9px;
    }

    #currentLangCode{
        display:none;
    }

    .page{
        padding:13px 10px 55px;
    }

    .hero{
        min-height:610px;
        border-radius:15px;
    }

    /*
      Op mobiel blijft de rechterkant van je afbeelding,
      inclusief het logo, zichtbaar.
    */

    .hero-image{
        object-position:68% center;
        transform:scale(1.01);
    }

    .hero-overlay{
        background:
            linear-gradient(
                180deg,
                rgba(2,5,4,.96) 0%,
                rgba(2,5,4,.82) 42%,
                rgba(2,5,4,.36) 70%,
                rgba(2,5,4,.82) 100%
            );
    }

    .hero-content{
        width:100%;
        min-height:610px;

        padding:42px 22px 23px;

        justify-content:flex-start;
    }

    .hero-kicker{
        font-size:8px;
        letter-spacing:1.5px;
        margin-bottom:13px;
    }

    .hero-title{
        font-size:clamp(37px,11vw,52px);
        letter-spacing:-1.5px;
    }

    .hero-description{
        font-size:12px;
        max-width:340px;
        margin-top:17px;
    }

    .hero-buttons{
        margin-top:19px;
    }

    .hero-btn{
        min-height:40px;
        padding:0 13px;
        font-size:10px;
    }

    .hero-search{
        margin-top:20px;
        width:100%;
        height:49px;
    }

    .hero-search input{
        font-size:12px;
    }

    .hero-search button{
        width:39px;
        height:37px;
    }

    .section{
        margin-top:35px;
    }

    .section-title{
        font-size:19px;
    }

    .section-link{
        font-size:10px;
    }

    .home-shirt-row{
        grid-auto-columns:205px;
        gap:11px;
    }

    .shirt-grid{
        grid-template-columns:repeat(2,minmax(0,1fr));
    }

    .explore-grid{
        grid-template-columns:repeat(2,minmax(0,1fr));
        gap:10px;
    }

    .shirt-info{
        padding:11px;
    }

    .shirt-name{
        font-size:11px;
    }

    .price{
        font-size:12px;
    }

    .view-button{
        font-size:8px;
        padding:6px 7px;
    }

    .explore-top{
        height:300px;
    }

    .explore-overlay{
        padding-left:25px;
    }

    .language-list{
        grid-template-columns:1fr;
    }

    .language-modal{
        padding:17px;
    }

}

/* =========================================
   VERY SMALL GSM
========================================= */

@media(max-width:420px){

    .hero{
        min-height:585px;
    }

    .hero-content{
        min-height:585px;
        padding:34px 18px 18px;
    }

    .hero-title{
        font-size:39px;
    }

    .hero-description{
        max-width:290px;
    }

    .hero-buttons{
        width:100%;
    }

    .hero-btn{
        flex:1;

.replaceAll("&","&amp;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;")
.replaceAll('"',"&quot;")

function updateNavigation(){

link=>link.classList.remove("active")

.getElementById("navSell")

}

.getElementById("navHome")
?.classList.add("active");

}

}

const hash=
location.hash || "#/";

renderExplore();

else if(hash.startsWith("#/sell")){

renderSell();

else{

renderHome();

/* =====================================================
   LANGUAGE
===================================================== */

function getCurrentLanguage(){

const cookie=
document.cookie
.split(";")
.map(x=>x.trim())
.find(
x=>x.startsWith("googtrans=")
);

if(!cookie){

return "nl";

}

const value=
decodeURIComponent(
cookie.substring(
"googtrans=".length
)
);

const parts=value.split("/");

return parts[2] || "nl";

}


/* =====================================================
   LANGUAGE BUTTON
===================================================== */

function updateLanguageButton(){

const code=
getCurrentLanguage();

const language=
languages.find(
x=>x.code===code
)
||
languages.find(
x=>x.code==="nl"
);

if(!language)return;

document
.getElementById("currentFlag")
.textContent=
language.flag;

document
.getElementById("currentLangCode")
.textContent=
language.code
.split("-")[0]
.toUpperCase();

}


/* =====================================================
   LANGUAGE LIST
===================================================== */

function renderLanguages(search=""){

const query=
search
.toLowerCase()
.trim();

const active=
getCurrentLanguage();

const results=
languages.filter(language=>{

return (
language.name
.toLowerCase()
.includes(query)

||

language.code
.toLowerCase()
.includes(query)

);

});


languageList.innerHTML="";


if(!results.length){

languageList.innerHTML=`

<div
style="
grid-column:1/-1;
text-align:center;
padding:30px;
color:#819087;
"
>
Geen taal gevonden.
</div>

`;

return;

}


results.forEach(language=>{

const item=
document.createElement("button");

item.type="button";

item.className=
"language-item";

if(language.code===active){

item.classList.add("active");

}


item.innerHTML=`

<span class="language-flag">
${language.flag}
</span>

<span>
${language.name}
</span>

`;


item.addEventListener(
"click",
()=>changeLanguage(language.code)
);


languageList.appendChild(item);

});

}


/* =====================================================
   LANGUAGE CHANGE
===================================================== */

function clearGoogleTranslateCookie(){

const expired=
"expires=Thu, 01 Jan 1970 00:00:00 GMT; path=/;";

document.cookie=
"googtrans=; "+expired;

if(location.hostname){

document.cookie=
"googtrans=; expires=Thu, 01 Jan 1970 00:00:00 GMT; path=/; domain="+
location.hostname+
";";

}

}


/*
  Deze functie gebruikt de standaard Google Translate-cookie.
  Daardoor werkt de vertaling ook na navigeren.
*/

function changeLanguage(code){

clearGoogleTranslateCookie();

if(code!=="nl"){

document.cookie=
"googtrans=/nl/"+code+
"; path=/; max-age=31536000";

}

localStorage.setItem(
"fsm_language",
code
);

languageModal.classList.remove("open");

location.reload();

}
