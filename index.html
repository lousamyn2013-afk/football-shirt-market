<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<title>Football-Shirt-Market</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
:root{
    --bg:#020504;
    --green:#18bf77;
    --green-dark:#08784c;
    --gold:#efd28f;
    --gold-dark:#d1a33d;
    --white:#fff;
    --muted:#b7c4be;
    --card:#08140f;
    --line:rgba(239,210,143,.2);
}

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,
body{
    margin:0;
    padding:0;
    background:var(--bg);
    color:#fff;
    font-family:Inter,Arial,sans-serif;
    overflow-x:hidden;
    min-height:100vh;
}

body{
    top:0!important;
}

a{
    color:inherit;
    text-decoration:none;
}

button,
input,
select,
textarea{
    font-family:inherit;
}

img{
    max-width:100%;
}

.goog-te-banner-frame,
.skiptranslate iframe,
#google_translate_element{
    display:none!important;
}

.goog-text-highlight{
    background:transparent!important;
    box-shadow:none!important;
}

/* ======================================================
   HEADER
====================================================== */

.site-header{
    position:sticky;
    top:0;
    z-index:1000;
    background:rgba(2,6,4,.94);
    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);
    border-bottom:1px solid var(--line);
}

.header-inner{
    width:min(1400px,100%);
    min-height:78px;
    margin:auto;
    padding:9px 22px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:20px;
}

.logo-area{
    display:flex;
    align-items:center;
    gap:11px;
    min-width:0;
}

.header-logo{
    width:54px;
    height:54px;
    object-fit:contain;
    flex-shrink:0;
}

.brand{
    display:flex;
    flex-direction:column;
    min-width:0;
}

.brand-title{
    font-family:Montserrat,sans-serif;
    font-size:14px;
    font-weight:900;
    letter-spacing:.5px;
    white-space:nowrap;
}

.brand-since{
    margin-top:3px;
    color:var(--gold);
    font-size:9px;
    letter-spacing:2px;
    font-weight:800;
}

nav{
    display:flex;
    gap:5px;
}

nav a{
    color:#adbbb4;
    padding:10px 15px;
    border-radius:10px;
    font-size:13px;
    font-weight:800;
    transition:.2s;
}

nav a:hover,
nav a.active{
    color:#fff;
    background:rgba(255,255,255,.07);
}

.header-right{
    display:flex;
    align-items:center;
    gap:8px;
}

.language-button{
    min-height:40px;
    border:1px solid rgba(239,210,143,.32);
    background:#07130e;
    color:var(--gold);
    border-radius:10px;
    padding:0 12px;
    display:flex;
    align-items:center;
    gap:6px;
    font-size:11px;
    font-weight:800;
    cursor:pointer;
    transition:.2s;
}

.language-button:hover{
    border-color:var(--gold);
    transform:translateY(-1px);
}

.menu-button{
    display:none;
    width:42px;
    height:42px;
    border:1px solid var(--line);
    border-radius:10px;
    background:#07130e;
    color:#fff;
    font-size:20px;
    cursor:pointer;
}

/* ======================================================
   MOBILE NAV
====================================================== */

.mobile-nav{
    display:none;
    border-top:1px solid rgba(239,210,143,.1);
    background:#030806;
    padding:10px 12px;
}

.mobile-nav.open{
    display:block;
}

.mobile-nav a{
    display:block;
    padding:13px;
    border-radius:12px;
    color:#dbe3df;
    font-weight:800;
}

.mobile-nav a:hover{
    background:rgba(255,255,255,.06);
}

/* ======================================================
   PAGE & HERO
====================================================== */

.page{
    width:min(1400px,100%);
    margin:auto;
    padding:25px 22px 75px;
}

.hero{
    position:relative;
    width:100%;
    min-height:520px;
    height:clamp(520px,51vw,680px);
    overflow:hidden;
    border-radius:22px;
    border:1px solid rgba(239,210,143,.22);
    background:#020504;
    box-shadow:0 25px 70px rgba(0,0,0,.6);
}

.hero-image{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    object-position:center;
    z-index:1;
}

.hero-shade{
    position:absolute;
    inset:0;
    z-index:2;
    background:linear-gradient(
        90deg,
        #020504 0%,
        rgba(2,5,4,.86) 38%,
        rgba(2,5,4,.28) 65%,
        transparent 100%
    );
    pointer-events:none;
}

.hero-clean-mask{
    position:absolute;
    z-index:3;
    left:0;
    top:0;
    bottom:0;
    width:55%;
    background:linear-gradient(
        90deg,
        #020504 0%,
        #020504 70%,
        transparent 100%
    );
    pointer-events:none;
}

.hero-content{
    position:absolute;
    z-index:5;
    left:5.5%;
    top:50%;
    transform:translateY(-50%);
    width:min(530px,90%);
    display:flex;
    flex-direction:column;
    align-items:flex-start;
}

.hero-kicker{
    color:var(--gold);
    font-family:Montserrat,sans-serif;
    font-size:11px;
    font-weight:900;
    letter-spacing:2px;
    text-transform:uppercase;
    margin-bottom:14px;
}

.hero-title{
    font-family:Montserrat,sans-serif;
    color:#fff;
    font-size:clamp(36px,4.5vw,68px);
    line-height:1;
    font-weight:900;
    text-transform:uppercase;
}

.hero-title span{
    color:var(--gold);
}

.hero-description{
    max-width:470px;
    color:#d1dbd6;
    margin-top:16px;
    font-size:14px;
    line-height:1.55;
}

.hero-buttons{
    display:flex;
    gap:10px;
    margin-top:22px;
    z-index:6;
}

.hero-button{
    min-height:45px;
    padding:0 20px;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    border-radius:99px;
    font-size:12px;
    font-weight:900;
    transition:.22s;
    border:none;
    cursor:pointer;
}

.hero-button.green{
    color:#fff;
    background:linear-gradient(135deg,#19c982,#0a8955);
    box-shadow:0 8px 25px rgba(25,201,130,.22);
}

.hero-button.white{
    background:#fff;
    color:#111;
}

.hero-button:hover{
    transform:translateY(-2px);
}

/* ======================================================
   HERO SEARCH
====================================================== */

.hero-search{
    width:min(430px,100%);
    height:50px;
    margin-top:20px;
    display:flex;
    align-items:center;
    background:rgba(8,20,15,.95);
    border:1px solid rgba(239,210,143,.48);
    border-radius:11px;
    overflow:hidden;
    z-index:6;
}

.hero-search-icon{
    width:45px;
    display:flex;
    justify-content:center;
    align-items:center;
    color:#fff;
    font-size:18px;
}

.hero-search input{
    flex:1;
    height:100%;
    border:0;
    outline:0;
    background:transparent;
    color:#fff;
    font-size:13px;
    min-width:0;
}

.hero-search input::placeholder{
    color:#829088;
}

.hero-search button{
    width:43px;
    height:38px;
    margin-right:5px;
    border:0;
    border-radius:8px;
    background:linear-gradient(
        135deg,
        var(--gold),
        var(--gold-dark)
    );
    color:#0a0d0b;
    font-weight:900;
    cursor:pointer;
}

/* ======================================================
   SECTIONS
====================================================== */

.section{
    margin-top:45px;
}

.section-head{
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    padding-bottom:13px;
    margin-bottom:18px;
    border-bottom:1px solid rgba(239,210,143,.14);
    gap:15px;
}

.section-title{
    font-family:Montserrat,sans-serif;
    font-size:24px;
    font-weight:900;
    text-transform:uppercase;
}

.section-title span{
    color:var(--gold);
}

.section-link{
    color:var(--gold);
    font-size:12px;
    font-weight:900;
    white-space:nowrap;
}

/* ======================================================
   HOME SHIRT ROW
====================================================== */

.home-shirt-row{
    display:grid;
    grid-auto-flow:column;
    grid-auto-columns:245px;
    gap:15px;
    overflow-x:auto;
    padding-bottom:12px;
}

.home-shirt-row::-webkit-scrollbar{
    height:5px;
}

.home-shirt-row::-webkit-scrollbar-thumb{
    background:rgba(239,210,143,.3);
    border-radius:10px;
}

/* ======================================================
   EXPLORE FILTERS
====================================================== */

.explore-filters{
    display:flex;
    flex-wrap:wrap;
    align-items:center;
    gap:10px;
    margin-bottom:22px;
}

.filter-group{
    position:relative;
}

.filter-trigger{
    min-height:42px;
    padding:0 13px;
    display:flex;
    align-items:center;
    gap:8px;
    background:#030806;
    border:1px solid rgba(239,210,143,.25);
    color:#fff;
    border-radius:10px;
    font-size:12px;
    font-weight:800;
    cursor:pointer;
    transition:.2s;
}

.filter-trigger:hover,
.filter-trigger.open{
    border-color:var(--gold);
    background:#09160f;
}

.filter-arrow{
    color:var(--gold);
    font-size:9px;
    transition:.2s;
}

.filter-trigger.open .filter-arrow{
    transform:rotate(180deg);
}

.filter-count{
    min-width:18px;
    height:18px;
    padding:0 5px;
    display:none;
    align-items:center;
    justify-content:center;
    border-radius:99px;
    background:var(--gold);
    color:#000;
    font-size:9px;
    font-weight:900;
}

.filter-count.show{
    display:flex;
}

.filter-dropdown{
    position:absolute;
    z-index:200;
    top:calc(100% + 8px);
    left:0;
    width:245px;
    max-height:320px;
    overflow-y:auto;
    padding:9px;
    display:none;
    background:#08150f;
    border:1px solid rgba(239,210,143,.28);
    border-radius:13px;
    box-shadow:0 20px 50px rgba(0,0,0,.6);
}

.filter-dropdown.open{
    display:block;
}

.filter-dropdown::-webkit-scrollbar{
    width:5px;
}

.filter-dropdown::-webkit-scrollbar-thumb{
    background:rgba(239,210,143,.25);
    border-radius:10px;
}

.filter-option{
    display:flex;
    align-items:center;
    gap:9px;
    width:100%;
    padding:10px;
    border-radius:8px;
    color:#d5dfda;
    background:transparent;
    cursor:pointer;
    font-size:12px;
    font-weight:600;
}

.filter-option:hover{
    background:rgba(239,210,143,.08);
    color:#fff;
}

.filter-option input{
    width:16px;
    height:16px;
    accent-color:var(--gold);
    flex-shrink:0;
}

.filter-reset{
    min-height:42px;
    padding:0 13px;
    border-radius:10px;
    border:1px solid rgba(239,210,143,.18);
    background:rgba(255,255,255,.025);
    color:#96a49d;
    font-size:11px;
    font-weight:800;
    cursor:pointer;
}

.filter-reset:hover{
    color:#fff;
    border-color:var(--gold);
}

/* ======================================================
   EXPLORE GRID
====================================================== */

.explore-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(235px,1fr));
    gap:18px;
}

/* ======================================================
   SHIRTS
====================================================== */

.shirt-card{
    background:linear-gradient(180deg,#0b1913,#06100c);
    border:1px solid var(--line);
    border-radius:15px;
    overflow:hidden;
    transition:.28s;
}

.shirt-card:hover{
    transform:translateY(-5px);
    border-color:var(--gold);
    box-shadow:0 15px 35px rgba(0,0,0,.35);
}

.shirt-visual{
    position:relative;
    width:100%;
    aspect-ratio:1/1;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    background:radial-gradient(
        circle,
        #183c2a,
        #08150f 60%,
        #030805
    );
    font-size:64px;
}

.shirt-visual > img{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:contain;
    padding:10%;
}

.shirt-condition{
    position:absolute;
    top:9px;
    left:9px;
    z-index:3;
    color:var(--gold);
    padding:4px 8px;
    background:rgba(0,0,0,.75);
    border:1px solid rgba(239,210,143,.3);
    border-radius:15px;
    font-size:8px;
    font-weight:900;
}

.shirt-boost-badge{
    position:absolute;
    top:9px;
    right:9px;
    z-index:4;
    background:linear-gradient(135deg,var(--gold),var(--gold-dark));
    color:#000;
    padding:4px 8px;
    border-radius:15px;
    font-size:8px;
    font-weight:900;
}

.shirt-info{
    padding:14px;
}

.shirt-club{
    color:#83948c;
    font-size:9px;
    font-weight:900;
    text-transform:uppercase;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.shirt-name{
    color:#fff;
    font-size:13px;
    font-weight:900;
    margin-top:4px;
    min-height:36px;
    line-height:1.3;
}

.shirt-footer{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-top:12px;
    gap:8px;
}

.shirt-price{
    color:var(--green);
    font-size:14px;
    font-weight:900;
    white-space:nowrap;
}

.shirt-view{
    color:var(--gold);
    background:rgba(239,210,143,.07);
    border:1px solid rgba(239,210,143,.27);
    border-radius:7px;
    padding:6px 10px;
    font-size:9px;
    font-weight:900;
    cursor:pointer;
    transition:.2s;
}

.shirt-view:hover{
    background:var(--gold-dark);
    color:#000;
}

/* ======================================================
   EXPLORE BANNER
====================================================== */

.explore-banner{
    position:relative;
    width:100%;
    overflow:hidden;
    border-radius:20px;
    border:1px solid var(--line);
    background:#020504;
}

.explore-banner img{
    width:100%;
    height:auto;
    display:block;
    object-fit:contain;
    position:relative;
    z-index:1;
}

.explore-overlay{
    position:absolute;
    inset:0;
    z-index:2;
    display:flex;
    flex-direction:column;
    align-items:flex-start;
    justify-content:center;
    padding:clamp(28px,5vw,60px) clamp(20px,4.5vw,55px);
    background:linear-gradient(
        90deg,
        rgba(2,5,4,.9) 0%,
        rgba(2,5,4,.55) 45%,
        transparent 75%
    );
    pointer-events:none;
}

.explore-kicker{
    color:var(--gold);
    font-family:Montserrat,sans-serif;
    font-size:clamp(10px,1.1vw,12px);
    font-weight:900;
    letter-spacing:3px;
    text-transform:uppercase;
    margin-bottom:14px;
    display:flex;
    align-items:center;
    gap:10px;
}

.explore-kicker::before{
    content:"";
    width:26px;
    height:2px;
    background:var(--gold);
    display:inline-block;
}

.explore-title{
    font-family:Montserrat,sans-serif;
    font-size:clamp(32px,5.5vw,64px);
    line-height:1.05;
    font-weight:900;
    text-transform:uppercase;
    text-shadow:0 6px 30px rgba(0,0,0,.55);
}

.explore-title span{
    background:linear-gradient(
        135deg,
        var(--gold),
        var(--gold-dark)
    );
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
}

.explore-subtitle{
    margin-top:16px;
    max-width:460px;
    color:#d1dbd6;
    font-size:clamp(13px,1.4vw,15px);
    line-height:1.6;
}

/* ======================================================
   SEARCH OVERLAY
====================================================== */

.explore-search-overlay{
    position:absolute;
    left:4.4%;
    top:74.8%;
    width:44.8%;
    height:11.9%;
    z-index:3;
}

.explore-search-overlay input{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    padding-left:14%;
    padding-right:14%;
    background:transparent;
    border:0;
    outline:0;
    color:#fff;
    font-size:clamp(12px,1.5vw,15px);
}

.explore-search-overlay input::placeholder{
    color:rgba(255,255,255,.4);
}

.explore-search-overlay button{
    position:absolute;
    right:0;
    top:0;
    width:14%;
    height:100%;
    background:transparent;
    border:0;
    cursor:pointer;
}

/* ======================================================
   SELL
====================================================== */

.sell-box{
    max-width:680px;
    margin:50px auto;
    padding:40px clamp(20px,4vw,40px);
    text-align:left;
    background:#07130e;
    border:1px solid var(--line);
    border-radius:20px;
}

.sell-box h1{
    color:var(--gold);
    font-family:Montserrat,sans-serif;
    font-size:32px;
    text-align:center;
}

.sell-intro{
    color:#a8b5ae;
    line-height:1.7;
    margin:15px 0 30px;
    text-align:center;
    font-size:14px;
}

.form-group{
    margin-bottom:18px;
}

.form-group label{
    display:block;
    color:var(--gold);
    font-size:11px;
    font-weight:800;
    text-transform:uppercase;
    letter-spacing:.5px;
    margin-bottom:7px;
}

.form-group input[type=text],
.form-group input[type=number],
.form-group select,
.form-group textarea{
    width:100%;
    padding:13px 14px;
    background:#030806;
    border:1px solid rgba(239,210,143,.25);
    border-radius:10px;
    color:#fff;
    font-size:16px;
    outline:0;
}

.form-group textarea{
    resize:vertical;
    min-height:90px;
}

.form-group input:focus,
.form-group select:focus,
.form-group textarea:focus{
    border-color:var(--gold);
}

.form-row{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:14px;
}

.type-checkboxes{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
}

.type-checkbox-label{
    display:flex;
    align-items:center;
    gap:8px;
    font-size:13px;
    color:#fff;
    cursor:pointer;
    background:#030806;
    padding:8px 12px;
    border:1px solid rgba(239,210,143,.25);
    border-radius:8px;
}

.type-checkbox-label input{
    accent-color:var(--gold);
    width:16px;
    height:16px;
}

.photo-dropzone{
    border:2px dashed rgba(239,210,143,.35);
    border-radius:14px;
    padding:26px 16px;
    text-align:center;
    cursor:pointer;
    color:#a8b5ae;
    font-size:13px;
    transition:.2s;
}

.photo-dropzone:hover,
.photo-dropzone.dragover{
    border-color:var(--gold);
    color:var(--gold);
    background:rgba(239,210,143,.05);
}

.photo-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(80px,1fr));
    gap:10px;
    margin-top:14px;
}

.photo-thumb{
    position:relative;
    aspect-ratio:1/1;
    border-radius:10px;
    overflow:hidden;
    border:1px solid var(--line);
}

.photo-thumb img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.photo-thumb button{
    position:absolute;
    top:4px;
    right:4px;
    width:22px;
    height:22px;
    border-radius:50%;
    border:0;
    background:rgba(0,0,0,.8);
    color:#fff;
    font-size:13px;
    cursor:pointer;
}

.boost-box{
    display:flex;
    align-items:flex-start;
    gap:12px;
    padding:14px;
    margin-bottom:14px;
    border:1px solid rgba(239,210,143,.3);
    border-radius:12px;
    background:rgba(239,210,143,.05);
}

.boost-box input{
    margin-top:3px;
    width:18px;
    height:18px;
    accent-color:var(--gold);
}

.boost-box-text strong{
    color:var(--gold);
    display:block;
    font-size:13px;
    margin-bottom:3px;
}

.boost-box-text span{
    color:#a8b5ae;
    font-size:12px;
    line-height:1.5;
}

.boost-options{
    display:flex;
    flex-direction:column;
    gap:10px;
}

.boost-option{
    display:flex;
    align-items:center;
    gap:12px;
    padding:13px 14px;
    border:1px solid rgba(239,210,143,.22);
    border-radius:12px;
    cursor:pointer;
    background:rgba(255,255,255,.02);
    transition:.15s;
}

.boost-option input[type=radio]{
    width:18px;
    height:18px;
    accent-color:var(--gold);
}

.boost-option-text{
    flex:1;
}

.boost-option-text strong{

<div id="google_translate_element"></div>

<script>
/*
   The site's own text is written in Dutch (nl).
   English is the default language shown to visitors,
   so on first visit (no saved preference yet) we
   translate straight to English before Google's
   widget even loads. On every load we make sure the
   googtrans cookie matches the saved preference,
   since that cookie is what the widget reads.
*/

(function(){

    var savedLang=
        localStorage.getItem("fsm_language");

    if(!savedLang){
        savedLang="en";
        localStorage.setItem(
            "fsm_language",
            savedLang
        );
    }

    document.cookie=
        "googtrans=; expires=Thu, 01 Jan 1970 00:00:00 GMT; path=/;";

    if(savedLang!=="nl"){
        document.cookie=
            "googtrans=/nl/"+savedLang+"; path=/;";
    }

})();

function googleTranslateElementInit(){

    new google.translate.TranslateElement(
        {
            pageLanguage:"nl",
            autoDisplay:false
        },
        "google_translate_element"
    );

}
</script>

/* ======================================================
   LOCAL STORAGE LISTINGS
====================================================== */

const LISTINGS_KEY="fsm_user_listings";


function getListings(){

    try{
        const data=
            JSON.parse(
                localStorage.getItem(LISTINGS_KEY)
            );

        return Array.isArray(data)
            ? data
            : [];

    }catch(error){

        return [];

    }

}


function saveListings(list){

    try{

        localStorage.setItem(
            LISTINGS_KEY,
            JSON.stringify(list)
        );

        return true;

    }catch(error){

        return false;

    }

}


/* ======================================================
   ESCAPE HTML
====================================================== */

function escapeHtml(str){

    return String(str)
        .replace(
            /[&<>"']/g,
            character=>({

                "&":"&amp;",
                "<":"&lt;",
                ">":"&gt;",
                '"':"&quot;",
                "'":"&#39;"

            }[character])
        );

}


/* ======================================================
   COMBINE SHIRTS
====================================================== */

function combinedShirts(){

    const listings=getListings();

    const now=Date.now();

    let changed=false;


    listings.forEach(listing=>{

        if(
            listing.boosted &&
            listing.boostExpiresAt &&
            listing.boostExpiresAt <= now
        ){

            listing.boosted=false;

            changed=true;

        }

    });


    if(changed){
        saveListings(listings);
    }


    const userShirts=
        listings.map(listing=>({

            id:"u"+listing.id,

            club:listing.club,

            name:listing.name,

            price:listing.price,

            condition:listing.condition,

            size:listing.size,

            type:listing.type || ["Club"],

            icon:"👕",

            image:
                listing.images &&
                listing.images.length
                    ? listing.images[0]
                    : null,

            boosted:!!listing.boosted

        }));


    const boosted=
        userShirts
            .filter(shirt=>shirt.boosted);


    const normal=
        userShirts
            .filter(shirt=>!shirt.boosted);


    return [
        ...boosted,
        ...normal,
        ...shirtsData
    ];

}


/* ======================================================
   SHIRT CARD
====================================================== */

function makeShirt(shirt){

    const visual=
        shirt.image
        ? `
            <img
                src="${shirt.image}"
                alt="${escapeHtml(shirt.name)}"
            >
          `
        : `
            <div>👕</div>
          `;


    return `

<article class="shirt-card">

    <div class="shirt-visual">

        <div class="shirt-condition">
            ${escapeHtml(shirt.condition)}
        </div>

        ${
            shirt.boosted
            ? `<div class="shirt-boost-badge">BOOST</div>`
            : ""
        }

        ${visual}

    </div>


    <div class="shirt-info">

        <div class="shirt-club">
            ${shirt.icon}
            ${escapeHtml(shirt.club)}
        </div>


        <div class="shirt-name">
            ${escapeHtml(shirt.name)}
        </div>


        <div class="shirt-footer">

            <div class="shirt-price">
                ${escapeHtml(shirt.price)}
            </div>

            <button
                class="shirt-view"
                data-club="${escapeHtml(shirt.club)}"
                data-price="${escapeHtml(shirt.price)}"
            >
                Bekijken
            </button>

        </div>

    </div>

</article>

`;

}

    /* ======================================
       PHOTO UPLOAD
    ====================================== */

    const photoDropzone=
        document.getElementById(
            "photoDropzone"
        );


    const photoInput=
        document.getElementById(
            "photoInput"
        );


    const photoGrid=
        document.getElementById(
            "photoGrid"
        );


    let selectedImages=[];


    photoDropzone.addEventListener(
        "click",
        ()=>{
            photoInput.click();
        }
    );


    photoInput.addEventListener(
        "change",
        ()=>{
            processFiles(
                Array.from(
                    photoInput.files
                )
            );
        }
    );


    function processFiles(files){

        const remaining=
            5-selectedImages.length;


        if(remaining<=0){
            return;
        }


        files
            .slice(0,remaining)
            .forEach(file=>{

                if(!file.type.startsWith("image/")){
                    return;
                }


                const reader=
                    new FileReader();


                reader.onload=event=>{

                    selectedImages.push(
                        event.target.result
                    );


                    renderPhotos();

                };


                reader.readAsDataURL(file);

            });

    }


    function renderPhotos(){

        photoGrid.innerHTML=
            selectedImages
                .map(
                    (src,index)=>`

<div class="photo-thumb">

<img
src="${src}"
alt="Foto ${index+1}"
>

<button
type="button"
data-photo-index="${index}"
>
×
</button>

</div>

`
                )
                .join("");


        photoGrid
            .querySelectorAll(
                "[data-photo-index]"
            )
            .forEach(button=>{

                button.addEventListener(
                    "click",
                    ()=>{

                        selectedImages.splice(
                            Number(
                                button.dataset.photoIndex
                            ),
                            1
                        );

                        renderPhotos();

                    }
                );

            });

    }


    /* ======================================
       FORM
    ====================================== */

    const form=
        document.getElementById(
            "sellForm"
        );


    form.addEventListener(
        "submit",
        event=>{

            event.preventDefault();


            const club=
                document.getElementById(
                    "sellClub"
                ).value.trim();


            const priceRaw=
                document.getElementById(
                    "sellPrice"
                ).value;


            const name=
                document.getElementById(
                    "sellName"
                ).value.trim();


            const condition=
                document.getElementById(
                    "sellCondition"
                ).value;


            const size=
                document.getElementById(
                    "sellMaat"
                ).value;


            const description=
                document.getElementById(
                    "sellDescription"
                ).value.trim();


            if(
                !club ||
                !priceRaw ||
                !name ||
                !condition
            ){

                alert(
                    "Vul alle verplichte velden in."
                );

                return;

            }


            if(
                selectedImages.length===0
            ){

                document
                    .getElementById(
                        "photoError"
                    )
                    .classList.add("show");

                return;

            }


            document
                .getElementById(
                    "photoError"
                )
                .classList.remove("show");


            const boost=
                document
                    .querySelector(
                        'input[name="boostOption"]:checked'
                    );


            let boosted=false;
            let boostExpiresAt=null;


            if(
                boost &&
                boost.value!=="none"
            ){

                boosted=true;


                boostExpiresAt=
                    Date.now()+
                    (
                        boost.value==="24h"
                        ?24*60*60*1000
                        :7*24*60*60*1000
                    );

            }


            const selectedTypes=
                Array.from(
                    document.querySelectorAll(
                        'input[name="sellType"]:checked'
                    )
                )
                .map(
                    checkbox=>checkbox.value
                );


            const newShirt={

                id:Date.now(),

                club:club,

                price:
                    "€ "+
                    parseFloat(priceRaw)
                    .toFixed(2)
                    .replace(".",","),

                name:name,

                condition:condition,

                size:size,

                type:
                    selectedTypes.length
                    ?selectedTypes
                    :["Club"],

                description:description,

                boosted:boosted,

                boostExpiresAt:boostExpiresAt,

                images:selectedImages

            };


            const listings=
                getListings();


            listings.push(
                newShirt
            );


            saveListings(
                listings
            );


            showToast(
                "Shirt succesvol geplaatst!"
            );


            setTimeout(
                ()=>{
                    location.hash="#/explore";
                },
                400
            );

        }
    );

}


/* ======================================================

====================================================== */

function showToast(message){

    const element=
        document.getElementById(
            "toast"
        );


    element.textContent=
        message;


    element.classList.add("show");


    clearTimeout(
        window.toastTimeout
    );


    window.toastTimeout=
        setTimeout(
            ()=>{
                element.classList.remove("show");
            },
            2500
        );

}

    const hash=
        location.hash || "#/";


    document
        .querySelectorAll("nav a")
        .forEach(
            link=>
                link.classList.remove("active")
        );


    if(
        hash.startsWith(
            "#/explore"
        )
    ){

        document
            .getElementById("navExplore")
            ?.classList.add("active");

    }

    else if(
        hash.startsWith(
            "#/sell"
        )
    ){

        document
            .getElementById("navSell")
            ?.classList.add("active");

    }
    else if(hash.startsWith("#/inbox") || hash.startsWith("#/profile") || hash.startsWith("#/badges") || hash.startsWith("#/favorites") || hash.startsWith("#/wallet") || hash.startsWith("#/orders") || hash.startsWith("#/promote") || hash.startsWith("#/chat") || hash.startsWith("#/product") || hash.startsWith("#/checkout") || hash.startsWith("#/order") || hash.startsWith("#/track") || hash.startsWith("#/offers")){
         if(window.__fsmRoute) window.__fsmRoute(hash);
         else renderHome();
      }
      else{
         renderHome();
      }

}

/* ======================================================
   LANGUAGE
====================================================== */

const langBtn=
    document.getElementById(
        "languageButton"
    );


const langModal=
    document.getElementById(
        "languageModal"
    );


const langClose=
    document.getElementById(
        "languageClose"
    );


const langList=
    document.getElementById(
        "languageList"
    );


const langSearch=
    document.getElementById(
        "languageSearch"
    );


let activeLang=
    localStorage.getItem(
        "fsm_language"
    ) || "en";


function renderLanguages(
    query=""
){

    const q=
        query
            .toLowerCase()
            .trim();


    const filtered=
        languages.filter(
            language=>
                language.name
                    .toLowerCase()
                    .includes(q)
                ||
                language.code
                    .toLowerCase()
                    .includes(q)
        );


    langList.innerHTML=
        filtered
            .map(
                language=>`

<button
type="button"
class="language-item ${
    language.code===activeLang
    ?"active"
    :""
}"
data-code="${language.code}"
>

<span class="language-flag">
${language.flag}
</span>

<span>
${language.name}
</span>

</button>

`
            )
            .join("");


}


langBtn.addEventListener(
    "click",
    ()=>{

        renderLanguages();

        langModal.classList.add(
            "open"
        );

        setTimeout(
            ()=>{
                langSearch.focus();
            },
            100
        );

    }
);


langClose.addEventListener(
    "click",
    ()=>{

        langModal.classList.remove(
            "open"
        );

    }
);


langSearch.addEventListener(
    "input",
    event=>{

        renderLanguages(
            event.target.value
        );

    }
);


langList.addEventListener(
    "click",
    event=>{

        const button=
            event.target.closest(
                ".language-item"
            );


        if(!button){
            return;
        }


        activeLang=
            button.dataset.code;


        localStorage.setItem(
            "fsm_language",
            activeLang
        );


        /*
           Google Translate cookie
           (site's own text is Dutch, so we always
           translate FROM nl)
        */

        document.cookie=
            "googtrans=; expires=Thu, 01 Jan 1970 00:00:00 GMT; path=/;";


        if(
            activeLang!=="nl"
        ){

            document.cookie=
                "googtrans=/nl/"+
                activeLang+
                "; path=/;";

        }


        langModal.classList.remove(
            "open"
        );


        location.reload();

    }
);


/* ======================================================
   CURRENT LANGUAGE BUTTON
====================================================== */

function updateLanguageButton(){

    const language=
        languages.find(
            item=>item.code===activeLang
        )
        ||
        languages.find(
            item=>item.code==="nl"
        );


    if(!language){
        return;
    }


    document
        .getElementById(
            "currentFlag"
        )
        .textContent=
            language.flag;


    document
        .getElementById(
            "currentCode"
        )
        .textContent=
            language.code
                .split("-")[0]
                .toUpperCase();

}


/* ======================================================
   CLOSE LANGUAGE MODAL WHEN CLICKING OUTSIDE
====================================================== */

langModal.addEventListener(
    "click",
    event=>{

        if(
            event.target===
            langModal
        ){

            langModal.classList.remove(
                "open"
            );

        }

    }
);


/* ======================================================
   ESCAPE KEY
====================================================== */

document.addEventListener(
    "keydown",
    event=>{

        if(
            event.key==="Escape"
        ){

            langModal.classList.remove(
                "open"
            );


            document
                .querySelectorAll(
                    ".filter-dropdown"
                )
                .forEach(
                    menu=>
                        menu.classList.remove("open")
                );


            document
                .querySelectorAll(
                    ".filter-trigger"
                )
                .forEach(
                    button=>
                        button.classList.remove("open")
                );

        }

    }
);


/* ======================================================
   INIT
====================================================== */

updateLanguageButton();

renderLanguages();

router();

</script>

.fsm-btn.green{background:linear-gradient(135deg,#19c982,#0a8955);color:#fff}
.fsm-btn.dark{background:#07130e;border:1px solid var(--fsm-line);color:#fff}
.fsm-btn.full{width:100%}
.fsm-menu{display:grid;gap:8px;margin-top:12px}
.fsm-menu button{display:flex;align-items:center;gap:12px;width:100%;padding:15px;background:#07130e;border:1px solid rgba(239,210,143,.12);border-radius:13px;color:#fff;text-align:left;cursor:pointer}
.fsm-menu button:hover{border-color:var(--gold)}
.fsm-menu .arrow{margin-left:auto;color:var(--gold)}
.fsm-progress{height:9px;background:#17251f;border-radius:99px;overflow:hidden;margin-top:10px}
.fsm-progress>i{display:block;height:100%;width:0;background:linear-gradient(90deg,#18bf77,var(--gold));border-radius:99px}
.fsm-tabs{display:flex;border-bottom:1px solid var(--fsm-line);margin-bottom:15px}
.fsm-tab{flex:1;background:none;border:0;color:#829088;padding:13px 5px;font-weight:900;cursor:pointer}
.fsm-tab.active{color:#fff;border-bottom:2px solid var(--gold)}
.fsm-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.fsm-item{overflow:hidden;border:1px solid var(--fsm-line);border-radius:14px;background:#07130e}
.fsm-item-img{aspect-ratio:1;display:grid;place-items:center;background:radial-gradient(circle,#183c2a,#06100c 68%);overflow:hidden}
.fsm-item-img img{width:100%;height:100%;object-fit:contain;padding:7%}
.fsm-item-body{padding:10px}
.fsm-price{font-weight:900;color:var(--green)}
.fsm-meta{font-size:10px;color:#87958e;margin-top:3px}
.fsm-promote{border:1px solid rgba(239,210,143,.25);border-radius:15px;padding:15px;background:linear-gradient(135deg,rgba(239,210,143,.09),rgba(24,191,119,.05));margin-bottom:14px}
.fsm-review{padding:14px 0;border-bottom:1px solid rgba(255,255,255,.08)}
.fsm-stars{color:var(--gold);letter-spacing:2px}
.fsm-empty{text-align:center;padding:48px 15px;color:#8b9992}
.fsm-empty .ico{font-size:42px;margin-bottom:10px}
.fsm-list{display:grid;gap:9px}
.fsm-list button{display:flex;align-items:center;gap:12px;width:100%;padding:15px;border:1px solid rgba(239,210,143,.12);background:#07130e;color:#fff;border-radius:13px;text-align:left;cursor:pointer}
.fsm-bottomnav{position:fixed;left:0;right:0;bottom:0;z-index:3500;display:none;background:rgba(3,8,6,.97);border-top:1px solid rgba(239,210,143,.16);padding:7px 8px calc(7px + env(safe-area-inset-bottom));grid-template-columns:repeat(5,1fr)}
.fsm-bottomnav a{display:flex;flex-direction:column;align-items:center;gap:3px;color:#8d9b94;font-size:10px;font-weight:800;padding:6px 2px;border-radius:9px}
.fsm-bottomnav a.active{color:#18bf77;background:rgba(24,191,119,.08)}
.fsm-chat{display:flex;flex-direction:column;min-height:62vh}
.fsm-messages{display:flex;flex-direction:column;gap:8px;overflow:auto;padding:8px 0 15px;flex:1}
.fsm-msg{max-width:78%;padding:10px 12px;border-radius:13px;background:#0b1913;border:1px solid rgba(255,255,255,.07)}
.fsm-msg.mine{align-self:flex-end;background:#08784c}
.fsm-msg.system{align-self:center;max-width:94%;background:#171d1a;border-color:rgba(239,210,143,.22);text-align:center}
.fsm-msg small{display:block;color:#91a29a;font-size:9px;margin-top:4px}
.fsm-chatbar{display:flex;gap:7px;padding-top:10px;border-top:1px solid rgba(255,255,255,.08)}
.fsm-chatbar input,.fsm-input{flex:1;min-height:43px;border:1px solid rgba(239,210,143,.24);border-radius:10px;background:#030806;color:#fff;padding:0 12px;outline:0}
.fsm-translate{display:flex;gap:6px;margin-top:6px}
.fsm-translate button{font-size:9px;background:none;border:0;color:var(--gold);cursor:pointer;padding:0}
.fsm-order-status{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}
.fsm-pill{padding:7px 10px;border-radius:99px;background:#07130e;border:1px solid var(--fsm-line);font-size:10px}
.fsm-form{display:grid;gap:11px}
.fsm-form label{font-size:10px;font-weight:900;color:var(--gold);text-transform:uppercase}
.fsm-form textarea,.fsm-form input,.fsm-form select{width:100%;min-height:43px;background:#030806;color:#fff;border:1px solid rgba(239,210,143,.24);border-radius:10px;padding:10px;outline:0}
.fsm-offer{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:end}
.fsm-amount{font-size:24px;font-weight:900;color:var(--green)}
.fsm-note{font-size:10px;color:#83918b;line-height:1.5}
@media(max-width:650px){
 .fsm-shell{padding:12px 10px 90px}.fsm-topbar h1{font-size:21px}.fsm-grid{gap:9px}.fsm-bottomnav{display:grid}
}
@media(min-width:651px){.fsm-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.fsm-inbox-row{width:100%;display:flex!important;align-items:center;gap:11px;text-align:left;background:transparent;border:0;border-bottom:1px solid rgba(255,255,255,.07);color:#fff;padding:13px 4px;cursor:pointer}
.fsm-inbox-row:last-child{border-bottom:0}
.fsm-inbox-copy{min-width:0;flex:1}
.fsm-inbox-copy strong,.fsm-inbox-copy .fsm-muted{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fsm-inbox-side{display:flex;align-items:center;gap:7px}
.fsm-unread{min-width:20px;height:20px;border-radius:999px;background:var(--gold);color:#06100b;display:grid;place-items:center;font-size:10px;font-weight:900}
.fsm-chat-user{display:flex;align-items:center;gap:10px;padding:10px 0 14px;border-bottom:1px solid rgba(255,255,255,.08)}
.fsm-msg-text{white-space:pre-wrap;word-break:break-word}
.fsm-msg small{display:block;margin-top:5px;opacity:.55}
.fsm-translate{display:flex;gap:6px;margin-top:7px}
.fsm-translate button{background:transparent;border:0;color:var(--gold);font-size:9px;padding:0;cursor:pointer}
@media(max-width:650px){.fsm-inbox-row{padding:12px 2px}.fsm-chatbar{position:sticky;bottom:75px}}
</style>
<style id="fsm-integrated-profile-chat">
.market-nav-link{
  color:#dfe8e3!important;
  text-decoration:none;
  font-weight:800;
  transition:.2s;
}
.market-nav-link:hover{color:var(--gold)!important}
@media(max-width:900px){
  .mobile-nav a{min-width:72px;text-align:center}
}
</style>
<script>
(function(){
"use strict";
const API_BASE = window.FSM_API_BASE || "/api";
const STORE="fsm_marketplace_v3";
function readLoggedInUser(){
  const keys=["fsm_user","currentUser","loggedInUser","user","account"];
  for(const key of keys){
    try{
      const raw=localStorage.getItem(key);
      if(!raw) continue;
      const v=JSON.parse(raw);
      const name=typeof v==="string"?v:(v?.username||v?.name||v?.user?.username);
      if(name) return {...(typeof v==="object"?v:{}),username:String(name)};
    }catch(e){
      const raw=localStorage.getItem(key);
      if(raw && raw.trim()) return {username:raw.trim()};
    }
  }
  if(window.currentUser){
    const v=window.currentUser;
    const name=typeof v==="string"?v:(v?.username||v?.name);
    if(name) return {...(typeof v==="object"?v:{}),username:String(name)};
  }
  return null;
}
const existing=JSON.parse(localStorage.getItem(STORE)||"null");
const logged=readLoggedInUser();
const demo=existing||{
  user:logged||{username:"Gebruiker",verified:[],bio:""},
  favorites:[],orders:[],messages:[],reviews:[],offers:[],wallet:{pending:0,balance:0},paymentMethod:null
};
if(logged && logged.username) demo.user={...demo.user,...logged,username:logged.username};
if(!demo.messages || !demo.messages.length){
  const me=demo.user.username;
  demo.messages=[
    {id:"demo1",chat:"ShirtCollector",from:"ShirtCollector",to:me,text:"Hey! Is het Anderlecht-shirt nog beschikbaar?",system:false,date:new Date(Date.now()-1000*60*18).toISOString()},
    {id:"demo2",chat:"VintageKits",from:me,to:"VintageKits",text:"Ja, ik heb interesse. Kan je nog wat foto's sturen?",system:false,date:new Date(Date.now()-1000*60*42).toISOString()},
    {id:"demo3",chat:"FootballFan24",from:"FootballFan24",to:me,text:"Zou je €75 accepteren voor het shirt?",system:false,date:new Date(Date.now()-1000*60*75).toISOString()},
    {id:"demo4",chat:"RetroJerseys",from:me,to:"RetroJerseys",text:"Hallo! Wanneer kan je het pakket verzenden?",system:false,date:new Date(Date.now()-1000*60*130).toISOString()}
  ];
}
function save(){localStorage.setItem(STORE,JSON.stringify(demo))}\nif(!existing || !existing.messages || !existing.messages.length) save()
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}
function money(n,c){
 const map={EUR:"€",GBP:"£",USD:"$"}; return (map[c]||"€")+Number(n||0).toFixed(2);
}
function currency(){return (localStorage.getItem("fsm_currency")||"EUR").toUpperCase()}
function app(){return document.getElementById("app")}
function hash(){return location.hash||"#/"}
function go(h){location.hash=h}
async function api(path,opts={}){
 try{const r=await fetch(API_BASE+path,{credentials:"include",headers:{"Content-Type":"application/json",...(opts.headers||{})},...opts});if(!r.ok)throw new Error("HTTP "+r.status);return await r.json()}catch(e){return null}
}
function initials(name){return (name||"?").slice(0,1).toUpperCase()}
function avatar(name,sm=false){return `<div class="fsm-avatar ${sm?"sm":""}">${esc(initials(name))}</div>`}
function nav(active="profile"){
 return `<nav class="fsm-bottomnav">
 <a href="#/" class="${active==="home"?"active":""}">⌂<span>Home</span></a>
 <a href="#/explore" class="${active==="browse"?"active":""}">◉<span>Bladeren</span></a>
 <a href="#/sell" class="${active==="sell"?"active":""}">＋<span>Verkopen</span></a>
 <a href="#/inbox" class="${active==="inbox"?"active":""}">✉<span>Inbox</span></a>
 <a href="#/profile" class="${active==="profile"?"active":""}">●<span>Profiel</span></a>
 </nav>`;
}
function shell(title,body,active="profile",back=true){
 app().innerHTML=`<div id="fsm-marketplace"><div class="fsm-shell">
 <div class="fsm-topbar">${back?`<button class="fsm-back" onclick="go('#/profile')">←</button>`:"<span></span>"}<h1>${esc(title)}</h1><span></span></div>${body}</div>${nav(active)}</div>`;
}
function listings(){
 try{return typeof getListings==="function"?getListings():[]}catch(e){return []}
}
function allListings(){
 const base=typeof combinedShirts==="function"?combinedShirts():[];
 return base.map((x,i)=>({...x,_idx:i}));
}
function itemFromId(id){
 const arr=allListings(); return arr.find(x=>String(x.id)===String(id)||String(x._idx)===String(id))||arr[0];
}
function profile(){
 const reviews=demo.reviews.filter(r=>r.to===demo.user.username||r.from===demo.user.username);
 shell("Profiel",`
 <section class="fsm-card"><div class="fsm-row">${avatar(demo.user.username)}
 <div style="flex:1"><h2>${esc(demo.user.username)}</h2><div class="fsm-muted">Mijn account</div></div>
 <button class="fsm-btn dark" onclick="go('#/profile/public')">Mijn advertenties bekijken</button></div></section>
 <section class="fsm-card" style="margin-top:12px;cursor:pointer" onclick="go('#/badges')">
 <div class="fsm-row fsm-between"><strong>Verdiende badges</strong><span class="fsm-gold">0 van 2 ›</span></div>
 <div class="fsm-progress"><i style="width:0%"></i></div>
 </section>
 <div class="fsm-menu">
 <button onclick="go('#/favorites')">♡ <strong>Mijn favorieten</strong><span class="arrow">›</span></button>
 <button onclick="go('#/wallet')">€ <strong>Mijn portemonnee</strong><span class="arrow">›</span></button>
 <button onclick="go('#/orders')">▣ <strong>Mijn bestellingen</strong><span class="arrow">›</span></button>
 <button onclick="go('#/promote')">↗ <strong>Advertenties promoten</strong><span class="arrow">›</span></button>
 <button onclick="go('#/offers')">⌁ <strong>Biedingen</strong><span class="arrow">›</span></button>
 </div>
 <section class="fsm-card" style="margin-top:12px"><div class="fsm-muted">Reviews</div><strong>${reviews.length?reviews.length+" ontvangen":"Nog geen reviews"}</strong></section>
 `,"profile",false);
}
function publicProfile(tab="items"){
 const mine=listings().filter(x=>x.seller===demo.user.username||x.username===demo.user.username||x.owner===demo.user.username);
 const reviews=demo.reviews.filter(r=>r.to===demo.user.username);
 let content="";
 if(tab==="reviews"){
   content=reviews.length?reviews.map(r=>`<div class="fsm-review"><div class="fsm-row">${avatar(r.from,true)}<div><strong>${esc(r.from)}</strong><div class="fsm-stars">${"★".repeat(r.rating)}${"☆".repeat(5-r.rating)}</div></div></div><div style="margin-top:8px">${esc(r.text)}</div><div class="fsm-muted">${esc(r.date||"Vandaag")}</div></div>`).join(""):`<div class="fsm-empty"><div class="ico">☆</div><strong>Nog geen reviews</strong><p class="fsm-muted">Na een voltooide bestelling kunnen kopers en verkopers elkaar beoordelen.</p></div>`;
 }else if(tab==="about"){
   content=`<div class="fsm-card"><div class="fsm-row">${avatar(demo.user.username)}<div><strong>${esc(demo.user.username)}</strong><div class="fsm-muted">✓ E-mail geverifieerd</div></div></div><hr style="border:0;border-top:1px solid rgba(255,255,255,.08);margin:15px 0"><div class="fsm-muted">${esc(demo.user.bio||"Nog geen beschrijving.")}</div></div>`;
 }else{
   content=`<div class="fsm-promote"><strong>Verhoog je zichtbaarheid</strong><div class="fsm-muted">Promoot je items. Vergroot je verkoopkansen.</div><button class="fsm-btn gold" style="margin-top:10px" onclick="go('#/promote')">Promoot</button></div>
   <div class="fsm-row fsm-between" style="margin-bottom:10px"><strong>${mine.length} advertenties</strong><span class="fsm-muted">Actief · Verkocht</span></div>
   ${mine.length?`<div class="fsm-grid">${mine.map(x=>listingCard(x)).join("")}</div>`:`<div class="fsm-empty">Nog geen advertenties.</div>`}`;
 }
 shell(demo.user.username,`<div class="fsm-tabs">
 <button class="fsm-tab ${tab==="items"?"active":""}" onclick="go('#/profile/public/items')">Advertenties</button>
 <button class="fsm-tab ${tab==="reviews"?"active":""}" onclick="go('#/profile/public/reviews')">Reviews</button>
 <button class="fsm-tab ${tab==="about"?"active":""}" onclick="go('#/profile/public/about')">Over mij</button>
 </div>${content}`,"profile",true);
}
function listingCard(x){
 const img=x.images?.[0]||x.image||"";
 return `<article class="fsm-item"><div class="fsm-item-img">${img?`<img src="${esc(img)}">`:"👕"}</div><div class="fsm-item-body"><div class="fsm-meta">${esc(x.club||"Shirt")} · ${esc(x.size||"")}</div><strong>${esc(x.name||"Voetbalshirt")}</strong><div class="fsm-row fsm-between" style="margin-top:7px"><span class="fsm-price">${money(x.price,currency())}</span><button class="fsm-btn dark" style="min-height:32px;padding:0 9px;font-size:9px" onclick="openProduct('${esc(x.id)}')">Bekijken</button></div></div></article>`
}
window.openProduct=id=>go("#/product/"+encodeURIComponent(id));
function badges(){shell("Badges",`
<div class="fsm-list">
<div class="fsm-card"><div class="fsm-row fsm-between"><div><h3>Goed bezig! 1 artikel geüpload</h3><p class="fsm-muted">Ga zo door om je badge te verdienen.</p></div><strong class="fsm-gold">0%</strong></div><div class="fsm-progress"><i style="width:20%"></i></div><button class="fsm-btn gold" style="margin-top:12px" onclick="go('#/sell')">Nieuwe advertentie maken</button></div>
<div class="fsm-card"><div class="fsm-row fsm-between"><div><h3>Best snel: je verzendt binnen 3 dagen</h3><p class="fsm-muted">Verzend je bestellingen iets sneller om deze badge te verdienen.</p></div><strong class="fsm-gold">0%</strong></div><div class="fsm-progress"><i style="width:0%"></i></div></div>
</div>`)}
function favorites(){
 const fav=allListings().filter(x=>demo.favorites.includes(String(x.id)));
 shell("Mijn favorieten",fav.length?`<div class="fsm-grid">${fav.map(x=>listingCard(x)).join("")}</div>`:`<div class="fsm-empty"><div class="ico">♡</div><strong>Nog geen favorieten</strong><p class="fsm-muted">Favoriete shirts verschijnen hier.</p></div>`);
}
function wallet(){shell("Mijn portemonnee",`
<div class="fsm-card"><div class="fsm-muted">Saldo in behandeling</div><div class="fsm-amount">${money(demo.wallet.pending,currency())}</div></div>
<div class="fsm-card" style="margin-top:12px"><div class="fsm-row fsm-between"><div><div class="fsm-muted">Beschikbaar saldo</div><div class="fsm-amount">${money(demo.wallet.balance,currency())}</div></div><button class="fsm-btn gold" onclick="toast('Uitbetaling wordt via de backend afgehandeld.')">Uitbetalen</button></div><div style="margin-top:12px"><button class="fsm-btn dark" onclick="go('#/explore')">Shoppen</button></div></div>
<div class="fsm-card" style="margin-top:12px"><strong>Transacties</strong><div class="fsm-empty" style="padding:25px 10px">Nog geen transacties.</div></div>
`)}
function orders(filter="all",tab="bought"){
 const mine=demo.orders.filter(o=>tab==="bought"?o.buyer===demo.user.username:o.seller===demo.user.username);
 const shown=mine.filter(o=>filter==="all"||o.status===filter);
 shell("Mijn bestellingen",`<div class="fsm-tabs"><button class="fsm-tab ${tab==="sold"?"active":""}" onclick="go('#/orders/all/sold')">Verkocht</button><button class="fsm-tab ${tab==="bought"?"active":""}" onclick="go('#/orders/all/bought')">Gekocht</button></div>
 <div class="fsm-row" style="gap:6px;overflow:auto;margin-bottom:13px">${["all","pending","cancelled","completed"].map(f=>`<button class="fsm-pill" onclick="go('#/orders/${f}/${tab}')">${f==="all"?"Alles":f==="pending"?"In behandeling":f==="cancelled"?"Geannuleerd":"Voltooid"}</button>`).join("")}</div>
 ${shown.length?shown.map(o=>`<div class="fsm-card" style="margin-bottom:9px;cursor:pointer" onclick="go('#/order/${o.id}')"><div class="fsm-row fsm-between"><div><strong>${esc(o.itemName)}</strong><div class="fsm-muted">${money(o.finalPrice,o.currency)} · ${esc(o.status)}</div></div><span>›</span></div></div>`).join(""):`<div class="fsm-empty"><div class="ico">▣</div><strong>Je hebt nog geen bestellingen</strong><p class="fsm-muted">Als je iets verkoopt, zie je het hier staan</p></div>`}`);
}
function promote(){shell("Promoot je advertenties",`
<div class="fsm-promote"><h2>Val op met Spotlights</h2><p class="fsm-muted">Geef al je advertenties meer zichtbaarheid.</p><button class="fsm-btn gold" style="margin-top:12px" onclick="toast('Spotlight geselecteerd — betaling wordt via backend gestart.')">Spotlight</button></div>
<div class="fsm-promote"><h2>Boost je artikelen</h2><p class="fsm-muted">Zet een artikel bovenaan de feed. Bereik potentiële kopers en krijg inzichten in je verkopen.</p>
<div class="fsm-list" style="margin-top:12px">${[
["3 dagen · Lokaal","Alleen zichtbaar in je eigen land"],
["3 dagen · Internationaal","Zichtbaarheid in meerdere landen"],
["7 dagen · Lokaal","7 dagen extra zichtbaarheid in eigen land"],
["7 dagen · Internationaal","7 dagen extra internationale zichtbaarheid"]
].map(a=>`<button onclick="toast('${a[0]} geselecteerd — backend checkout nodig.')"><span>↗</span><div><strong>${a[0]}</strong><div class="fsm-muted">${a[1]}</div></div><span class="arrow">›</span></button>`).join("")}</div></div>`)}
function inbox(){
 const chats=[...new Set(demo.messages.map(m=>m.chat).filter(Boolean))];
 ["ShirtCollector","VintageKits","FootballFan24","RetroJerseys"].forEach(n=>{if(!chats.includes(n))chats.push(n)});
 const rows=chats.map(c=>{
   const msgs=demo.messages.filter(m=>m.chat===c);
   const last=msgs[msgs.length-1]||{text:"Start een gesprek",date:new Date().toISOString()};
   const unread=msgs.filter(m=>m.to===demo.user.username && !m.read).length;
   return `<button class="fsm-inbox-row" type="button" onclick="go('#/chat/${encodeURIComponent(c)}')">${avatar(c,true)}<div class="fsm-inbox-copy"><strong>${esc(c)}</strong><div class="fsm-muted">${esc(last.text)}</div></div><div class="fsm-inbox-side">${unread?`<span class="fsm-unread">${unread}</span>`:""}<span class="arrow">›</span></div></button>`;
 }).join("");
 shell("Inbox",`<div class="fsm-card"><div class="fsm-muted" style="margin-bottom:8px">Berichten</div><div class="fsm-list">${rows}</div></div>`,"inbox",false);
}
function chat(user){
 user=String(user||"verkoper");
 let msgs=demo.messages.filter(m=>m.chat===user);
 if(!msgs.length) msgs=[{id:"seed-"+Date.now(),chat:user,from:user,to:demo.user.username,text:"Hallo! 👋 Leuk dat je een bericht stuurt.",system:false,date:new Date().toISOString()}];
 msgs.forEach(m=>{if(m.to===demo.user.username)m.read=true});
 save();
 const html=msgs.map(m=>`<div class="fsm-msg ${m.from===demo.user.username?"mine":""} ${m.system?"system":""}"><div class="fsm-msg-text">${esc(m.text)}</div><small>${new Date(m.date||Date.now()).toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"})}</small>${!m.system?`<div class="fsm-translate"><button type="button" onclick="translateMsg('${esc(m.id||"")}',this)">Vertalen</button><button type="button" onclick="originalMsg('${esc(m.id||"")}',this)">Origineel bekijken</button></div>`:""}</div>`).join("");
 shell(user,`<div class="fsm-chat"><div class="fsm-chat-user">${avatar(user,true)}<div><strong>${esc(user)}</strong><div class="fsm-muted">Gesprek</div></div></div><div class="fsm-messages">${html}</div><div class="fsm-chatbar"><input id="chatInput" autocomplete="off" placeholder="Typ een bericht..." onkeydown="if(event.key==='Enter')sendChat('${esc(user)}')"><button class="fsm-btn green" type="button" onclick="sendChat('${esc(user)}')">Stuur</button></div></div>`,"inbox",true);
}
window.sendChat=async user=>{const i=document.getElementById("chatInput");if(!i?.value.trim())return;demo.messages.push({id:"m"+Date.now(),chat:user,from:demo.user.username,to:user,text:i.value.trim(),system:false,read:true,date:new Date().toISOString()});save();await api("/messages",{method:"POST",body:JSON.stringify(demo.messages.at(-1))});chat(user)}
window.translateMsg=(id,b)=>{b.textContent="Vertalen…";setTimeout(()=>{b.textContent="Vertaling beschikbaar via de vertaalservice.";},250)}
window.originalMsg=(id,b)=>{b.textContent="Origineel bekeken"}
function product(id){
 const x=itemFromId(decodeURIComponent(id));
 if(!x){shell("Shirt",`<div class="fsm-empty">Shirt niet gevonden.</div>`);return}
 const price=Number(x.price)||0;
 shell("Shirt",`<div class="fsm-card"><div class="fsm-item-img" style="border-radius:12px">${x.image?`<img src="${esc(x.image)}">`:"👕"}</div><div style="padding-top:14px"><div class="fsm-muted">${esc(x.club||"Shirt")} · ${esc(x.size||"")}</div><h2>${esc(x.name)}</h2><div class="fsm-amount">${money(price,currency())}</div>
 <div class="fsm-row" style="margin-top:13px"><button class="fsm-btn green" onclick="checkout('${esc(x.id)}','buy')">Kopen</button><button class="fsm-btn gold" onclick="offer('${esc(x.id)}')">Bod doen</button></div>
 <button class="fsm-btn dark full" style="margin-top:8px" onclick="toggleFav('${esc(x.id)}')">♡ Favoriet</button>
 <button class="fsm-btn dark full" style="margin-top:8px" onclick="go('#/chat/'+encodeURIComponent('${esc(x.seller||x.username||'verkoper')}'))">💬 Bericht sturen</button></div></div>`,"browse");
}
window.toggleFav=id=>{id=String(id);demo.favorites=demo.favorites.includes(id)?demo.favorites.filter(x=>x!==id):[...demo.favorites,id];save();toast(demo.favorites.includes(id)?"Toegevoegd aan favorieten":"Verwijderd uit favorieten")}
window.offer=id=>{const x=itemFromId(id);const v=prompt("Jouw bod (€):",Number(x?.price||0).toFixed(2));const n=Number(v);if(!Number.isFinite(n)||n<=0)return;const o={id:"of"+Date.now(),itemId:String(id),itemName:x?.name||"Shirt",buyer:demo.user.username,seller:x?.seller||x?.username||"verkoper",originalPrice:Number(x?.price||0),amount:n,currency:currency(),status:"pending"};demo.offers.push(o);save();api("/offers",{method:"POST",body:JSON.stringify(o)});toast("Bod verstuurd")}
async function checkout(id,source){
 const x=itemFromId(id);if(!x)return;
 let accepted=null;
 if(source==="offer") accepted=demo.offers.find(o=>String(o.itemId)===String(id)&&o.buyer===demo.user.username&&o.status==="accepted");
 const price=accepted?accepted.amount:Number(x.price)||0;
 const order={id:"ord"+Date.now(),itemId:String(id),itemName:x.name||"Shirt",buyer:demo.user.username,seller:x.seller||x.username||"verkoper",originalPrice:Number(x.price)||0,finalPrice:price,currency:currency(),status:"pending",source:accepted?"accepted_offer":"listing",trackingId:"TRK"+Date.now(),createdAt:new Date().toISOString()};
 demo.orders.push(order);save();
 const result=await api("/checkout/session",{method:"POST",body:JSON.stringify({orderId:order.id,itemId:order.itemId,price:order.finalPrice,currency:order.currency,source:order.source})});
 if(result?.url){location.href=result.url;return}
 go("#/checkout/"+order.id);
}
window.checkout=checkout;
function checkoutPage(id){
 const o=demo.orders.find(x=>x.id===id);
 if(!o){shell("Betaling",`<div class="fsm-empty">Bestelling niet gevonden.</div>`);return}
 shell("Betaling",`<div class="fsm-card"><div class="fsm-muted">Je betaalt voor</div><h2>${esc(o.itemName)}</h2><div class="fsm-amount">${money(o.finalPrice,o.currency)}</div>${o.source==="accepted_offer"?`<div class="fsm-note" style="margin-top:8px">Dit is de door de verkoper geaccepteerde bodprijs.</div>`:""}
 <div class="fsm-form" style="margin-top:16px"><label>Betaalmethode</label><button class="fsm-btn dark" onclick="addPaymentMethod('${o.id}')">${demo.paymentMethod?"💳 Kaart •••• "+demo.paymentMethod.last4:"＋ Kaart toevoegen"}</button><button class="fsm-btn green" onclick="payOrder('${o.id}')">Betalen ${money(o.finalPrice,o.currency)}</button><div class="fsm-note">De echte kaartgegevens horen rechtstreeks bij een betaalprovider te worden ingevoerd. De website bewaart geen volledig kaartnummer of CVC.</div></div></div>`);
}
window.addPaymentMethod=async id=>{const r=await api("/payments/setup-session",{method:"POST",body:JSON.stringify({returnUrl:location.href})});if(r?.url){location.href=r.url;return}const last=prompt("Demo: laatste 4 cijfers van je kaart:");if(/^\d{4}$/.test(last)){demo.paymentMethod={last4:last};save();checkoutPage(id)}}
window.payOrder=async id=>{const o=demo.orders.find(x=>x.id===id);if(!o)return;const r=await api("/orders/"+id+"/pay",{method:"POST",body:JSON.stringify({})});if(r?.success||!r){o.status="paid";systemMessage(o,"paid");save();go("#/order/"+id)}}
function systemMessage(o,event){
 const texts={paid:`Je bestelling is bevestigd. ${o.itemName} wordt klaargemaakt voor verzending.`,shipped:`Je bestelling is verzonden 📦. Track pakket: ${location.origin+location.pathname+"#/track/"+o.id}`,delivered:`Je pakket is afgeleverd 🎉. Bevestig de ontvangst of meld een probleem.`,completed:`Bestelling afgerond. Je kunt nu een beoordeling achterlaten.`};
 demo.messages.push({id:"m"+Date.now(),chat:o.seller,from:"SYSTEM",to:demo.user.username,text:texts[event]||"Orderupdate",system:true,event,date:new Date().toISOString(),orderId:o.id,trackingUrl:location.origin+location.pathname+"#/track/"+o.id});save();
}
function order(id){
 const o=demo.orders.find(x=>x.id===id);if(!o){shell("Bestelling",`<div class="fsm-empty">Bestelling niet gevonden.</div>`);return}
 const canReview=o.status==="completed";
 shell("Bestelling",`<div class="fsm-card"><div class="fsm-muted">Bestelling ${esc(o.id)}</div><h2>${esc(o.itemName)}</h2><div class="fsm-amount">${money(o.finalPrice,o.currency)}</div><div class="fsm-order-status">${["pending","paid","shipped","delivered","completed"].map(s=>`<span class="fsm-pill" style="${o.status===s?"border-color:var(--green);color:var(--green)":""}">${s}</span>`).join("")}</div>
 <button class="fsm-btn dark" onclick="go('#/track/${o.id}')">📦 Tracking bekijken</button>
 ${o.status==="paid"?`<button class="fsm-btn green" style="margin-top:8px" onclick="changeOrder('${o.id}','shipped')">Markeer als verzonden</button>`:""}
 ${o.status==="shipped"?`<button class="fsm-btn green" style="margin-top:8px" onclick="changeOrder('${o.id}','delivered')">Markeer als afgeleverd</button>`:""}
 ${o.status==="delivered"?`<div class="fsm-row" style="margin-top:8px"><button class="fsm-btn green" onclick="changeOrder('${o.id}','completed')">Bestelling ontvangen</button><button class="fsm-btn dark" onclick="issueOrder('${o.id}')">Er is een probleem</button></div>`:""}
 ${canReview?`<button class="fsm-btn gold full" style="margin-top:10px" onclick="review('${o.id}')">⭐ Feedback geven</button>`:""}
 </div>`)}
window.changeOrder=async(id,status)=>{const o=demo.orders.find(x=>x.id===id);if(!o)return;const r=await api("/orders/"+id+"/status",{method:"POST",body:JSON.stringify({status})});if(r===null||r?.success){o.status=status;systemMessage(o,status);save();order(id)}}
window.issueOrder=async id=>{await api("/orders/"+id+"/issue",{method:"POST",body:JSON.stringify({reason:"buyer_reported_issue"})});toast("Probleem gemeld")}
function track(id){
 const o=demo.orders.find(x=>x.id===id);if(!o){shell("Tracking",`<div class="fsm-empty">Bestelling niet gevonden.</div>`);return}
 shell("Tracking",`<div class="fsm-card"><div class="fsm-muted">Bestelling</div><h2>${esc(o.itemName)}</h2><div class="fsm-pill" style="display:inline-block;margin:10px 0">Tracking: ${esc(o.trackingId)}</div><div class="fsm-order-status"><span class="fsm-pill">✓ Bestelling geplaatst</span><span class="fsm-pill">${o.status==="pending"?"○":"✓"} Betaling</span><span class="fsm-pill">${["shipped","delivered","completed"].includes(o.status)?"✓":"○"} Verzonden</span><span class="fsm-pill">${["delivered","completed"].includes(o.status)?"✓":"○"} Afgeleverd</span></div><p class="fsm-muted">Deze trackingpagina is gekoppeld aan bestelling ${esc(o.id)}.</p></div>`)}
function review(id){
 const o=demo.orders.find(x=>x.id===id);if(!o)return;
 shell("Feedback",`<div class="fsm-card"><h2>Beoordeel ${esc(o.seller)}</h2><div class="fsm-form"><label>Sterren</label><select id="reviewRating"><option value="5">★★★★★</option><option value="4">★★★★☆</option><option value="3">★★★☆☆</option><option value="2">★★☆☆☆</option><option value="1">★☆☆☆☆</option></select><label>Review</label><textarea id="reviewText" placeholder="Schrijf je ervaring..."></textarea><button class="fsm-btn gold" onclick="submitReview('${o.id}')">Feedback plaatsen</button></div></div>`)}
window.submitReview=async id=>{const o=demo.orders.find(x=>x.id===id);const r={id:"rv"+Date.now(),orderId:id,from:demo.user.username,to:o.seller,rating:Number(document.getElementById("reviewRating").value),text:document.getElementById("reviewText").value.trim(),date:new Date().toLocaleDateString()};if(!r.text)return;demo.reviews.push(r);save();await api("/reviews",{method:"POST",body:JSON.stringify(r)});toast("Feedback geplaatst");go("#/profile/public/reviews")}
function toast(t){const el=document.getElementById("toast");if(el){el.textContent=t;el.classList.add("show");setTimeout(()=>el.classList.remove("show"),2200)}}
window.toast=toast;
function renderOffers(){
 const offers=demo.offers.filter(o=>o.seller===demo.user.username);
 shell("Biedingen",offers.length?offers.map(o=>`<div class="fsm-card" style="margin-bottom:9px"><div class="fsm-row fsm-between"><div><strong>${esc(o.itemName)}</strong><div class="fsm-muted">${esc(o.buyer)} bood ${money(o.amount,o.currency)}</div></div><span class="fsm-pill">${esc(o.status)}</span></div>${o.status==="pending"?`<div class="fsm-row" style="margin-top:10px"><button class="fsm-btn green" onclick="acceptOffer('${o.id}')">Accepteren</button><button class="fsm-btn dark" onclick="rejectOffer('${o.id}')">Weigeren</button></div>`:""}</div>`).join(""):`<div class="fsm-empty">Nog geen biedingen.</div>`)
}
window.acceptOffer=async id=>{const o=demo.offers.find(x=>x.id===id);if(!o)return;o.status="accepted";save();await api("/offers/"+id+"/accept",{method:"POST",body:JSON.stringify({})});toast("Bod geaccepteerd");renderOffers()}
window.rejectOffer=async id=>{const o=demo.offers.find(x=>x.id===id);if(!o)return;o.status="rejected";save();await api("/offers/"+id+"/reject",{method:"POST",body:JSON.stringify({})});renderOffers()}
function enhancedRouter(routeHash){
 const h=routeHash || hash(), m=h.match(/^#\/([^/?]+)(?:\/([^/?]+))?(?:\/([^/?]+))?/);
 if(!m)return false;
 const a=m[1],b=m[2],c=m[3];
 if(a==="profile"&&!b){profile();return true}
 if(a==="profile"&&b==="public"){publicProfile(c||"items");return true}
 if(a==="badges"){badges();return true}
 if(a==="favorites"){favorites();return true}
 if(a==="wallet"){wallet();return true}
 if(a==="orders"){orders(b||"all",c||"bought");return true}
 if(a==="promote"){promote();return true}
 if(a==="inbox"){inbox();return true}
 if(a==="chat"){chat(decodeURIComponent(b||"verkoper"));return true}
 if(a==="product"){product(b);return true}
 if(a==="checkout"){checkoutPage(b);return true}
 if(a==="order"){order(b);return true}
 if(a==="track"){track(b);return true}
 if(a==="offers"){renderOffers();return true}
 return false
}
window.__fsmRoute = enhancedRouter;
// Zorg dat alle hash-routes via dezelfde index.html werken.
window.addEventListener("click",function(event){
 const link=event.target.closest("a[href]");
 if(!link)return;
 const href=link.getAttribute("href")||"";
 if(href==="#/profile"){
   event.preventDefault();
   location.hash="#/profile";
   profile();
   return;
 }
 if(href==="#/inbox"){
   event.preventDefault();
   location.hash="#/inbox";
   inbox();
   return;
 }
});
window.addEventListener("hashchange",()=>{setTimeout(()=>{enhancedRouter()},0)});
setTimeout(()=>{enhancedRouter()},0);
})();
</script>
