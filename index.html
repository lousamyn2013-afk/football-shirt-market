<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Football-Shirt-Market - Koop, verkoop en verzamel voetbalshirts.">
<meta name="theme-color" content="#020504">

<title>Football-Shirt-Market • Since 2026</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800;900&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#020504;
  --bg2:#050b08;
  --card:#08130f;
  --card2:#0b1913;
  --gold:#efd28f;
  --gold2:#d6aa45;
  --gold3:#a97a22;
  --green:#19c982;
  --green2:#0d8757;
  --white:#fff;
  --text:#f5f1e7;
  --line:rgba(239,210,143,.18);
  --shadow:0 20px 60px rgba(0,0,0,.55);
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html{
  scroll-behavior:smooth;
}

body{
  min-height:100vh;
  background: var(--bg);
  color:var(--text);
  font-family:Inter,Arial,sans-serif;
  overflow-x:hidden;
}

body.translated-ltr,
body.translated-rtl{ top:0!important; }

a{ color:inherit; text-decoration:none; }
button, input{ font:inherit; }
button{ cursor:pointer; }
img{ max-width:100%; }

/* =========================
   GOOGLE TRANSLATE VERBERGEN
========================= */
.goog-te-banner-frame,
.skiptranslate iframe,
#goog-gt-tt,
.goog-te-balloon-frame{ display:none!important; }
.goog-text-highlight{ background:none!important; box-shadow:none!important; }
body > .skiptranslate{ display:none!important; }

/* =========================
   HEADER
========================= */
.header{
  position:sticky;
  top:0;
  z-index:1000;
  width:100%;
  background:rgba(2,5,4,.92);
  backdrop-filter:blur(20px);
  border-bottom:1px solid var(--line);
}

.header-inner{
  width:min(1400px,100%);
  min-height:78px;
  margin:auto;
  padding:10px 24px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:24px;
}

.logo-area{ display:flex; align-items:center; gap:12px; min-width:0; }
.header-logo{ width:54px; height:54px; object-fit:contain; flex-shrink:0; }
.brand{ display:flex; flex-direction:column; min-width:0; }

.brand-title{
  color:#fff;
  font-family:Montserrat,sans-serif;
  font-size:15px;
  font-weight:900;
  letter-spacing:.7px;
  white-space:nowrap;
}
.brand-since{
  margin-top:3px;
  color:var(--gold);
  font-size:10px;
  font-weight:800;
  letter-spacing:2px;
}

.nav{ display:flex; align-items:center; gap:5px; }
.nav a{
  padding:10px 15px;
  border-radius:10px;
  color:#aab8b0;
  font-size:14px;
  font-weight:800;
  transition:.25s;
}
.nav a:hover, .nav a.active{
  color:#fff;
  background:rgba(255,255,255,.07);
}

.header-actions{ display:flex; align-items:center; gap:9px; }

.lang-button, .cart-button{
  border:1px solid rgba(239,210,143,.3);
  background:#08130f;
  color:var(--gold);
  min-height:42px;
  padding:0 13px;
  border-radius:11px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:7px;
  font-weight:800;
  transition:.25s;
}
.lang-button:hover, .cart-button:hover{
  border-color:var(--gold);
  background:#0d2018;
  transform:translateY(-1px);
}
.cart-button{ position:relative; font-size:18px; width:44px; padding:0; }
.cart-count{
  position:absolute; top:-5px; right:-5px;
  width:18px; height:18px; border-radius:50%;
  background:var(--green); color:#001b10;
  font-size:10px; font-weight:900; display:grid; place-items:center;
}
.menu-button{ display:none; width:43px; height:43px; border:1px solid var(--line); background:#08130f; color:#fff; border-radius:10px; font-size:21px; }

/* MOBILE MENU */
.mobile-menu{ display:none; padding:10px 20px 20px; border-top:1px solid rgba(239,210,143,.1); background:#030806; }
.mobile-menu.open{ display:block; }
.mobile-menu a{ display:block; padding:14px; border-radius:10px; color:#dce6e0; font-weight:800; }
.mobile-menu a:hover{ background:rgba(255,255,255,.06); }

/* =========================
   PAGE CONTAINER
========================= */
.page{ width:min(1400px,100%); margin:auto; padding:30px 24px 90px; }

/* =========================
   1. HERO (HOME) - IMAGE MAPPING
========================= */
.hero{
  position:relative;
  width:100%;
  border:1px solid rgba(239,210,143,.25);
  border-radius:22px;
  overflow:hidden;
  box-shadow:var(--shadow);
  display:flex; 
  background:#020504;
}
.hero img{
  width:100%;
  height:auto;
  display:block;
}

/* Onzichtbare klik-zones voor de Home afbeelding */
.hero-link-ontdek {
  position:absolute;
  top:64.5%; left:4.5%;
  width:12%; height:6.5%;
  z-index:10;
  border-radius:8px;
}
.hero-link-verkoop {
  position:absolute;
  top:64.5%; left:17%;
  width:12.5%; height:6.5%;
  z-index:10;
  border-radius:8px;
}
.hero-search-overlay {
  position:absolute;
  top:73.5%; left:4.5%;
  width:24.5%; height:6%;
  z-index:10;
  display:flex;
}
.hero-search-overlay input {
  flex:1; height:100%;
  background:transparent;
  border:none; outline:none;
  color:#fff;
  font-weight:600;
  font-size:clamp(12px, 1.2vw, 16px);
  padding-left:14%; /* Voorbij het ingetekende icoon */
  transition:0.2s;
}
/* Als je typt, maken we de achtergrond donker om de getekende tekst te verbergen */
.hero-search-overlay input:focus,
.hero-search-overlay input:not(:placeholder-shown) {
  background:rgba(0,0,0,0.85);
  backdrop-filter:blur(5px);
  border-radius:10px;
  padding-left:15px;
  border:1px solid var(--gold);
}
.hero-search-overlay button {
  width:20%;
  background:transparent;
  border:none;
  cursor:pointer;
}

/* =========================
   2. EXPLORE HERO - IMAGE MAPPING
========================= */
.explore-top {
  position:relative;
  width:100%;
  border-radius:20px;
  overflow:hidden;
  border:1px solid var(--line);
  box-shadow:var(--shadow);
  display:flex;
  background:#020504;
  margin-bottom:40px;
}
.explore-top img {
  width:100%;
  height:auto;
  display:block;
}

/* Onzichtbare interactieve zoekbalk in de Ontdekken afbeelding */
.explore-search-overlay {
  position:absolute;
  top:76.5%; left:4.5%;
  width:44.5%; height:12.5%;
  z-index:10;
  display:flex;
  border-radius:12px;
}
.explore-search-overlay input {
  flex:1; height:100%;
  background:transparent;
  border:none; outline:none;
  color:#fff;
  font-weight:800;
  font-size:clamp(14px, 1.8vw, 24px);
  padding-left:15%;
  transition:0.2s;
}
.explore-search-overlay input:focus,
.explore-search-overlay input:not(:placeholder-shown) {
  background:#07120c; /* Dekt de gouden tekst af tijdens het typen */
  border:2px solid var(--gold);
  border-radius:12px;
  padding-left:20px;
  color:var(--green);
}
.explore-search-overlay button {
  width:15%; height:100%;
  background:transparent;
  border:none;
  cursor:pointer;
}

/* =========================
   SECTIES & SHIRTS
========================= */
.section{ margin-top:52px; }
.section-header{
  display:flex; align-items:flex-end; justify-content:space-between; gap:20px;
  margin-bottom:20px; padding-bottom:14px; border-bottom:1px solid var(--line);
}
.section-title{ font-family:Montserrat,sans-serif; font-size:27px; font-weight:900; color:#fff; text-transform:uppercase; }
.section-title span{ color:var(--gold); }
.section-link{ color:var(--gold); font-size:13px; font-weight:900; white-space:nowrap; }
.section-link:hover{ color:#fff; }

.shirt-row{
  display:grid; grid-auto-flow:column; grid-auto-columns:minmax(235px,280px); gap:18px;
  overflow-x:auto; padding:4px 3px 15px; scroll-snap-type:x mandatory;
}
.shirt-row::-webkit-scrollbar{ height:6px; }
.shirt-row::-webkit-scrollbar-thumb{ background:rgba(239,210,143,.3); border-radius:10px; }

.shirt-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:20px; }

.shirt-card{
  position:relative; background:linear-gradient(180deg,#0a1812,#06100c);
  border:1px solid var(--line); border-radius:17px; overflow:hidden;
  min-width:0; scroll-snap-align:start; transition:.3s;
}
.shirt-card:hover{
  transform:translateY(-5px); border-color:rgba(239,210,143,.55); box-shadow:0 15px 35px rgba(0,0,0,.45);
}
.shirt-visual{
  position:relative; aspect-ratio:1/1; display:flex; align-items:center; justify-content:center; overflow:hidden;
  background:radial-gradient(circle at 50% 35%,#183528 0%,#07120d 55%,#030805 100%);
}
.shirt-visual::after{ content:""; position:absolute; inset:auto 0 0; height:35%; background:linear-gradient(transparent,rgba(0,0,0,.35)); }
.shirt-emoji{ font-size:82px; filter:drop-shadow(0 15px 16px rgba(0,0,0,.65)); transition:.3s; }
.shirt-card:hover .shirt-emoji{ transform:scale(1.08); }

.condition{
  position:absolute; top:11px; left:11px; z-index:2; padding:5px 9px; border-radius:20px;
  background:rgba(0,0,0,.75); border:1px solid rgba(239,210,143,.4); color:var(--gold);
  font-size:9px; font-weight:900; text-transform:uppercase;
}
.shirt-body{ padding:16px; }
.club{ color:#82958a; font-size:10px; font-weight:900; text-transform:uppercase; letter-spacing:.7px; }
.shirt-name{ margin-top:5px; min-height:42px; color:#fff; font-size:14px; line-height:1.35; font-weight:900; }
.shirt-bottom{ display:flex; align-items:center; justify-content:space-between; gap:10px; margin-top:14px; }
.price{ color:var(--green); font-size:16px; font-weight:900; }
.view-button{
  border:1px solid rgba(239,210,143,.3); background:rgba(239,210,143,.07); color:var(--gold);
  border-radius:8px; padding:7px 11px; font-size:10px; font-weight:900;
}
.view-button:hover{ background:var(--gold2); color:#000; }

/* =========================
   SELL & OTHERS
========================= */
.sell-box{ max-width:760px; margin:40px auto; padding:45px; text-align:center; border:1px solid var(--line); border-radius:22px; background:radial-gradient(circle at top,#102a1d,#07110d 55%,#040806); box-shadow:var(--shadow); }
.sell-icon{ font-size:55px; margin-bottom:15px; }
.sell-box h1{ font-family:Montserrat,sans-serif; font-size:clamp(30px,5vw,48px); color:var(--gold); text-transform:uppercase; }
.sell-box p{ color:#aebcb5; line-height:1.7; margin:15px auto 28px; max-width:560px; }
.btn-green{ color:#fff; background:linear-gradient(135deg,#18c982,#0b8756); padding:12px 20px; border-radius:10px; font-weight:900; display:inline-block; }

.search-info{ color:#9ca9a2; margin-bottom:15px; font-size:13px; }

/* MODAL & FOOTER (inkort om de code niet te zwaar te maken, logica is hetzelfde) */
.modal-backdrop{ position:fixed; inset:0; z-index:3000; background:rgba(0,0,0,.82); backdrop-filter:blur(10px); display:none; align-items:center; justify-content:center; padding:20px; }
.modal-backdrop.open{ display:flex; }
.language-modal{ width:min(650px,100%); max-height:85vh; display:flex; flex-direction:column; background:#0a1711; border:1px solid rgba(239,210,143,.35); border-radius:20px; padding:22px; }
.modal-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:15px; }
.modal-title{ color:var(--gold); font-size:18px; font-weight:900; }
.modal-close{ width:38px; height:38px; border:0; border-radius:9px; background:rgba(255,255,255,.06); color:#fff; font-size:24px; }
.language-search{ width:100%; height:45px; border:1px solid rgba(239,210,143,.25); border-radius:10px; outline:0; background:#030806; color:#fff; padding:0 14px; margin-bottom:14px; }
.language-list{ overflow-y:auto; display:grid; grid-template-columns:repeat(2,1fr); gap:7px; padding-right:5px; }
.language-item{ min-height:43px; border:1px solid transparent; background:rgba(255,255,255,.035); border-radius:9px; color:#d9e3de; display:flex; align-items:center; gap:9px; padding:8px 11px; font-size:12px; font-weight:700; cursor:pointer; transition:.2s; }
.language-item.active, .language-item:hover{ background:var(--gold2); color:#000; }

.footer{ border-top:1px solid var(--line); background:#020504; padding:40px 20px; text-align:center; }
.footer-brand{ font-family:Montserrat,sans-serif; font-weight:900; color:#fff; }
.footer p{ margin-top:8px; color:#7f8f87; font-size:12px; }

.toast{ position:fixed; left:50%; bottom:25px; z-index:5000; transform:translate(-50%,120px); background:#0d2018; border:1px solid rgba(239,210,143,.4); color:#fff; border-radius:10px; padding:12px 18px; font-size:13px; font-weight:800; transition:.3s; }
.toast.show{ transform:translate(-50%,0); }

/* =========================
   RESPONSIVE
========================= */
@media(max-width:1050px){
  .header-inner{ padding:9px 16px; }
  .nav{ display:none; }
  .menu-button{ display:block; }
}

@media(max-width:720px){
  .page{ padding:16px 12px 60px; }
  .header-inner{ min-height:68px; padding:8px 12px; gap:8px; }
  .brand-title{ font-size:11px; }
  .brand-since{ font-size:8px; }
  .hero{ border-radius:15px; }
  .section{ margin-top:38px; }
  .section-title{ font-size:20px; }
  .shirt-grid{ grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; }
}

@media(max-width:420px){
  .brand{ display:none; }
  .header-actions{ margin-left:auto; }
  .shirt-grid{ grid-template-columns:1fr 1fr; }
}
</style>
</head>
<body>

<header class="header">
  <div class="header-inner">
    <a href="#/" class="logo-area">
      <img src="logo.png" class="header-logo" alt="Football-Shirt-Market" onerror="this.style.display='none'">
      <div class="brand">
        <div class="brand-title" translate="no">FOOTBALL-SHIRT-MARKET</div>
        <div class="brand-since" translate="no">SINCE 2026</div>
      </div>
    </a>
    <nav class="nav">
      <a href="#/" id="navHome">Home</a>
      <a href="#/explore" id="navExplore">Ontdekken</a>
      <a href="#/sell" id="navSell">Verkopen</a>
    </nav>
    <div class="header-actions">
      <button class="lang-button" id="languageButton"><span id="currentFlag">🇳🇱</span><span id="currentCode">NL</span><span>▼</span></button>
      <button class="cart-button" id="cartButton" title="Winkelmand">🛒<span class="cart-count" id="cartCount">0</span></button>
      <button class="menu-button" id="menuButton">☰</button>
    </div>
  </div>
  <div class="mobile-menu" id="mobileMenu">
    <a href="#/" id="mobileHome">Home</a>
    <a href="#/explore" id="mobileExplore">Ontdekken</a>
    <a href="#/sell" id="mobileSell">Verkopen</a>
  </div>
</header>

<main id="app"></main>

<footer class="footer">
  <div class="footer-brand">⚽ Football-Shirt-Market</div>
  <p>De marketplace voor voetbalshirts, verzamelaars en voetbalfans.</p>
</footer>

<div class="toast" id="toast"></div>

<script>
/* =========================================================
   DATA & STATUS
========================================================= */
const shirts = [
  { id:1, club:"AC Milan", name:"AC Milan 1994-1995 Home #3 Maldini", price:"€ 149,95", condition:"Mint Condition", icon:"🔴⚫" },
  { id:2, club:"Real Madrid", name:"Real Madrid 2001-2002 Centenary #5 Zidane", price:"€ 179,95", condition:"Nieuwstaat", icon:"⚪👑" },
  { id:3, club:"FC Barcelona", name:"FC Barcelona 2005-2006 Home #10 Ronaldinho", price:"€ 169,95", condition:"Mint Condition", icon:"🔵🔴" },
  { id:4, club:"Manchester United", name:"Manchester United 1998-1999 Treble #7 Beckham", price:"€ 159,95", condition:"Nieuwstaat", icon:"🔴⚪" }
];

let cart = JSON.parse(localStorage.getItem("fsm_cart") || "[]");
const app = document.getElementById("app");
const toast = document.getElementById("toast");

function escapeHTML(str){
  return String(str).replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;");
}

function showToast(msg){
  toast.textContent = msg; toast.classList.add("show");
  clearTimeout(window.toastTimer);
  window.toastTimer = setTimeout(()=>toast.classList.remove("show"),2200);
}

function updateCart(){
  document.getElementById("cartCount").textContent = cart.length;
  localStorage.setItem("fsm_cart", JSON.stringify(cart));
}

function addToCart(id){
  cart.push(id); updateCart(); showToast("Shirt toegevoegd aan je winkelmand.");
}

function shirtCard(shirt){
  return `
    <article class="shirt-card">
      <div class="shirt-visual">
        <div class="condition">${escapeHTML(shirt.condition)}</div>
        <div class="shirt-emoji">👕</div>
      </div>
      <div class="shirt-body">
        <div class="club">${shirt.icon} ${escapeHTML(shirt.club)}</div>
        <div class="shirt-name">${escapeHTML(shirt.name)}</div>
        <div class="shirt-bottom">
          <div class="price">${escapeHTML(shirt.price)}</div>
          <button class="view-button" onclick="addToCart(${shirt.id})">Bekijken</button>
        </div>
      </div>
    </article>
  `;
}

/* =========================================================
   VIEWS
========================================================= */

// 1. HOME
function renderHome(){
  app.innerHTML = `
    <div class="page">
      <section class="hero">
        <!-- De getekende afbeelding als basis -->
        <img src="hero.png" alt="Football Shirt Market" onerror="this.style.display='none'">
        
        <!-- Verborgen interactieve knoppen die exact over de afbeelding vallen -->
        <a href="#/explore" class="hero-link-ontdek" title="Ontdek shirts"></a>
        <a href="#/sell" class="hero-link-verkoop" title="Verkoop een shirt"></a>
        
        <div class="hero-search-overlay">
          <input id="heroSearchInput" type="search" placeholder=" " autocomplete="off">
          <button id="heroSearchButton" aria-label="Zoeken"></button>
        </div>
      </section>

      <section class="section">
        <div class="section-header">
          <h2 class="section-title">Uitgelichte <span>shirts</span></h2>
          <a href="#/explore" class="section-link">Alle shirts →</a>
        </div>
        <div class="shirt-row">${shirts.map(shirtCard).join("")}</div>
      </section>
    </div>
  `;
  setupSearch("heroSearchInput", "heroSearchButton");
}

// 2. EXPLORE
function renderExplore(){
  const hash = location.hash;
  const queryPart = hash.includes("?search=") ? hash.split("?search=")[1] : "";
  const query = decodeURIComponent(queryPart || "").trim().toLowerCase();
  
  const filtered = query ? shirts.filter(s => \`\${s.club} \${s.name}\`.toLowerCase().includes(query)) : shirts;

  app.innerHTML = `
    <div class="page">
      <section class="explore-top">
        <!-- Jouw prachtige, onafgesneden ontwerp -->
        <img src="ontdekken.png" alt="Ontdek voetbalshirts" onerror="this.style.display='none'">
        
        <!-- Onzichtbare interactieve zoekbalk over de getekende gouden rand -->
        <div class="explore-search-overlay">
          <input type="search" id="exploreSearchInput" placeholder=" " autocomplete="off">
          <button id="exploreSearchBtn" aria-label="Zoeken"></button>
        </div>
      </section>

      <section>
        <div class="section-header">
          <h2 class="section-title">Alle <span>shirts</span></h2>
        </div>
        ${query ? \`<div class="search-info">Resultaten voor: <strong style="color:var(--gold)">\${escapeHTML(query)}</strong></div>\` : ""}
        <div class="shirt-grid">
          ${filtered.length ? filtered.map(shirtCard).join("") : \`<div style="grid-column:1/-1; padding:60px 20px; text-align:center; border:1px solid var(--line); border-radius:16px; color:#8e9d95;">Geen shirts gevonden.</div>\`}
        </div>
      </section>
    </div>
  `;
  setupSearch("exploreSearchInput", "exploreSearchBtn");
}

// 3. SELL
function renderSell(){
  app.innerHTML = `
    <div class="page">
      <section class="sell-box">
        <div class="sell-icon">👕</div>
        <h1>Verkoop je shirt</h1>
        <p>Binnenkort kun je hier je eigen voetbalshirts plaatsen.</p>
        <a href="#/" class="btn-green">← Terug naar Home</a>
      </section>
    </div>
  `;
}

/* =========================================================
   ROUTING & LOGICA
========================================================= */

function setupSearch(inputId, btnId){
  const input = document.getElementById(inputId);
  const btn = document.getElementById(btnId);
  if(!input || !btn) return;
  
  function doSearch(){
    const val = input.value.trim();
    if(val) location.hash = "#/explore?search=" + encodeURIComponent(val);
    else location.hash = "#/explore";
  }
  btn.onclick = doSearch;
  input.addEventListener("keydown", e => { if(e.key === "Enter") doSearch(); });
}

function updateActiveNavigation(){
  document.querySelectorAll(".nav a").forEach(a => a.classList.remove("active"));
  const hash = location.hash || "#/";
  if(hash.startsWith("#/explore")) document.getElementById("navExplore")?.classList.add("active");
  else if(hash.startsWith("#/sell")) document.getElementById("navSell")?.classList.add("active");
  else document.getElementById("navHome")?.classList.add("active");
}

function route(){
  const hash = location.hash || "#/";
  updateActiveNavigation();
  if(hash.startsWith("#/explore")) renderExplore();
  else if(hash.startsWith("#/sell")) renderSell();
  else renderHome();
  window.scrollTo({top:0, behavior:"smooth"});
}

window.addEventListener("hashchange", route);
updateCart();
route();

</script>
</body>
</html>
