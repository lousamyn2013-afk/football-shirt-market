<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Football-Shirt-Market</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,700;0,800;0,900;1,900&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">

<style>
:root {
  --gold-hi: #efd28f;
  --gold-mid: #d6aa45;
  --cream: #f5f1e7;
  --green: #2bd58c;
  --dark-bg: #020504;
  --card-bg: #08130f;
  --card-border: rgba(239, 210, 143, 0.2);
}
* { box-sizing: border-box; }
html, body {
  margin: 0; padding: 0;
  background: var(--dark-bg);
  color: var(--cream);
  font-family: 'Inter', system-ui, sans-serif;
}
a { text-decoration: none; color: inherit; }

/* HEADER & NAVBAR */
.site-header {
  position: sticky; top: 0; z-index: 1000; width: 100%;
  background: rgba(2, 7, 5, 0.96);
  backdrop-filter: blur(18px);
  border-bottom: 1px solid rgba(239, 210, 143, 0.20);
}
.header-inner {
  width: min(1320px, 100%); min-height: 84px; margin: auto; padding: 10px 22px;
  display: flex; align-items: center; justify-content: space-between; gap: 20px;
}
.logo-link { display: flex; align-items: center; gap: 14px; flex-shrink: 0; }
.header-logo { height: 52px; width: auto; object-fit: contain; }

.brand-name { display: flex; flex-direction: column; justify-content: center; }
.brand-title { color: #ffffff; font-weight: 900; font-size: 16px; letter-spacing: 0.5px; text-transform: uppercase; font-family: 'Montserrat', sans-serif; }
.brand-since { color: var(--gold-hi); font-size: 11px; font-weight: 800; letter-spacing: 2px; margin-top: 2px; }

nav { display: flex; align-items: center; gap: 10px; }
nav a { color: #b8c9be; padding: 10px 16px; border-radius: 11px; font-size: 14px; font-weight: 800; transition: .28s; }
nav a:hover, nav a.active { color: #fff; background: rgba(255,255,255,0.08); }

/* RECHTSBOVEN TAAL KNOP */
.lang-btn {
  background: var(--card-bg); color: var(--gold-hi); 
  border: 1px solid rgba(239, 210, 143, 0.4);
  border-radius: 12px; padding: 10px 18px; font-size: 13px; font-weight: 800;
  cursor: pointer; outline: none; display: flex; align-items: center; gap: 8px;
  transition: all 0.2s ease; flex-shrink: 0;
}
.lang-btn:hover { border-color: var(--gold-hi); background: #0e2019; transform: translateY(-1px); }

/* MODAL ZOEKBALK VOOR TALEN */
.lang-modal-backdrop {
  position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
  background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(8px);
  z-index: 2000; display: none; align-items: center; justify-content: center;
}
.lang-modal-backdrop.open { display: flex; }

.lang-modal {
  background: #0b1a14; border: 1px solid rgba(239, 210, 143, 0.3);
  border-radius: 20px; width: min(560px, 92vw); max-height: 82vh;
  display: flex; flex-direction: column; padding: 24px;
  box-shadow: 0 25px 50px rgba(0,0,0,0.8);
}
.lang-modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
.lang-modal-title { font-size: 18px; font-weight: 800; color: var(--gold-hi); }
.lang-close-btn { background: none; border: none; color: #8a9e92; font-size: 24px; cursor: pointer; }
.lang-close-btn:hover { color: #fff; }

.lang-search-box {
  width: 100%; background: #040a08; border: 1px solid rgba(239, 210, 143, 0.25);
  border-radius: 12px; padding: 12px 16px; color: #fff; font-size: 14px;
  outline: none; margin-bottom: 16px; font-family: inherit;
}
.lang-search-box:focus { border-color: var(--gold-hi); }

.lang-list {
  overflow-y: auto; display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px;
  max-height: 52vh; padding-right: 6px;
}
.lang-list::-webkit-scrollbar { width: 6px; }
.lang-list::-webkit-scrollbar-thumb { background: rgba(239, 210, 143, 0.3); border-radius: 3px; }

.lang-item {
  display: flex; align-items: center; gap: 10px; padding: 10px 14px;
  border-radius: 10px; background: rgba(255,255,255,0.03); cursor: pointer;
  font-size: 13px; font-weight: 600; transition: background 0.2s;
}
.lang-item:hover { background: rgba(239, 210, 143, 0.15); color: #fff; }
.lang-item.active { background: var(--gold-mid); color: #000; font-weight: 800; }

/* INHOUD & BANNERS */
.page { width: min(1320px, 100%); margin: auto; padding: 34px 22px 80px; }

.banner-container {
  position: relative; width: 100%; border-radius: 20px; overflow: hidden;
  border: 1px solid rgba(239, 210, 143, 0.24); box-shadow: 0 20px 50px rgba(0,0,0,0.6);
  margin-bottom: 40px;
}
.banner-container img { width: 100%; display: block; height: auto; }

.banner-btn-green {
  background: linear-gradient(135deg, #18b875, #118252); color: #fff; padding: 0.8vw 1.6vw;
  border-radius: 8px; font-weight: 800; font-size: 1.1vw; text-decoration: none; display: inline-block;
  box-shadow: 0 0 20px rgba(24, 184, 117, 0.4);
}
.banner-btn-white {
  background: #ffffff; color: #000; padding: 0.8vw 1.6vw; border-radius: 8px;
  font-weight: 800; font-size: 1.1vw; text-decoration: none; display: inline-block;
}

/* SHIRTS GRID SECTIE */
.section-header {
  display: flex; justify-content: space-between; align-items: flex-end;
  margin-bottom: 24px; border-bottom: 1px solid rgba(239, 210, 143, 0.15); padding-bottom: 12px;
}
.section-title {
  font-family: 'Montserrat', sans-serif; font-size: 24px; font-weight: 900;
  color: #fff; text-transform: uppercase; letter-spacing: 0.5px;
}
.section-title span { color: var(--gold-hi); }

.shirts-grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 22px;
}
.shirt-card {
  background: var(--card-bg); border: 1px solid var(--card-border);
  border-radius: 16px; overflow: hidden;
  transition: transform 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
  display: flex; flex-direction: column; cursor: pointer;
}
.shirt-card:hover {
  transform: translateY(-6px); border-color: var(--gold-hi);
  box-shadow: 0 12px 30px rgba(239, 210, 143, 0.15);
}
.shirt-img-wrapper {
  position: relative; width: 100%; aspect-ratio: 1;
  background: radial-gradient(circle, #132b20 0%, #050d09 100%);
  display: flex; align-items: center; justify-content: center; overflow: hidden;
}
.shirt-img-placeholder {
  font-size: 72px; display:flex; align-items:center; justify-content:center;
  filter: drop-shadow(0 10px 15px rgba(0,0,0,0.6)); transition: transform 0.3s ease;
}
.shirt-card:hover .shirt-img-placeholder { transform: scale(1.08); }

.badge-tag {
  position: absolute; top: 12px; left: 12px; background: rgba(2, 7, 5, 0.85);
  color: var(--gold-hi); border: 1px solid rgba(239, 210, 143, 0.4);
  font-size: 11px; font-weight: 800; padding: 4px 10px; border-radius: 20px;
  text-transform: uppercase; backdrop-filter: blur(4px);
}

.shirt-info { padding: 18px; display: flex; flex-direction: column; flex: 1; justify-content: space-between; }
.shirt-club { color: #8a9e92; font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }
.shirt-name { color: #fff; font-size: 16px; font-weight: 800; margin: 4px 0 12px; line-height: 1.3; }
.shirt-footer { display: flex; justify-content: space-between; align-items: center; margin-top: auto; }
.shirt-price { font-size: 18px; font-weight: 900; color: var(--green); }
.shirt-btn {
  background: rgba(239, 210, 143, 0.1); color: var(--gold-hi);
  border: 1px solid rgba(239, 210, 143, 0.3); padding: 8px 14px;
  border-radius: 8px; font-size: 12px; font-weight: 800; transition: 0.2s;
}
.shirt-card:hover .shirt-btn { background: var(--gold-mid); color: #000; }

footer { text-align: center; padding: 42px 20px; background: #020504; border-top: 1px solid rgba(239, 210, 143, .18); }

/* VERBERG GOOGLE BALK */
body { top: 0 !important; position: static !important; }
.skiptranslate iframe, .goog-te-banner-frame, #goog-te-setup { display: none !important; }
.goog-text-highlight { background-color: transparent !important; box-shadow: none !important; }
</style>
</head>
<body>

<div id="goog-te-setup" style="display:none;"></div>
<script type="text/javascript">
  function googleTranslateElementInit() {
    new google.translate.TranslateElement({pageLanguage: 'nl', autoDisplay: false}, 'goog-te-setup');
  }
</script>
<script type="text/javascript" src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>

<header class="site-header">
  <div class="header-inner">
    <a href="#/" class="logo-link">
      <img class="header-logo" src="logo.png" alt="Logo">
      <div class="brand-name">
        <span class="brand-title" translate="no">Football-Shirt-Market</span>
        <span class="brand-since" translate="no">SINCE 2026</span>
      </div>
    </a>

    <nav>
      <a href="#/" id="nav-home">Home</a>
      <a href="#/explore" id="nav-explore">Ontdekken</a>
      <a href="#/sell" id="nav-sell">Verkopen</a>
    </nav>

    <button id="langPickerBtn" class="lang-btn" translate="no">
      <span id="currentFlag">🇳🇱</span>
      <span id="currentLangCode">NL</span>
      <span style="font-size: 10px; opacity: 0.7;">▼</span>
    </button>
  </div>
</header>

<div id="langModal" class="lang-modal-backdrop">
  <div class="lang-modal">
    <div class="lang-modal-header">
      <div class="lang-modal-title">Kies een taal / Select Language</div>
      <button class="lang-close-btn" id="closeLangModal">&times;</button>
    </div>
    <input type="text" id="langSearchInput" class="lang-search-box" placeholder="Zoek taal / Search language...">
    <div id="langList" class="lang-list" translate="no"></div>
  </div>
</div>

<main id="app"></main>

<footer>
  <strong translate="no">⚽ Football-Shirt-Market</strong><br>
  <span>De marketplace voor voetbalshirts · <span style="color:var(--gold-hi)" translate="no">Since 2026</span></span>
</footer>

<script>
const languages = [
  { code: 'af', name: 'Afrikaans', flag: '🇿🇦' },
  { code: 'sq', name: 'Albanian', flag: '🇦🇱' },
  { code: 'ar', name: 'Arabic', flag: '🇸🇦' },
  { code: 'zh-CN', name: 'Chinese (Simplified)', flag: '🇨🇳' },
  { code: 'zh-TW', name: 'Chinese (Traditional)', flag: '🇹🇼' },
  { code: 'hr', name: 'Croatian', flag: '🇭🇷' },
  { code: 'cs', name: 'Czech', flag: '🇨🇿' },
  { code: 'da', name: 'Danish', flag: '🇩🇰' },
  { code: 'nl', name: 'Dutch (Nederlands)', flag: '🇳🇱' },
  { code: 'en', name: 'English', flag: '🇬🇧' },
  { code: 'et', name: 'Estonian', flag: '🇪🇪' },
  { code: 'fi', name: 'Finnish', flag: '🇫🇮' },
  { code: 'fr', name: 'French', flag: '🇫🇷' },
  { code: 'de', name: 'German', flag: '🇩🇪' },
  { code: 'el', name: 'Greek', flag: '🇬🇷' },
  { code: 'he', name: 'Hebrew', flag: '🇮🇱' },
  { code: 'hi', name: 'Hindi', flag: '🇮🇳' },
  { code: 'hu', name: 'Hungarian', flag: '🇭🇺' },
  { code: 'id', name: 'Indonesian', flag: '🇮🇩' },
  { code: 'it', name: 'Italian', flag: '🇮🇹' },
  { code: 'ja', name: 'Japanese', flag: '🇯🇵' },
  { code: 'ko', name: 'Korean', flag: '🇰🇷' },
  { code: 'no', name: 'Norwegian', flag: '🇳🇴' },
  { code: 'pl', name: 'Polish', flag: '🇵🇱' },
  { code: 'pt', name: 'Portuguese', flag: '🇵🇹' },
  { code: 'ro', name: 'Romanian', flag: '🇷🇴' },
  { code: 'ru', name: 'Russian', flag: '🇷🇺' },
  { code: 'es', name: 'Spanish', flag: '🇪🇸' },
  { code: 'sv', name: 'Swedish', flag: '🇸🇪' },
  { code: 'th', name: 'Thai', flag: '🇹🇭' },
  { code: 'tr', name: 'Turkish', flag: '🇹🇷' },
  { code: 'uk', name: 'Ukrainian', flag: '🇺🇦' },
  { code: 'vi', name: 'Vietnamese', flag: '🇻🇳' }
  // (Alle overige talen werken via de engine, deze lijst dekt de belangrijkste 30+ direct visueel af)
];

const shirtsData = [
  { club: "AC Milan", name: "AC Milan 1994-1995 Home #3 Maldini", price: "€ 149,95", condition: "Mint Condition", icon: "🔴🖤" },
  { club: "Real Madrid", name: "Real Madrid 2001-2002 Centenary #5 Zidane", price: "€ 179,95", condition: "Nieuwstaat", icon: "⚪👑" },
  { club: "FC Barcelona", name: "FC Barcelona 2005-2006 Home #10 Ronaldinho", price: "€ 169,95", condition: "Mint Condition", icon: "🔵🔴" },
  { club: "Manchester United", name: "Manchester United 1998-1999 Treble #7 Beckham", price: "€ 159,95", condition: "Nieuwstaat", icon: "🔴⚪" },
  { club: "Arsenal", name: "Arsenal 2003-2004 Invincibles #14 Henry", price: "€ 189,95", condition: "Mint Condition", icon: "🔴⚪" },
  { club: "Juventus", name: "Juventus 1997-1998 Centenary #10 Del Piero", price: "€ 139,95", condition: "Nieuwstaat", icon: "⚪🖤" }
];

function renderHome() {
  document.getElementById("app").innerHTML = `
    <div class="page">
      <div class="banner-container">
        <img src="hero.png" alt="Hero Banner">
        <div style="position: absolute; top: 28%; left: 5%; color: #ffffff; font-size: 3.8vw; font-weight: 900; line-height: 1.1; max-width: 45%; font-family: 'Montserrat', sans-serif; text-transform: uppercase;">
          Koop. Verkoop.<br>Verzamel.
        </div>
        <div style="position: absolute; top: 54%; left: 5%; color: #c2cfc7; font-size: 1.1vw; max-width: 38%; line-height: 1.4; text-shadow: 0 2px 8px rgba(0,0,0,0.8);">
          De marketplace voor voetbalshirts, verzamelaars en echte voetbalfans.
        </div>
        <div style="position: absolute; top: 68%; left: 5%; display: flex; gap: 1vw;">
          <a href="#/explore" class="banner-btn-green">Ontdek shirts</a>
          <a href="#/sell" class="banner-btn-white">Verkoop een shirt</a>
        </div>
      </div>
      <section style="margin-top: 30px;">
        <div class="section-header">
          <div class="section-title">Populaire <span style="color:var(--gold-hi)">Voetbalshirts</span></div>
        </div>
        <div class="shirts-grid">
          ${shirtsData.map(shirt => `
            <div class="shirt-card">
              <div class="shirt-img-wrapper">
                <span class="badge-tag">${shirt.condition}</span>
                <div class="shirt-img-placeholder">👕</div>
              </div>
              <div class="shirt-info">
                <div>
                  <div class="shirt-club" translate="no">${shirt.icon} ${shirt.club}</div>
                  <div class="shirt-name" translate="no">${shirt.name}</div>
                </div>
                <div class="shirt-footer">
                  <div class="shirt-price" translate="no">${shirt.price}</div>
                  <button class="shirt-btn">Bekijken</button>
                </div>
              </div>
            </div>
          `).join('')}
        </div>
      </section>
    </div>
  `;
}

function renderExplore() {
  document.getElementById("app").innerHTML = `
    <div class="page">
      <div class="banner-container">
        <img src="ontdekken.png" alt="Explore Banner" onerror="this.src='hero.png'">
      </div>
      <section style="margin-top: 30px;">
        <div class="section-header">
          <div class="section-title">Alle <span>Ontdekkingen</span></div>
        </div>
        <div class="shirts-grid">
          ${shirtsData.map(shirt => `
            <div class="shirt-card">
              <div class="shirt-img-wrapper">
                <span class="badge-tag">${shirt.condition}</span>
                <div class="shirt-img-placeholder">👕</div>
              </div>
              <div class="shirt-info">
                <div>
                  <div class="shirt-club" translate="no">${shirt.icon} ${shirt.club}</div>
                  <div class="shirt-name" translate="no">${shirt.name}</div>
                </div>
                <div class="shirt-footer">
                  <div class="shirt-price" translate="no">${shirt.price}</div>
                  <button class="shirt-btn">Bekijken</button>
                </div>
              </div>
            </div>
          `).join('')}
        </div>
      </section>
    </div>
  `;
}

function renderSell() {
  document.getElementById("app").innerHTML = `
    <div class="page" style="max-width: 600px; text-align: center;">
      <h1 style="font-family:'Montserrat',sans-serif; color:var(--gold-hi);">Verkoop je Voetbalshirt</h1>
      <p style="color:#b8c9be; margin-bottom: 24px;">Upload hier binnenkort je iconische shirts en bereik duizenden verzamelaars.</p>
      <a href="#/" class="banner-btn-green">Terug naar Home</a>
    </div>
  `;
}

function route() {
  const hash = location.hash || "#/";
  
  // Active links bijwerken
  document.querySelectorAll("nav a").forEach(a => a.classList.remove("active"));
  if (hash.startsWith("#/explore")) {
    document.getElementById("nav-explore")?.classList.add("active");
    renderExplore();
  } else if (hash.startsWith("#/sell")) {
    document.getElementById("nav-sell")?.classList.add("active");
    renderSell();
  } else {
    document.getElementById("nav-home")?.classList.add("active");
    renderHome();
  }

  // Actieve taal ophalen uit cookie of opslag
  let activeCode = 'nl';
  const match = document.cookie.match(/(^|;) ?googtrans=\/nl\/([^;]*)/);
  if (match) activeCode = match[2];

  const activeLangObj = languages.find(l => l.code === activeCode) || languages.find(l => l.code === 'nl');
  if (activeLangObj) {
    document.getElementById("currentFlag").textContent = activeLangObj.flag;
    document.getElementById("currentLangCode").textContent = activeLangObj.code.split('-')[0].toUpperCase();
  }
}

function renderLanguageList(filterText = "") {
  const langList = document.getElementById("langList");
  langList.innerHTML = "";
  
  const filtered = languages.filter(l => 
    l.name.toLowerCase().includes(filterText.toLowerCase()) || 
    l.code.toLowerCase().includes(filterText.toLowerCase())
  );

  filtered.forEach(lang => {
    const item = document.createElement("div");
    item.className = "lang-item";
    item.innerHTML = `<span>${lang.flag}</span> <span>${lang.name}</span>`;
    
    item.onclick = () => {
      document.cookie = "googtrans=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;";
      document.cookie = "googtrans=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/; domain=" + location.hostname + ";";
      
      if (lang.code !== 'nl') {
        document.cookie = `googtrans=/nl/${lang.code}; path=/;`;
      }
      
      document.getElementById("langModal").classList.remove("open");
      location.reload();
    };
    
    langList.appendChild(item);
  });
}

document.getElementById("langPickerBtn").onclick = () => {
  document.getElementById("langModal").classList.add("open");
  document.getElementById("langSearchInput").value = "";
  renderLanguageList();
  document.getElementById("langSearchInput").focus();
};

document.getElementById("closeLangModal").onclick = () => {
  document.getElementById("langModal").classList.remove("open");
};

document.getElementById("langSearchInput").oninput = (e) => {
  renderLanguageList(e.target.value);
};

window.addEventListener("hashchange", route);
route();
</script>
</body>
</html>
