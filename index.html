<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#020504">
<title>Football-Shirt-Market</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,700;0,800;0,900;1,900&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">

<style>
:root {
  --gold-hi: #efd28f;
  --gold-mid: #d6aa45;
  --gold-dark: #9f7624;
  --cream: #f5f1e7;
  --green: #2bd58c;
  --green-dark: #118252;
  --dark-bg: #020504;
  --card-bg: #08130f;
  --card-border: rgba(239, 210, 143, 0.20);
}

* {
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

html,
body {
  margin: 0;
  padding: 0;
  background:
    radial-gradient(circle at 50% -10%, rgba(43,213,140,.08), transparent 35%),
    var(--dark-bg);
  color: var(--cream);
  font-family: 'Inter', system-ui, sans-serif;
  min-height: 100%;
}

body {
  overflow-x: hidden;
}

a {
  text-decoration: none;
  color: inherit;
}

button,
input {
  font-family: inherit;
}

/* =========================
   GOOGLE TRANSLATE VERBORGEN
========================= */

.google-translate-hidden {
  position: fixed !important;
  left: -9999px !important;
  top: -9999px !important;
  width: 1px !important;
  height: 1px !important;
  overflow: hidden !important;
  opacity: 0 !important;
  pointer-events: none !important;
}

body {
  top: 0 !important;
  position: static !important;
}

.skiptranslate iframe,
.goog-te-banner-frame,
.goog-te-balloon-frame,
#goog-gt-tt,
.goog-tooltip {
  display: none !important;
}

.goog-text-highlight {
  background-color: transparent !important;
  box-shadow: none !important;
}

font {
  background: transparent !important;
}

/* =========================
   HEADER
========================= */

.site-header {
  position: sticky;
  top: 0;
  z-index: 1000;
  width: 100%;
  background: rgba(2, 7, 5, 0.94);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-bottom: 1px solid rgba(239, 210, 143, 0.20);
}

.header-inner {
  width: min(1320px, 100%);
  min-height: 84px;
  margin: auto;
  padding: 10px 22px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
}

.logo-link {
  display: flex;
  align-items: center;
  gap: 14px;
  flex-shrink: 0;
}

.header-logo {
  height: 55px;
  width: 55px;
  object-fit: contain;
  border-radius: 10px;
}

.brand-name {
  display: flex;
  flex-direction: column;
  justify-content: center;
}

.brand-title {
  color: #ffffff;
  font-weight: 900;
  font-size: 16px;
  letter-spacing: .5px;
  text-transform: uppercase;
  font-family: 'Montserrat', sans-serif;
}

.brand-since {
  color: var(--gold-hi);
  font-size: 11px;
  font-weight: 800;
  letter-spacing: 2px;
  margin-top: 3px;
}

nav {
  display: flex;
  align-items: center;
  gap: 6px;
}

nav a {
  color: #b8c9be;
  padding: 11px 16px;
  border-radius: 11px;
  font-size: 14px;
  font-weight: 800;
  transition: .25s ease;
}

nav a:hover,
nav a.active {
  color: #fff;
  background: rgba(255,255,255,.08);
}

nav a.active {
  box-shadow: inset 0 -2px 0 var(--gold-hi);
}

/* =========================
   TAAL KNOP
========================= */

.lang-btn {
  background: linear-gradient(
    145deg,
    rgba(239,210,143,.10),
    rgba(255,255,255,.025)
  );
  color: var(--gold-hi);
  border: 1px solid rgba(239,210,143,.40);
  border-radius: 12px;
  padding: 10px 15px;
  font-size: 13px;
  font-weight: 800;
  cursor: pointer;
  outline: none;
  display: flex;
  align-items: center;
  gap: 8px;
  transition: all .2s ease;
  flex-shrink: 0;
}

.lang-btn:hover {
  border-color: var(--gold-hi);
  background: #0e2019;
  transform: translateY(-1px);
  box-shadow: 0 5px 20px rgba(239,210,143,.12);
}

#currentFlag {
  font-size: 17px;
}

/* =========================
   TAAL MODAL
========================= */

.lang-modal-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.84);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  z-index: 2000;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 20px;
}

.lang-modal-backdrop.open {
  display: flex;
}

.lang-modal {
  background:
    radial-gradient(circle at top right, rgba(43,213,140,.08), transparent 35%),
    #0b1a14;
  border: 1px solid rgba(239,210,143,.30);
  border-radius: 22px;
  width: min(620px, 100%);
  max-height: 86vh;
  display: flex;
  flex-direction: column;
  padding: 24px;
  box-shadow:
    0 30px 80px rgba(0,0,0,.85),
    0 0 50px rgba(239,210,143,.06);
}

.lang-modal-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 16px;
}

.lang-modal-title {
  font-size: 19px;
  font-weight: 900;
  color: var(--gold-hi);
  font-family: 'Montserrat', sans-serif;
}

.lang-close-btn {
  background: rgba(255,255,255,.04);
  border: 1px solid rgba(255,255,255,.08);
  color: #8a9e92;
  width: 38px;
  height: 38px;
  border-radius: 10px;
  font-size: 24px;
  cursor: pointer;
  transition: .2s;
}

.lang-close-btn:hover {
  color: #fff;
  background: rgba(255,255,255,.10);
}

.lang-search-box {
  width: 100%;
  background: #040a08;
  border: 1px solid rgba(239,210,143,.25);
  border-radius: 13px;
  padding: 14px 16px;
  color: #fff;
  font-size: 14px;
  outline: none;
  margin-bottom: 16px;
}

.lang-search-box::placeholder {
  color: #718078;
}

.lang-search-box:focus {
  border-color: var(--gold-hi);
  box-shadow: 0 0 0 3px rgba(239,210,143,.06);
}

.lang-list {
  overflow-y: auto;
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 8px;
  max-height: 55vh;
  padding-right: 5px;
}

.lang-list::-webkit-scrollbar {
  width: 6px;
}

.lang-list::-webkit-scrollbar-thumb {
  background: rgba(239,210,143,.30);
  border-radius: 3px;
}

.lang-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 11px 13px;
  border-radius: 11px;
  background: rgba(255,255,255,.035);
  border: 1px solid transparent;
  cursor: pointer;
  font-size: 13px;
  font-weight: 600;
  transition: .2s;
}

.lang-item:hover {
  background: rgba(239,210,143,.12);
  border-color: rgba(239,210,143,.18);
  color: #fff;
}

.lang-item.active {
  background: linear-gradient(135deg, var(--gold-hi), var(--gold-mid));
  color: #000;
  font-weight: 900;
}

.lang-empty {
  grid-column: 1 / -1;
  text-align: center;
  padding: 30px;
  color: #829188;
}

/* =========================
   PAGE
========================= */

.page {
  width: min(1320px, 100%);
  margin: auto;
  padding: 34px 22px 80px;
}

/* =========================
   BANNER
========================= */

.banner-container {
  position: relative;
  width: 100%;
  border-radius: 20px;
  overflow: hidden;
  border: 1px solid rgba(239,210,143,.24);
  box-shadow:
    0 20px 50px rgba(0,0,0,.6),
    0 0 50px rgba(43,213,140,.035);
  margin-bottom: 40px;
}

.banner-container img {
  width: 100%;
  display: block;
  height: auto;
}

.banner-overlay {
  position: absolute;
  inset: 0;
  pointer-events: none;
}

.banner-content {
  position: absolute;
  top: 27%;
  left: 5%;
  max-width: 44%;
}

.banner-title {
  color: #fff;
  font-size: clamp(30px, 4vw, 62px);
  font-weight: 900;
  line-height: 1.05;
  font-family: 'Montserrat', sans-serif;
  text-transform: uppercase;
  text-shadow: 0 4px 25px rgba(0,0,0,.8);
}

.banner-description {
  margin-top: 18px;
  color: #c2cfc7;
  font-size: clamp(12px, 1.1vw, 17px);
  max-width: 500px;
  line-height: 1.5;
  text-shadow: 0 2px 8px rgba(0,0,0,.8);
}

.banner-actions {
  margin-top: 24px;
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
  pointer-events: auto;
}

.banner-btn-green,
.banner-btn-white {
  padding: 13px 21px;
  border-radius: 9px;
  font-weight: 900;
  font-size: 14px;
  display: inline-block;
  transition: .25s;
}

.banner-btn-green {
  background: linear-gradient(135deg, #18b875, #118252);
  color: #fff;
  box-shadow: 0 0 25px rgba(24,184,117,.35);
}

.banner-btn-green:hover {
  transform: translateY(-3px);
  box-shadow: 0 8px 30px rgba(24,184,117,.45);
}

.banner-btn-white {
  background: #fff;
  color: #000;
}

.banner-btn-white:hover {
  transform: translateY(-3px);
  background: #f3f3f3;
}

/* =========================
   SECTIE
========================= */

.section-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
  margin-bottom: 24px;
  border-bottom: 1px solid rgba(239,210,143,.15);
  padding-bottom: 12px;
}

.section-title {
  font-family: 'Montserrat', sans-serif;
  font-size: 24px;
  font-weight: 900;
  color: #fff;
  text-transform: uppercase;
  letter-spacing: .5px;
}

.section-title span {
  color: var(--gold-hi);
}

/* =========================
   SHIRTS
========================= */

.shirts-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  gap: 22px;
}

.shirt-card {
  background: var(--card-bg);
  border: 1px solid var(--card-border);
  border-radius: 16px;
  overflow: hidden;
  transition:
    transform .3s ease,
    border-color .3s ease,
    box-shadow .3s ease;
  display: flex;
  flex-direction: column;
  cursor: pointer;
}

.shirt-card:hover {
  transform: translateY(-6px);
  border-color: var(--gold-hi);
  box-shadow: 0 12px 30px rgba(239,210,143,.15);
}

.shirt-img-wrapper {
  position: relative;
  width: 100%;
  aspect-ratio: 1;
  background:
    radial-gradient(circle at 50% 35%, #193a2b 0%, #08140f 48%, #050b08 100%);
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}

.shirt-img-wrapper::before {
  content: "";
  position: absolute;
  width: 70%;
  height: 70%;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(239,210,143,.10), transparent 65%);
}

.shirt-img-placeholder {
  position: relative;
  z-index: 2;
  font-size: 72px;
  display: flex;
  align-items: center;
  justify-content: center;
  filter: drop-shadow(0 10px 15px rgba(0,0,0,.6));
  transition: transform .3s ease;
}

.shirt-card:hover .shirt-img-placeholder {
  transform: scale(1.08);
}

.badge-tag {
  position: absolute;
  z-index: 5;
  top: 12px;
  left: 12px;
  background: rgba(2,7,5,.85);
  color: var(--gold-hi);
  border: 1px solid rgba(239,210,143,.4);
  font-size: 11px;
  font-weight: 800;
  padding: 5px 10px;
  border-radius: 20px;
  text-transform: uppercase;
  backdrop-filter: blur(4px);
}

.shirt-info {
  padding: 18px;
  display: flex;
  flex-direction: column;
  flex: 1;
  justify-content: space-between;
}

.shirt-club {
  color: #8a9e92;
  font-size: 12px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: .5px;
}

.shirt-name {
  color: #fff;
  font-size: 16px;
  font-weight: 800;
  margin: 5px 0 14px;
  line-height: 1.35;
}

.shirt-footer {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-top: auto;
  gap: 10px;
}

.shirt-price {
  font-size: 18px;
  font-weight: 900;
  color: var(--green);
}

.shirt-btn {
  background: rgba(239,210,143,.1);
  color: var(--gold-hi);
  border: 1px solid rgba(239,210,143,.3);
  padding: 8px 14px;
  border-radius: 8px;
  font-size: 12px;
  font-weight: 800;
  transition: .2s;
  cursor: pointer;
}

.shirt-card:hover .shirt-btn {
  background: var(--gold-mid);
  color: #000;
}

/* =========================
   SELL PAGINA
========================= */

.sell-page {
  max-width: 650px;
  text-align: center;
  margin: auto;
}

.sell-page h1 {
  font-family: 'Montserrat', sans-serif;
  color: var(--gold-hi);
  font-size: clamp(28px, 5vw, 44px);
}

.sell-page p {
  color: #b8c9be;
  margin-bottom: 28px;
  line-height: 1.7;
}

/* =========================
   FOOTER
========================= */

footer {
  text-align: center;
  padding: 42px 20px;
  background: #020504;
  border-top: 1px solid rgba(239,210,143,.18);
  color: #91a096;
  line-height: 1.7;
}

footer strong {
  color: #fff;
}

/* =========================
   MOBILE
========================= */

@media (max-width: 900px) {

  .header-inner {
    min-height: 70px;
    padding: 8px 14px;
    gap: 10px;
  }

  .header-logo {
    width: 45px;
    height: 45px;
  }

  .brand-title {
    font-size: 12px;
  }

  .brand-since {
    font-size: 9px;
    letter-spacing: 1.5px;
  }

  nav {
    gap: 2px;
  }

  nav a {
    padding: 8px 9px;
    font-size: 12px;
  }

  .lang-btn {
    padding: 9px 10px;
    gap: 5px;
  }

  #currentLangCode {
    display: none;
  }

  .page {
    padding: 18px 12px 55px;
  }

  .banner-container {
    border-radius: 14px;
    margin-bottom: 28px;
  }

  .banner-content {
    top: 25%;
    left: 5%;
    max-width: 52%;
  }

  .banner-description {
    display: none;
  }

  .banner-actions {
    margin-top: 15px;
    gap: 7px;
  }

  .banner-btn-green,
  .banner-btn-white {
    padding: 9px 12px;
    font-size: 11px;
  }

  .shirts-grid {
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 11px;
  }

  .shirt-card {
    border-radius: 12px;
  }

  .shirt-info {
    padding: 12px;
  }

  .shirt-name {
    font-size: 13px;
  }

  .shirt-price {
    font-size: 15px;
  }

  .shirt-btn {
    padding: 7px 9px;
    font-size: 10px;
  }

  .shirt-img-placeholder {
    font-size: 52px;
  }

  .section-title {
    font-size: 18px;
  }

  .lang-modal {
    padding: 18px;
    border-radius: 18px;
  }

  .lang-list {
    grid-template-columns: 1fr;
    max-height: 58vh;
  }
}

@media (max-width: 560px) {

  .header-inner {
    flex-wrap: wrap;
  }

  .logo-link {
    flex: 1;
    min-width: 0;
  }

  .brand-name {
    min-width: 0;
  }

  .brand-title {
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  nav {
    order: 3;
    width: 100%;
    justify-content: center;
    padding-top: 2px;
  }

  nav a {
    flex: 1;
    text-align: center;
  }

  .site-header {
    position: sticky;
  }

  .banner-content {
    top: 22%;
    max-width: 58%;
  }

  .banner-title {
    font-size: 25px;
  }

  .banner-actions {
    flex-direction: column;
    align-items: flex-start;
  }

  .banner-btn-green,
  .banner-btn-white {
    font-size: 10px;
    padding: 8px 10px;
  }

  .shirts-grid {
    grid-template-columns: repeat(2, 1fr);
  }

  .shirt-club {
    font-size: 9px;
  }

  .shirt-name {
    font-size: 12px;
    margin-bottom: 9px;
  }

  .shirt-price {
    font-size: 13px;
  }

  .shirt-btn {
    font-size: 9px;
    padding: 6px 8px;
  }

  .badge-tag {
    font-size: 8px;
    top: 7px;
    left: 7px;
    padding: 4px 6px;
  }
}

@media (max-width: 380px) {

  .brand-title {
    font-size: 10px;
  }

  .header-logo {
    width: 40px;
    height: 40px;
  }

  nav a {
    font-size: 10px;
    padding: 8px 5px;
  }

  .shirts-grid {
    gap: 8px;
  }
}
</style>
</head>

     HEADER

<!-- =========================

========================= -->

<div

<!-- =========================
     APP
========================= -->

<main id="app"></main>


<!-- =========================
     FOOTER
========================= -->

<footer>

  <strong>

  <br>

  <span>

/* =====================================================
   ROUTER
===================================================== */

function route() {

  const hash = location.hash || "#/";

  document
    .querySelectorAll("nav a")
    .forEach(a => a.classList.remove("active"));


  if (hash.startsWith("#/explore")) {

    document
      .getElementById("nav-explore")
      ?.classList.add("active");

    renderExplore();

  }

  else if (hash.startsWith("#/sell")) {

    document
      .getElementById("nav-sell")
      ?.classList.add("active");

    renderSell();

  }

  else {

    document
      .getElementById("nav-home")
      ?.classList.add("active");

    renderHome();

  }


  updateLanguageButton();

}


/* =====================================================
   TAAL KNOP UPDATEN
===================================================== */

function getCurrentLanguageCode() {

  const cookie = document.cookie
    .split(";")
    .map(x => x.trim())
    .find(x => x.startsWith("googtrans="));

  if (!cookie) {
    return "nl";
  }

  const value = decodeURIComponent(
    cookie.split("=")[1] || ""
  );

  const parts = value.split("/");

  return parts[2] || "nl";
}


function updateLanguageButton() {

  const code = getCurrentLanguageCode();

  const language =
    languages.find(
      l => l.code.toLowerCase() === code.toLowerCase()
    )
    || languages.find(l => l.code === "nl");


  if (!language) return;


  document.getElementById("currentFlag").textContent =
    language.flag;

  document.getElementById("currentLangCode").textContent =
    language.code
      .split("-")[0]
      .toUpperCase();

}


/* =====================================================
   TAALLIJST
===================================================== */

function renderLanguageList(filterText = "") {

  const langList =
    document.getElementById("langList");

  const search =
    filterText.trim().toLowerCase();


  const filtered =
    languages.filter(lang => {

      return (
        lang.name.toLowerCase().includes(search) ||
        lang.code.toLowerCase().includes(search)
      );

    });


  langList.innerHTML = "";


  if (filtered.length === 0) {

    langList.innerHTML = `
      <div class="lang-empty">
        Geen taal gevonden
      </div>
    `;

    return;
  }


  const currentCode =
    getCurrentLanguageCode();


  filtered.forEach(lang => {

    const item =
      document.createElement("div");

    item.className = "lang-item";


    if (
      lang.code.toLowerCase() ===
      currentCode.toLowerCase()
    ) {

      item.classList.add("active");

    }


    item.innerHTML = `

      <span style="font-size:18px">
        ${lang.flag}
      </span>

      <span>
        ${lang.name}
      </span>

    `;


    item.addEventListener(
      "click",
      () => selectLanguage(lang.code)
    );


    langList.appendChild(item);

  });

}


/* =====================================================
   TAAL SELECTEREN
===================================================== */

function setGoogleTranslateCookie(code) {

  const value =
    code === "nl"
      ? ""
      : `/nl/${code}`;


  const hostname =
    location.hostname;


  document.cookie =
    "googtrans=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;";


  if (hostname) {

    document.cookie =
      "googtrans=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/; domain=" +
      hostname +
      ";";

  }


  if (code !== "nl") {

    document.cookie =
      `googtrans=${value}; path=/;`;

    if (hostname) {

      document.cookie =
        `googtrans=${value}; path=/; domain=${hostname};`;

    }

  }

}


function selectLanguage(code) {

  setGoogleTranslateCookie(code);

  updateLanguageButton();

  document
    .getElementById("langModal")
    .classList.remove("open");


  /*
    Probeer eerst Google Translate
    zonder volledige pagina-refresh.
  */

  const select =
    document.querySelector(".goog-te-combo");


  if (select) {

    select.value = code;

    select.dispatchEvent(
      new Event("change")
    );

    setTimeout(
      translateCurrentPage,
      800
    );

  }

  else {

    /*
      Google Translate is nog niet geladen.
      Een reload zorgt ervoor dat de cookie
      direct wordt gebruikt.
    */

    location.reload();

  }

}


/* =====================================================
   GOOGLE TRANSLATE OPNIEUW TOEPASSEN
===================================================== */

function translateCurrentPage() {

  const code =
    getCurrentLanguageCode();


  if (code === "nl") {
    return;
  }


  let tries = 0;


  const timer =
    setInterval(() => {

      tries++;


      const select =
        document.querySelector(".goog-te-combo");


      if (select) {

        select.value = code;

        select.dispatchEvent(
          new Event("change")
        );

        clearInterval(timer);

      }


      if (tries > 30) {

        clearInterval(timer);

      }

    }, 250);

}


/* =====================================================
   MODAL
===================================================== */

const langModal =
  document.getElementById("langModal");

const langPickerBtn =
  document.getElementById("langPickerBtn");

const closeLangModal =
  document.getElementById("closeLangModal");

const langSearchInput =
  document.getElementById("langSearchInput");


langPickerBtn.addEventListener(
  "click",
  () => {

    langModal.classList.add("open");

    langSearchInput.value = "";

    renderLanguageList();

    setTimeout(
      () => langSearchInput.focus(),
      100
    );

  }
);


closeLangModal.addEventListener(
  "click",
  () => {

    langModal.classList.remove("open");

  }
);


langModal.addEventListener(
  "click",
  event => {

    if (
      event.target === langModal
    ) {

      langModal.classList.remove("open");

    }

  }
);


langSearchInput.addEventListener(
  "input",
  event => {

    renderLanguageList(
      event.target.value
    );

  }
);


/* ESC om modal te sluiten */

document.addEventListener(
  "keydown",
  event => {

    if (
      event.key === "Escape"
    ) {

      langModal.classList.remove("open");

    }

  }
);


/* =====================================================
   ROUTER EVENTS
===================================================== */

window.addEventListener(
  "hashchange",
  route
);


/* =====================================================
   GOOGLE TRANSLATE MUTATION OBSERVER
===================================================== */

const observer =
  new MutationObserver(() => {

    const code =
      getCurrentLanguageCode();

    if (code !== "nl") {
      updateLanguageButton();
    }

  });


observer.observe(
  document.body,
  {
    childList: true,
    subtree: true
  }
);


/* =====================================================
   START
===================================================== */

route();

</script>
